<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Ember Watch</title>
<meta name="description" content="An arcade survival game. Hold the light for thirty minutes; your weapons do the rest.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="src/ui/fonts.css">
<link rel="stylesheet" href="src/ui/arclight.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230b0d12'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23f5c56b' stroke-width='8' stroke-dasharray='120 60'/></svg>">
</head>
<body>
  <div id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="overlay" class="hidden"></div>
    <div id="stick"><div class="nub"></div></div>
    <!-- Shown by CSS alone when a small screen is held upright. The game is a
         fixed 16:9 field, so portrait spends three quarters of a phone on
         nothing; see #rotate in arclight.css. -->
    <div id="rotate">
      <div class="rotate-inner">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="30" y="14" width="40" height="72" rx="7"/>
          <path d="M18 62 A34 34 0 0 0 52 96" />
          <path d="M44 90 L52 96 L46 104" />
        </svg>
        <div class="rotate-title">Turn your device</div>
        <div class="rotate-body">The Ember Watch is played wide. Landscape gives you
          the whole battlefield instead of a quarter of it.</div>
      </div>
    </div>
  </div>

  <!-- Classic scripts in dependency order, so the game runs straight off the
       filesystem (file://) with no build step and no module CORS rules. -->
  <script src="src/core/util.js"></script>
  <script src="src/data/config.js"></script>
  <script src="src/core/save.js"></script>
  <script src="src/core/input.js"></script>

  <script src="src/data/characters.js"></script>
  <script src="src/data/weapons.js"></script>
  <script src="src/data/enemies.js"></script>
  <script src="src/data/bosses.js"></script>
  <script src="src/data/maps.js"></script>
  <script src="src/data/upgrades.js"></script>
  <script src="src/data/meta.js"></script>
  <script src="src/data/blessings.js"></script>
  <script src="src/data/combos.js"></script>
  <script src="src/data/achievements.js"></script>
  <script src="src/data/lore.js"></script>
  <!-- Local balance overrides, then the layer that applies them over the
       shipped data above. Both must come after every data file. -->
  <script src="src/data/tuning.js"></script>
  <script src="src/data/tuning-apply.js"></script>

  <script src="src/render/hero.js"></script>
  <script src="src/render/sprites.js"></script>
  <script src="src/render/icons.js"></script>
  <script src="src/audio/audio.js"></script>

  <script src="src/game/fx.js"></script>
  <script src="src/game/projectile.js"></script>
  <script src="src/game/enemy.js"></script>
  <script src="src/game/weapon.js"></script>
  <script src="src/game/player.js"></script>
  <script src="src/game/xp.js"></script>
  <script src="src/game/pickup.js"></script>
  <script src="src/game/hazard.js"></script>
  <script src="src/game/familiar.js"></script>
  <script src="src/game/combos.js"></script>
  <script src="src/game/achievements.js"></script>
  <script src="src/game/waves.js"></script>
  <script src="src/game/levelup.js"></script>
  <script src="src/game/arena.js"></script>
  <script src="src/game/game.js"></script>

  <script src="src/render/scenery.js"></script>
  <script src="src/render/prologue-v1.js"></script>
  <script src="src/render/prologue-v2.js"></script>
  <script src="src/render/cinematic.js"></script>
  <script src="src/render/victory.js"></script>
  <script src="src/render/renderer.js"></script>
  <script src="src/ui/ui.js"></script>
  <script src="src/main.js"></script>

  <!-- If nothing above loaded, say why.
       index.html is not the whole game: it is a page that pulls in src/. Drag
       it somewhere on its own and every stylesheet and script 404s, the CSS
       that hides the portrait prompt goes with them, and what you get is an
       unstyled "Turn your device" on a black page - which says nothing at all
       about what actually went wrong. This has to be inline, because by
       definition it runs in the case where nothing external arrived. -->
  <script>
    addEventListener('load', function () {
      if (window.WS && window.WS.Game) return;
      document.body.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;'
        + 'justify-content:center;padding:24px;background:#0b0d12;color:#cdd4e4;'
        + 'font:16px/1.6 system-ui,sans-serif;text-align:center">'
        + '<div style="max-width:34em">'
        + '<div style="font-size:22px;color:#f5c56b;letter-spacing:.04em;'
        + 'margin-bottom:14px">The Ember Watch could not load its own files</div>'
        + '<p style="margin:0 0 14px">index.html is not the whole game. It needs the '
        + '<code>src</code> folder sitting beside it, and none of it arrived.</p>'
        + '<p style="margin:0;color:#8b93a5">To host or hand over the game as a single '
        + 'file, use <code>dist/the-ember-watch.html</code> instead - everything is '
        + 'inlined into it and it needs nothing else.</p>'
        + '</div></div>';
    });
  </script>
</body>
</html>
