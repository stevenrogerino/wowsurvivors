<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelGen Viewer</title>
<style>
  :root { --bg: #121317; --panel: #1b1d23; --line: #2c2f38; --text: #e6e6ea; --dim: #8b8f9a; --accent: #f0a23a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; }
  aside { width: 280px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  label { display: flex; flex-direction: column; gap: 6px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  select, input, button { font: inherit; color: var(--text); background: #23262e; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  #about { color: var(--dim); font-size: 13px; min-height: 36px; }
  #stats { font: 12px/1.6 ui-monospace, monospace; color: var(--dim); white-space: pre; }
  .hint { color: var(--dim); font-size: 12px; margin-top: auto; }
  main { flex: 1; position: relative; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); max-height: 48vh; }
    main { height: 52vh; flex: none; }
  }
</style>
</head>
<body>
<aside>
  <h1><span>&#9650;</span> ModelGen</h1>
  <label>Model type <select id="type"></select></label>
  <div id="about"></div>
  <label>Seed
    <div class="row">
      <input id="seed" value="1" spellcheck="false">
      <button id="prev" title="Previous seed (&larr;)" style="flex:none">&lsaquo;</button>
      <button id="next" title="Next seed (&rarr;)" style="flex:none">&rsaquo;</button>
    </div>
  </label>
  <button id="random">Random seed (R)</button>
  <label>Detail <span id="detailVal"></span>
    <input id="detail" type="range" min="0.5" max="2" step="0.5" value="1">
  </label>
  <div class="row">
    <button id="glb" class="primary">Download .glb</button>
    <button id="obj">.obj + .mtl</button>
  </div>
  <label style="flex-direction:row;align-items:center;text-transform:none;letter-spacing:0;font-size:13px">
    <input id="spin" type="checkbox" checked> Auto-rotate
  </label>
  <div id="stats"></div>
  <div class="hint">Drag to orbit, scroll to zoom. The grid is 1&nbsp;m. Every model is reproducible from its type + seed.</div>
</aside>
<main><canvas id="view"></canvas></main>

<script src="modelgen.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const canvas = $('view');
const gl = canvas.getContext('webgl', { antialias: true });
const uint32 = gl.getExtension('OES_element_index_uint');

/* ---- shaders ---- */
const VS = `
attribute vec3 aPos; attribute vec3 aNrm; attribute vec3 aCol;
uniform mat4 uMVP; varying vec3 vN; varying vec3 vC;
void main() { vN = aNrm; vC = aCol; gl_Position = uMVP * vec4(aPos, 1.0); }`;
const FS = `
precision mediump float; varying vec3 vN; varying vec3 vC; uniform float uLit;
void main() {
  vec3 n = normalize(vN);
  vec3 L = normalize(vec3(0.55, 0.85, 0.45));
  float diff = max(dot(n, L), 0.0);
  vec3 amb = mix(vec3(0.22, 0.2, 0.18), vec3(0.45, 0.5, 0.6), n.y * 0.5 + 0.5);
  vec3 c = mix(vC, vC * (amb + diff * vec3(1.0, 0.95, 0.85)), uLit);
  gl_FragColor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
}`;
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const loc = {
  pos: gl.getAttribLocation(prog, 'aPos'), nrm: gl.getAttribLocation(prog, 'aNrm'), col: gl.getAttribLocation(prog, 'aCol'),
  mvp: gl.getUniformLocation(prog, 'uMVP'), lit: gl.getUniformLocation(prog, 'uLit'),
};

/* ---- matrices (column-major) ---- */
function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
}
function lookAt(eye, at) {
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const nrm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };
  const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const z = nrm(sub(eye, at)), x = nrm(crs([0, 1, 0], z)), y = crs(z, x);
  const d = (a) => -(a[0] * eye[0] + a[1] * eye[1] + a[2] * eye[2]);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, d(x), d(y), d(z), 1];
}
function mul(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s;
  }
  return o;
}

/* ---- geometry upload ---- */
function mesh(positions, normals, colors, indices) {
  const buf = (data, target) => { const b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, gl.STATIC_DRAW); return b; };
  return {
    p: buf(positions, gl.ARRAY_BUFFER), n: buf(normals, gl.ARRAY_BUFFER), c: buf(colors, gl.ARRAY_BUFFER),
    i: indices ? buf(indices, gl.ELEMENT_ARRAY_BUFFER) : null,
    count: indices ? indices.length : positions.length / 3,
    type: indices instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT,
  };
}
function drawMesh(m, mode, lit) {
  for (const [b, l] of [[m.p, loc.pos], [m.n, loc.nrm], [m.c, loc.col]]) {
    gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 0, 0);
  }
  gl.uniform1f(loc.lit, lit);
  if (m.i) { gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.i); gl.drawElements(mode, m.count, m.type, 0); }
  else gl.drawArrays(mode, 0, m.count);
}
function freeMesh(m) { if (m) for (const b of [m.p, m.n, m.c, m.i]) if (b) gl.deleteBuffer(b); }

const grid = (() => {
  const p = [], n = [], c = [], N = 10;
  for (let i = -N; i <= N; i++) {
    const k = i === 0 ? 0.09 : 0.035;
    p.push(i, 0, -N, i, 0, N, -N, 0, i, N, 0, i);
    for (let j = 0; j < 4; j++) { n.push(0, 1, 0); c.push(k, k, k * 1.1); }
  }
  return mesh(new Float32Array(p), new Float32Array(n), new Float32Array(c), null);
})();

/* ---- state ---- */
let model = null, gpu = null;
const cam = { yaw: 0.7, pitch: 0.35, dist: 5, target: [0, 1, 0], fit: 5 };

function rebuild(refit) {
  const type = $('type').value, seed = $('seed').value.trim() || '1', detail = Number($('detail').value);
  model = ModelGen.generate(type, seed, { detail });
  if (model.triangles * 3 > 65535 && !uint32) throw new Error('Model too large for this browser');
  const b = ModelGen.toBuffers(model);
  freeMesh(gpu);
  gpu = mesh(b.positions, b.normals, b.colors, b.indices);
  const { min, max } = model.bounds;
  const size = max.map((v, i) => v - min[i]);
  const radius = Math.hypot(...size) / 2;
  if (refit) {
    cam.target = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
    cam.fit = cam.dist = Math.max(radius * 2.6, 0.3);
  }
  $('about').textContent = ModelGen.describe(type);
  $('detailVal').textContent = detail + 'x';
  $('stats').textContent =
    `name      ${model.name}\ntriangles ${model.triangles}\nvertices  ${b.vertexCount}\n` +
    `size (m)  ${size.map((v) => v.toFixed(2)).join(' x ')}`;
  try { localStorage.setItem('modelgen', JSON.stringify({ type, seed, detail })); } catch (e) { /* private mode */ }
}

function frame() {
  const w = canvas.clientWidth * devicePixelRatio, h = canvas.clientHeight * devicePixelRatio;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.071, 0.075, 0.09, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  if ($('spin').checked && !drag) cam.yaw += 0.004;
  const t = cam.target, cp = Math.cos(cam.pitch);
  const eye = [t[0] + Math.sin(cam.yaw) * cp * cam.dist, t[1] + Math.sin(cam.pitch) * cam.dist, t[2] + Math.cos(cam.yaw) * cp * cam.dist];
  const mvp = mul(perspective(0.8, w / Math.max(1, h), cam.dist * 0.02, cam.dist * 20), lookAt(eye, t));
  gl.uniformMatrix4fv(loc.mvp, false, new Float32Array(mvp));
  drawMesh(grid, gl.LINES, 0);
  if (gpu) drawMesh(gpu, gl.TRIANGLES, 1);
  requestAnimationFrame(frame);
}

/* ---- input ---- */
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  cam.yaw -= (e.clientX - drag.x) * 0.008;
  cam.pitch = Math.max(-0.2, Math.min(1.45, cam.pitch + (e.clientY - drag.y) * 0.008));
  drag = { x: e.clientX, y: e.clientY };
});
const endDrag = () => { drag = null; canvas.style.cursor = 'grab'; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cam.dist = Math.max(cam.fit * 0.2, Math.min(cam.fit * 4, cam.dist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });

function stepSeed(k) {
  const s = $('seed').value.trim();
  $('seed').value = /^\d+$/.test(s) ? Math.max(0, Number(s) + k) : 1;
  rebuild(true);
}
$('prev').onclick = () => stepSeed(-1);
$('next').onclick = () => stepSeed(1);
$('random').onclick = () => { $('seed').value = Math.floor(Math.random() * 1e6); rebuild(true); };
$('type').onchange = () => rebuild(true);
$('seed').onchange = () => rebuild(true);
$('detail').oninput = () => rebuild(false);
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.key === 'ArrowRight') stepSeed(1);
  else if (e.key === 'ArrowLeft') stepSeed(-1);
  else if (e.key === 'r' || e.key === 'R') $('random').click();
});

function download(name, data, mime) {
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$('glb').onclick = () => download(`${model.type}-${model.seed}.glb`, ModelGen.toGLB(model), 'model/gltf-binary');
$('obj').onclick = () => {
  const { obj, mtl } = ModelGen.toOBJ(model);
  download(`${model.name}.obj`, obj, 'text/plain');
  setTimeout(() => download(`${model.name}.mtl`, mtl, 'text/plain'), 300);
};

/* ---- boot ---- */
for (const t of ModelGen.types()) $('type').add(new Option(t, t));
try {
  const saved = JSON.parse(localStorage.getItem('modelgen') || 'null');
  if (saved && ModelGen.types().includes(saved.type)) {
    $('type').value = saved.type; $('seed').value = saved.seed; $('detail').value = saved.detail;
  }
} catch (e) { /* no storage */ }
const q = new URLSearchParams(location.search);
if (q.get('type')) $('type').value = q.get('type');
if (q.get('seed')) $('seed').value = q.get('seed');
if (q.get('spin') === '0') $('spin').checked = false;
rebuild(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
