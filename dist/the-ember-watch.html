      g.fillStyle = '#101018';
      g.beginPath(); g.ellipse(cx - 4 * u, cy - 21 * u, 3 * u, 3.6 * u, 0, 0, WS.TAU); g.fill();
      g.beginPath(); g.ellipse(cx + 4 * u, cy - 21 * u, 3 * u, 3.6 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 21 * u, 4 * u, 1.5 * u, '#8fe6ff');
      g.fillStyle = p.lo; g.fillRect(cx - 5 * u, cy - 13 * u, 10 * u, 3 * u);
      blade(g, cx + 24 * u, cy + 6 * u, 30 * u, 5 * u, 0.6, '#b9c0cc', '#5c6270');
    },

    ghoul(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 3 * u, cy + 4 * u, 21 * u, 22 * u, p, 0.18);  // lopsided
      shaded(g, cx - 24 * u, cy + 6 * u, 8 * u, 15 * u, p, -0.6);  // dragging arm
      poly(g, [[cx - 32 * u, cy + 16 * u], [cx - 26 * u, cy + 26 * u], [cx - 22 * u, cy + 14 * u]], p.hi, p.line, u);
      shaded(g, cx - 2 * u, cy - 18 * u, 12 * u, 11 * u, p, -0.25);
      g.fillStyle = '#2a1414';                                     // hanging jaw
      g.beginPath(); g.ellipse(cx - 2 * u, cy - 10 * u, 6 * u, 5 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx - 2 * u, cy - 21 * u, 4 * u, 1.8 * u, '#d9ff7a');
    },

    geist(g, s, p) {
      const cx = s / 2, cy = s * 0.62, u = s / 100;
      shaded(g, cx, cy, 15 * u, 14 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 3.5 * u; g.lineCap = 'round';
      for (const dir of [-1, 1]) {
        g.beginPath();
        g.moveTo(cx + dir * 10 * u, cy - 2 * u);
        g.quadraticCurveTo(cx + dir * 30 * u, cy - 16 * u, cx + dir * 24 * u, cy + 16 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 16 * u, 11 * u, 10 * u, p);
      g.fillStyle = '#141a20';                                     // stitched mask
      g.fillRect(cx - 11 * u, cy - 19 * u, 22 * u, 6 * u);
      eyes(g, cx, cy - 16 * u, 4.5 * u, 1.8 * u, '#9ff5ff');
    },

    abomination(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 6 * u, 30 * u, 28 * u, p);
      g.strokeStyle = p.dark; g.lineWidth = 2 * u;                 // stitches
      for (let i = -2; i <= 2; i++) {
        g.beginPath(); g.moveTo(cx + i * 9 * u, cy - 14 * u); g.lineTo(cx + i * 9 * u, cy + 26 * u); g.stroke();
      }
      shaded(g, cx - 30 * u, cy - 2 * u, 11 * u, 17 * u, p, -0.35);
      shaded(g, cx + 30 * u, cy - 2 * u, 11 * u, 17 * u, p, 0.35);
      blade(g, cx + 38 * u, cy + 6 * u, 34 * u, 8 * u, 0.75, '#aeb6c4', '#5a6070');
      shaded(g, cx - 4 * u, cy - 24 * u, 13 * u, 11 * u, p, -0.2); // sagging head
      eyes(g, cx - 4 * u, cy - 25 * u, 5 * u, 2 * u, '#bfff6b');
    },

    wraith(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.save();
      const grd = g.createLinearGradient(0, cy - 34 * u, 0, cy + 30 * u);
      grd.addColorStop(0, p.hi); grd.addColorStop(0.6, p.mid); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(cx - 20 * u, cy + 30 * u);
      g.quadraticCurveTo(cx - 24 * u, cy - 22 * u, cx, cy - 36 * u);
      g.quadraticCurveTo(cx + 24 * u, cy - 22 * u, cx + 20 * u, cy + 30 * u);
      g.quadraticCurveTo(cx, cy + 18 * u, cx - 20 * u, cy + 30 * u);
      g.fill();
      g.restore();
      g.fillStyle = 'rgba(6,8,14,.85)';
      g.beginPath(); g.ellipse(cx, cy - 20 * u, 9 * u, 11 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 21 * u, 4 * u, 2.2 * u, '#cfe6ff');
    },

    reaper(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      CREATURES.wraith(g, s, p);
      g.save();                                                    // the scythe
      g.strokeStyle = '#d8e4f2'; g.lineWidth = 3.5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 26 * u, cy + 34 * u); g.lineTo(cx + 34 * u, cy - 40 * u); g.stroke();
      g.beginPath();
      g.moveTo(cx + 34 * u, cy - 40 * u);
      g.quadraticCurveTo(cx - 4 * u, cy - 52 * u, cx - 12 * u, cy - 24 * u);
      g.lineWidth = 5 * u; g.strokeStyle = '#eef6ff'; g.stroke();
      g.restore();
      g.save(); g.globalAlpha = 0.5; g.strokeStyle = '#9fd8ff'; g.lineWidth = 2 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
    },

    sovereign(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.save();                                                    // eclipse disc
      const grd = g.createRadialGradient(cx, cy, 6 * u, cx, cy, 46 * u);
      grd.addColorStop(0, '#1a1030'); grd.addColorStop(0.7, '#2a1a4a'); grd.addColorStop(1, '#0d0820');
      g.fillStyle = grd;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.fill();
      g.shadowColor = '#ffe6ae'; g.shadowBlur = 26 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 3 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
      for (let i = 0; i < 8; i++) {                                // corona spears
        const a = (i / 8) * WS.TAU + 0.2;
        blade(g, cx + WS.cos(a) * 44 * u, cy + WS.sin(a) * 44 * u, 22 * u, 4 * u, a + WS.PI / 2, '#ffd98f', '#a97c2f');
      }
      g.fillStyle = '#0a0714';
      g.beginPath(); g.ellipse(cx, cy - 4 * u, 13 * u, 16 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 6 * u, 5 * u, 2.6 * u, '#fff3d0');
    },

    /* --- beasts ----------------------------------------------------------- */
    wolf(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      legs(g, p, cx, cy + 17 * u, u, [-16, -6, 8, 18], 13, 4.2);
      shaded(g, cx - 2 * u, cy + 2 * u, 26 * u, 15 * u, p);        // long body
      poly(g, [[cx + 22 * u, cy - 2 * u], [cx + 40 * u, cy - 14 * u], [cx + 26 * u, cy + 6 * u]], p.lo, p.line, u); // tail
      shaded(g, cx - 22 * u, cy - 6 * u, 13 * u, 11 * u, p);       // head
      poly(g, [[cx - 34 * u, cy - 6 * u], [cx - 44 * u, cy - 2 * u], [cx - 32 * u, cy + 2 * u]], p.hi, p.line, u);  // muzzle
      poly(g, [[cx - 28 * u, cy - 14 * u], [cx - 30 * u, cy - 26 * u], [cx - 20 * u, cy - 16 * u]], p.lo, p.line, u);
      poly(g, [[cx - 16 * u, cy - 14 * u], [cx - 14 * u, cy - 26 * u], [cx - 8 * u, cy - 15 * u]], p.lo, p.line, u);
      eyes(g, cx - 26 * u, cy - 8 * u, 4 * u, 1.6 * u, '#ffe08a');
    },

    cat(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      legs(g, p, cx, cy + 16 * u, u, [-15, -5, 7, 17], 12, 3.8);
      shaded(g, cx - 2 * u, cy + 2 * u, 25 * u, 14 * u, p);        // low, long body
      g.strokeStyle = p.dark; g.lineWidth = 2.6 * u; g.lineCap = 'round';
      for (let i = -1; i <= 2; i++) {                              // stripes
        g.beginPath();
        g.moveTo(cx + i * 9 * u, cy - 9 * u);
        g.lineTo(cx + i * 9 * u + 4 * u, cy + 9 * u);
        g.stroke();
      }
      g.lineWidth = 4 * u;                                         // curled tail
      g.strokeStyle = p.lo;
      g.beginPath();
      g.moveTo(cx + 22 * u, cy);
      g.quadraticCurveTo(cx + 42 * u, cy - 6 * u, cx + 36 * u, cy - 24 * u);
      g.stroke();
      shaded(g, cx - 22 * u, cy - 6 * u, 12 * u, 11 * u, p);       // round head
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 31 * u, cy - 24 * u], [cx - 22 * u, cy - 15 * u]], p.lo, p.line, u);
      poly(g, [[cx - 18 * u, cy - 15 * u], [cx - 15 * u, cy - 25 * u], [cx - 10 * u, cy - 14 * u]], p.lo, p.line, u);
      eyes(g, cx - 24 * u, cy - 7 * u, 4.5 * u, 1.8 * u, '#c9f26b');
    },

    boar(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      // Stubby trotters: short, but they still have to clear the barrel.
      legs(g, p, cx + 2 * u, cy + 18 * u, u, [-13, -4, 7, 16], 11, 5);
      /* A boar is a high hump with the head slung low and forward. Sitting the
         head at the body's own centre height, as this did, just made two
         spheres of the same size in a row. */
      shaded(g, cx + 3 * u, cy - 1 * u, 23 * u, 18 * u, p);         // humped body
      g.strokeStyle = p.dark; g.lineWidth = 2.6 * u; g.lineCap = 'round';
      for (let i = -3; i <= 3; i++) {                               // bristles, over the hump
        const a = WS.PI * (0.62 + i * 0.055);
        const bx = cx + 3 * u + WS.cos(a) * 22 * u, by = cy - 1 * u - WS.sin(a) * 17 * u;
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(bx + WS.cos(a) * 8 * u, by - WS.sin(a) * 9 * u);
        g.stroke();
      }
      shaded(g, cx - 21 * u, cy + 6 * u, 13 * u, 12 * u, p);        // low head
      poly(g, [[cx - 30 * u, cy + 7 * u], [cx - 41 * u, cy + 11 * u], [cx - 29 * u, cy + 15 * u]],
        p.hi, p.line, u);                                          // snout
      /* Tusks. They have to grow out of the snout and curl only a little: an
         earlier pass swept them up past the ears, where they read as two loose
         white crescents floating beside the animal rather than as teeth. */
      g.strokeStyle = '#f4ecdc'; g.lineWidth = 3.6 * u; g.lineCap = 'round';
      for (const dy of [13, 8]) {
        g.beginPath();
        g.moveTo(cx - 33 * u, cy + dy * u);
        g.quadraticCurveTo(cx - 43 * u, cy + (dy - 2) * u, cx - 41 * u, cy + (dy - 9) * u);
        g.stroke();
      }
      eyes(g, cx - 22 * u, cy + 1 * u, 4.5 * u, 1.6 * u, '#ff9d6b');
    },

    bristlekin(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 4 * u, 22 * u, 24 * u, p);
      g.strokeStyle = p.hi; g.lineWidth = 3.4 * u; g.lineCap = 'round';
      for (let i = 0; i < 7; i++) {                                // quills
        const a = WS.PI * (0.15 + i * 0.1);
        g.beginPath();
        g.moveTo(cx - WS.cos(a) * 20 * u, cy - WS.sin(a) * 20 * u);
        g.lineTo(cx - WS.cos(a) * 36 * u, cy - WS.sin(a) * 36 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 20 * u, 13 * u, 11 * u, p);
      poly(g, [[cx - 6 * u, cy - 14 * u], [cx + 6 * u, cy - 14 * u], [cx, cy - 6 * u]], p.hi);
      eyes(g, cx, cy - 22 * u, 5 * u, 1.8 * u, '#ffcf6b');
      blade(g, cx + 24 * u, cy + 4 * u, 28 * u, 6 * u, 0.55, '#cdd3de', '#6b7280');
    },

    raptor(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx + 2 * u, cy, 20 * u, 14 * u, p, -0.15);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 16 * u, cy - 2 * u); g.quadraticCurveTo(cx + 40 * u, cy - 8 * u, cx + 44 * u, cy - 24 * u); g.stroke();
      g.strokeStyle = p.dark; g.lineWidth = 4 * u;                 // raised legs
      g.beginPath(); g.moveTo(cx, cy + 8 * u); g.lineTo(cx - 6 * u, cy + 22 * u); g.lineTo(cx + 4 * u, cy + 26 * u); g.stroke();
      shaded(g, cx - 20 * u, cy - 14 * u, 12 * u, 9 * u, p, -0.3);
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 42 * u, cy - 10 * u], [cx - 28 * u, cy - 6 * u]], p.hi, p.line, u);
      poly(g, [[cx - 20 * u, cy - 22 * u], [cx - 12 * u, cy - 34 * u], [cx - 10 * u, cy - 20 * u]], p.lo, p.line, u); // crest
      eyes(g, cx - 23 * u, cy - 16 * u, 3.5 * u, 1.6 * u, '#ffe066');
    },

    strider(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 6 * u, cy + 10 * u); g.lineTo(cx - 10 * u, cy + 32 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 6 * u, cy + 10 * u); g.lineTo(cx + 12 * u, cy + 32 * u); g.stroke();
      shaded(g, cx, cy, 20 * u, 17 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u;                   // long neck
      g.beginPath(); g.moveTo(cx - 8 * u, cy - 10 * u); g.quadraticCurveTo(cx - 22 * u, cy - 30 * u, cx - 14 * u, cy - 40 * u); g.stroke();
      shaded(g, cx - 14 * u, cy - 42 * u, 9 * u, 8 * u, p);
      poly(g, [[cx - 22 * u, cy - 42 * u], [cx - 34 * u, cy - 40 * u], [cx - 22 * u, cy - 36 * u]], p.hi, p.line, u);
      eyes(g, cx - 14 * u, cy - 44 * u, 3.5 * u, 1.5 * u, '#ffe9a8');
    },

    vulture(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // layered wings
        poly(g, [[cx + dir * 5 * u, cy - 8 * u], [cx + dir * 46 * u, cy - 26 * u],
        [cx + dir * 40 * u, cy - 2 * u], [cx + dir * 14 * u, cy + 8 * u]], p.lo, p.line, u);
        poly(g, [[cx + dir * 8 * u, cy - 4 * u], [cx + dir * 38 * u, cy - 10 * u],
        [cx + dir * 20 * u, cy + 10 * u]], p.dark, p.line, u * 0.8);
      }
      legs(g, p, cx, cy + 16 * u, u, [-6, 6], 9, 3.4);
      shaded(g, cx, cy + 2 * u, 14 * u, 16 * u, p);
      // A neck. Without one the head sat inside the body and the bird read as
      // a torso with wings - no beak, no direction, no animal.
      g.strokeStyle = p.lo; g.lineWidth = 6 * u; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(cx + 2 * u, cy - 8 * u);
      g.quadraticCurveTo(cx - 4 * u, cy - 20 * u, cx - 1 * u, cy - 26 * u);
      g.stroke();
      shaded(g, cx - 1 * u, cy - 28 * u, 8 * u, 8 * u, p);
      poly(g, [[cx - 7 * u, cy - 28 * u], [cx - 22 * u, cy - 24 * u], [cx - 7 * u, cy - 21 * u]], '#e8b455', '#8a6420', u);
      eyes(g, cx, cy - 30 * u, 3 * u, 1.5 * u, '#ffd166');
    },

    spider(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.strokeStyle = p.lo; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        for (const dir of [-1, 1]) {
          const a = -0.55 + i * 0.38;
          g.beginPath();
          g.moveTo(cx + dir * 6 * u, cy);
          g.quadraticCurveTo(cx + dir * (26 + i * 3) * u, cy + WS.sin(a) * 26 * u - 12 * u,
            cx + dir * (34 - i * 2) * u, cy + WS.sin(a) * 34 * u + 8 * u);
          g.stroke();
        }
      }
      shaded(g, cx + 4 * u, cy + 4 * u, 18 * u, 16 * u, p);        // abdomen
      shaded(g, cx - 14 * u, cy - 4 * u, 11 * u, 10 * u, p);       // cephalothorax
      g.save(); g.shadowColor = '#ff6b6b'; g.shadowBlur = 8 * u; g.fillStyle = '#ff8a8a';
      for (const [ox, oy] of [[-4, -3], [0, -5], [-6, 1], [1, 0]]) {
        g.beginPath(); g.arc(cx - 16 * u + ox * u, cy - 5 * u + oy * u, 1.5 * u, 0, WS.TAU); g.fill();
      }
      g.restore();
    },

    moonwretch(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      shaded(g, cx, cy + 6 * u, 22 * u, 26 * u, p);
      shaded(g, cx - 24 * u, cy + 4 * u, 9 * u, 16 * u, p, -0.5);
      shaded(g, cx + 24 * u, cy + 4 * u, 9 * u, 16 * u, p, 0.5);
      for (const dir of [-1, 1]) {
        poly(g, [[cx + dir * 30 * u, cy + 16 * u], [cx + dir * 40 * u, cy + 24 * u], [cx + dir * 28 * u, cy + 24 * u]], '#e9edf5', '#8a90a0', u);
      }
      shaded(g, cx, cy - 22 * u, 13 * u, 12 * u, p);
      poly(g, [[cx - 8 * u, cy - 24 * u], [cx - 16 * u, cy - 42 * u], [cx - 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx + 8 * u, cy - 24 * u], [cx + 16 * u, cy - 42 * u], [cx + 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx - 7 * u, cy - 16 * u], [cx + 7 * u, cy - 16 * u], [cx, cy - 6 * u]], p.hi);
      g.fillStyle = '#fff'; // bared teeth
      for (let i = -2; i <= 2; i++) poly(g, [[cx + i * 3 * u, cy - 12 * u], [cx + i * 3 * u + 1.4 * u, cy - 8 * u], [cx + i * 3 * u + 2.8 * u, cy - 12 * u]], '#fff');
      eyes(g, cx, cy - 26 * u, 5 * u, 2 * u, '#ffe14d');
    },

    shrikewing(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // feathered wings
        for (let i = 0; i < 4; i++) {
          poly(g, [
            [cx + dir * 8 * u, cy - 8 * u],
            [cx + dir * (24 + i * 8) * u, cy - (26 - i * 5) * u],
            [cx + dir * (18 + i * 7) * u, cy - (10 - i * 4) * u],
          ], i % 2 ? p.mid : p.lo, p.line, u * 0.8);
        }
      }
      shaded(g, cx, cy + 4 * u, 13 * u, 18 * u, p);
      shaded(g, cx, cy - 16 * u, 10 * u, 9 * u, p);
      poly(g, [[cx - 4 * u, cy - 16 * u], [cx - 16 * u, cy - 12 * u], [cx - 4 * u, cy - 10 * u]], '#f0c469', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3.5 * u, 1.5 * u, '#d9f4ff');
      g.strokeStyle = '#e8c98f'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(cx - 5 * u, cy + 20 * u); g.lineTo(cx - 9 * u, cy + 30 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 5 * u, cy + 20 * u); g.lineTo(cx + 9 * u, cy + 30 * u); g.stroke();
    },

    karrash(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 4 * u, cy + 8 * u, 26 * u, 15 * u, p);        // horse barrel
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      for (const dx of [-14, -4, 12, 22]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 18 * u); g.lineTo(cx + dx * u + 2 * u, cy + 32 * u); g.stroke();
      }
      poly(g, [[cx + 28 * u, cy + 4 * u], [cx + 44 * u, cy - 6 * u], [cx + 30 * u, cy + 12 * u]], p.lo, p.line, u);
      shaded(g, cx - 12 * u, cy - 14 * u, 13 * u, 16 * u, p);      // humanoid torso
      shaded(g, cx - 12 * u, cy - 32 * u, 10 * u, 9 * u, p);
      eyes(g, cx - 12 * u, cy - 33 * u, 4 * u, 1.6 * u, '#ffd98f');
      g.strokeStyle = '#cfd6e2'; g.lineWidth = 3 * u;              // spear
      g.beginPath(); g.moveTo(cx - 30 * u, cy + 20 * u); g.lineTo(cx + 6 * u, cy - 44 * u); g.stroke();
      poly(g, [[cx + 6 * u, cy - 44 * u], [cx + 12 * u, cy - 34 * u], [cx, cy - 36 * u]], '#e7ecf5', '#8a90a0', u);
    },

    golem(g, s, p) {
      /* The one creature that was flat fillRects - no shading, no bevel, no
         legs - which is why it read as furniture rather than a thing that
         walks at you. It stays angular, because that is the point of a golem,
         but it now takes the same light as everything else: lit along the top
         and left, shadowed at the foot, and standing on something. */
      const cx = s / 2, cy = s * 0.54, u = s / 100;
      const plate = (x, y, w, h, lit) => {
        const grd = g.createLinearGradient(x, y, x + w * 0.4, y + h);
        grd.addColorStop(0, lit ? p.hi : p.mid);
        grd.addColorStop(0.55, p.mid);
        grd.addColorStop(1, p.lo);
        g.fillStyle = grd;
        g.fillRect(x, y, w, h);
        g.strokeStyle = p.line; g.lineWidth = 2 * u;
        g.strokeRect(x, y, w, h);
        // The Arclight bevel, in stone: a lit top edge and a dark foot.
        g.fillStyle = 'rgba(255,244,224,.16)'; g.fillRect(x, y, w, 2 * u);
        g.fillStyle = 'rgba(0,0,0,.32)'; g.fillRect(x, y + h - 2 * u, w, 2 * u);
      };

      // Squat legs, angular to match, with a foot slab each.
      plate(cx - 17 * u, cy + 20 * u, 12 * u, 14 * u);
      plate(cx + 5 * u, cy + 20 * u, 12 * u, 14 * u);
      plate(cx - 20 * u, cy + 32 * u, 18 * u, 6 * u);
      plate(cx + 2 * u, cy + 32 * u, 18 * u, 6 * u);

      plate(cx - 30 * u, cy - 8 * u, 10 * u, 26 * u);              // arms
      plate(cx + 20 * u, cy - 8 * u, 10 * u, 26 * u);
      plate(cx - 22 * u, cy - 14 * u, 44 * u, 36 * u, true);       // torso
      plate(cx - 14 * u, cy - 32 * u, 28 * u, 18 * u, true);       // head block

      g.save(); g.shadowColor = '#ff9d3c'; g.shadowBlur = 12 * u;  // furnace
      g.fillStyle = '#ffb45c';
      g.fillRect(cx - 8 * u, cy - 26 * u, 16 * u, 5 * u);
      g.fillRect(cx - 6 * u, cy + 2 * u, 12 * u, 12 * u);
      g.restore();
      blade(g, cx + 34 * u, cy + 6 * u, 30 * u, 9 * u, 0.9, '#b9c0cc', '#5c6270'); // scythe arm
    },
  };

  /* --------------------------------------------------------- the survivor - */
  // Player sprites share one frame and differ by robe/armour colour, silhouette
  // accessory (staff, blades, bow...) and a class glyph on the chest.
  const HEROES = {
    mage: { accessory: 'staff', cloak: true },
    priest: { accessory: 'staff', cloak: true, halo: true },
    rogue: { accessory: 'daggers', hood: true },
    hunter: { accessory: 'bow' },
    warrior: { accessory: 'axe', bulk: 1.15 },
    warlock: { accessory: 'orb', cloak: true, hood: true },
    shaman: { accessory: 'totem', cloak: true },
    paladin: { accessory: 'shield', bulk: 1.1, halo: true },
    graveblade: { accessory: 'graveblade', bulk: 1.1, cloak: true },
    ruinseeker: { accessory: 'glaives', horns: true },
  };

  function drawHero(g, s, tint, cfg, demon) {
    const cx = s / 2, cy = s * 0.56, u = s / 100;
    const p = palette(demon ? [0.45, 0.95, 0.25] : tint);
    const bulk = cfg.bulk || 1;

    if (cfg.cloak) {                                               // cloak behind
      poly(g, [[cx - 20 * u * bulk, cy + 30 * u], [cx - 13 * u, cy - 18 * u],
      [cx + 13 * u, cy - 18 * u], [cx + 20 * u * bulk, cy + 30 * u]],
        p.lo, p.line, u);
    }
    shaded(g, cx, cy + 6 * u, 15 * u * bulk, 20 * u, p);           // torso
    shaded(g, cx - 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, -0.35);
    shaded(g, cx + 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, 0.35);
    g.fillStyle = p.dark;                                          // legs
    g.fillRect(cx - 9 * u, cy + 20 * u, 7 * u, 14 * u);
    g.fillRect(cx + 2 * u, cy + 20 * u, 7 * u, 14 * u);

    const skin = { hi: '#f2d9bd', mid: '#d9b494', lo: '#a07f63', line: '#5d4738', glow: '#fff' };
    shaded(g, cx, cy - 16 * u, 10 * u, 10 * u, demon ? p : skin);
    if (cfg.hood) {
      poly(g, [[cx - 12 * u, cy - 12 * u], [cx, cy - 34 * u], [cx + 12 * u, cy - 12 * u]], p.mid, p.line, u);
      g.fillStyle = 'rgba(6,8,14,.8)';
      g.beginPath(); g.ellipse(cx, cy - 17 * u, 7 * u, 8 * u, 0, 0, WS.TAU); g.fill();
    }
    if (cfg.horns || demon) {
      poly(g, [[cx - 8 * u, cy - 22 * u], [cx - 18 * u, cy - 42 * u], [cx - 3 * u, cy - 26 * u]], p.hi, p.line, u);
      poly(g, [[cx + 8 * u, cy - 22 * u], [cx + 18 * u, cy - 42 * u], [cx + 3 * u, cy - 26 * u]], p.hi, p.line, u);
    }
    if (cfg.halo) {
      g.save(); g.globalAlpha = 0.85; g.shadowColor = '#ffe6ae'; g.shadowBlur = 12 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 2 * u;
      g.beginPath(); g.ellipse(cx, cy - 32 * u, 12 * u, 4 * u, 0, 0, WS.TAU); g.stroke();
      g.restore();
    }
    eyes(g, cx, cy - 17 * u, 4 * u, 1.6 * u, demon ? '#d9ff6b' : '#8fd8ff');

    switch (cfg.accessory) {
      case 'staff':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3 * u; g.lineCap = 'round';
        g.beginPath(); g.moveTo(cx + 22 * u, cy + 28 * u); g.lineTo(cx + 26 * u, cy - 38 * u); g.stroke();
        g.save(); g.shadowColor = WS.hex(tint); g.shadowBlur = 16 * u;
        g.fillStyle = WS.hex(WS.mix(tint, [1, 1, 1], 0.5));
        g.beginPath(); g.arc(cx + 26 * u, cy - 42 * u, 6 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'daggers':
        blade(g, cx - 22 * u, cy + 10 * u, 20 * u, 4 * u, -0.5, '#e2e7f0', '#767c8c');
        blade(g, cx + 22 * u, cy + 10 * u, 20 * u, 4 * u, 0.5, '#e2e7f0', '#767c8c');
        break;
      case 'bow':
        g.strokeStyle = '#a97f4a'; g.lineWidth = 3 * u;
        g.beginPath(); g.arc(cx + 24 * u, cy, 22 * u, -1.1, 1.1); g.stroke();
        g.strokeStyle = '#e8edf6'; g.lineWidth = 1.2 * u;
        g.beginPath(); g.moveTo(cx + 34 * u, cy - 19 * u); g.lineTo(cx + 34 * u, cy + 19 * u); g.stroke();
        break;
      case 'axe':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3.5 * u;
        g.beginPath(); g.moveTo(cx + 20 * u, cy + 26 * u); g.lineTo(cx + 30 * u, cy - 26 * u); g.stroke();
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 46 * u, cy - 18 * u], [cx + 30 * u, cy - 6 * u]], '#d4dae6', '#767c8c', u);
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 16 * u, cy - 16 * u], [cx + 30 * u, cy - 6 * u]], '#b9c0cc', '#767c8c', u);
        break;
      case 'orb':
        g.save(); g.shadowColor = '#9d5bff'; g.shadowBlur = 18 * u;
        g.fillStyle = '#b98cff';
        g.beginPath(); g.arc(cx + 24 * u, cy - 4 * u, 7 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'totem':
        g.fillStyle = '#8b6a44'; g.fillRect(cx + 20 * u, cy - 20 * u, 9 * u, 44 * u);
        g.save(); g.shadowColor = '#4db8ff'; g.shadowBlur = 14 * u;
        g.fillStyle = '#7fd4ff'; g.fillRect(cx + 21 * u, cy - 14 * u, 7 * u, 7 * u);
        g.restore();
        break;
      case 'shield':
        poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 14 * u, cy - 18 * u], [cx - 12 * u, cy + 8 * u],
        [cx - 22 * u, cy + 20 * u], [cx - 32 * u, cy + 6 * u]], '#e0d3a8', '#8a7440', u * 1.2);
        g.save(); g.shadowColor = '#ffe6ae'; g.shadowBlur = 10 * u;
        g.fillStyle = '#fff2cc';
        g.beginPath(); g.arc(cx - 22 * u, cy - 1 * u, 4 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'graveblade':
        blade(g, cx + 24 * u, cy + 26 * u, 52 * u, 6 * u, 0.32, '#cfd8e6', '#5f6878');
        g.save(); g.globalAlpha = 0.85; g.strokeStyle = '#5be0ff'; g.lineWidth = 1.6 * u;
        g.shadowColor = '#5be0ff'; g.shadowBlur = 10 * u;
        g.beginPath(); g.moveTo(cx + 26 * u, cy + 14 * u); g.lineTo(cx + 34 * u, cy - 22 * u); g.stroke();
        g.restore();
        break;
      case 'glaives':
        for (const dir of [-1, 1]) {
          g.save();
          g.translate(cx + dir * 26 * u, cy + 4 * u); g.rotate(dir * 0.5);
          g.strokeStyle = '#7dff45'; g.lineWidth = 2.4 * u;
          g.shadowColor = '#7dff45'; g.shadowBlur = 12 * u;
          g.beginPath(); g.arc(0, 0, 14 * u, -0.9, 1.4); g.stroke();
          g.beginPath(); g.arc(0, 0, 8 * u, 1.4, -0.9, true); g.stroke();
          g.restore();
        }
        break;
    }
  }

  /* ------------------------------------------------------------- props ---- */
  const PROPS = {
    tree(g, s) {
      const u = s / 100, cx = s / 2, cy = s * 0.7;
      g.fillStyle = '#2a1f14'; g.fillRect(cx - 5 * u, cy - 6 * u, 10 * u, 30 * u);
      for (let i = 0; i < 3; i++) {
        ellipse(g, cx, cy - 18 * u - i * 14 * u, (32 - i * 7) * u, (18 - i * 3) * u,
          i === 2 ? '#2f4a26' : i === 1 ? '#26401f' : '#1e3419');
      }
    },
    deadtree(g, s) {
      const u = s / 100, cx = s / 2, cy = s * 0.8;
      g.strokeStyle = '#2c2a33'; g.lineWidth = 6 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - 44 * u); g.stroke();
      g.lineWidth = 3.5 * u;
      for (const [ax, ay] of [[-24, -30], [22, -36], [-16, -46], [18, -52]]) {
        g.beginPath(); g.moveTo(cx, cy - 26 * u); g.lineTo(cx + ax * u, cy + ay * u); g.stroke();
      }
    },
    stump(g, s) {
      const u = s / 100;
      ellipse(g, s / 2, s * 0.62, 20 * u, 12 * u, '#3b2c1c');
      ellipse(g, s / 2, s * 0.58, 15 * u, 8 * u, '#5a452c');
    },
    rock(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 24 * u, s * 0.7], [s / 2 - 14 * u, s * 0.42], [s / 2 + 10 * u, s * 0.38],
      [s / 2 + 24 * u, s * 0.62], [s / 2 + 8 * u, s * 0.74]], '#3c4048', '#22252b', u);
    },
    flower(g, s) {
      const u = s / 100;
      g.strokeStyle = '#3f5a2c'; g.lineWidth = 2 * u;
      g.beginPath(); g.moveTo(s / 2, s * 0.72); g.lineTo(s / 2, s * 0.5); g.stroke();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * WS.TAU;
        ellipse(g, s / 2 + WS.cos(a) * 7 * u, s * 0.48 + WS.sin(a) * 7 * u, 5 * u, 5 * u, '#c98fd6');
      }
      ellipse(g, s / 2, s * 0.48, 4 * u, 4 * u, '#ffe27a');
    },
    mushroom(g, s) {
      const u = s / 100;
      g.fillStyle = '#c9c4b4'; g.fillRect(s / 2 - 4 * u, s * 0.52, 8 * u, 18 * u);
      ellipse(g, s / 2, s * 0.52, 18 * u, 11 * u, '#6b4a7a');
      ellipse(g, s / 2 - 6 * u, s * 0.5, 3 * u, 2 * u, '#d8cfe6');
    },
    grave(g, s) {
      const u = s / 100;
      g.fillStyle = '#4a4f58';
      g.beginPath();
      g.moveTo(s / 2 - 16 * u, s * 0.74); g.lineTo(s / 2 - 16 * u, s * 0.46);
      g.arc(s / 2, s * 0.46, 16 * u, WS.PI, 0);
      g.lineTo(s / 2 + 16 * u, s * 0.74); g.closePath(); g.fill();
      g.strokeStyle = '#2b2f36'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(s / 2, s * 0.44); g.lineTo(s / 2, s * 0.64); g.stroke();
      g.beginPath(); g.moveTo(s / 2 - 8 * u, s * 0.52); g.lineTo(s / 2 + 8 * u, s * 0.52); g.stroke();
    },
    bone(g, s) {
      const u = s / 100;
      g.strokeStyle = '#8f94a0'; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(s / 2 - 18 * u, s * 0.6); g.lineTo(s / 2 + 18 * u, s * 0.56); g.stroke();
      g.fillStyle = '#a3a8b4';
      for (const [x, y] of [[-20, 56], [-18, 66], [20, 52], [22, 62]]) {
        ellipse(g, s / 2 + x * u, s * (y / 100), 5 * u, 5 * u, '#a3a8b4');
      }
    },
    skull(g, s) {
      const u = s / 100;
      ellipse(g, s / 2, s * 0.56, 16 * u, 15 * u, '#9aa0ac');
      g.fillStyle = '#20242c';
      ellipse(g, s / 2 - 6 * u, s * 0.55, 4 * u, 5 * u, '#20242c');
      ellipse(g, s / 2 + 6 * u, s * 0.55, 4 * u, 5 * u, '#20242c');
      g.fillRect(s / 2 - 6 * u, s * 0.64, 12 * u, 6 * u);
    },
    wheat(g, s) {
      const u = s / 100;
      g.strokeStyle = '#8f7a3c'; g.lineWidth = 2 * u;
      for (const dx of [-10, 0, 10]) {
        g.beginPath(); g.moveTo(s / 2 + dx * u, s * 0.74); g.quadraticCurveTo(s / 2 + dx * u + 4 * u, s * 0.56, s / 2 + dx * u, s * 0.4); g.stroke();
        ellipse(g, s / 2 + dx * u, s * 0.4, 4 * u, 8 * u, '#c9a94c');
      }
    },
    fence(g, s) {
      const u = s / 100;
      g.fillStyle = '#4a3a26';
      g.fillRect(s / 2 - 22 * u, s * 0.44, 5 * u, 30 * u);
      g.fillRect(s / 2 + 17 * u, s * 0.44, 5 * u, 30 * u);
      g.fillRect(s / 2 - 24 * u, s * 0.52, 48 * u, 4 * u);
      g.fillRect(s / 2 - 24 * u, s * 0.62, 48 * u, 4 * u);
    },
    gear(g, s) {
      const u = s / 100;
      g.save(); g.translate(s / 2, s * 0.58);
      g.fillStyle = '#585d68';
      for (let i = 0; i < 8; i++) {
        g.rotate(WS.TAU / 8);
        g.fillRect(-3 * u, -20 * u, 6 * u, 8 * u);
      }
      g.beginPath(); g.arc(0, 0, 14 * u, 0, WS.TAU); g.fill();
      g.fillStyle = '#2b2f36';
      g.beginPath(); g.arc(0, 0, 5 * u, 0, WS.TAU); g.fill();
      g.restore();
    },
    cactus(g, s) {
      const u = s / 100;
      g.fillStyle = '#3d5a34';
      g.fillRect(s / 2 - 6 * u, s * 0.36, 12 * u, 38 * u);
      g.fillRect(s / 2 - 18 * u, s * 0.5, 8 * u, 16 * u);
      g.fillRect(s / 2 + 10 * u, s * 0.46, 8 * u, 20 * u);
    },
    grass(g, s) {
      const u = s / 100;
      g.strokeStyle = '#6b6a3c'; g.lineWidth = 2 * u; g.lineCap = 'round';
      for (const dx of [-12, -4, 4, 12]) {
        g.beginPath(); g.moveTo(s / 2 + dx * u, s * 0.72);
        g.quadraticCurveTo(s / 2 + dx * u + 6 * u, s * 0.58, s / 2 + dx * u + 2 * u, s * 0.44); g.stroke();
      }
    },
    spire(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 14 * u, s * 0.76], [s / 2 - 6 * u, s * 0.3], [s / 2 + 4 * u, s * 0.26],
      [s / 2 + 14 * u, s * 0.72]], '#39485c', '#22303f', u);
    },
    crystal(g, s) {
      const u = s / 100;
      g.save(); g.shadowColor = '#7fd4ff'; g.shadowBlur = 14 * u;
      poly(g, [[s / 2, s * 0.3], [s / 2 + 11 * u, s * 0.56], [s / 2, s * 0.72], [s / 2 - 11 * u, s * 0.56]],
        '#6fbfe8', '#a9e6ff', u);
      g.restore();
    },
    ice(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 20 * u, s * 0.68], [s / 2 - 6 * u, s * 0.48], [s / 2 + 8 * u, s * 0.54],
      [s / 2 + 20 * u, s * 0.7]], 'rgba(160,210,240,.5)', 'rgba(210,240,255,.7)', u);
    },
  };

  /* -------------------------------------------------------------- API ----- */
  WS.Sprites = {
    /** Cached creature sprite. `size` is the full canvas edge in world units. */
    creature(art, tint, size) {
      size = WS.round(size);
      const key = `c:${art}:${WS.hex(tint)}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const g = c.getContext('2d');
      const draw = CREATURES[art] || CREATURES.lampling;
      draw(g, res, palette(tint));
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    /** @param {number} [frame] stride frame, or undefined for standing. */
    hero(id, tint, size, demon, frame) {
      size = WS.round(size);
      const key = `h:${id}:${WS.hex(tint)}:${size}:${demon ? 1 : 0}:${frame === undefined ? 'x' : frame}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      // The survivor is drawn by src/render/hero.js, which owns the rig, the
      // roster and the light. This is the cache in front of it.
      /* One canvas per stride frame. Baked rather than transformed because
       * the parts that move are inside the drawing - a leg swinging from the
       * hip, a hem lagging the body - and only the size the game is played at
       * ever asks for more than the standing frame, so the cache grows by a
       * few dozen small canvases and nothing else changes. */
      WS.Hero.draw(c.getContext('2d'), res, id, tint, demon,
        frame === undefined ? undefined : frame / WS.Hero.frames);
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    /** A character portrait: the survivor standing in their own light.
     *
     *  The roster used to show a 116px sprite floating in a grey box, which is
     *  the difference between a game's character select and a settings row.
     *  Same materials as everything else - there is no artwork to load - but
     *  composed as a picture: a lit ground they stand ON, a shadow that seats
     *  them, a wash of their own class colour behind, and a vignette to close
     *  the frame. */
    portrait(id, tint, size) {
      size = WS.round(size);
      const key = `pt:${id}:${WS.hex(tint)}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const g = c.getContext('2d');
      const u = res / 100;
      const p = palette(tint);
      const horizon = res * 0.67;

      // The room: dark at the edges, warmer where the subject stands.
      const room = g.createRadialGradient(res * 0.5, res * 0.46, 0, res * 0.5, res * 0.5, res * 0.72);
      room.addColorStop(0, '#171a24');
      room.addColorStop(0.55, '#0f121a');
      room.addColorStop(1, '#07080c');
      g.fillStyle = room;
      g.fillRect(0, 0, res, res);

      // Their colour, thrown up the back wall.
      const wash = g.createRadialGradient(res * 0.5, res * 0.58, 0, res * 0.5, res * 0.58, res * 0.5);
      wash.addColorStop(0, WS.rgb(tint, 0.24));
      wash.addColorStop(1, WS.rgb(tint, 0));
      g.fillStyle = wash;
      g.fillRect(0, 0, res, res);

      // The floor they are standing on, and its horizon line.
      const floor = g.createLinearGradient(0, horizon - 6 * u, 0, res);
      floor.addColorStop(0, 'rgba(0,0,0,.42)');
      floor.addColorStop(1, 'rgba(0,0,0,.08)');
      g.fillStyle = floor;
      g.fillRect(0, horizon - 6 * u, res, res - horizon + 6 * u);
      g.fillStyle = WS.rgb(tint, 0.16);
      g.fillRect(0, horizon - 1 * u, res, 1 * u);

      // A pool of light on the floor, then the shadow inside it.
      const pool = g.createRadialGradient(res * 0.5, horizon + 4 * u, 0, res * 0.5, horizon + 4 * u, res * 0.4);
      pool.addColorStop(0, WS.rgb(tint, 0.2));
      pool.addColorStop(1, WS.rgb(tint, 0));
      g.fillStyle = pool;
      g.beginPath();
      g.ellipse(res * 0.5, horizon + 4 * u, res * 0.4, res * 0.12, 0, 0, WS.TAU);
      g.fill();
      g.fillStyle = 'rgba(0,0,0,.5)';
      g.beginPath();
      g.ellipse(res * 0.5, horizon + 5 * u, res * 0.17, res * 0.045, 0, 0, WS.TAU);
      g.fill();

      // The survivor, large enough to be a portrait rather than a token.
      const hs = WS.round(size * 0.66);
      const hero = WS.Sprites.hero(id, tint, hs);
      // The hero sprite plants its feet at 0.72 of its own canvas, so line that
      // up with the horizon rather than the sprite's box.
      g.drawImage(hero, (res - hs * SS) / 2, horizon - hs * SS * 0.72, hs * SS, hs * SS);

      // Close the frame.
      const vig = g.createRadialGradient(res * 0.5, res * 0.5, res * 0.3, res * 0.5, res * 0.5, res * 0.72);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,.5)');
      g.fillStyle = vig;
      g.fillRect(0, 0, res, res);

      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    /** A zone card: the battlefield at dusk, from its own palette.
     *
     *  The survivor gets a portrait, so a battlefield gets a landscape - a
     *  116px glyph adrift in a 184px frame was the one place the two halves of
     *  the picker did not match. No sigil struck over it: the zone's name is
     *  already set in 24px beside the card, and a symbol laid over a scene
     *  only competes with it. The tiles keep their glyph plates; this is the
     *  place itself.
     */
    zoneCard(map, sigil, size) {
      size = WS.round(size);
      const key = `zc:${map.name}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const g = c.getContext('2d');
      const horizon = res * 0.58;
      // Scattered once and cached by key, so the card is stable for the run.
      const rnd = WS.random;

      // Dusk, in the zone's own light: dark overhead, its accent at the skyline.
      const sky = g.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, WS.hex(WS.shade(map.ground, 0.30)));
      sky.addColorStop(0.62, WS.hex(WS.shade(map.groundAlt, 0.62)));
      sky.addColorStop(1, WS.hex(WS.mix(map.groundAlt, [1, 1, 1], 0.30)));
      g.fillStyle = sky;
      g.fillRect(0, 0, res, horizon);

      // A low sun sitting on the skyline - the one warm thing in the picture.
      const sun = g.createRadialGradient(res * 0.66, horizon, 0, res * 0.66, horizon, res * 0.34);
      sun.addColorStop(0, WS.rgb(WS.mix(map.groundAlt, [1, 1, 1], 0.7), 0.6));
      sun.addColorStop(1, WS.rgb(map.groundAlt, 0));
      g.fillStyle = sun;
      g.fillRect(0, 0, res, horizon);

      // Ground, mottled the way the battlefield itself is.
      g.fillStyle = WS.hex(WS.shade(map.ground, 0.9));
      g.fillRect(0, horizon, res, res - horizon);
      for (let i = 0; i < 120; i++) {

/* Procedural ability icons, drawn to one system.
 *
 * THE SYSTEM - every glyph obeys it, which is what makes sixty of them read as
 * one set rather than sixty drawings:
 *   - a 100x100 field, with all marks inside an optical circle of radius 36
 *     centred at (50,50). Nothing touches the plate edge.
 *   - two stroke weights only: STROKE for the subject, HAIR for detail. Round
 *     caps and joins throughout.
 *   - one density target: a glyph covers roughly a third of its optical circle,
 *     so a stroked icon never looks starved beside a filled one.
 *   - one treatment per glyph. A shape is drawn OR outlined, never a hairline
 *     stapled to a heavy fill.
 *   - a distinct silhouette. Five weapons must not all be a thin vertical.
 *
 * The plate is a chamfered machined tile - an octagon, not a rounded rectangle -
 * with an outer rim, an inner bevel lit from the top, an accent hairline inlaid
 * three units in, and a pool of light behind the subject.

      shape(g, [[76, 48], [92, 28], [80, 62]], col);
      shape(g, [[14, 44], [4, 47], [16, 52]], col);
      disc(g, 24, 40, 4, '#0b0d12');
      line(g, col, HAIR + 1);
      for (const dx of [-6, 10, 22]) {
        g.beginPath(); g.moveTo(50 + dx, 70); g.lineTo(50 + dx, 84); g.stroke();
      }
    },
    risen(g, c) {
      const col = c || '#9fd66b';
      g.fillStyle = col;
      g.beginPath(); g.ellipse(50, 34, 17, 19, 0, 0, WS.TAU); g.fill();
      g.fillStyle = '#12141a';
      disc(g, 43, 32, 4, '#12141a'); disc(g, 57, 32, 4, '#12141a');
      line(g, col, STROKE - 1);
      g.beginPath(); g.moveTo(50, 52); g.lineTo(50, 74); g.stroke();
      g.beginPath(); g.moveTo(50, 58); g.lineTo(28, 68); g.stroke();
      g.beginPath(); g.moveTo(50, 58); g.lineTo(72, 68); g.stroke();
      g.beginPath(); g.moveTo(50, 74); g.lineTo(38, 88); g.stroke();
      g.beginPath(); g.moveTo(50, 74); g.lineTo(62, 88); g.stroke();
    },
    command(g, c) {
      // A hand of command: three thralls bound to one point.
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * WS.TAU - WS.PI / 2;
        const x = 50 + WS.cos(a) * 28, y = 50 + WS.sin(a) * 28;
        line(g, dim(c), 3.5);
        g.beginPath(); g.moveTo(50, 50); g.lineTo(x, y); g.stroke();
        disc(g, x, y, 10, c);
        disc(g, x, y, 4.5, '#0b0d12');
      }
      disc(g, 50, 50, 12, c);
      disc(g, 50, 50, 6, lit);
    },
    thorn(g, c) {
      // A bramble ring: barbs facing outward, which is exactly what the passive
      // does, and a silhouette nothing else in the set shares.
      const col = c || '#6fbf5a';
      circle(g, 50, 50, 22, col, HAIR + 2);
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * WS.TAU + 0.3;
        spike(g, 50 + WS.cos(a) * 28, 50 + WS.sin(a) * 28, 14, 5.5, a + WS.PI / 2, col);
      }
      disc(g, 50, 50, 6, dim(col));
    },
    desecrate(g, c) {
      g.fillStyle = '#5a1f7a';
      g.beginPath(); g.ellipse(50, 64, 34, 18, 0, 0, WS.TAU); g.fill();
      g.fillStyle = c || '#8cf24a';
      g.beginPath(); g.ellipse(50, 64, 20, 10, 0, 0, WS.TAU); g.fill();
      line(g, '#c77dff', HAIR + 1);
      for (const [dx, h] of [[-20, 30], [0, 22], [20, 32]]) {
        g.beginPath(); g.moveTo(50 + dx, 56); g.lineTo(50 + dx * 0.75, h); g.stroke();
      }
    },
    soulrend(g, c) {
      const col = c || '#8cf24a';
      // A torn ring: two arcs pulled apart, with the tear lit between them.
      arcAt(g, 50, 50, 28, -1.05, 1.35, col, STROKE);
      arcAt(g, 50, 50, 28, 1.85, -1.55, col, STROKE);
      line(g, lit, HAIR - 1);
      g.beginPath(); g.moveTo(70, 34); g.lineTo(60, 50); g.lineTo(72, 62); g.stroke();
      disc(g, 50, 50, 6, col);
    },
    retaura(g, c) {
      const col = c || '#ffdf7a';
      circle(g, 50, 50, 24, col, HAIR + 1);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * WS.TAU;
        spike(g, 50 + WS.cos(a) * 32, 50 + WS.sin(a) * 32, 10, 4.5, a + WS.PI / 2, col);
      }
      disc(g, 50, 50, 11, col);
    },
    feint(g, c) {
      // A figure stepping clear of its own after-image: two humanoid marks,
      // one ghosted, which reads as a dodge and not as two leaves.
      const figure = (x, alpha) => {
        g.save();
        g.globalAlpha = alpha;
        g.fillStyle = c;
        disc(g, x, 28, 10, c);
        g.beginPath();
        g.moveTo(x - 12, 44);
        g.quadraticCurveTo(x, 38, x + 12, 44);
        g.lineTo(x + 9, 72);
        g.lineTo(x - 9, 72);
        g.fill();
        g.beginPath(); g.roundRect(x - 9, 70, 7, 18, 3); g.fill();
        g.beginPath(); g.roundRect(x + 2, 70, 7, 18, 3); g.fill();
        g.restore();
      };
      figure(33, 0.28);
      figure(62, 1);
    },

    /* ---- meta ----------------------------------------------------------- */
    clover(g, c) {
      const col = c || '#4fd67a';
      // Heart-shaped leaves with a notch, so it is a clover and not four dots.
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * WS.TAU + WS.PI / 4;
        g.save();
        g.translate(50 + WS.cos(a) * 15, 44 + WS.sin(a) * 15);
        g.rotate(a + WS.PI / 2);
        g.fillStyle = col;
        g.beginPath();
        g.moveTo(0, 15);
        g.bezierCurveTo(-17, 2, -9, -14, 0, -4);
        g.bezierCurveTo(9, -14, 17, 2, 0, 15);
        g.fill();
        g.restore();
      }
      line(g, '#2f7a45', HAIR);
      g.beginPath(); g.moveTo(50, 58); g.quadraticCurveTo(61, 74, 46, 86); g.stroke();
    },
    reroll(g, c) {
      arcAt(g, 50, 52, 27, 0.55, WS.TAU - 0.25, c, STROKE - 1);
      shape(g, [[76, 18], [86, 44], [58, 40]], c);
    },
    banish(g, c) {
      circle(g, 50, 50, 27, c, STROKE - 1);
      line(g, c, STROKE - 1);
      g.beginPath(); g.moveTo(31, 31); g.lineTo(69, 69); g.stroke();
    },
    hourglass(g, c) {
      const col = c || '#7fd4ff';
      g.fillStyle = '#b98f4c';
      g.beginPath(); g.roundRect(24, 14, 52, 8, 2); g.fill();
      g.beginPath(); g.roundRect(24, 78, 52, 8, 2); g.fill();
      shape(g, [[31, 22], [69, 22], [53, 50], [69, 78], [31, 78], [47, 50]], col);
      disc(g, 50, 50, 3.5, lit);
    },
    ankh(g, c) {
      const col = c || '#ffd35c';
      circle(g, 50, 32, 15, col, STROKE);
      line(g, col, STROKE);
      g.beginPath(); g.moveTo(50, 47); g.lineTo(50, 86); g.stroke();
      g.beginPath(); g.moveTo(29, 58); g.lineTo(71, 58); g.stroke();
    },
    egg(g, c) {
      g.fillStyle = c || '#f0e6cf';
      g.beginPath(); g.ellipse(50, 54, 25, 32, 0, 0, WS.TAU); g.fill();
      line(g, '#00000044', 3); g.stroke();
      g.fillStyle = lit + '77';
      g.beginPath(); g.ellipse(41, 40, 7, 11, -0.4, 0, WS.TAU); g.fill();
    },

    /* ---- blessings ------------------------------------------------------ */
    crown(g, c) {
      shape(g, [[18, 74], [24, 32], [37, 52], [50, 22], [63, 52], [76, 32], [82, 74]],
        c || '#ffd35c', '#00000055');
      g.fillStyle = '#00000044'; g.fillRect(20, 74, 60, 8);
      disc(g, 50, 40, 5, lit);
    },
    drain(g, c) {
      const col = c || '#c94f8a';
      g.fillStyle = col;
      g.beginPath();
      g.moveTo(50, 16); g.quadraticCurveTo(78, 52, 68, 70);
      g.quadraticCurveTo(50, 92, 32, 70);
      g.quadraticCurveTo(22, 52, 50, 16); g.fill();
      line(g, lit + '99', HAIR);
      g.beginPath(); g.arc(41, 62, 10, 0.5, 2.7); g.stroke();
    },
    flame(g, c) { G.ember(g, c || '#ff8a3c'); },
    arcane(g, c) {
      const col = c || '#8f7bff';
      for (let i = 0; i < 3; i++) {
        g.save(); g.translate(50, 50); g.rotate((i / 3) * WS.PI);
        line(g, i === 0 ? col : dim(col), HAIR + 1);
        g.beginPath(); g.ellipse(0, 0, 34, 13, 0, 0, WS.TAU); g.stroke();
        g.restore();
      }
      disc(g, 50, 50, 10, lit);
    },

    /* ---- world objects and achievements --------------------------------- */
    candle(g, c) {
      g.fillStyle = '#e8dfc8';
      g.beginPath(); g.roundRect(38, 44, 24, 42, 3); g.fill();
      g.fillStyle = '#00000033'; g.fillRect(38, 44, 24, 5);
      g.fillStyle = c || '#ffd166';
      g.beginPath(); g.moveTo(50, 14); g.quadraticCurveTo(66, 32, 50, 44);
      g.quadraticCurveTo(34, 32, 50, 14); g.fill();
      disc(g, 50, 34, 6, lit);
    },
    mask(g, c) {
      // A bandit's kerchief: a knotted band across the face, not a domino.
      g.fillStyle = c || '#c33b3b';
      g.beginPath();
      g.moveTo(14, 38); g.quadraticCurveTo(50, 26, 86, 38);
      g.quadraticCurveTo(84, 58, 50, 70);
      g.quadraticCurveTo(16, 58, 14, 38); g.fill();
      shape(g, [[14, 38], [4, 30], [8, 52], [16, 52]], c || '#c33b3b');
      g.fillStyle = '#00000055';
      g.beginPath();
      g.moveTo(14, 38); g.quadraticCurveTo(50, 48, 86, 38);
      g.quadraticCurveTo(84, 46, 50, 56);
      g.quadraticCurveTo(16, 46, 14, 38); g.fill();
      disc(g, 37, 42, 5, '#12141a');
      disc(g, 63, 42, 5, '#12141a');
    },
    deadtree(g, c) {
      const col = c || '#7a7080';
      line(g, col, STROKE);
      g.beginPath(); g.moveTo(50, 88); g.lineTo(50, 42); g.stroke();
      line(g, col, HAIR + 1);
      for (const [x, y] of [[24, 26], [76, 20], [32, 14], [70, 42]]) {
        g.beginPath(); g.moveTo(50, 52); g.lineTo(x, y); g.stroke();
      }
      line(g, col, HAIR - 1);
      g.beginPath(); g.moveTo(38, 66); g.lineTo(26, 56); g.stroke();
      g.beginPath(); g.moveTo(62, 62); g.lineTo(74, 54); g.stroke();
    },
    sun(g, c) {
      const col = c || '#ffdf7a';
      disc(g, 50, 50, 19, col);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * WS.TAU;
        spike(g, 50 + WS.cos(a) * 30, 50 + WS.sin(a) * 30, 11, 5, a + WS.PI / 2, col);
      }
    },
    crystal(g, c) {
      shape(g, [[50, 14], [74, 44], [50, 86], [26, 44]], c || '#7fd4ff', lit + '99');
      shape(g, [[50, 14], [50, 86], [26, 44]], lit + '44');
    },
    gilkin(g, c) {
      const col = c || '#5fd68a';
      g.fillStyle = col;
      g.beginPath(); g.ellipse(50, 54, 25, 29, 0, 0, WS.TAU); g.fill();
      shape(g, [[27, 40], [8, 22], [29, 54]], col);
      shape(g, [[73, 40], [92, 22], [71, 54]], col);
      g.fillStyle = '#0e1218';
      g.beginPath(); g.ellipse(50, 68, 15, 8, 0, 0, WS.PI); g.fill();
      disc(g, 39, 44, 8, '#eaffd8'); disc(g, 61, 44, 8, '#eaffd8');
      disc(g, 39, 44, 3.5, '#12141a'); disc(g, 61, 44, 3.5, '#12141a');
    },
    anvil(g, c) {
      shape(g, [[16, 34], [84, 34], [68, 52], [60, 52], [62, 70], [76, 84],
      [24, 84], [38, 70], [40, 52], [32, 52]], c || '#8b93a7');
      g.fillStyle = '#00000033'; g.fillRect(24, 78, 52, 6);
    },
    grave(g, c) {
      g.fillStyle = c || '#8b93a7';
      g.beginPath();
      g.moveTo(26, 86); g.lineTo(26, 42); g.arc(50, 42, 24, WS.PI, 0);
      g.lineTo(74, 86); g.closePath(); g.fill();
      line(g, '#2b303a', STROKE - 2);
      g.beginPath(); g.moveTo(50, 34); g.lineTo(50, 70); g.stroke();
      g.beginPath(); g.moveTo(34, 48); g.lineTo(66, 48); g.stroke();
    },
    sovereign(g, c) {
      const col = c || '#ffe6ae';
      disc(g, 50, 50, 25, '#150e28');
      circle(g, 50, 50, 25, col, HAIR + 1);
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * WS.TAU;
        spike(g, 50 + WS.cos(a) * 32, 50 + WS.sin(a) * 32, 10, 4, a + WS.PI / 2, col);
      }
      disc(g, 50, 50, 7, col);
    },
    wheat(g, c) {
      const col = c || '#c9a94c';
      for (const dx of [-19, 0, 19]) {
        line(g, '#8f7a3c', HAIR - 1);
        g.beginPath(); g.moveTo(50 + dx, 88); g.quadraticCurveTo(50 + dx + 7, 58, 50 + dx, 30); g.stroke();
        leafBlade(g, 50 + dx, 30, 16, 8, 0, col);
      }
    },

    /* ---- pickups -------------------------------------------------------- */
    potion(g, c) {
      g.fillStyle = '#8a8f9c';
      g.beginPath(); g.roundRect(41, 12, 18, 12, 2); g.fill();
      g.fillStyle = c || '#e2483d';
      g.beginPath();
      g.moveTo(40, 24); g.lineTo(60, 24); g.lineTo(74, 58);
      g.quadraticCurveTo(74, 88, 50, 88);
      g.quadraticCurveTo(26, 88, 26, 58); g.closePath(); g.fill();
      g.fillStyle = lit + '66';
      g.beginPath(); g.ellipse(38, 58, 5, 13, -0.3, 0, WS.TAU); g.fill();
    },
    chest(g, c) {
      g.fillStyle = '#6b4a2c';
      g.beginPath(); g.roundRect(18, 46, 64, 36, 3); g.fill();
      g.fillStyle = '#8a6238';
      g.beginPath(); g.moveTo(18, 46); g.arc(50, 46, 32, WS.PI, 0); g.closePath(); g.fill();
      g.fillStyle = c || '#f5c56b';
      g.fillRect(18, 42, 64, 7); g.fillRect(44, 42, 12, 26);
      disc(g, 50, 60, 5, '#2b2f36');
    },
    bomb(g, c) {
      disc(g, 47, 62, 26, '#2b2f36');
      disc(g, 40, 54, 8, '#4a505c');
      line(g, '#8a6238', HAIR + 1);
      g.beginPath(); g.moveTo(62, 42); g.quadraticCurveTo(78, 28, 70, 14); g.stroke();
      disc(g, 70, 12, 7, c || '#ffd166');
      disc(g, 70, 12, 3, lit);
    },
    stone(g, c) {
      const col = c || '#59bfff';
      shape(g, [[50, 18], [74, 42], [66, 80], [34, 80], [26, 42]], col, lit + '77');
      circle(g, 50, 52, 32, col, 2.5);
    },
    cache(g, c) {
      g.fillStyle = '#7a5f3a';
      g.beginPath(); g.roundRect(20, 26, 60, 58, 3); g.fill();
      line(g, '#4a3a24', HAIR);
      g.strokeRect(20, 26, 60, 58);
      g.beginPath(); g.moveTo(20, 26); g.lineTo(80, 84); g.stroke();
      g.beginPath(); g.moveTo(80, 26); g.lineTo(20, 84); g.stroke();
      g.fillStyle = c || '#f5c56b'; g.fillRect(20, 20, 60, 8);
    },
    coffin(g, c) {
      shape(g, [[50, 12], [74, 36], [64, 88], [36, 88], [26, 36]], '#5a5f6b');
      line(g, c || '#d8dce6', STROKE - 2);
      g.beginPath(); g.moveTo(50, 30); g.lineTo(50, 66); g.stroke();
      g.beginPath(); g.moveTo(35, 44); g.lineTo(65, 44); g.stroke();
    },
    graveblade(g, c) {
      leafBlade(g, 50, 40, 32, 11, 0, '#cfd8e6', '#5f6878');
      shape(g, [[44, 70], [56, 70], [54, 88], [46, 88]], '#3a2020');
      shape(g, [[31, 64], [69, 64], [67, 72], [33, 72]], '#b0b7c4');
      line(g, c || '#e2483d', 3);
      g.beginPath(); g.moveTo(50, 22); g.lineTo(50, 58); g.stroke();
    },
    twinglaive(g, c) {
      const col = c || '#8cf24a';
      arcAt(g, 50, 50, 30, -1.0, 1.5, col, STROKE);
      arcAt(g, 50, 50, 17, 1.5, -1.0, col, STROKE - 2);
      g.fillStyle = '#2b2f36';
      g.beginPath(); g.roundRect(44, 40, 12, 24, 3); g.fill();
    },
    merchant(g, c) {
      g.fillStyle = '#7a5f3a';
      g.beginPath(); g.roundRect(20, 46, 60, 38, 2); g.fill();
      shape(g, [[12, 46], [50, 22], [88, 46]], c || '#f5c56b');
      g.fillStyle = '#e8dfc8';
      g.beginPath(); g.ellipse(50, 66, 13, 16, 0, 0, WS.TAU); g.fill();
      line(g, '#b6a680', 2.5); g.stroke();
    },

    /* ---- fallback -------------------------------------------------------- */
    rune(g, c) {
      line(g, c, STROKE);
      path(g, [[32, 20], [32, 80], [68, 50], [68, 20]]);
      g.stroke();
      disc(g, 68, 80, 5, c);
    },
  };

  /* --------------------------------------------------------------- plate -- */
  /** A chamfered machined tile. Eight sides, not a rounded rectangle: an outer
   *  rim, a bevel lit from the top, an accent hairline inlaid three units in,
   *  and a pool of light for the subject to sit in. */
  function chamfer(g, s, inset, cut) {
    const a = inset, b = s - inset, k = cut;
    g.beginPath();
    g.moveTo(a + k, a);
    g.lineTo(b - k, a);
    g.lineTo(b, a + k);
    g.lineTo(b, b - k);
    g.lineTo(b - k, b);
    g.lineTo(a + k, b);
    g.lineTo(a, b - k);
    g.lineTo(a, a + k);
    g.closePath();
  }

  function plate(g, s, accent) {
    const cut = s * 0.17;

    // Body: a vertical gradient, darker at the foot.
    const body = g.createLinearGradient(0, 0, 0, s);
    body.addColorStop(0, '#1b212e');
    body.addColorStop(0.55, '#10141c');
    body.addColorStop(1, '#080a0f');
    chamfer(g, s, 0.5, cut);
    g.fillStyle = body;
    g.fill();

    // A pool of light behind the subject, in the accent.
    g.save();
    chamfer(g, s, 0.5, cut);
    g.clip();
    const pool = g.createRadialGradient(s * 0.5, s * 0.42, 0, s * 0.5, s * 0.42, s * 0.62);
    pool.addColorStop(0, accent + '26');
    pool.addColorStop(1, accent + '00');
    g.fillStyle = pool;
    g.fillRect(0, 0, s, s);
    g.restore();

    // Bevel: a light inner edge along the top, dark along the foot.
    g.save();
    chamfer(g, s, 0.5, cut);
    g.clip();
    g.strokeStyle = 'rgba(255,255,255,.16)';
    g.lineWidth = 2;
    chamfer(g, s, 1.5, cut);
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.55)';
    g.lineWidth = 2;
    g.save();
    g.translate(0, 2);
    chamfer(g, s, 1.5, cut);
    g.stroke();
    g.restore();
    g.restore();

    // The rim, and the accent hairline inlaid inside it.
    chamfer(g, s, 0.5, cut);
    g.strokeStyle = 'rgba(255,255,255,.13)';
    g.lineWidth = 1;
    g.stroke();

    // Below 40px the inlay and the arc would collapse into each other, so the
    // plate keeps only its rim and bevel at pip sizes.
    if (s >= 40) {
      g.save();
      g.globalAlpha = 0.42;
      chamfer(g, s, s * 0.075, cut * 0.72);
      g.strokeStyle = accent;
      g.lineWidth = 1;
      g.stroke();
      g.restore();
    }

    /* No ring, no arc.
     *
     * This carried a short bright arc over the top-left chamfer, which read as
     * a stray mark: it traced a circle the octagonal plate does not have, and
     * a partial arc is already the HUD's word for a quantity - the health and
     * experience gauges and the weapon cooldowns are each a faint full ring
     * with a bright arc riding it, where the arc means how much. A fragment on
     * a static icon was decoration impersonating information.
     *
     * Closing it into a full ring fixed the stray-mark half and broke
     * something else: on any glyph that is itself circular it stacked into
     * concentric rings and the icon stopped reading at a glance.
     *
     * So the plate carries no circle at all. It has a chamfered rim, a bevel,
     * an accent inlay and a pool of light, which is enough to seat a subject -
     * and the ring stays where it earns its keep, on the gauges that are
     * actually measuring something. A motif spent everywhere is not a motif.
     */
  }

  /* ----------------------------------------------------------------- API -- */
  const SS = 2;    // rasterise at 2x and draw down

  function render(size, accent, art, withPlate) {
    const res = size * SS;
    const c = document.createElement('canvas');
    c.width = res; c.height = res;
    const g = c.getContext('2d');
    g.scale(SS, SS);
    if (withPlate) plate(g, size, accent);
    g.save();
    // Every glyph draws in the same 100-unit field, inset so the optical circle
    // clears the plate's inlay.
    const inset = withPlate ? size * 0.15 : size * 0.06;
    g.translate(inset, inset);
    g.scale((size - inset * 2) / 100, (size - inset * 2) / 100);
    g.save();
    g.shadowColor = accent;
    g.shadowBlur = withPlate ? 9 : 12;
    (G[art] || G.rune)(g, accent);
    g.restore();
    g.restore();
    c.displaySize = size;
    return c;
  }

  WS.Icons = {
    /** Cached icon on its plate. `art` is a glyph name, `color` an [r,g,b]. */
    get(art, color, size) {
      size = WS.round(size || 64);
      const accent = WS.hex(color || WS.CONST.COLORS.arc);
      const key = `i:${art}:${accent}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      c = render(size, accent, art, true);
      cache.set(key, c);
      return c;
    },

    /** The bare glyph with no plate, for world-space objects: a coin lying in
     *  the grass should not look like a UI tile. */
    glyph(art, color, size) {
      size = WS.round(size || 32);
      const accent = WS.hex(color || WS.CONST.COLORS.arc);
      const key = `w:${art}:${accent}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      c = render(size, accent, art, false);
      cache.set(key, c);
      return c;
    },

    /** Data URL for CSS/img elements (the DOM-side UI). */
    url(art, color, size) { return this.get(art, color, size).toDataURL(); },

    has(art) { return !!G[art]; },
    names() { return Object.keys(G); },
  };

})(window.WS);

  /* ------------------------------------------------------------- update -- */
  Enemy.update = function (dt) {
    const player = WS.Game.player;
    const cfg = WS.Config;

    if (this.freezeTimer > 0) this.freezeTimer -= dt;
    const timeFrozen = this.freezeTimer > 0;

    const chillRank = player.chillRank;
    const chillRange = (cfg.chillRangeBase + cfg.chillRangePerRank * chillRank) * player.areaMultiplier;
    const chillFactor = 1 - cfg.chillSlowPerRank * chillRank;

    let i = 0;
    while (i < this.pool.count) {
      const e = this.pool.active[i];
      const t = e.template;
      const [dx, dy, distance] = WS.normalize(player.x - e.x, player.y - e.y);

      // Time freeze halts everything except Death itself.
      const frozen = timeFrozen && t.family !== 'death';

      let speed = e.speed;
      if (frozen) speed = 0;
      const inChill = chillRank > 0 && !e.boss && distance < chillRange;
      if (inChill) speed *= chillFactor;
      e.chilled = inChill;
      if (e.slowTimer > 0) {
        e.slowTimer -= dt;
        speed *= e.slowFactor;
      }
      /* A creature's lunge: the boss charge at rank-and-file size. It only
       * commits from inside its own range and never from on top of you, so it
       * is always a gap you can be pushed out of rather than a hit you were
       * already taking. */
      if (t.lunge && !frozen && e.windup <= 0 && e.chargeTimer <= 0) {
        e.lungeTimer -= dt;
        /* Only the overlap is excluded, not "anything close". Gating this on
         * a comfortable gap meant a fast creature that reached the survivor
         * before its cooldown came up could never lunge again, because it was
         * permanently too close - the behaviour quietly switched itself off
         * on exactly the creatures built to use it. Lunging from point blank
         * carries it THROUGH and out the far side, which is the better move
         * anyway: it has to turn around and come back. */
        if (e.lungeTimer <= 0 && distance < t.lunge.range * 1.05
            && distance > e.radius + player.radius) {
          e.lungeTimer = t.lunge.cooldown;
          this.beginCharge(e, dx, dy, t.lunge.windup || cfg.lungeWindup,
            t.lunge.time || cfg.lungeTime, t.lunge.range, 2.0);
        }
      }

      /* Ground left behind. Venom, rot, whatever the thing leaks - it is
       * harmless for a beat and then it is not, and it is why a lane you ran
       * down once is not a lane you can run down again. */
      if (t.trail && !frozen && !e.stationary) {
        e.trailTimer -= dt;
        if (e.trailTimer <= 0) {
          e.trailTimer = t.trail.interval;
          WS.Hazard.spawn(e.x, e.y, {
            radius: t.trail.radius, fuse: cfg.trailFuse, life: t.trail.life,
            damage: e.damage * (t.trail.damagePct || 0.35),
            interval: cfg.hazardTick, tint: t.trail.tint || t.tint, name: t.name,
          });
        }
      }

      /* THE LANE IS A PROMISE. While the boss is planted the lane swings to
       * follow the survivor, so the tell is live and you can watch it come
       * round onto you; the instant it commits, the lane locks and the boss
       * travels exactly down it. It used to do neither: the lane was aimed
       * once at windup and the charge was aimed again three quarters of a
       * second later, at wherever you had walked to since - and then didn't
       * use that direction either, because it homed. */
      if (e.windup > 0 && !frozen) {
        e.windup -= dt;
        speed = 0;
        if (e.telegraph && e.telegraph.live) {
          e.telegraph.dx = dx; e.telegraph.dy = dy;
          e.telegraph.life = e.windup;
        }
        if (e.windup <= 0) {
          e.chargeTimer = e.chargeDur;
          e.chargeDir = [dx, dy];
          if (e.telegraph) {
            e.telegraph.live = false;      // aimed; from here it is a fact
            e.telegraph.firing = true;
            /* Outlive the charge by a beat. Matching the two exactly meant
               the lane expired a tick or two before the boss stopped, so the
               last of the charge happened on unmarked ground. */
            e.telegraph.life = e.chargeDur + cfg.chargeLaneTail;
            e.telegraph.maxLife = e.chargeDur + cfg.chargeLaneTail;
          }
          if (e.boss) WS.FX.shake(5, 0.25);
          WS.Audio.play('warn', e.x);
        }
      } else if (e.chargeTimer > 0 && !frozen) {
        e.chargeTimer -= dt;
      }

      let advance = !e.stationary;
      if (t.ranged && distance <= t.ranged.range) advance = false;
      if (e.chargeTimer > 0 && e.chargeDir && !frozen) {
        /* Down the lane, at the speed that covers the lane. Not toward the
         * survivor - a charge you cannot sidestep is not a charge, it is a
         * fast walk with a light show in front of it. */
        const v = e.chargeLen / e.chargeDur;
        e.x = WS.clamp(e.x + e.chargeDir[0] * v * dt, e.radius, WS.CONST.WORLD_WIDTH - e.radius);
        e.y = WS.clamp(e.y + e.chargeDir[1] * v * dt, e.radius, WS.CONST.WORLD_HEIGHT - e.radius);
        e.facing = e.chargeDir[0] < 0 ? -1 : 1;
        advance = false;
      } else {
        if (advance && distance > 1) {
          if (t.orbit && distance < t.orbit.range * 1.3) {
            /* Holds a ring and walks it. The point is not the damage - it is
             * that circling away from the horde stops working, because this
             * one circles with you and closes the lane you were going to use.
             * `pull` is the only radial component: it keeps the ring honest
             * without ever letting the thing sit still. */
            const pull = WS.clamp((distance - t.orbit.range) / 70, -1, 1);
            const tx = -dy * e.orbitDir, ty = dx * e.orbitDir;
            e.x += (dx * pull + tx * (t.orbit.spin || 0.9)) * speed * dt;
            e.y += (dy * pull + ty * (t.orbit.spin || 0.9)) * speed * dt;
          } else {
            e.x += dx * speed * dt;
            e.y += dy * speed * dt;
          }
        }
        e.facing = dx < 0 ? -1 : 1;
      }
      e.bob += dt * (advance ? 9 : 3);

      // Contact. The swing always triggers Thorns, even if the survivor dodges,
      // blocks, or is mid-invulnerability; takeDamage decides what lands.
      let struck = false;
      e.contactCooldown -= dt;
      if (!frozen && e.contactCooldown <= 0 && distance < e.radius + player.radius) {
        e.contactCooldown = e.boss ? cfg.contactCooldownBoss : cfg.contactCooldownNormal;
        struck = true;
        WS.Player.takeDamage(player, e.damage, t.name);
        if (!WS.Game.running) return;
      }

      if (e.rangedTimer !== null && !frozen) {
        e.rangedTimer -= dt;
        if (e.rangedTimer <= 0 && distance <= t.ranged.range * 1.15) {
          e.rangedTimer = t.ranged.cooldown;
          const r = t.ranged;
          WS.Projectile.spawnHostile(e.x, e.y, dx * r.speed, dy * r.speed,
            e.damage * 0.75, r.school, t.name, e, r.slowFactor, r.slowDuration);
        }
      }

      if (e.boss && !t.arena && !frozen) {
        e.attackTimer -= dt;
        if (e.attackTimer <= 0) {
          this.bossAttack(e, dx, dy);
          e.attackTimer = t.interval || 3.6;
        }
      }

      if (e.flash > 0) e.flash -= dt;
      if (e.invuln > 0) e.invuln -= dt;
      /* A lane still being aimed is owned by the windup above, which sets its
         life every frame; letting the clock here have a second go at it
         expired the lane one tick BEFORE the charge committed, so the charge
         found no telegraph to lock and the promise was never made at all. */
      if (e.telegraph && !e.telegraph.live) {
        e.telegraph.life -= dt;
        if (e.telegraph.life <= 0) e.telegraph = null;
      }

      // Thorns last, so reflecting a fatal hit cannot corrupt this update.
      if (struck && player.thornsRank > 0) {
        this.hit(e, (cfg.thornsFlat + e.damage * cfg.thornsDamagePct) * player.thornsRank, 'thorns');
      }

      if (!e._dead) i++;
    }
    this.buildGrid();
  };

  /** Plant, mark the ground, then run down it. One entry point for the boss
   *  charge and for a creature's lunge, because they are the same move at two
   *  sizes and the promise is the same: `live` says the lane is still being
   *  aimed, and the update loop turns that off the instant it commits. */
  Enemy.beginCharge = function (e, dx, dy, windup, time, range, girth) {
    e.windup = windup;
    e.windupMax = windup;
    e.chargeDur = time;
    e.chargeLen = range;
    e.telegraph = {
      kind: 'lane', live: true, firing: false,
      life: windup, maxLife: windup,
      dx, dy, length: range, width: e.radius * (girth || 2.0),
    };
    WS.FX.flash(e.x, e.y, e.radius * 1.6, WS.CONST.COLORS.enemy, 0.5);
  };

  /* ------------------------------------------------------ boss patterns -- */
  Enemy.bossAttack = function (e, dx, dy) {
    const t = e.template;
    const pattern = t.patterns[e.patternIndex];
    e.patternIndex = (e.patternIndex + 1) % t.patterns.length;
    const school = t.school || 'shadow';

    if (pattern.type === 'summon') {
      const scale = 1 + WS.Game.run.time / 600;
      for (let n = 0; n < (pattern.count || 6); n++) {
        const a = WS.random() * WS.TAU;
        const range = 60 + WS.random() * 70;
        this.spawn(pattern.id, e.x + WS.cos(a) * range, e.y + WS.sin(a) * range, scale);
      }
      WS.FX.flash(e.x, e.y, e.radius * 2.4, WS.CONST.COLORS.shadow, 0.4);
      e.telegraph = { kind: 'ring', life: 0.4, maxLife: 0.4, radius: e.radius * 3 };
    } else if (pattern.type === 'volley') {
      const bolts = pattern.bolts || 7;
      for (let s = 1; s <= bolts; s++) {
        const spread = (s - (bolts + 1) / 2) * 0.16;
        const c = WS.cos(spread), sn = WS.sin(spread);
        WS.Projectile.spawnHostile(e.x, e.y,
          (dx * c - dy * sn) * 260, (dx * sn + dy * c) * 260,
          e.damage * 0.7, school, t.name, e);
      }
    } else if (pattern.type === 'ring') {
      const bolts = pattern.bolts || 10;
      for (let s = 0; s < bolts; s++) {
        const a = (s / bolts) * WS.TAU;
        WS.Projectile.spawnHostile(e.x, e.y,
          WS.cos(a) * 220, WS.sin(a) * 220, e.damage * 0.6, school, t.name, e);
      }
    } else if (pattern.type === 'charge') {
      /* Plant, mark the ground, then run down it. `live` says the lane is
       * still being aimed; the update loop turns that off the moment the
       * charge commits, and the same lane stays on screen while it happens so
       * the player can see the promise kept. */
      const cfg = WS.Config;
      this.beginCharge(e, dx, dy, cfg.chargeWindup, cfg.chargeTime, cfg.chargeRange, 2.2);
      WS.FX.flash(e.x, e.y, e.radius * 1.6, WS.CONST.COLORS.enemy, 0.5);
    }
  };

  /* ------------------------------------------------------ damage intake -- */
  /** Central strike entry: rolls the survivor's crit and prints the number. */
  Enemy.hit = function (e, amount, source) {
    const player = WS.Game.player;
    const crit = WS.random() < player.critChance;
    if (crit) amount *= player.critDamage;
    this.damage(e, amount, crit, source);
    WS.FX.damage(e.x, e.y - e.radius * 0.6, amount, crit);
    WS.Audio.play(crit ? 'crit' : 'hit', e.x);
    return amount;
  };

  Enemy.damage = function (e, amount, isCrit, source) {
    if (!e || e._dead) return;
    if (e.invuln > 0) return;
    const player = WS.Game.player;
    // Overkill is normally discarded; the Ruinseeker's ruin meter drinks it.
    if (player && player.felAttuned > 0 && amount > e.health) {
      WS.Player.gainFel(player, amount - WS.max(0, e.health));
    }
    e.health -= amount;
    e.flash = 0.09;
    e.flashCrit = isCrit;
    const run = WS.Game.run;
    run.damageDone += amount;
    const key = source || 'untagged';
    run.damageByWeapon[key] = (run.damageByWeapon[key] || 0) + amount;
    if (e.health <= 0) this.kill(e);
  };

  Enemy.damageArea = function (x, y, radius, amount, hitBy, knockback, source) {
    let i = 0;
    while (i < this.pool.count) {
      const e = this.pool.active[i];
      const reach = radius + e.radius;
      if ((!hitBy || hitBy.get(e) !== e.spawnId) && WS.dist2(x, y, e.x, e.y) <= reach * reach) {
        if (hitBy) hitBy.set(e, e.spawnId);
        if (knockback && !e.boss) {
          const [kx, ky] = WS.normalize(e.x - x, e.y - y);
          e.x += kx * knockback;
          e.y += ky * knockback;
        }
        this.hit(e, amount, source);
        if (!e._dead) i++;
      } else i++;
    }
  };

  /** Damage everything within halfWidth of the segment (beams). */
  Enemy.damageLine = function (x1, y1, x2, y2, halfWidth, amount, source) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq <= 0) return;
    let i = 0;
    while (i < this.pool.count) {
      const e = this.pool.active[i];
      let t = ((e.x - x1) * dx + (e.y - y1) * dy) / lenSq;
      t = WS.clamp(t, 0, 1);
      const px = x1 + dx * t, py = y1 + dy * t;
      const reach = halfWidth + e.radius;
      if (WS.dist2(e.x, e.y, px, py) <= reach * reach) {
        this.hit(e, amount, source);
        if (!e._dead) i++;
      } else i++;
    }
  };

  Enemy.applySlow = function (e, factor, duration) {
    if (!e || e._dead) return;
    if (e.slowTimer <= 0 || factor < e.slowFactor) e.slowFactor = factor;
    e.slowTimer = WS.max(e.slowTimer, duration);
  };

  /* ---------------------------------------------------------------- kill - */
  Enemy.kill = function (e) {
    const run = WS.Game.run;
    const t = e.template;
    const player = WS.Game.player;

    /* What it leaves behind. A stitched thing comes apart into what it was
     * stitched from, and a body full of pressure goes off - which is the one
     * behaviour that makes WHERE you kill something matter, not just how
     * fast. Both happen before the corpse, so the burst lights the death
     * rather than following it. */
    if (t.burst) {
      WS.Hazard.spawn(e.x, e.y, {
        radius: t.burst.radius, fuse: t.burst.fuse || WS.Config.burstFuse,
        life: WS.Config.burstLife, damage: e.damage * (t.burst.damagePct || 1.2),
        interval: 99, tint: t.burst.tint || t.tint, name: t.name,
      });
    }
    if (t.split && !e.noSplit) {
      const kids = t.split.count || 2;
      for (let n = 0; n < kids; n++) {
        const a = (n / kids) * WS.TAU + WS.random();
        const child = this.spawn(t.split.into,
          WS.clamp(e.x + WS.cos(a) * e.radius, 20, WS.CONST.WORLD_WIDTH - 20),
          WS.clamp(e.y + WS.sin(a) * e.radius, 20, WS.CONST.WORLD_HEIGHT - 20),
          e.scale * (t.split.scale || 0.7));
        // One generation. Anything that could split again is a spawn loop
        // waiting for a slow machine to find it.
        if (child) child.noSplit = true;
      }
    }

    WS.FX.corpse(e);
    WS.FX.burst(e.x, e.y, e.boss ? 26 : e.elite ? 14 : 7,
      WS.hex(t.tint), e.boss ? 260 : 150, 0.5, e.boss ? 5 : 3);
    if (e.boss) WS.FX.stop(0.16);
    else if (e.elite) WS.FX.stop(0.05);
    WS.XP.spawnGem(e.x, e.y, e.xp);
    WS.Pickup.onKill(e);
    WS.Save.recordKill(t, e.id);
    run.kills++;
    WS.Audio.play('enemyHit', e.x);

    if (player.bloodthirst && run.kills % player.bloodthirstInterval === 0) {
      WS.Player.heal(player,
        WS.floor(player.maxHealth * player.bloodthirstHealPct) + player.bloodthirstHealFlat,
        'bloodthirst');
    }

    if (e.boss) {
      run.bossesSlain++;
      if (e.id === 'aethelgard') {
        this.pool.release(e);
        WS.Arena.onBossDead();
        return;
      }
      if (e.id === 'death_itself') run.deathsSlain++;
      WS.Save.stats.bosses[e.id] = (WS.Save.stats.bosses[e.id] || 0) + 1;
      const gold = WS.floor((t.gold || 40) * run.goldMult * player.goldMultiplier);
      WS.Game.addGold(gold, e.x, e.y);
      for (let n = 0; n < 8; n++) {
        WS.XP.spawnGem(e.x + WS.randRange(-34, 34), e.y + WS.randRange(-34, 34), WS.floor(e.xp / 8));
      }
      /* The biggest cheer the game has. Three rings out of the corpse rather
         than one, so the payoff keeps arriving for most of a second, and a
         gold banner rather than a caption - killing a boss is the moment the
         run has been building toward and it should read like one. */
      WS.Audio.play('explode', e.x);
      WS.FX.shake(9, 0.5);
      WS.FX.stop(0.12);
      WS.FX.flash(e.x, e.y, e.radius * 4, WS.CONST.COLORS.boss, 0.6);
      WS.FX.flash(e.x, e.y, e.radius * 7, '#f5c56b', 0.85);
      WS.FX.burst(e.x, e.y, 26, '#ffe6ae', 260, 0.9, 4);
      WS.Game.announce(t.name + ' falls.', 'The battlefield is quieter.', 2.8,
        { kind: 'glory' });
      WS.Achievements.check();
      const wasFinal = e.finalBoss;
      this.pool.release(e);
      if (wasFinal) WS.Game.victory();
      return;
    }

    this.pool.release(e);
  };

  WS.Enemy = Enemy;

})(window.WS);

/* ===== src/game/weapon.js ===== */
/* Weapon behaviors: turn a weapon's data plus the survivor's stats into
 * projectiles, zones, orbits and beams. A new weapon usually needs only data
 * in src/data/weapons.js; a genuinely new pattern gets a handler here. */
'use strict';
(function (WS) {

  const Weapon = {};

  // One scratch spec per shot; fields are copied out by launchBolt.
  const spec = {};
  const RETRY_COOLDOWN = 0.25;   // nothing in range - look again shortly

  /* --------------------------------------------------------- derivation -- */
  function damageOf(player, w) {
    const cfg = WS.Config, d = w.data;
    const step = d.rankDamageStep || cfg.rankDamageStep;
    let base = d.damage * (1 + step * (w.level - 1))
      * player.damageMultiplier * (w.mods.damageMult || 1);
    if (w.evolved) base *= (d.evolveDamageMult || cfg.evolveDamageMult);
    if (player.metaTimer > 0) base *= cfg.metaDamageMult;
    if (!d.noNerf) base *= WS.CONST.PLAYER_DAMAGE_SCALE;
    return base;
  }

  function countOf(player, w) {
    const cfg = WS.Config, d = w.data;
    let count = d.projectiles || 1;
    if (w.level >= (d.projRankA || cfg.projRankA)) count++;
    if (w.level >= (d.projRankB || cfg.projRankB)) count++;
    count += player.projectileBonus + (w.mods.extraProjectiles || 0);
    if (w.evolved) count += (d.evolveProjectiles || cfg.evolveProjectiles);
    return count;
  }

  function areaOf(player, w, base) {
    const cfg = WS.Config, d = w.data;
    const step = d.rankAreaStep || cfg.rankAreaStep;
    const evo = w.evolved ? (d.evolveAreaMult || cfg.evolveAreaMult) : 1;
    return base * player.areaMultiplier * (1 + step * (w.level - 1)) * evo * (w.mods.areaMult || 1);
  }

  function speedOf(player, w) {
    let s = (w.data.speed || 400) * player.projectileSpeed;
    if (!w.data.noNerf) s *= WS.CONST.PLAYER_SPEED_SCALE;
    return s;
  }

  function durationOf(player, w, base) {
    return base * (1 + WS.Config.rankDurationStep * (w.level - 1));
  }

  Weapon.cooldown = function (player, w) {
    const d = w.data, cfg = WS.Config;
    let base = d.cooldown * player.cooldownMultiplier
      * (w.evolved ? (d.evolveCooldownMult || cfg.evolveCooldownMult) : 1);
    if (!d.noNerf) base *= WS.CONST.PLAYER_COOLDOWN_SCALE;
    if (player.metaTimer > 0) base *= cfg.metaCooldownMult;
    // A runaway multiplier must never silently switch a weapon off.
    if (!(base > 0) || base > 20) base = 20;
    if (base < 0.05) base = 0.05;
    return base;
  };

  /** What a weapon actually puts out at a given rank, through the same
   *  derivation the game fires with.
