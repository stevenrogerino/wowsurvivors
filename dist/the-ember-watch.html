/* ===== src/ui/arclight.css ===== */
/* ===========================================================================
   ARCLIGHT UI - the design language for The Ember Watch.
   Obsidian substrate, arc light for everything that measures or matters.
   See docs/ARCLIGHT-UI.md for the rules this file implements.
   ======================================================================== */

:root {
  /* -- substrate ---------------------------------------------------------
     The ladder runs cold at the bottom and warm at the top, and that is the
     whole duality in two columns: the void the world falls into is blue and
     unbothered, the surfaces you actually hold are lit by something with a
     fire in it. Panels sit on the warm rungs, the battlefield on the cold. */
  --void:        #06070b;
  --obsidian:    #0b0d12;
  --obsidian-2:  #13141c;
  --obsidian-3:  #1d1c26;
  --obsidian-4:  #2b2733;

  /* Rims are warm white, not white. Every bevel in the set carries one, so
     this is the single change that decides whether the UI feels lamplit. */
  --rim:         rgba(255, 240, 214, .075);
  --rim-lit:     rgba(255, 240, 214, .16);
  --rim-arc:     rgba(245, 197, 107, .34);
  /* An ambient warmth to lay under raised surfaces - the light in the room. */
  --hearth:      radial-gradient(120% 90% at 50% -10%, rgba(245,197,107,.055), transparent 62%);

  /* -- light ----------------------------------------------------------- */
  --arc:         #f5c56b;
  --arc-hot:     #ffe6ae;
  --arc-deep:    #b98c3c;
  --arcane:      #8f7bff;
  --frost:       #59bfff;
  --fel:         #8cf24a;
  --blood:       #e2483d;
  --blood-deep:  #8f2018;
  --holy:        #ffdf7a;
  --umbra:       #b34ff2;
  --verdant:     #3ddc7a;

  /* -- ink -------------------------------------------------------------- */
  --ink:         #e9edf6;
  --ink-dim:     #8b93a7;
  /* 4.7:1 on --obsidian. It was #565d6e, which is 2.9:1 - card flavour text
     set in it looked like it was fading out mid-sentence rather than simply
     being quiet, which reads as truncation. Quiet, not illegible. */
  --ink-faint:   #757d8e;

  /* -- quality ---------------------------------------------------------- */
  --q-common:    #e9edf6;
  --q-uncommon:  #3ddc7a;
  --q-rare:      #59bfff;
  --q-epic:      #b34ff2;
  --q-legendary: #f5c56b;

  /* -- type ------------------------------------------------------------- */
  --ui:    'Archivo', 'Segoe UI', Inter, Roboto, system-ui, sans-serif;
  --fig:   'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;

  /* A single scale, used everywhere. */
  --t-micro: 10px;
  --t-small: 11.5px;
  --t-body:  13.5px;
  --t-lead:  15px;
  --t-title: 18px;
  --t-head:  28px;
  --t-hero:  40px;

  --ease:      cubic-bezier(.2, .8, .2, 1);
  --ease-out:  cubic-bezier(.16, 1, .3, 1);

  --lift-1: 0 8px 22px rgba(0,0,0,.5);
  --lift-2: 0 20px 52px rgba(0,0,0,.62);
  /* The bevel: lit along the top edge, shadowed along the foot. Every raised
     surface carries it, which is what stops the set reading as flat boxes. */
  --bevel: inset 0 1px 0 rgba(255,244,224,.085), inset 0 -1px 0 rgba(0,0,0,.55);
  --bevel-deep: inset 0 1px 0 rgba(255,244,224,.115), inset 0 -2px 3px rgba(0,0,0,.5);
  /* A sunken surface: the inverse, for wells and tracks. */
  --sunk: inset 0 1px 2px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,244,224,.05);
}

* { box-sizing: border-box; }

/* The focus ring. One rule for every control in the game, in the arc light,
   because a pad or a keyboard has to be able to see where it is.

   Two triggers, deliberately. :focus-visible covers tabbing, which the
   browser judges correctly. body.nav-active covers arrow keys and the pad,
   which drive focus programmatically - a case :focus-visible does not
   reliably match, and relying on it alone left a player arrowing round the
   menu with the default 1px outline or none. A pointer moving clears the
   class, so a mouse never leaves a ring behind it. */
:focus { outline: none; }
:focus-visible,
body.nav-active :focus {
  outline: 2px solid var(--arc);
  outline-offset: 2px;
  border-radius: 2px;
  box-shadow: 0 0 20px -6px var(--arc);
}
.card:focus-visible, .pick:focus-visible, .beast:focus-visible,
body.nav-active .card:focus, body.nav-active .pick:focus,
body.nav-active .beast:focus { outline-offset: 3px; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--void);
  color: var(--ink);
  font-family: var(--ui);
  font-size: var(--t-body);
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  touch-action: none;
}

#stage { position: fixed; inset: 0; }
#game-canvas { position: absolute; inset: 0; display: block; }

.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* --------------------------------------------------------------- letters */
.label {
  font-size: var(--t-micro); letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-dim); font-weight: 600;
}
.figure { font-family: var(--fig); font-variant-numeric: tabular-nums; }

/* Corner brackets - the Arclight frame.
 * RULE: an element uses .bracketed OR its own ::before/::after decoration,
 * never both. There are only two pseudo-elements, and when a component also
 * wants them the two rule sets silently fight - which is how the card's
 * quality arc ended up collapsed into a 14px stub. Components with their own
 * corner language (.card, .panel) carry it themselves. */
.bracketed { position: relative; }
.bracketed::before, .bracketed::after {
  content: ""; position: absolute; width: 14px; height: 14px;
  border-color: var(--arc); border-style: solid; opacity: .7; pointer-events: none;
}
.bracketed::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
.bracketed::after  { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

.panel {
  position: relative;
  background: linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim);
  border-radius: 2px;
  box-shadow: var(--bevel), var(--lift-1);
}
/* The inlay: a second hairline set in from the rim, the detail that separates
   a machined panel from a div with a border. A child, not a pseudo-element,
   so .bracketed can still claim ::before/::after on the same panel. */
.panel > .inlay {
  position: absolute; inset: 5px; pointer-events: none;
  border: 1px solid rgba(255,255,255,.035);
  border-radius: 1px;
}
.panel-title {
  font-size: var(--t-micro); letter-spacing: .18em; text-transform: uppercase;
  color: var(--arc); font-weight: 700;
}

/* --------------------------------------------------------------- buttons */
:where(button, [tabindex]):focus-visible {
  outline: 1px solid var(--arc-hot);
  outline-offset: 2px;
}

.btn {
  appearance: none; cursor: pointer; font-family: inherit;
  background: linear-gradient(180deg, var(--obsidian-3), var(--obsidian-2));
  border: 1px solid var(--rim); border-radius: 2px;
  box-shadow: var(--bevel);
  color: var(--ink);
  padding: 11px 22px;
  font-size: var(--t-small); font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  position: relative; overflow: hidden;
  transition: border-color .18s var(--ease), color .18s var(--ease),
              transform .12s var(--ease), background .18s var(--ease);
}
/* A hairline of arc light sweeps the top edge on hover. */
.btn::after {
  content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--arc), transparent);
  opacity: 0; transition: opacity .2s var(--ease);
}
.btn:hover { border-color: var(--rim-arc); color: var(--arc-hot); }
.btn:hover::after { opacity: .9; }
.btn:active { transform: translateY(1px); box-shadow: var(--sunk); }
.btn:disabled { opacity: .3; cursor: not-allowed; border-color: var(--rim); color: var(--ink-faint); }
.btn:disabled:hover::after { opacity: 0; }
.btn.primary {
  background: linear-gradient(180deg, rgba(245,197,107,.18), rgba(245,197,107,.05));
  border-color: rgba(245,197,107,.5); color: var(--arc-hot);
}
.btn.primary:hover { border-color: var(--arc); background: linear-gradient(180deg, rgba(245,197,107,.3), rgba(245,197,107,.09)); }
.btn.small { padding: 7px 13px; font-size: var(--t-micro); letter-spacing: .1em; }
.btn.danger:hover { border-color: rgba(226,72,61,.7); color: #ff8f84; }

/* -------------------------------------------------------------- overlays */
#overlay {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: 26px;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(10,12,18,.62), rgba(6,7,11,.94));
  backdrop-filter: blur(4px) saturate(.85);
}
/* The menu sits over a live scene rather than a paused battlefield, so its
   scrim is lighter and its blur deeper: enough depth behind the panels to
   read as a place, not enough to compete with them for attention. */
#overlay.scene {
  background:
    radial-gradient(ellipse 82% 76% at 50% 42%, rgba(8,10,15,.40), rgba(6,7,11,.76));
  backdrop-filter: blur(6px) saturate(.95);
}
/* Panels need their own ground once the backdrop is a place rather than a
   void: without this the roster tiles float on grass. */
#overlay.scene .panel,
#overlay.scene .row-item,
#overlay.scene .pick { background-color: rgba(8,10,15,.82); }
#overlay.hidden { display: none; }

.overlay-inner {
  position: relative;
  width: min(1180px, 100%); max-height: 100%;
  display: flex; flex-direction: column; gap: 20px;
  animation: sweep-in .3s var(--ease-out);
}
@keyframes sweep-in {
  from { opacity: 0; transform: translateY(12px) scale(.994); }
  to   { opacity: 1; transform: none; }
}

.overlay-head { display: flex; align-items: baseline; gap: 18px; flex: none; }
.overlay-head h1 {
  margin: 0; font-size: var(--t-head); font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; color: var(--arc-hot);
}
.overlay-head .sub { color: var(--ink-dim); font-size: var(--t-body); }
/* Scroll areas signal "more below" with a scrim over the trailing edge, never
   by masking the content itself - a fade across visible content is precisely
   what reads as truncation. The scrim is sticky, so it rides the fold, and it
   clears the moment the reader reaches the end. */
.overlay-body {
  overflow-y: auto; overflow-x: hidden; padding-right: 6px; min-height: 0;
}
.scroll-scrim {
  position: sticky; bottom: 0; left: 0; right: 0; height: 44px; margin-top: -44px;
  pointer-events: none; flex: none;
  background: linear-gradient(180deg, rgba(6,7,11,0), rgba(6,7,11,.92));
  opacity: 0; transition: opacity .2s var(--ease);
}
.overlay-body.has-more .scroll-scrim { opacity: 1; }
/* The sentinel the scrim keys off. Zero height, pulled back over the scrim so
   it marks the true end of the content rather than adding to it. */
.overlay-body .scroll-end {
  display: block; height: 1px; margin-top: -1px; pointer-events: none;
}
/* Same inset language as the panels: a slim thumb floating in a wide track,
   never a trough hard against the edge of the content. */
.overlay-body::-webkit-scrollbar { width: 14px; }
.overlay-body::-webkit-scrollbar-track { background: transparent; }
.overlay-body::-webkit-scrollbar-thumb {
  background: var(--obsidian-3); border: 5px solid transparent;
  background-clip: padding-box; border-radius: 7px;
}
.overlay-body::-webkit-scrollbar-thumb:hover {
  background: var(--obsidian-4); background-clip: padding-box;
}
.overlay-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: none; }
.overlay-foot .spacer { flex: 1; }

/* ----------------------------------------------------------------- title */
/* -- the logotype ------------------------------------------------------
   This was one thin, widely tracked word, which is the typographic default
   of every dark dashboard ever built. A game's name should have weight and a
   material. So: a small cool article, EMBER struck in gilt with a real metal
   ramp - highlight along the top third, shadow through the middle, warm
   bounce underneath - and WATCH in cold grey beside it. One warm word held
   inside something grey and steady, which is the whole title said in type. */
#title-wrap { text-align: center; }
#title-wrap .game-title, #prologue .game-title {
  margin: 0; display: flex; align-items: baseline; justify-content: flex-start;
  gap: .16em; text-transform: uppercase;
  font-size: clamp(28px, 4.6vw, 50px); line-height: 1;
}
/* The article: small, cold and set back, so it reads as grammar rather than
   as a third word competing with the two that matter. Optical, not metric -
   it sits on the same baseline but a third of the size. */
#title-wrap .game-title .art, #prologue .game-title .art {
  font-size: .4em; font-weight: 400; letter-spacing: .3em;
  color: var(--ink-faint); align-self: baseline; margin-right: .05em;
}
#title-wrap .game-title .wm, #prologue .game-title .wm {
  font-weight: 300; letter-spacing: .17em; color: #cdd4e4;
  text-shadow: 0 1px 0 rgba(0,0,0,.7);
}
#title-wrap .game-title .nm, #prologue .game-title .nm {
  font-weight: 700; letter-spacing: .05em;
  background-image: linear-gradient(180deg,
    #fff3d4 0%, #ffe0a2 26%, #f5c56b 46%, #a97c2c 62%, #e6b45e 84%, #ffe6ae 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 34px rgba(245,197,107,.3));
}
#title-wrap .game-sub {
  font-size: var(--t-micro); letter-spacing: .34em; text-transform: uppercase;
  color: var(--ink-faint); margin-top: 12px; text-align: left;
}
#title-wrap .title-arc { margin-left: 0; margin-right: auto; }
/* The title's arc: a swept rule that draws itself on entry. */
#title-wrap .title-arc {
  margin: 16px auto 0; width: min(520px, 70%); height: 1px;
  background: linear-gradient(90deg, transparent, var(--arc), transparent);
  transform-origin: center;
  animation: arc-draw .7s var(--ease-out) both;
}
@keyframes arc-draw { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: .85; } }

/* ----------------------------------------------------------------- cards */
.card-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.card {
  width: 270px; min-height: 316px;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(255,248,236,.05), transparent 60%),
    var(--hearth),
    linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim); border-radius: 2px;
  box-shadow: var(--bevel-deep), var(--lift-1);
  padding: 22px 20px 18px;
  cursor: pointer; text-align: left; font-family: inherit; color: inherit;
  display: flex; flex-direction: column; gap: 11px;
  transition: transform .18s var(--ease-out), border-color .18s var(--ease),
              box-shadow .18s var(--ease);
  position: relative; overflow: hidden;
  animation: card-in .34s var(--ease-out) both;
}
.card:nth-child(2) { animation-delay: .05s; }
.card:nth-child(3) { animation-delay: .1s; }
/* Cards arrive eager: they overshoot the mark by three pixels and settle.
   A straight lerp to rest is correct and lifeless; the overshoot is the
   difference between a dialog appearing and a hand dealing you a card. */
@keyframes card-in {
  0%   { opacity: 0; transform: translateY(16px) scale(.985); }
  62%  { opacity: 1; transform: translateY(-3px) scale(1.004); }
  100% { opacity: 1; transform: none; }
}
/* The quality arc across the shoulders of the card. */
.card::before {
  content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--q, var(--arc)), transparent);
  opacity: .85;
}
/* A wash of the quality colour, banked at the top where the icon sits. */
.card::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(90% 46% at 50% 0%, var(--q, var(--arc)), transparent 70%);
  opacity: .07; transition: opacity .18s var(--ease);
}
.card:hover, .card:focus-visible {
  transform: translateY(-5px);
  border-color: var(--q, var(--arc));
  box-shadow: var(--bevel-deep), var(--lift-2), 0 0 42px -14px var(--q, var(--arc));
}
/* The inlay, and four corner ticks that pick up the quality colour on hover. */
.card .card-inlay {
  position: absolute; inset: 7px; pointer-events: none;
  border: 1px solid rgba(255,255,255,.04);
}
.card .card-inlay i {
  position: absolute; width: 7px; height: 7px;
  border: 0 solid var(--q, var(--arc)); opacity: .3;
  transition: opacity .18s var(--ease);
}
.card .card-inlay i:nth-child(1) { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.card .card-inlay i:nth-child(2) { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
.card .card-inlay i:nth-child(3) { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
.card .card-inlay i:nth-child(4) { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.card:hover .card-inlay i, .card:focus-visible .card-inlay i { opacity: .85; }
.card:hover::after, .card:focus-visible::after { opacity: .14; }
.card .icon-plate {
  width: 66px; height: 66px; position: relative; flex: none;
  border-radius: 2px;
}
.card .icon-plate img { width: 66px; height: 66px; display: block; }
/* No second frame: the plate carries its own chamfered rim. A pool of the
   quality colour behind it seats the tile instead. */
.card .icon-plate::before {
  content: ""; position: absolute; inset: -14px; border-radius: 50%;
  background: radial-gradient(circle, var(--q, var(--arc)), transparent 68%);
  opacity: .13; pointer-events: none;
}
.card .card-name {
  font-size: 17px; font-weight: 600; color: var(--q, var(--ink));
  letter-spacing: .005em; line-height: 1.2;
}
.card .card-note {
  font-size: var(--t-micro); letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-dim); font-weight: 600;
}
.card .card-body { font-size: var(--t-body); line-height: 1.5; color: var(--ink-dim); }
/* The flavour note, hung off the foot of the card by margin-top:auto. Its
   rule is reserved three lines of room whatever the text runs to, because
   three cards side by side with the rule at three different heights reads as
   an accident - the eye tracks that line across the row before it reads a
   word of any card. 1.45em is the line-height; 10px is the rule's gap. */
.card .card-detail {
  font-size: var(--t-small); line-height: 1.45; color: var(--ink-faint);
  border-top: 1px solid var(--rim); padding-top: 10px; margin-top: auto;
  min-height: calc(3 * 1.45em + 10px);
}
/* The number that picks the card, so 1/2/3 is discoverable. */
.card .card-key {
  position: absolute; top: 12px; right: 12px;
  font-family: var(--fig); font-size: var(--t-micro); color: var(--ink-faint);
  border: 1px solid var(--rim); border-radius: 2px; padding: 1px 5px;
}
.card.locked { cursor: not-allowed; opacity: .45; }
.card.locked:hover { transform: none; border-color: var(--rim); box-shadow: none; }
.card.selected { border-color: var(--arc); box-shadow: 0 0 0 1px var(--arc), 0 0 46px -16px var(--arc); }

/* ------------------------------------------------------------ pick grids */
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 10px; }
/* A pick tile is a plate with a name beside it, not a rectangle with a sprite
   dropped on. It carries the same chamfer as every icon in the game, its
   subject's colour along the leading edge, and a wash of that colour behind
   the seat - so a grid of ten reads as ten characters rather than ten rows. */
.pick {
  display: flex; gap: 12px; align-items: center;
  background:
    linear-gradient(100deg, color-mix(in srgb, var(--q, var(--arc)) 9%, transparent), transparent 46%),
    linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim); border-radius: 2px;
  padding: 11px 13px; cursor: pointer; text-align: left;
  font-family: inherit; color: inherit; box-shadow: var(--bevel);
  transition: border-color .16s var(--ease), transform .14s var(--ease-out),
              box-shadow .16s var(--ease);
  position: relative; overflow: hidden;
  clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px),
    calc(100% - 11px) 100%, 0 100%, 0 11px);
}
/* The leading edge, in the subject's colour. */
.pick::after {
  content: ""; position: absolute; left: 0; top: 11px; bottom: 0; width: 2px;
  background: var(--q, var(--arc)); opacity: .5;
  transition: opacity .16s var(--ease);
}
.pick:hover {
  border-color: color-mix(in srgb, var(--q, var(--arc)) 55%, transparent);
  transform: translateY(-2px);
  box-shadow: var(--bevel), var(--lift-1), 0 0 30px -16px var(--q, var(--arc));
}
.pick:hover::after { opacity: .9; }
.pick.selected {
  border-color: var(--q, var(--arc));
  box-shadow: var(--bevel), 0 0 0 1px color-mix(in srgb, var(--q, var(--arc)) 40%, transparent),
              0 0 34px -14px var(--q, var(--arc));
}
.pick.selected::after { opacity: 1; width: 3px; }
.pick.locked { opacity: .45; cursor: not-allowed; }
.pick.locked:hover { transform: none; border-color: var(--rim); box-shadow: var(--bevel); }
/* The seat: a chamfered well the portrait sits in, lit from its own colour. */
.pick .pick-seat {
  position: relative; flex: none; width: 48px; height: 48px;
  display: grid; place-items: center;
  clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
    calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  background:
    radial-gradient(circle at 50% 34%, color-mix(in srgb, var(--q, var(--arc)) 22%, transparent), transparent 68%),
    linear-gradient(180deg, var(--obsidian-3), var(--void));
  box-shadow: inset 0 0 0 1px rgba(255,240,214,.08);
}
.pick .pick-seat img { width: 44px; height: 44px; display: block; }
.pick .pick-name { font-size: var(--t-lead); font-weight: 600; letter-spacing: .005em; }
.pick .pick-sub { font-size: var(--t-small); color: var(--ink-dim); margin-top: 2px; line-height: 1.4; }

/* ---------------------------------------------------- the detail cartouche */
/* The selected survivor or battlefield, shown whole rather than as a tooltip. */
.cartouche {
  display: grid; grid-template-columns: 184px 1fr; gap: 24px;
  background: linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim); border-radius: 2px;
  padding: 20px; margin-bottom: 14px;
}
/* The portrait is a picture, not a token in a well: the canvas carries the
   room, the floor and the light, and this only frames it. Chamfered, because
   that is the shape every plate in the set is cut to. */
.cartouche .art {
  width: 184px; height: 184px; position: relative;
  clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px),
    calc(100% - 15px) 100%, 15px 100%, 0 calc(100% - 15px), 0 15px);
  box-shadow: var(--lift-1);
}
.cartouche .art img { display: block; width: 184px; height: 184px; }
/* Two hairlines inside the chamfer: the rim, and the survivor's own colour
   inlaid a few pixels in, the same construction as an ability plate. */
.cartouche .art .frame {
  position: absolute; inset: 0; pointer-events: none;
  clip-path: inherit;
  box-shadow:
    inset 0 0 0 1px rgba(255,240,214,.2),
    inset 0 0 0 5px rgba(6,7,11,.6),
    inset 0 0 0 6px color-mix(in srgb, var(--q, var(--arc)) 52%, transparent),
    inset 0 0 0 7px rgba(0,0,0,.5),
    inset 0 0 26px -6px rgba(0,0,0,.7),
    inset 0 24px 34px -24px rgba(255,244,224,.2);
}
.cartouche h3 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: .01em; }
.cartouche .role { margin-top: 3px; }
.cartouche .flavour { font-size: var(--t-body); color: var(--ink-dim); margin: 9px 0 0; line-height: 1.5; max-width: 62ch; }
.cartouche .perk {
  margin-top: 12px; padding: 10px 12px;
  background: rgba(245,197,107,.05); border-left: 2px solid var(--arc);
  font-size: var(--t-body); color: var(--ink); line-height: 1.45;
}
.cartouche .stat-line {
  display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px;
}
.cartouche .stat-line .s { display: flex; align-items: baseline; gap: 6px; }
.cartouche .stat-line .s b {
  font-family: var(--fig); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink);
}

/* ------------------------------------------------------------- list rows */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  background: var(--obsidian); border: 1px solid var(--rim); border-radius: 2px;
  box-shadow: var(--bevel);
  padding: 10px 14px;
  transition: border-color .16s var(--ease), background .16s var(--ease);
}
.row::before {
  content: ""; position: absolute; left: -1px; top: 30%; bottom: 30%; width: 2px;
  background: var(--arc); opacity: 0; transition: opacity .16s var(--ease), top .16s var(--ease), bottom .16s var(--ease);
}
.row:hover { border-color: var(--rim-lit); background: var(--obsidian-2); }
.row:hover::before { opacity: .55; top: 14%; bottom: 14%; }
.row img { width: 40px; height: 40px; flex: none; }
.row .row-main { flex: 1; min-width: 0; }
.row .row-name { font-size: var(--t-lead); font-weight: 600; }
.row .row-sub { font-size: var(--t-small); color: var(--ink-dim); margin-top: 2px; line-height: 1.4; }
.row .row-value {
  font-size: var(--t-body); color: var(--arc); white-space: nowrap;
  font-family: var(--fig); font-variant-numeric: tabular-nums;
}
/* An earned entry is marked along its leading edge, not merely tinted: at a
   glance down a column of twenty-four you should be able to count the ones
   you have without reading a word. */
.row.done { border-color: rgba(61,220,122,.28); }
.row.done .row-name { color: var(--q-uncommon); }
.row.done::before { opacity: .8; background: var(--q-uncommon); top: 14%; bottom: 14%; }
.row.undone { opacity: .55; }
.codex-head h3.panel-title { padding: 0; margin: 0; }

/* -- the trainer shop row ----------------------------------------------
   Four columns across the width: the mark, what it does, how far you have
   taken it, and what the next rank costs. */
.trainer-row { display: grid; grid-template-columns: 40px 1fr auto 132px; gap: 16px; }
.trainer-row .row-main { align-self: center; }
.trainer-row .rank-track { display: flex; align-items: center; gap: 12px; }
.trainer-row .rank-count {
  font-family: var(--fig); font-size: var(--t-small); font-variant-numeric: tabular-nums;
  color: var(--ink-dim); min-width: 34px; text-align: right;
}
.trainer-row.maxed .rank-count { color: var(--arc); }

/* A rank track you can read across a room: sunken cells, filled ones lit,
   and the one you are about to buy outlined so the purchase has a
   destination. Three-pixel dashes under the description did none of that. */
.rank-pips { display: flex; gap: 4px; }
.rank-pips i {
  width: 16px; height: 8px; display: block; border-radius: 1px;
  background: rgba(0,0,0,.5); box-shadow: var(--sunk);
}
.rank-pips i.on {
  background: linear-gradient(180deg, var(--arc-hot), var(--arc-deep));
  box-shadow: 0 0 8px -2px var(--arc), var(--bevel);
}
.rank-pips i.next { box-shadow: inset 0 0 0 1px var(--rim-arc); }

/* The same track for a rank that runs to a hundred. Fixed width, so a long
   upgrade cannot widen its column and squash the name beside it. */
.trainer-row .rank-bar {
  width: 168px; height: 8px; border-radius: 1px; overflow: hidden;
  background: rgba(0,0,0,.5); box-shadow: var(--sunk);
}
.trainer-row .rank-bar i {
  display: block; height: 100%; min-width: 2px;
  background: linear-gradient(90deg, var(--arc-deep), var(--arc-hot));
  box-shadow: 0 0 8px -2px var(--arc);
}
/* Names never wrap to a single letter: the description column may shrink,
   but only to something still readable, and the track keeps its width. */
.trainer-row .row-main { min-width: 0; }
.trainer-row .row-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The price carries the figure, not a caption. */
.btn.buy {
  display: flex; align-items: baseline; justify-content: center; gap: 1px;
  font-family: var(--fig); font-size: var(--t-body); padding: 8px 10px;
}
.btn.buy b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--arc-hot); }
.btn.buy .g { color: var(--ink-faint); font-size: var(--t-small); }
.btn.buy:disabled b { color: var(--ink-faint); }
.maxed-tag {
  align-self: center; text-align: center; font-family: var(--fig);
  font-size: var(--t-small); letter-spacing: .12em; color: var(--arc);
  border: 1px solid var(--rim-arc); border-radius: 2px; padding: 7px 0;
  background: rgba(245,197,107,.06);
}

/* ------------------------------------------------------------- bestiary */
.codex-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 20px; margin-bottom: 14px;
}
.codex-count {
  font-family: var(--fig); font-size: var(--t-lead); font-variant-numeric: tabular-nums;
  color: var(--arc); letter-spacing: .06em; flex: none;
}
.beast-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px;
}
.beast {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 12px 8px 11px; text-align: center;
  background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--q, var(--arc)) 10%, transparent), transparent 62%),
    linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim); border-radius: 2px; box-shadow: var(--bevel);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px),
    calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: border-color .16s var(--ease), transform .14s var(--ease-out);
}
.beast:hover { border-color: color-mix(in srgb, var(--q, var(--arc)) 55%, transparent); transform: translateY(-2px); }
/* The seat, cut to the same octagon every plate in the game wears. */
.beast .beast-plate {
  position: relative; width: 60px; height: 60px; display: grid; place-items: center;
  clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px),
    calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  background:
    radial-gradient(circle at 50% 34%, color-mix(in srgb, var(--q, var(--arc)) 20%, transparent), transparent 70%),
    linear-gradient(180deg, var(--obsidian-3), var(--void));
  box-shadow: inset 0 0 0 1px rgba(255,240,214,.07);
}
.beast .beast-plate img { display: block; }
.beast .beast-plate .q {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--fig); font-size: 26px; font-weight: 500;
  color: var(--ink-faint); text-shadow: 0 2px 6px rgba(0,0,0,.9);
}
.beast .beast-name {
  font-size: var(--t-small); font-weight: 600; line-height: 1.25;
  overflow-wrap: anywhere;
}
.beast .beast-sub { font-size: var(--t-micro); color: var(--ink-dim); letter-spacing: .04em; }
.beast.unknown { opacity: .62; }
.beast.unknown .beast-name { color: var(--ink-faint); letter-spacing: .1em; }
/* Elites and bosses are worth marking out of the crowd. */
.beast.elite { border-color: rgba(245,197,107,.24); }
.beast.boss { border-color: rgba(226,72,61,.3); }
.beast.boss .beast-plate { box-shadow: inset 0 0 0 1px rgba(226,72,61,.28); }

/* ------------------------------------------------------- field manual -- */
/* The one rule nobody guesses, said at the size it deserves. Everything else
   in this pane is ordinary rows; this is the only thing a player must read. */
.manual-lede {
  position: relative; margin-bottom: 20px; padding: 22px 24px;
  border: 1px solid var(--rim-arc); border-radius: 2px;
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(245,197,107,.10), transparent 62%),
    linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  box-shadow: var(--bevel-deep), var(--lift-1);
  overflow: hidden;
}
.manual-lede::before {
  content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--arc), transparent);
}
.manual-lede-title {
  font-size: 30px; font-weight: 600; letter-spacing: .01em; color: var(--arc-hot);
  line-height: 1.15;
}
.manual-lede-body {
  margin-top: 8px; font-size: var(--t-lead); color: var(--ink-dim);
  line-height: 1.5; max-width: 62ch;
}

/* Two columns: the key, then what it does. The key column is sized in ch off
   the mono face so every cap lines up down the page rather than centring. */
.key-grid { display: flex; flex-direction: column; gap: 6px; }
.key-row {
  display: grid; grid-template-columns: 22ch 1fr; gap: 16px; align-items: baseline;
  padding: 9px 14px;
  background: var(--obsidian); border: 1px solid var(--rim); border-radius: 2px;
  box-shadow: var(--bevel);
}
.key-row span { font-size: var(--t-body); color: var(--ink-dim); line-height: 1.45; }
.key-row kbd {
  font-family: var(--fig); font-size: var(--t-small); font-weight: 500;
  letter-spacing: .04em; color: var(--arc-hot); white-space: nowrap;
}
@media (max-width: 720px) {
  .key-row { grid-template-columns: 1fr; gap: 3px; }
  .manual-lede-title { font-size: 22px; }
}

/* ---------------------------------------------------------- best records */
.record-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px;
}
.record {
  display: flex; gap: 13px; align-items: center; padding: 10px 12px;
  background:
    linear-gradient(100deg, color-mix(in srgb, var(--q, var(--arc)) 9%, transparent), transparent 48%),
    linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim); border-radius: 2px; box-shadow: var(--bevel);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px),
    calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.record .record-art {
  position: relative; flex: none; width: 56px; height: 56px; display: block;
  clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px),
    calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
}
.record .record-art img { display: block; width: 56px; height: 56px; }
.record .record-art .frame {
  position: absolute; inset: 0; clip-path: inherit;
  box-shadow:
    inset 0 0 0 1px rgba(255,240,214,.14),
    inset 0 0 0 3px rgba(6,7,11,.5),
    inset 0 0 0 4px color-mix(in srgb, var(--q, var(--arc)) 45%, transparent);
}
.record .record-name { font-size: var(--t-small); color: var(--ink-dim); }
.record .record-time {
  font-family: var(--fig); font-size: 21px; font-weight: 500;
  font-variant-numeric: tabular-nums; color: var(--arc-hot); margin-top: 1px;
}
.record.unset .record-time { color: var(--ink-faint); }
.record.unset .record-art { filter: saturate(.35) brightness(.7); }

/* ------------------------------------------------------------- stat grid */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.stat {
  position: relative; background: var(--obsidian); border: 1px solid var(--rim);
  padding: 13px 15px; border-radius: 2px; box-shadow: var(--bevel);
}
.stat::after {
  content: ""; position: absolute; top: 0; left: 0; width: 12px; height: 2px; background: var(--arc); opacity: .5;
}
.stat .stat-value {
  font-size: 23px; font-weight: 600; color: var(--arc);
  font-family: var(--fig); font-variant-numeric: tabular-nums;
}
.stat .stat-label { margin-top: 5px; }

/* ================================================================== HUD == */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-family: var(--ui); }
#hud.hidden { display: none; }

/* -- portrait cluster ------------------------------------------------- */
/* The survivor leads. They are the cute half of the game's two halves, so
   the portrait is the largest single thing in the HUD and it breathes. */
#hud-portrait { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 17px; }
.gauge-wrap { position: relative; width: 112px; height: 112px; }
.gauge-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
.gauge-wrap .track { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 6; }
.gauge-wrap .ticks { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 6; }
.gauge-wrap .arc-hp {
  fill: none; stroke: var(--blood); stroke-width: 6; stroke-linecap: round;
  transition: stroke-dashoffset .14s linear, stroke .3s var(--ease);
  filter: drop-shadow(0 0 5px rgba(226,72,61,.5));
}
.gauge-wrap .arc-xp {
  fill: none; stroke: var(--arc); stroke-width: 3; stroke-linecap: round;
  filter: drop-shadow(0 0 4px rgba(245,197,107,.5));
}
.gauge-wrap .portrait {
  position: absolute; inset: 17px; border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, var(--obsidian-3), var(--obsidian));
  border: 1px solid var(--rim-lit);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.5),
              inset 0 -6px 12px rgba(0,0,0,.45);
  display: grid; place-items: center; overflow: hidden;
}
/* The bob. Two and a half seconds, a pixel and a half - below the threshold
   where you would call it an animation, above the one where the portrait
   looks like a dead sticker. The hero is alive even while you read a menu. */
.gauge-wrap .portrait img {
  width: 100%; height: 100%;
  animation: hero-bob 2.4s var(--ease) infinite;
}
@keyframes hero-bob {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-1.5px) scale(1.015); }
}
@media (prefers-reduced-motion: reduce) {
  .gauge-wrap .portrait img { animation: none; }
  .card { animation-duration: .01s; }
}
.gauge-wrap .lvl {
  position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
  background: var(--obsidian); border: 1px solid var(--arc); color: var(--arc-hot);
  font-family: var(--fig); font-size: var(--t-micro); font-weight: 500; letter-spacing: .06em;
  padding: 1px 7px; border-radius: 2px; white-space: nowrap;
}
/* A ring that pulses when the survivor is about to die. */
.gauge-wrap.critical .portrait { border-color: rgba(226,72,61,.7); }
.gauge-wrap.critical::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--blood); opacity: 0;
  animation: peril 1.1s ease-in-out infinite;
}
@keyframes peril { 0%, 100% { opacity: 0; transform: scale(.97); } 50% { opacity: .55; transform: scale(1.02); } }

#hud-vitals { display: flex; flex-direction: column; gap: 3px; }
#hud-vitals .hp-text {
  font-family: var(--fig); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums;
}
#hud-vitals .hp-text small { color: var(--ink-faint); font-size: var(--t-small); }
#hud-vitals .name { font-size: var(--t-body); color: var(--ink-dim); }

#hud-meters { display: flex; flex-direction: column; gap: 6px; margin-top: 7px; }
.meter { width: 158px; }
.meter .meter-track {
  height: 5px; background: rgba(0,0,0,.45); border-radius: 2px; overflow: hidden;
  box-shadow: var(--sunk);
}
.meter .meter-fill { height: 100%; width: 0%; border-radius: 2px; transition: width .15s linear; }
.meter.fel .meter-fill { background: linear-gradient(90deg, #5aa832, var(--fel)); }
.meter.meta .meter-fill { background: linear-gradient(90deg, var(--fel), #eaffd8); }
.meter .meter-label {
  font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 4px; font-weight: 600;
}

/* -- timer rail -------------------------------------------------------- */
#hud-timer {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  text-align: center; width: min(560px, 56vw);
}
#hud-timer .time {
  font-family: var(--fig); font-size: 32px; font-weight: 300;
  letter-spacing: .1em; font-variant-numeric: tabular-nums;
}
#hud-timer .rail {
  position: relative; height: 4px; margin-top: 9px;
  background: rgba(0,0,0,.45); box-shadow: var(--sunk);
}
#hud-timer .rail .fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, rgba(245,197,107,.3), var(--arc));
}
#hud-timer .rail .head {
  position: absolute; top: -2px; width: 7px; height: 7px; margin-left: -3px;
  background: var(--arc-hot); border-radius: 50%;
  box-shadow: 0 0 9px 2px rgba(245,197,107,.55);
}
#hud-timer .rail .tick { position: absolute; top: -3px; width: 1px; height: 9px; background: rgba(255,255,255,.26); }
#hud-timer .rail .tick.passed { background: var(--arc); opacity: .8; }
#hud-timer .rail .tick.death { background: var(--blood); height: 11px; top: -4px; width: 2px; }
#hud-timer .mode { margin-top: 7px; color: var(--arc); }

/* -- boss arc ---------------------------------------------------------- */
/* The centring lives in the keyframes, not beside them.
 *
 * This was `transform: translateX(-50%)` on the rule PLUS `animation:
 * sweep-in`, and sweep-in animates `transform` - so for the 300ms of the
 * entrance the animation's transform replaced the centring one and the bar
 * drew from `left: 50%` with nothing pulling it back. Measured at 1280x720:
 * it entered at x=642..1398, 380px right of where it belongs and 118px past
 * the right edge of the screen, then snapped into place when the animation
 * ended. Every boss arrival, on the most dramatic beat the game has.
 *
 * A transform cannot be half-overridden, so the fix is to stop splitting it:
 * these keyframes carry the -50% themselves, in every frame including the
 * last. Anything else that centres this way must do the same. */
#hud-boss {
  position: absolute; top: 116px; left: 50%; transform: translateX(-50%);
  width: min(760px, 74vw); text-align: center;
  animation: boss-in .3s var(--ease-out);
}
@keyframes boss-in {
  from { opacity: 0; transform: translateX(-50%) translateY(12px) scale(.994); }
  to   { opacity: 1; transform: translateX(-50%); }
}
#hud-boss.hidden { display: none; }
#hud-boss .boss-name {
  font-size: var(--t-small); letter-spacing: .18em; text-transform: uppercase;
  color: #f2c9ff; font-weight: 600; margin-bottom: 2px;
  text-shadow: 0 0 18px rgba(179,79,242,.45);
}
#hud-boss svg { display: block; width: 100%; height: 30px; overflow: visible; }
#hud-boss .b-track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 5; }
#hud-boss .b-fill {
  fill: none; stroke: var(--blood); stroke-width: 5; stroke-linecap: round;
  filter: drop-shadow(0 0 6px rgba(226,72,61,.45));
  transition: stroke-dashoffset .18s var(--ease);
}
#hud-boss .b-pct {
  font-family: var(--fig); font-size: var(--t-micro); color: var(--ink-dim);
  font-variant-numeric: tabular-nums; margin-top: 1px;
}

/* -- tallies ----------------------------------------------------------- */
#hud-stats {
  position: absolute; top: 20px; right: 20px; text-align: right;
  display: flex; flex-direction: column; gap: 9px;
}
#hud-stats .stat-line { display: flex; align-items: baseline; justify-content: flex-end; gap: 9px; }
#hud-stats .stat-line .v {
  font-family: var(--fig); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums;
  min-width: 4ch;
}
#hud-stats .gold .v { color: var(--arc); }
#hud-stats .dps .v { color: #ff9d6b; }
#hud-stats .hps .v { color: var(--verdant); }

/* -- weapon strip ------------------------------------------------------ */
/* -- arsenal and passives ----------------------------------------------
   Two layouts, chosen in Settings.

   The default lies along the foot of the screen, tucked close to the edge -
   vertical space is the scarce kind, because the survivor is usually near
   the middle of the field and the horde comes from every side.

   The rail stands them up the two edges instead. On anything wider than 16:9
   the world is letterboxed, so that puts both columns in the dark bars and
   takes them off the battlefield entirely; at 16:9 they hug the extreme
   edges, which is still further out of the way than lying across the bottom.
   Both build upward and outward, so picking something new never shunts what
   is already there. */
#hud-weapons {
  position: absolute; bottom: 10px; left: 20px;
  display: flex; gap: 11px; align-items: flex-end;
}
body.hud-rail #hud-weapons {
  bottom: 14px; left: 9px;
  flex-direction: column-reverse; gap: 10px; align-items: center;
}
.wslot { position: relative; width: 54px; height: 54px; }
.wslot img { width: 54px; height: 54px; display: block; }
/* The chamfered icon plate is the frame; the slot adds only a seat. */
.wslot::before {
  content: ""; position: absolute; inset: -8px; border-radius: 50%;
  background: radial-gradient(circle, rgba(245,197,107,.16), transparent 66%);
  pointer-events: none;
}
.wslot svg { position: absolute; inset: -5px; transform: rotate(-90deg); pointer-events: none; overflow: visible; }
.wslot .cd-track { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 3; }
.wslot .cd-arc {
  fill: none; stroke: var(--arc); stroke-width: 3; stroke-linecap: round;
  filter: drop-shadow(0 0 3px rgba(245,197,107,.45));
}
.wslot .rank {
  position: absolute; bottom: -3px; right: -3px;
  background: var(--obsidian); border: 1px solid var(--rim);
  font-family: var(--fig); font-size: 9px; font-weight: 500;
  padding: 0 4px; border-radius: 2px; color: var(--ink);
}
.wslot.evolved .rank { border-color: var(--arc); color: var(--arc); }
.wslot.evolved::after {
  content: ""; position: absolute; inset: -8px; pointer-events: none;
  border: 1px solid rgba(245,197,107,.45);
  clip-path: polygon(0 0, 34% 0, 0 34%, 0 0, 100% 100%, 66% 100%, 100% 66%);
}
.wslot.evolved::before { background: radial-gradient(circle, rgba(245,197,107,.3), transparent 66%); }
/* Fires when the weapon does, so the strip reads as a live instrument. */
.wslot .flash {
  position: absolute; inset: -5px; border-radius: 3px; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.55), transparent 65%);
  opacity: 0;
}
.wslot.fired .flash { animation: slot-fire .26s var(--ease-out); }
@keyframes slot-fire { from { opacity: .8; transform: scale(.9); } to { opacity: 0; transform: scale(1.15); } }
/* An empty scabbard is a seat waiting for a plate, so it wears the plate's own
   chamfered octagon rather than a dashed rectangle borrowed from nothing else
   in the set. */
.wslot.empty { opacity: 1; }
.wslot.empty::before { display: none; }
.wslot .scabbard {
  width: 54px; height: 54px;
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
  background: linear-gradient(180deg, rgba(255,244,224,.075), rgba(255,244,224,.02));
}

/* -- passive pips ------------------------------------------------------ */
#hud-passives {
  position: absolute; bottom: 10px; right: 20px;
  display: flex; gap: 6px; flex-wrap: wrap-reverse; justify-content: flex-end; max-width: 38vw;
}
body.hud-rail #hud-passives {
  bottom: 14px; right: 9px; max-width: none;
  flex-direction: column-reverse; flex-wrap: wrap-reverse; gap: 7px;
  align-items: center; align-content: flex-end;
  /* Twenty-five passives will not fit one column, so it wraps into a second
     rail inward of the first rather than running off the top of the screen. */
  max-height: calc(100vh - 190px);
}
.pslot { position: relative; width: 34px; height: 34px; }
.pslot img { width: 34px; height: 34px; display: block; opacity: .92; }
.pslot .rank {
  position: absolute; bottom: -2px; right: -2px; background: var(--obsidian);
  font-family: var(--fig); font-size: 8px; font-weight: 500; padding: 0 3px;
  border: 1px solid var(--rim); border-radius: 2px; color: var(--ink-dim);
}

/* -- toasts ------------------------------------------------------------ */
/* Toasts live in the corner, not across the middle of the fight.
 *
 * They were centred, 460px wide and stacked three deep, which put them at the
 * lower centre of the playfield - measured at 1280x720, y 441 to 628 of a 720
 * tall field. That is not a margin, it is the ground directly under the
 * survivor, who spends the whole run near the middle of the screen because
 * the horde comes from every side. A discovery notice was covering the thing
 * it was congratulating you on.
 *
 * Bottom left, rising off the arsenal, is where a log belongs: it reads as a
 * feed attached to your kit, it is peripheral rather than central, and the
 * eye can ignore it completely while dodging. */
#hud-toasts {
  position: absolute; bottom: 78px; left: 20px;
  display: flex; flex-direction: column-reverse; gap: 7px; align-items: stretch;
  /* Narrow on purpose. At 360px a three-deep stack still caught the corner of
     the middle of the field on a 1280 screen - only by a few pixels, but the
     whole point of moving them was that the centre is not theirs. */
  width: min(320px, 26vw);
}
/* Two lines is a notice; more is a paragraph nobody reads mid-fight, and an
   unbounded stack is what let the column climb back into the playfield. */
.toast .t-body {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;
}
/* The rail layout stands the arsenal up the left edge, so the feed steps
   inward to clear it rather than stacking on top of it. */
body.hud-rail #hud-toasts { left: 76px; bottom: 20px; }
.toast {
  width: 100%;
  background: linear-gradient(90deg, rgba(17,20,29,.86), rgba(11,13,18,.7));
  backdrop-filter: blur(2px);
  border: 1px solid var(--rim); border-left: 2px solid var(--arc);
  padding: 10px 15px; border-radius: 2px;
  box-shadow: var(--bevel), var(--lift-1);
  animation: toast-in .26s var(--ease-out);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.toast .t-title { font-size: var(--t-small); font-weight: 700; color: var(--arc-hot); letter-spacing: .06em; }
.toast .t-body { font-size: var(--t-small); color: var(--ink-dim); margin-top: 3px; line-height: 1.4; }

/* -- the level-up bar -------------------------------------------------- */
/* A segmented choice: one sunken track, the picked cell lifted out of it. */
.segmented {
  display: flex; flex: none; padding: 2px; gap: 2px; border-radius: 3px;
  background: rgba(0,0,0,.4); box-shadow: var(--sunk);
  border: 1px solid var(--rim);
}
.segmented .seg {
  font: inherit; font-size: var(--t-small); letter-spacing: .04em;
  color: var(--ink-dim); background: transparent; border: 0; border-radius: 2px;
  padding: 5px 11px; cursor: pointer; white-space: nowrap;
  transition: color .14s var(--ease), background .14s var(--ease);
}
.segmented .seg:hover { color: var(--ink); }
.segmented .seg.on {
  color: var(--arc-hot);
  background: linear-gradient(180deg, var(--obsidian-4), var(--obsidian-3));
  box-shadow: var(--bevel);
}

.choice-bar { display: flex; gap: 10px; align-items: center; justify-content: center; }
/* The banish hint is always in the bar at its full width, and only fades. If
   it appeared on demand it would widen the bar and re-centre the two buttons
   under the cursor that just clicked one of them. Nothing may move. */
.choice-hint {
  font-size: var(--t-small); color: var(--blood); letter-spacing: .04em;
  opacity: 0; transition: opacity .16s var(--ease); pointer-events: none;
}
.choice-hint.on { opacity: .9; }
/* An armed toggle reads as held down, not as a button that was clicked. */
.btn.armed {
  border-color: var(--blood); color: #ffd9d2;
  background: linear-gradient(180deg, rgba(226,72,61,.22), rgba(226,72,61,.08));
  box-shadow: var(--sunk), 0 0 22px -8px var(--blood);
}
.choice-bar .count { color: var(--arc); font-weight: 700; }
.banish-mode .card { border-color: rgba(226,72,61,.5); }
.banish-mode .card::before { background: linear-gradient(90deg, transparent, var(--blood), transparent); }
.banish-mode .card:hover { border-color: var(--blood); box-shadow: var(--lift-2), 0 0 34px -12px var(--blood); }

/* -- the verdict ------------------------------------------------------- */
/* The outcome, stated once and large, before the accounting. */
.verdict {
  position: relative; margin-bottom: 16px; padding: 24px 26px;
  border: 1px solid var(--rim); border-radius: 2px;
  box-shadow: var(--bevel-deep), var(--lift-1);
  background: linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  overflow: hidden;
}
.verdict::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--verdict-hue, var(--arc)), transparent);
}
.verdict::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 70% at 50% -20%, var(--verdict-hue, var(--arc)), transparent 65%);
  opacity: .09;
}
.verdict.win  { --verdict-hue: var(--arc); }
.verdict.loss { --verdict-hue: var(--blood); }
.verdict.neutral { --verdict-hue: var(--ink-dim); }
.verdict-head { position: relative; }
.verdict-title {
  font-size: var(--t-hero); font-weight: 200; letter-spacing: .04em;
  color: var(--verdict-hue, var(--arc)); line-height: 1.1;
}
.verdict-line {
  margin-top: 8px; font-size: var(--t-lead); color: var(--ink-dim); max-width: 62ch;
}
.verdict-figures {
  position: relative; display: flex; flex-wrap: wrap; gap: 10px 34px; margin-top: 20px;
  padding-top: 18px; border-top: 1px solid var(--rim);
}
.verdict-figures .vf .v {
  font-family: var(--fig); font-size: 24px; font-weight: 500;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.verdict-figures .vf .label { margin-top: 3px; }

/* -- the build sheet --------------------------------------------------- */
.sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .sheet { grid-template-columns: 1fr; } }

/* A results screen keeps its verdict and its buttons in front of you and
   scrolls the detail, not the page. At 720p the run summary used to put 54%
   of itself on screen and hide the rest below the fold - including, on a
   victory, the button that claims the win. The body now fits the space it is
   given and the two panels carry their own scroll. */
.overlay-body.fitted {
  display: flex; flex-direction: column; gap: 14px;
  overflow: hidden; min-height: 0;
}
/* Everything that is not the sheet keeps its full height - the verdict block
   carries the run's figures, and flex was squeezing them to nothing. */
.overlay-body.fitted > * { flex: none; }
/* The pause screen puts its tabs inside the body, above the sheet, so the
   pane below them is the part that fills and scrolls. */
.overlay-body.fitted > div:last-child { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.overlay-body.fitted > div:last-child > .sheet { flex: 1 1 auto; min-height: 0; }
.overlay-body.fitted .sheet { flex: 1 1 auto; min-height: 0; }
/* The frame holds still; the inside scrolls.
   The panel used to scroll itself, which put its scrollbar on top of its own
   border and slid the bottom-right bracket up out of the corner as you read.
   Now the panel clips and never moves, and .panel-scroll carries the content -
   so the border, the inlay and both brackets are simply always where they
   belong, and the sticky patch the inlay needed is gone with the problem. */
.overlay-body.fitted .sheet > .panel {
  position: relative; overflow: hidden; min-height: 0;
  display: flex; flex-direction: column;
}
.overlay-body.fitted .sheet > .panel > .panel-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  /* Asymmetric on purpose: the bar lives in the right-hand gutter, so the
     text needs less padding on that side to end up looking evenly inset.
     `stable` keeps the gutter there whether the bar is showing or not, so a
     panel does not reflow the moment its content grows past the fold. */
  padding: 16px 12px 16px 16px; scrollbar-gutter: stable;
}
/* The bar rides INSIDE the frame: a wide track with a transparent border and
   background-clip leaves a slim thumb floating clear of the rim and the inlay
   hairline, instead of a full-width trough drawn across the edging. */
.overlay-body.fitted .sheet > .panel > .panel-scroll::-webkit-scrollbar { width: 14px; }
.overlay-body.fitted .sheet > .panel > .panel-scroll::-webkit-scrollbar-track { background: transparent; }
.overlay-body.fitted .sheet > .panel > .panel-scroll::-webkit-scrollbar-thumb {
  background: var(--obsidian-4); border: 5px solid transparent;
  background-clip: padding-box; border-radius: 7px;
}
.overlay-body.fitted .sheet > .panel > .panel-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--rim-hot, var(--obsidian-4)); background-clip: padding-box;
}
.sheet h3 {
  margin: 0 0 11px; font-size: var(--t-micro); letter-spacing: .18em; text-transform: uppercase;
  color: var(--arc); font-weight: 700;
}
.sheet > .panel > * + h3 { margin-top: 20px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: var(--t-small); padding: 3px 0; }
.kv span:first-child { color: var(--ink-dim); }
.kv span:last-child { font-family: var(--fig); font-variant-numeric: tabular-nums; }
/* A share bar behind each damage-meter row, so the split reads at a glance. */
.kv.meter-row { position: relative; padding: 4px 6px; }
.kv.meter-row::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--share, 0%);
  background: var(--q, var(--arc)); opacity: .12; border-radius: 1px;
}
.kv.meter-row span { position: relative; }

/* -- settings ---------------------------------------------------------- */
.setting {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 11px 14px; background: var(--obsidian); border: 1px solid var(--rim);
  border-radius: 2px; box-shadow: var(--bevel);
}
.setting .s-name { font-size: var(--t-body); }
.setting .s-desc { font-size: var(--t-small); color: var(--ink-dim); margin-top: 2px; }
.switch {
  width: 42px; height: 22px; border-radius: 11px; background: var(--obsidian-4);
  border: 1px solid var(--rim); position: relative; cursor: pointer; flex: none;
  transition: background .18s var(--ease), border-color .18s var(--ease);
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--ink-faint);
  transition: transform .2s var(--ease-out), background .18s var(--ease);
}
.switch.on { background: rgba(245,197,107,.2); border-color: var(--arc); }
.switch.on::after { transform: translateX(20px); background: var(--arc); }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 140px; height: 3px;
  background: var(--obsidian-4); border-radius: 2px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--arc); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: var(--arc); border: none; cursor: pointer;
}

/* -- tabs -------------------------------------------------------------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rim); flex-wrap: wrap; }
.tab {
  appearance: none; background: none; border: none; cursor: pointer; font-family: inherit;
  padding: 11px 16px; color: var(--ink-dim);
  font-size: var(--t-small); letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .16s var(--ease), border-color .16s var(--ease);
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--arc); border-bottom-color: var(--arc); }

/* -- the purse --------------------------------------------------------- */
.bank {
  display: inline-flex; align-items: baseline; gap: 9px;
  border: 1px solid var(--rim); border-radius: 2px; padding: 8px 14px;
  background: var(--obsidian); box-shadow: var(--bevel);
}
.bank .v {
  color: var(--arc); font-family: var(--fig); font-weight: 500;
  font-variant-numeric: tabular-nums; font-size: var(--t-title);
}

/* -- touch stick ------------------------------------------------------- */
#stick {
  position: absolute; width: 132px; height: 132px; border-radius: 50%;
  border: 1px solid var(--rim); background: rgba(11,13,18,.45);
  pointer-events: none; z-index: 15; display: none;
}
#stick .nub {
  position: absolute; width: 52px; height: 52px; border-radius: 50%;
  background: rgba(245,197,107,.28); border: 1px solid var(--arc); left: 40px; top: 40px;
}
/* The stick is not a touch-device feature any more - it is how a pointer
   steers, whichever kind of pointer it is. */
#stick.active { display: block; }

/* -- held the wrong way round ------------------------------------------ */
/* The playfield is a fixed 1280x720 letterboxed into whatever it is given, so
   a phone held upright spends 74% of its screen on letterbox - measured on a
   390x844 viewport, a 390x219 field and 26% of the display doing anything.
   That is not a small screen problem, it is an orientation one, and the fix
   is to say so rather than to render a postage stamp and hope.

   Pure CSS, deliberately: the prompt appears and disappears with the device
   itself, with no state to get out of step. The simulation freezes separately
   (see Game.update) so nothing can kill you behind it. */
#rotate {
  position: fixed; inset: 0; z-index: 40; display: none;
  place-items: center; padding: 32px;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, #0b0d12, var(--void));
}
@media (orientation: portrait) and (max-width: 900px) {
  #rotate { display: grid; }
}
.rotate-inner { text-align: center; max-width: 34ch; animation: sweep-in .35s var(--ease-out); }
#rotate svg {
  width: 92px; height: 92px; margin-bottom: 20px;
  fill: none; stroke: var(--arc); stroke-width: 4;
  stroke-linecap: round; stroke-linejoin: round;
  animation: rotate-hint 2.6s var(--ease) infinite;
}
@keyframes rotate-hint {
  0%, 55%, 100% { transform: rotate(0deg); }
  75%, 90%      { transform: rotate(-90deg); }
}
.rotate-title {
  font-size: var(--t-title); font-weight: 600; color: var(--arc-hot);
  letter-spacing: .04em; text-transform: uppercase;
}
.rotate-body {
  margin-top: 10px; font-size: var(--t-body); color: var(--ink-dim); line-height: 1.55;
}
@media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; } }

/* -- small screens ----------------------------------------------------- */
@media (max-width: 860px) {
  .cartouche { grid-template-columns: 1fr; }
  .cartouche .art { width: 100%; height: 120px; }
}
@media (max-width: 720px) {
  .card { width: 100%; min-height: 0; }
  #hud-portrait { top: 12px; left: 12px; gap: 10px; }
  .gauge-wrap { width: 74px; height: 74px; }
  #hud-timer .time { font-size: 23px; }
  #hud-weapons { bottom: 12px; left: 12px; gap: 7px; }
  .wslot, .wslot img { width: 44px; height: 44px; }
  #hud-passives { bottom: 12px; right: 12px; }
  #hud-stats { top: 12px; right: 12px; gap: 5px; }
  #hud-stats .stat-line .v { font-size: var(--t-lead); }
  .overlay-head h1 { font-size: 21px; }
}

/* ============================================================ prologue ====
   The words over the cinematic. Canvas paints the night; this typesets what
   is said about it, so the writing gets the same faces and the same kerning
   as every other line of text in the game rather than canvas' own.

   Pointer events are ON for the layer, because tapping anywhere skips - the
   one exception being the skip button itself, which handles its own click. */
#prologue {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 0 6vw 7vh; text-align: center;
  pointer-events: auto; cursor: pointer;
  background: radial-gradient(ellipse at 50% 42%, transparent 40%, rgba(3,4,7,.55) 100%);
}
#prologue .lines {
  max-width: min(84vw, 880px); transition: opacity .28s ease;
  text-shadow: 0 2px 22px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.85);
}
/* Archivo, because Archivo is what this game has. Only two faces are embedded
   and a cinematic is not a reason to reach for a third the player would have
   to download - the weight, the size and the air do the work a serif would. */
#prologue .lines p {
  margin: 0 0 .42em;
  font-family: var(--ui);
  font-size: clamp(18px, 2.05vw, 30px); font-weight: 300; line-height: 1.42;
  letter-spacing: .008em; color: #eef1f7;
}
#prologue .lines p + p { color: #aab3c4; font-size: clamp(16px, 1.8vw, 26px); }

#prologue .title {
  position: absolute; left: 0; right: 0; top: 34%; transform: translateY(-50%);
  opacity: 0; transition: opacity .5s ease; pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
}
#prologue .game-title { justify-content: center; font-size: clamp(30px, 5.4vw, 74px); }
#prologue .title em {
  display: block; margin-top: 1.1em; font-style: normal;
  font-family: var(--ui);
  font-size: clamp(10px, 1.05vw, 14px); letter-spacing: .36em;
  text-transform: uppercase; color: var(--ink-faint, #6b7488);
}

#prologue .skip {
  position: absolute; right: 3vw; bottom: 3.4vh;
  background: none; border: 0; cursor: pointer;
  font-family: var(--ui, 'Archivo', system-ui, sans-serif);
  font-size: 11px; letter-spacing: .26em; text-transform: uppercase;
  color: #6b7488; padding: 8px 10px; border-radius: 5px;
}
#prologue .skip:hover { color: var(--gold, #f5c56b); }
#prologue .skip:focus-visible { outline: 2px solid var(--gold, #f5c56b); outline-offset: 2px; }

</style>

<body>
  <div id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="overlay" class="hidden"></div>
    <div id="stick"><div class="nub"></div></div>
    <div id="rotate">
      <div class="rotate-inner">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="30" y="14" width="40" height="72" rx="7"/>
          <path d="M18 62 A34 34 0 0 0 52 96" />
          <path d="M44 90 L52 96 L46 104" />
        </svg>
        <div class="rotate-title">Turn your device</div>
        <div class="rotate-body">The Ember Watch is played wide. Landscape gives you
          the whole battlefield instead of a quarter of it.</div>
      </div>
    </div>
  </div>

  <script>
/* ===== src/core/util.js ===== */
/* The Ember Watch - core utilities.
 * Loaded first; every other file hangs off the global WS namespace, mirroring
 * the addon's `WS` table so ported logic reads the same. Classic scripts (no
 * ES modules) so the game runs straight off the filesystem. */
'use strict';
window.WS = window.WS || {};
(function (WS) {

  const M = Math;
  WS.PI = M.PI; WS.TAU = M.PI * 2;
  WS.min = M.min; WS.max = M.max; WS.abs = M.abs;
  WS.floor = M.floor; WS.ceil = M.ceil; WS.round = M.round;
  WS.sqrt = M.sqrt; WS.sin = M.sin; WS.cos = M.cos; WS.atan2 = M.atan2;

  WS.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  WS.lerp = (a, b, t) => a + (b - a) * t;

  /** Returns unit dx, dy and the original length. Zero-safe. */
  WS.normalize = function (dx, dy) {
    const d = M.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) return [0, 0, 0];
    return [dx / d, dy / d, d];
  };
  WS.dist = (ax, ay, bx, by) => M.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
  WS.dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);

  /* ---------------------------------------------------------------- random */
  // Deterministic-ish xorshift so a seeded run can be reproduced for debugging.
  let seed = (Date.now() ^ 0x9e3779b9) >>> 0;
  WS.setSeed = (s) => { seed = (s >>> 0) || 1; };
  /* Borrowing the stream and putting it back. Anything that seeds the RNG to
     make itself repeatable - the prologue's starfield, a measurement harness -
     has to hand the stream back where it found it, or every run after it is
     deterministic in a way nobody asked for. */
  WS.getSeed = () => seed;
  WS.random = function () {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >> 17;
    seed ^= seed << 5; seed >>>= 0;
    return seed / 4294967296;
  };
  /** Inclusive integer range, or [0, a] when b is omitted. */
  WS.randInt = function (a, b) {
    if (b === undefined) { b = a; a = 0; }
    return a + WS.floor(WS.random() * (b - a + 1));
  };
  WS.randRange = (a, b) => a + WS.random() * (b - a);
  WS.pick = (arr) => arr[WS.floor(WS.random() * arr.length)];
  WS.chance = (p) => WS.random() < p;

  /** Weighted pick over [{weight}] entries. */
  WS.weightedPick = function (list) {
    let total = 0;
    for (const e of list) total += (e.weight || 1);
    let roll = WS.random() * total;
    for (const e of list) {
      roll -= (e.weight || 1);
      if (roll <= 0) return e;
    }
    return list[list.length - 1];
  };

  /** Weighted pick that also removes the winner (sampling without replacement). */
  WS.takeWeighted = function (list) {
    if (!list.length) return null;
    const chosen = WS.weightedPick(list);
    const i = list.indexOf(chosen);
    if (i >= 0) list.splice(i, 1);
    return chosen;
  };

  WS.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = WS.floor(WS.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };

  /* ---------------------------------------------------------------- format */
  WS.formatTime = function (seconds) {
    const s = WS.max(0, WS.floor(seconds));
    return `${WS.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  WS.formatNumber = function (n) {
    n = WS.floor(n);
    return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
      : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k'
        : String(n);
  };
  WS.rgb = (c, a) => a === undefined
    ? `rgb(${(c[0] * 255) | 0},${(c[1] * 255) | 0},${(c[2] * 255) | 0})`
    : `rgba(${(c[0] * 255) | 0},${(c[1] * 255) | 0},${(c[2] * 255) | 0},${a})`;
  WS.hex = function (c) {
    const h = (v) => WS.clamp(WS.round(v * 255), 0, 255).toString(16).padStart(2, '0');
    return '#' + h(c[0]) + h(c[1]) + h(c[2]);
  };
  WS.shade = (c, k) => [WS.clamp(c[0] * k, 0, 1), WS.clamp(c[1] * k, 0, 1), WS.clamp(c[2] * k, 0, 1)];
  WS.mix = (a, b, t) => [WS.lerp(a[0], b[0], t), WS.lerp(a[1], b[1], t), WS.lerp(a[2], b[2], t)];

  /* ------------------------------------------------------------------ pool */
  /** Fixed-capacity object pool. `active` is a dense array; Release swaps the
   *  tail into the freed slot, so iteration must handle in-place removal. */
  WS.Pool = class Pool {
    constructor(factory, reset, cap) {
      this.factory = factory; this.reset = reset; this.cap = cap || 512;
      this.active = []; this.free = [];
    }
    get count() { return this.active.length; }
    acquire() {
      if (this.active.length >= this.cap) return null;
      const o = this.free.pop() || this.factory();
      o._dead = false;
      this.active.push(o);
      return o;
    }
    release(o) {
      const i = this.active.indexOf(o);
      if (i < 0) return;
      this.active[i] = this.active[this.active.length - 1];
      this.active.pop();
      o._dead = true;
      if (this.reset) this.reset(o);
      this.free.push(o);
    }
    releaseAt(i) {
      const o = this.active[i];
      this.active[i] = this.active[this.active.length - 1];
      this.active.pop();
      o._dead = true;
      if (this.reset) this.reset(o);
      this.free.push(o);
      return o;
    }
    releaseAll() {
      while (this.active.length) this.releaseAt(this.active.length - 1);
    }
  };

  /* ---------------------------------------------------------- spatial hash */
  /** Uniform grid over the world, rebuilt once per tick. Collision queries in
   *  the addon used an 80px hash; same here. */
  WS.Grid = class Grid {
    constructor(cell) { this.cell = cell || 80; this.buckets = new Map(); }
    clear() { this.buckets.clear(); }
    key(x, y) { return ((y / this.cell) | 0) * 4096 + ((x / this.cell) | 0); }
    insert(e) {
      const k = this.key(e.x, e.y);
      let b = this.buckets.get(k);
      if (!b) { b = []; this.buckets.set(k, b); }
      b.push(e);
    }
    /** Calls fn(entity) for everything in the cells overlapping the radius. */
    query(x, y, radius, fn) {
      const c = this.cell;
      const x0 = ((x - radius) / c) | 0, x1 = ((x + radius) / c) | 0;
      const y0 = ((y - radius) / c) | 0, y1 = ((y + radius) / c) | 0;
      for (let gy = y0; gy <= y1; gy++) {
        for (let gx = x0; gx <= x1; gx++) {
          const b = this.buckets.get(gy * 4096 + gx);
          if (!b) continue;
          for (let i = 0; i < b.length; i++) fn(b[i]);
        }
      }
    }
  };

  /* --------------------------------------------------------------- helpers */
  /** Substitutes {field}, {field%}, {field*%} and {field~%} in a description,
   *  exactly like the addon's tooltip templating:
   *    {v}    -> raw value            {v%}   -> value x100
   *    {v*%}  -> (value-1) x100       {v~%}  -> (1-value) x100 */
  WS.template = function (text, source) {
    if (!text) return '';
    return text.replace(/\{(\w+)([%*~]*)\}/g, (all, key, op) => {
      const v = source[key];
      if (v === undefined) return all;
      if (op === '%') return String(WS.round(v * 100));
      if (op === '*%') return String(WS.round((v - 1) * 100));
      if (op === '~%') return String(WS.round((1 - v) * 100));
      return String(WS.round(v * 100) / 100);
    });
  };

  WS.CONST = {
    TICK_RATE: 1 / 60,          // the browser build simulates at 60 Hz
    MAX_TICKS_PER_FRAME: 5,
    PLAYER_DAMAGE_SCALE: 0.91,
    PLAYER_SPEED_SCALE: 0.91,
    PLAYER_COOLDOWN_SCALE: 1.099,
    ENEMY_SCALE: 1.08,

   * to overwrite the keyboard to steer and then had nothing to hand back to on
   * release - the old touch code papered over that by calling releaseAll(),

    if (t) {
      this.keys.left = t.x < -0.3; this.keys.right = t.x > 0.3;
      this.keys.up = t.y < -0.3; this.keys.down = t.y > 0.3;
      return;
    }
    /* No stick: the keyboard is in charge again. Resolving from `held` every
       tick is what lets a stick be released without stranding its last
       direction, and without touching keys the player is still holding. */
    this.keys.up = this.held.up; this.keys.down = this.held.down;
    this.keys.left = this.held.left; this.keys.right = this.held.right;
    if (this.gamepadIndex === null || !navigator.getGamepads) return;
    const pad = navigator.getGamepads()[this.gamepadIndex];
    if (!pad) return;
    const dead = 0.28;
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    if (WS.abs(ax) > dead || WS.abs(ay) > dead) {
      this.keys.left = ax < -dead; this.keys.right = ax > dead;
      this.keys.up = ay < -dead; this.keys.down = ay > dead;
    }
    // D-pad, for pads that report it as buttons 12-15.
    if (pad.buttons.length > 15) {
      if (pad.buttons[12].pressed) this.keys.up = true;
      if (pad.buttons[13].pressed) this.keys.down = true;
      if (pad.buttons[14].pressed) this.keys.left = true;
      if (pad.buttons[15].pressed) this.keys.right = true;
    }
  };

  WS.Input = Input;

})(window.WS);

/* The tuning layer.
 *
 * Every number, name and description in the game lives in the data files
 * beside this one, and those files are the SHIPPED values - they are never
 * edited by the tuning bench and never contain a player's local changes. What
 * the bench writes instead is src/data/tuning.js: a flat list of overrides,
 * keyed by a dotted path, applied over the top on load.
 *
 * Keeping the two apart is what makes the whole thing safe to use. Shipped
 * defaults survive every tuning pass, so "reset to shipped" is real rather
 * than a promise; a git diff of a tuning session is one small file rather than
 * a hundred scattered edits; and the changelog is free, because a change is
 * exactly the difference between the value at a path and the value shipped at
 * that path.
 *
 *   'Weapons.cinderfall.damage': 22
 *   'Enemies.wolf.name': 'Dire Longtooth'
 *   'Maps.thornhollow.phases.2.interval': 0.8
 *

 * anything else - a tuning file is data, and data that can reach __proto__ is
 * not data any more.

  /* Every root a tuning path may start from. The last two are not data files

   * and the pool ceilings, and Arena.tuning is the entire Eclipse Arena fight.
   * Both were reachable from nowhere until the bench went looking for what it
   * could not edit. A root is written as a path so a table can live inside a
   * system rather than only at the top level. */
  const ROOTS = ['Config', 'CONST', 'Characters', 'Weapons', 'Unions', 'Enemies',
    'Elites', 'Bosses', 'Maps', 'Upgrades', 'MetaUpgrades', 'Blessings',
    'Combos', 'Achievements', 'Lore', 'Arena.tuning'];
  /* A Set, not an object literal. `{ __proto__: 1 }` does not create a key
   * called __proto__ - it sets the object's prototype - so the literal form of
   * this list silently failed to contain the one name it exists to catch, and
   * 'Weapons.__proto__.anything' walked straight through to Object.prototype.
   * The bench's own check found it. */
  const FORBIDDEN = new Set(['__proto__', 'constructor', 'prototype']);

  const T = WS.Tuning = WS.Tuning || {};
  T.overrides = T.overrides || {};

  /** Walks a dotted path to its owning container. Returns null for anything
   *  that is not a real, reachable, permitted location. */
  function locate(path) {
    if (typeof path !== 'string' || !path) return null;
    // The longest matching root wins, so 'Arena.tuning' is one root rather
    // than a walk into WS.Arena that any path could have taken.
    let root = null;
    for (const r of ROOTS) {
      if ((path === r || path.startsWith(r + '.')) && (!root || r.length > root.length)) root = r;
    }
    if (!root) return null;
    const parts = [root].concat(path.slice(root.length + 1).split('.'));
    if (parts.length < 2 || parts[1] === '') return null;
    let node = root.split('.').reduce((o, k) => (o == null ? o : o[k]), WS);
    for (let i = 1; i < parts.length - 1; i++) {
      const k = parts[i];
      if (FORBIDDEN.has(k)) return null;
      if (node === null || typeof node !== 'object') return null;
      node = node[k];
    }
    const key = parts[parts.length - 1];
    if (FORBIDDEN.has(key)) return null;
    if (node === null || typeof node !== 'object') return null;

   * which some other script could read a shipped value that tuning was about
   * to change. */

 *    controlled neutral ramp - obsidian cloth, warm leather, cold steel - and
 *    the tint appears where a colour should appear: cloak, tabard, gem, eyes,
 *    the light on the weapon. Everyone is readable, everyone is still
