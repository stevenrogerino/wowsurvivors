      WS.Audio.play('potion');

    } else if (kind === 'coin') {
      WS.Game.addGold(WS.floor(pickup.value * p.goldMultiplier), pickup.x, pickup.y);
      WS.Audio.play('coin');

    } else if (kind === 'chest') {
      // Chests roll for a jackpot: one, three, or five payouts.
      const roll = WS.random();
      const rolls = roll < 0.03 ? 5 : roll < 0.15 ? 3 : 1;
      const total = WS.floor(pickup.value * p.goldMultiplier * (rolls === 1 ? 1 : rolls * 0.8));
      WS.Game.addGold(total, pickup.x, pickup.y);
      WS.Audio.play('chest');
      if (rolls > 1) {
        WS.Game.toast(rolls === 5 ? 'JACKPOT!' : 'Treasure!', `The chest pays out ${rolls}x.`);
        WS.FX.flash(pickup.x, pickup.y, 90, WS.CONST.COLORS.gold, 0.5);
      }

    } else if (kind === 'bomb') {
      Pickup.detonate(pickup.x, pickup.y);

    } else if (kind === 'stone') {
      WS.XP.vacuumAll();
      WS.FX.notice(p.x, p.y, 'Lodestone!', '#8fe0ff');
      WS.Audio.play('gem');

    } else if (kind === 'hourglass') {
      WS.Enemy.freezeAll(WS.Config.hourglassFreeze);
      WS.FX.notice(p.x, p.y, 'Time stops!', '#bfe6ff');

    } else if (kind === 'cache') {
      // A supply crate always holds something useful - never gold, never a dud.
      WS.Audio.play('chest');
      const roll = WS.randInt(1, 4);
      if (roll === 1) Pickup.detonate(pickup.x, pickup.y);
      else if (roll === 2) { WS.XP.vacuumAll(); WS.FX.notice(p.x, p.y, 'Lodestone!', '#8fe0ff'); }
      else if (roll === 3) { WS.Enemy.freezeAll(WS.Config.hourglassFreeze); WS.FX.notice(p.x, p.y, 'Time stops!', '#bfe6ff'); }
      else {
        WS.Player.heal(p, WS.floor(p.maxHealth * WS.Config.potionHealPct * 2), 'potion');
        WS.FX.notice(p.x, p.y, 'Two potions!', '#7fe89a');
        WS.Audio.play('potion');
      }

    } else if (kind === 'coffin') {
      WS.Save.stats.coffinsOpened = (WS.Save.stats.coffinsOpened || 0) + 1;
      WS.Save.save();
      WS.Game.announce('Bartholomew the Adequate rises!',
        'He files a complaint, then hands you the shield.', 3.5);
      WS.Game.addGold(WS.floor(80 * run.goldMult), p.x, p.y);
      WS.Achievements.check();
      WS.Audio.play('evolve');

    } else if (kind === 'graveblade') {
      WS.Save.stats.gravebladesClaimed = (WS.Save.stats.gravebladesClaimed || 0) + 1;
      WS.Save.save();
      WS.Game.announce('The graveblade answers.', 'Something colder takes the hilt.', 3.5,
        { kind: 'glory' });
      WS.Game.addGold(WS.floor(120 * run.goldMult), p.x, p.y);
      WS.Player.addWeapon(p, 'reaving_arc');
      WS.Achievements.check();
      WS.Audio.play('evolve');

    } else if (kind === 'twinglaive') {
      WS.Save.stats.glaivesClaimed = (WS.Save.stats.glaivesClaimed || 0) + 1;
      WS.Save.save();
      WS.Game.announce('The twin glaives find you.', 'You were never going to refuse.', 3.5,
        { kind: 'glory' });
      WS.Game.addGold(WS.floor(120 * run.goldMult), p.x, p.y);
      WS.Player.addWeapon(p, 'verdant_lance');
      WS.Achievements.check();
      WS.Audio.play('evolve');

    } else if (kind === 'merchant') {
      // The Egg Merchant sells run-only eggs; "Buy All" spends every coin.
      const cost = WS.Config.eggVendorCost;
      const affordable = WS.floor(run.gold / cost);
      if (affordable <= 0) {
        WS.Game.toast('Egg Merchant', `You cannot afford an egg (${cost}g each).`);
        return false;   // leave the merchant standing
      }
      run.gold -= affordable * cost;
      WS.Player.grantRunEggs(p, affordable);
      WS.Game.toast('Egg Merchant', `Bought ${affordable} curious egg${affordable === 1 ? '' : 's'}.`);
      WS.Audio.play('chest');
    }
    return true;
  }

  Pickup.update = function (dt) {
    const player = WS.Game.player;
    let i = 0;
    while (i < this.pool.count) {
      const pickup = this.pool.active[i];
      pickup.bob += dt * 3;
      pickup.life += dt;
      const [dx, dy, distance] = WS.normalize(player.x - pickup.x, player.y - pickup.y);

      if (!pickup.type.noMagnet && distance < player.pickupRadius) {
        const pull = WS.max(150, 380 * (1 - distance / player.pickupRadius));
        pickup.x += dx * pull * dt;
        pickup.y += dy * pull * dt;
      }

      if (pickup.snooze > 0) pickup.snooze -= dt;
      if (pickup.snooze <= 0 && distance < player.radius + pickup.radius + 4) {
        const consumed = collect(player, pickup);
        if (consumed) {
          this.pool.releaseAt(i);
          if (!WS.Game.running) return;
          continue;
        }
        // Not consumed (the merchant, with no coin to spend): wait a few
        // seconds before offering again instead of toasting every frame.
        pickup.snooze = 4;
      }
      i++;
    }
  };

  WS.Pickup = Pickup;

})(window.WS);

/* ===== src/game/hazard.js ===== */
/* Ground that will hurt you.
 *
 * The horde used to be one verb - walk at the survivor - and the only thing
 * on the field that mattered was where the bodies were. Hazards are the other
 * half: ground the player has to read and route around, left behind by things
 * that die badly or leak as they walk.
 *
 * Every hazard has two lives. It FUSES first, drawn as a ring nobody has been
 * hurt by yet, because a hazard that hurts you on the frame it appears is not
 * a mechanic, it is a tax. Then it is ARMED for a while, and ticks damage into
 * whoever is standing in it. Nothing here reaches the player except through
 * Player.takeDamage, so armour, dodge, blocks and Thorns all behave exactly as
 * they do against a claw.
 */
'use strict';
(function (WS) {

  const Hazard = WS.Hazard = { pool: null };

  Hazard.init = function () {
    this.pool = new WS.Pool(() => ({}), null, WS.CONST.MAX_HAZARDS);
  };

  Hazard.clear = function () { if (this.pool) this.pool.releaseAll(); };

  /** @param spec {radius, fuse, life, damage, interval, tint, name} */
  Hazard.spawn = function (x, y, spec) {
    if (!this.pool || this.pool.count >= WS.CONST.MAX_HAZARDS) return null;
    const h = this.pool.acquire();
    if (!h) return null;
    h.x = x; h.y = y;
    h.radius = spec.radius;
    h.fuse = spec.fuse || 0;
    h.maxFuse = h.fuse;
    h.life = spec.life;
    h.maxLife = spec.life;
    h.damage = spec.damage;
    h.interval = spec.interval || 0.5;
    h.timer = 0;                       // hits the moment it arms, then on interval
    h.tint = spec.tint || [1.0, 0.45, 0.30];
    h.name = spec.name || 'the ground';
    h.seed = WS.random() * WS.TAU;     // so a field of them does not pulse in lockstep
    return h;
  };

  Hazard.update = function (dt) {
    const player = WS.Game.player;
    let i = 0;
    while (i < this.pool.count) {
      const h = this.pool.active[i];
      if (h.fuse > 0) {
        h.fuse -= dt;
        if (h.fuse <= 0) {
          h.fuse = 0;
          WS.FX.flash(h.x, h.y, h.radius, WS.hex(h.tint), 0.35);
          WS.Audio.play('enemyHit', h.x);
        }
        i++;
        continue;
      }
      h.life -= dt;
      h.timer -= dt;
      if (h.timer <= 0 && player) {
        const dx = player.x - h.x, dy = player.y - h.y;
        if (dx * dx + dy * dy < (h.radius + player.radius) * (h.radius + player.radius)) {
          h.timer = h.interval;
          WS.Player.takeDamage(player, h.damage, h.name);
          if (!WS.Game.running) return;
        }
      }
      if (h.life <= 0) this.pool.releaseAt(i);
      else i++;
    }
  };

})(window.WS);

/* ===== src/game/familiar.js ===== */
/* Familiars: summons that HUNT. Each picks the nearest enemy, bounds it down,
 * bites, then peels off and retargets. Spirit wolves are fast and light;
 * ghouls are slower to close and slower to swing, but hit far harder with a
 * wider sweep. Granted in-run by Spirit Companion / Grave Call. */
'use strict';
(function (WS) {

  const MAX = 6;   // shared cap across every summon kind

  const Familiar = {
    list: [],
    tuning: {
      dashSpeed: 340,
      biteRadius: 46,
      biteCooldown: 0.55,
      dmgBase: 14,
      dmgPerLevel: 1.0,
      huntRange: 560,
      leash: 440,
      wanderSpeed: 150,
      ghoulSpeedMult: 0.70,
      ghoulRadiusMult: 1.35,
      ghoulCdMult: 1.45,
      ghoulDmgMult: 2.10,
    },
    KINDS: {
      wolf: { art: 'spiritwolf', tint: [0.60, 0.85, 1.00], source: 'wolves' },
      ghoul: {
        art: 'risen', tint: [0.55, 0.90, 0.40], source: 'ghouls',
        speedMult: 'ghoulSpeedMult', radiusMult: 'ghoulRadiusMult',
        cdMult: 'ghoulCdMult', dmgMult: 'ghoulDmgMult',
      },
    },
  };

  Familiar.init = function () { this.list = []; };
  Familiar.reset = function () { this.list.length = 0; };

  Familiar.add = function (kind) {
    if (this.list.length >= MAX) return;
    const player = WS.Game.player;
    const spec = this.KINDS[kind] || this.KINDS.wolf;
    this.list.push({
      kind, spec,
      x: player.x + WS.randRange(-50, 50),
      y: player.y + WS.randRange(-50, 50),
      target: null,
      biteTimer: 0,
      pounce: 0,
      bob: WS.random() * WS.TAU,
      facing: 1,
    });
    WS.FX.flash(player.x, player.y, 60, spec.tint, 0.4);
  };

  Familiar.update = function (dt) {
    const player = WS.Game.player;
    const t = this.tuning;

    for (const fam of this.list) {
      const spec = fam.spec;
      const speedMult = spec.speedMult ? t[spec.speedMult] : 1;
      const radiusMult = spec.radiusMult ? t[spec.radiusMult] : 1;
      const cdMult = spec.cdMult ? t[spec.cdMult] : 1;
      const dmgMult = spec.dmgMult ? t[spec.dmgMult] : 1;

      // Retarget when the mark dies or strays out of the hunt.
      if (!fam.target || fam.target._dead
        || WS.dist(fam.x, fam.y, fam.target.x, fam.target.y) > t.huntRange) {
        fam.target = WS.Enemy.findNearest(fam.x, fam.y, t.huntRange);
      }

      // Leash: past this the summon breaks off and comes home.
      const homeDist = WS.dist(fam.x, fam.y, player.x, player.y);
      let tx, ty, speed;
      if (homeDist > t.leash) {
        [tx, ty] = WS.normalize(player.x - fam.x, player.y - fam.y);
        speed = t.dashSpeed * speedMult;
        fam.target = null;
      } else if (fam.target) {
        [tx, ty] = WS.normalize(fam.target.x - fam.x, fam.target.y - fam.y);
        speed = t.dashSpeed * speedMult * (1 + player.summonHaste * 0.25);
      } else {
        // Nothing to hunt: lope around the survivor.
        const a = fam.bob;
        const ox = player.x + WS.cos(a) * 70, oy = player.y + WS.sin(a) * 70;
        [tx, ty] = WS.normalize(ox - fam.x, oy - fam.y);
        speed = t.wanderSpeed;
      }
      fam.x += tx * speed * dt;
      fam.y += ty * speed * dt;
      if (tx !== 0) fam.facing = tx < 0 ? -1 : 1;
      fam.bob += dt * 3;
      if (fam.pounce > 0) fam.pounce -= dt;

      fam.biteTimer -= dt * (1 + player.summonHaste);
      if (fam.biteTimer <= 0 && fam.target) {
        const reach = t.biteRadius * radiusMult * 0.6 + fam.target.radius;
        if (WS.dist2(fam.x, fam.y, fam.target.x, fam.target.y) <= reach * reach) {
          fam.biteTimer = t.biteCooldown * cdMult;
          fam.pounce = 0.18;
          const damage = (t.dmgBase + t.dmgPerLevel * player.level)
            * dmgMult
            * player.damageMultiplier
            * (1 + player.summonDamage)
            * WS.CONST.PLAYER_DAMAGE_SCALE;
          WS.Enemy.damageArea(fam.x, fam.y, t.biteRadius * radiusMult * player.areaMultiplier,
            damage, null, null, spec.source);
          WS.FX.flash(fam.x, fam.y, t.biteRadius * radiusMult * 0.8, spec.tint, 0.2);
        }
      }
    }
  };

  WS.Familiar = Familiar;

})(window.WS);

/* ===== src/game/combos.js ===== */
/* Discoveries: the moment a survivor carries both weapons of a pair, the combo
 * activates for the run, toasts, and is written into the permanent codex. */
'use strict';
(function (WS) {

  const ComboSystem = {};

  ComboSystem.check = function (p) {
    for (const id of WS.ComboOrder) {
      if (p.combosActive[id]) continue;
      const combo = WS.Combos[id];
      const w1 = WS.Player.getWeapon(p, combo.weapons[0]);
      const w2 = WS.Player.getWeapon(p, combo.weapons[1]);
      if (!w1 || !w2) continue;

      p.combosActive[id] = true;
      combo.apply(w1, w2, combo);
      const fresh = WS.Save.discoverCombo(id);
      WS.Game.toast(
        (fresh ? 'Discovery: ' : 'Synergy: ') + combo.name,
        WS.template(combo.description, combo));
      WS.Audio.play('evolve');
    }
  };

  WS.ComboSystem = ComboSystem;

})(window.WS);

/* ===== src/game/achievements.js ===== */
/* Achievement checking. Tests read persisted statistics, so an achievement can
 * complete mid-run or at the moment the run's totals are banked. */
'use strict';
(function (WS) {

  const Achievements = {};

  Achievements.check = function () {
    const db = WS.Save.db;
    let earned = null;
    for (const id of WS.AchievementOrder) {
      if (db.achievements[id]) continue;
      const a = WS.Achievements[id];
      let passed = false;
      try { passed = a.test(db); } catch (e) { passed = false; }
      if (!passed) continue;

      db.achievements[id] = true;
      earned = a;
      if (a.reward) {
        if (a.reward.type === 'gold') WS.Save.addGold(a.reward.amount);
        else if (a.reward.type === 'character') db.unlocks.characters[a.reward.id] = true;
        else if (a.reward.type === 'map') db.unlocks.maps[a.reward.id] = true;
      }
      WS.Game.toast('Achievement: ' + a.name, Achievements.rewardText(a));
      WS.Audio.play('level');
    }
    if (earned) WS.Save.save();
    return earned;
  };

  Achievements.rewardText = function (a) {
    if (!a.reward) return a.description;
    if (a.reward.type === 'gold') return `+${a.reward.amount} gold banked.`;
    if (a.reward.type === 'character') return `${WS.Characters[a.reward.id].name} is now playable.`;
    if (a.reward.type === 'map') return `${WS.Maps[a.reward.id].name} is now open.`;
    return a.description;
  };

  WS.AchievementSystem = Achievements;
  // The data table is WS.Achievements; the system hangs off it for convenience
  // so ported call sites (`WS.Achievements.check()`) still read naturally.
  WS.Achievements.check = Achievements.check;
  WS.Achievements.rewardText = Achievements.rewardText;

})(window.WS);

/* ===== src/game/waves.js ===== */
/* Drives each battlefield's data timeline: ambient spawn phases, scripted swarm
 * events, timed boss arrivals, supply caches, the egg merchant, and the three
 * one-shot story objects (coffin / graveblade / twin glaives). Difficulty scaling
 * is a function of elapsed time times the map's difficulty knob. */
'use strict';
(function (WS) {

  const Wave = {};

  Wave.reset = function (map) {
    this.map = map;
    this.phaseIndex = 0;
    this.eventIndex = 0;
    this.bossIndex = 0;
    this.spawnTimer = 0.75;
    this.endlessBossTimer = 120;
    this.endlessEventTimer = 100;
    this.endlessBosses = 0;
    this.deathWarned = false;
    this.deathTimer = 0;
    this.cacheTimer = 60;
    this.merchantTimer = 150;
    this.coffinDone = false;
    this.coffinTimer = 120;
    this.gravebladeDone = false;
    this.glaiveDone = false;
  };

  /** Health/damage/xp inflation for ambient spawns. */
  Wave.enemyScale = function (time) {
    const run = WS.Game.run;
    const hyper = run.hyper ? WS.Config.hyperScale : 1;
    let s = (1 + time / WS.Config.enemyScaleTime) * this.map.difficulty * run.diffScale * hyper;
    if (run.victorious || run.mode === 'endless') {
      s *= 1 + WS.max(0, time - 1620) / WS.Config.endlessEnemyRampTime;
    }
    return s;
  };

  /** Bosses have large bases already, so their curve is gentler. */
  Wave.bossScale = function (time) {
    const run = WS.Game.run;
    const hyper = run.hyper ? WS.Config.hyperScale : 1;
    return (1 + time / WS.Config.bossScaleTime) * this.map.difficulty * run.diffScale * hyper;
  };

  /** Endless respawns draw from the tougher half of the map's roster, so a
   *  returning boss is never a step down from the last scheduled one. */
  Wave.endlessBossPool = function () {
    const bosses = this.map.bosses;
    const pool = bosses.slice(WS.floor(bosses.length / 2));
    return pool.length ? pool : [bosses[bosses.length - 1]];
  };

  Wave.spawnBoss = function (id, scale, final) {
    const player = WS.Game.player;
    const a = WS.random() * WS.TAU;
    const boss = WS.Enemy.spawn(id,
      WS.clamp(player.x + WS.cos(a) * 520, 60, WS.CONST.WORLD_WIDTH - 60),
      WS.clamp(player.y + WS.sin(a) * 520, 60, WS.CONST.WORLD_HEIGHT - 60),
      scale, true);
    if (!boss) return null;
    boss.finalBoss = !!final;
    const t = boss.template;
    WS.Game.announce(t.name, t.yell, 3.4, { kind: 'dread', art: t.art, tint: t.tint });
    WS.Audio.play('boss');
    WS.FX.shake(6, 0.5);
    WS.FX.screen('rgba(180,40,120,.14)', 0.4);
    return boss;
  };

  Wave.update = function (dt, run) {
    const map = this.map;
    const time = run.time;
    const player = WS.Game.player;

    // Advance to the newest phase whose start time has passed.
    while (map.phases[this.phaseIndex + 1] && map.phases[this.phaseIndex + 1].at <= time) {
      this.phaseIndex++;
    }
    const phase = map.phases[this.phaseIndex];

    /* ---- ambient spawns -------------------------------------------------- */
    const curse = player.curse;
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0 && phase.count > 0) {
      this.spawnTimer = phase.interval * WS.Config.spawnIntervalMult
        * run.diffInterval * (run.hyper ? 0.75 : 1) / (1 + 0.20 * curse);
      const scale = this.enemyScale(time);
      const count = WS.max(1, WS.round(phase.count * WS.Config.spawnCountMult * (1 + 0.20 * curse)));
      for (let n = 0; n < count; n++) {
        const pick = WS.weightedPick(phase.roster);
        WS.Enemy.spawnRing(pick.id, 700 + WS.random() * 160, scale);
      }
      if (phase.elite && WS.random() < phase.eliteChance) {
        const elite = WS.Enemy.spawnRing(phase.elite, 740, scale);
        if (elite) WS.FX.notice(elite.x, elite.y, elite.template.name, '#ffb347');
      }
    }

    /* ---- scripted swarm events ------------------------------------------- */
    const ev = map.events[this.eventIndex];
    if (ev && time >= ev.at) {
      this.eventIndex++;
      WS.Game.announce(ev.text, null, 2.6);
      WS.Audio.play('warn');
      WS.Enemy.spawnCircle(ev.id, ev.count, 620, this.enemyScale(time));
    }

    /* ---- scheduled bosses ------------------------------------------------ */
    const nextBoss = map.bosses[this.bossIndex];
    if (nextBoss && time >= nextBoss.at) {
      this.bossIndex++;
      const isFinal = this.bossIndex >= map.bosses.length;
      this.spawnBoss(nextBoss.id, this.bossScale(time), false);
      if (isFinal) run.finalBossSeen = true;
    }

    /* ---- supply caches --------------------------------------------------- */
    this.cacheTimer -= dt;
    if (this.cacheTimer <= 0) {
      this.cacheTimer = 75 + WS.random() * 45;
      const a = WS.random() * WS.TAU;
      WS.Pickup.spawn('cache',
        WS.clamp(player.x + WS.cos(a) * 320, 60, WS.CONST.WORLD_WIDTH - 60),
        WS.clamp(player.y + WS.sin(a) * 320, 60, WS.CONST.WORLD_HEIGHT - 60));
    }

    /* ---- the egg merchant ------------------------------------------------ */
    this.merchantTimer -= dt;
    if (this.merchantTimer <= 0) {
      this.merchantTimer = WS.Config.eggVendorInterval;
      const a = WS.random() * WS.TAU;
      if (WS.Pickup.spawn('merchant',
        WS.clamp(player.x + WS.cos(a) * 400, 80, WS.CONST.WORLD_WIDTH - 80),
        WS.clamp(player.y + WS.sin(a) * 400, 80, WS.CONST.WORLD_HEIGHT - 80))) {
        WS.Game.toast('An egg merchant sets up shop', 'Walk to the crate to spend your coin.');
      }
    }

    /* ---- the coffin of Bartholomew the Adequate -------------------------- */
    if (!this.coffinDone && !WS.Save.db.unlocks.characters.paladin) {
      this.coffinTimer -= dt;
      if (this.coffinTimer <= 0) {
        const a = WS.random() * WS.TAU;
        const cx = WS.clamp(player.x + WS.cos(a) * 380, 90, WS.CONST.WORLD_WIDTH - 90);
        const cy = WS.clamp(player.y + WS.sin(a) * 380, 90, WS.CONST.WORLD_HEIGHT - 90);
        if (WS.Pickup.spawn('coffin', cx, cy)) {
          this.coffinDone = true;
          WS.Game.announce('A weathered coffin lies open to the sky...',
            'Reach it. Something stirs within.', 4.0);
          WS.Audio.play('boss');
          for (let i = 0; i < 6; i++) {
            const g = (i / 6) * WS.TAU;
            WS.Enemy.spawn('skeleton', cx + WS.cos(g) * 70, cy + WS.sin(g) * 70,
              this.enemyScale(time) * 1.5);
          }
        } else this.coffinTimer = 10;   // field full; try again shortly
      }
    }

    /* ---- the graveblade: answers curdled, not a timer ------------------ */
    if (!this.gravebladeDone && !WS.Save.db.unlocks.characters.graveblade
      && player.curdleDealt >= WS.Config.gravebladeThreshold) {
      const a = WS.random() * WS.TAU;
      const cx = WS.clamp(player.x + WS.cos(a) * 300, 90, WS.CONST.WORLD_WIDTH - 90);
      const cy = WS.clamp(player.y + WS.sin(a) * 300, 90, WS.CONST.WORLD_HEIGHT - 90);
      if (WS.Pickup.spawn('graveblade', cx, cy)) {
        this.gravebladeDone = true;
        WS.Game.announce('Enough Light has rotted.', 'A blade breaks the ground where it fell.', 4.0);
        WS.Audio.play('boss');
        for (let i = 0; i < 6; i++) {
          const g = (i / 6) * WS.TAU;
          WS.Enemy.spawn('ghoul', cx + WS.cos(g) * 74, cy + WS.sin(g) * 74, this.enemyScale(time) * 1.6);
        }
      }
    }

    /* ---- the twin glaives: answer Ruinform ---------------------------- */
    if (!this.glaiveDone && !WS.Save.db.unlocks.characters.ruinseeker
      && player.metamorphoses >= WS.Config.glaiveMetas) {
      const a = WS.random() * WS.TAU;
      const cx = WS.clamp(player.x + WS.cos(a) * 300, 90, WS.CONST.WORLD_WIDTH - 90);
      const cy = WS.clamp(player.y + WS.sin(a) * 300, 90, WS.CONST.WORLD_HEIGHT - 90);
      if (WS.Pickup.spawn('twinglaive', cx, cy)) {
        this.glaiveDone = true;
        WS.Game.announce('The ruin has taken enough of you.', 'Two glaives are waiting.', 4.0);
        WS.Audio.play('boss');
      }
    }

    /* ---- Death itself, and the endless escalation ------------------------ */
    const deathTime = WS.Config.deathTime;
    if (!this.deathWarned && time >= deathTime - 15) {
      this.deathWarned = true;
      WS.Game.announce('Something is coming.', 'Fifteen seconds.', 4.0);
      WS.Audio.play('warn');
    }
    if (time >= deathTime) {
      this.deathTimer -= dt;
      if (this.deathTimer <= 0) {
        this.deathTimer = WS.Config.deathInterval;
        this.spawnBoss('death_itself', 1, false);
      }
    }

    if (run.victorious || run.mode === 'endless') {
      this.endlessBossTimer -= dt;
      if (this.endlessBossTimer <= 0) {
        const cfg = WS.Config;
        this.endlessBosses++;
        // The cadence tightens toward a floor as overtime drags on.
        this.endlessBossTimer = WS.max(cfg.endlessBossMinInterval,
          cfg.endlessBossInterval - this.endlessBosses * cfg.endlessBossInterval / cfg.endlessBossAccel);
        const pool = this.endlessBossPool();
        const pick = pool[WS.randInt(0, pool.length - 1)];
        const over = WS.max(0, time - 1620);
        this.spawnBoss(pick.id,
          this.bossScale(time) * cfg.endlessBossMult * (1 + over / cfg.endlessRampTime), false);
      }
      this.endlessEventTimer -= dt;
      if (this.endlessEventTimer <= 0) {
        this.endlessEventTimer = WS.Config.endlessEventInterval;
        const phaseNow = map.phases[map.phases.length - 1];
        const pick = WS.weightedPick(phaseNow.roster);
        WS.Game.announce('The horde does not stop.', null, 2.0);
        WS.Enemy.spawnCircle(pick.id, 22, 640, this.enemyScale(time));
      }
    }
  };

  WS.WaveManager = Wave;

})(window.WS);

/* ===== src/game/levelup.js ===== */
/* Level-up boon generation and application: weapon ranks, new weapons,
 * evolutions, unions, passives, the Breaking Point, and the deep-run bread
 * fallback. `type` doubles as the card's quality key in the UI. */
'use strict';
(function (WS) {

  const LevelUp = {};

  const BREADS = [
    {
      type: 'bread', id: 'crust', art: 'leaf', name: 'Crust of Bread',
      description: 'A quick bite. Restores 30 health.', heal: 30, gold: 10,
      note: 'Better than nothing',
    },
    {
      type: 'bread', id: 'loaf', art: 'leaf', name: 'Hearty Loaf',
      description: "A hero's supper. Restores 70 health and a little gold.", heal: 70, gold: 25,
      note: "The innkeeper's finest",
    },
    {
      type: 'bread', id: 'feast', art: 'heart', name: "Traveler's Feast",
      description: 'A full spread. Restores 130 health.', heal: 130, gold: 20,
      note: 'Fit for a champion',
    },
    {
      type: 'bread', id: 'bakers_dozen', art: 'coin', name: "Baker's Dozen",
      description: 'Modest food, a fat coin purse. Restores 40 health, +75 gold.', heal: 40, gold: 75,
      note: 'Mostly for the gold',
    },
  ];

  LevelUp.buildChoices = function (p) {
    const candidates = [];

    // Owned weapons: a rank-up, or the evolution once rank 8 is reached and
    // the paired passive has been learned.
    for (const w of p.weapons) {
      const d = w.data;
      if (p.banished[w.id]) continue;
      if (w.level < WS.WEAPON_MAX_LEVEL) {
        candidates.push({
          type: 'weapon_rank', id: w.id, art: d.art, school: d.school, weight: 3,
          name: d.name, description: d.description,
          note: `Rank ${w.level}  >  ${w.level + 1}`,
        });
      } else if (!w.evolved && d.evolvePairing && (p.upgradeLevels[d.evolvePairing] || 0) > 0) {
        candidates.push({
          type: 'evolve', id: w.id, art: d.art, school: d.school, weight: 6,
          name: d.evolveName, description: d.evolveDescription,
          note: 'EVOLUTION - ' + d.name + ' transformed',
        });
      }
    }

    // Unions: both sources fully evolved merge into one super-weapon, freeing
    // a slot. A forged union is recorded so it can never be offered again.
    for (const recipe of WS.Unions) {
      const [a, b] = recipe.from;
      const wa = WS.Player.getWeapon(p, a);
      const wb = WS.Player.getWeapon(p, b);
      if (!p.unionsForged[recipe.result] && !p.weaponLevels[recipe.result]
        && wa && wa.evolved && wb && wb.evolved) {
        const d = WS.Weapons[recipe.result];
        candidates.push({
          type: 'union', id: recipe.result, art: d.art, school: d.school, weight: 10,
          unionFrom: recipe.from, name: d.name, description: d.description,
          note: `UNION - merges evolved ${WS.Weapons[a].name} + ${WS.Weapons[b].name}`,
        });
      }
    }

    // New weapons, while there are free slots.
    if (p.weapons.length < WS.MAX_WEAPONS) {
      for (const id of WS.WeaponOrder) {
        if (p.weaponLevels[id] || p.banished[id]) continue;
        const d = WS.Weapons[id];
        candidates.push({
          type: 'new_weapon', id, art: d.art, school: d.school, weight: 2,
          name: d.name, description: d.description,
          note: 'New Weapon  -  pairs with ' + WS.Upgrades[d.evolvePairing].name,
        });
      }
    }

    // Passive boons.
    for (const id of WS.UpgradeOrder) {
      const up = WS.Upgrades[id];
      const rank = p.upgradeLevels[id] || 0;
      const offerable = !up.offer || up.offer(p);
      if (rank < up.max && !p.banished[id] && offerable) {
        candidates.push({
          type: 'stat', id, art: up.art, quality: up.quality, weight: 2,
          name: up.name, description: up.description, detail: up.detail,
          note: `Rank ${rank + 1} / ${up.max}`,
        });
      }
    }

    // Fill all three slots from the real pool FIRST: a live build never loses
    // a choice to Breaking Point while genuine upgrades remain.
    const choices = [];
    for (let i = 0; i < 3; i++) {
      const pick = WS.takeWeighted(candidates);
      if (pick) choices.push(pick);
    }

    // Only once the pool cannot fill three slots does Breaking Point appear.
    if (choices.length < 3) {
      const pct = WS.round(WS.Config.limitBreakDamage * 100);
      choices.push({
        type: 'breaking_point', id: 'breaking_point', art: 'fist', quality: 'legendary',
        name: 'Breaking Point',
        description: `Break past your limits: +${pct}% weapon damage, forever.`,
        note: `Breaking Points: ${p.limitBreaks}`,
      });
    }

    // Any still-empty slots get distinct breads.
    const pool = BREADS.slice();
    while (choices.length < 3 && pool.length) {
      choices.push(pool.splice(WS.randInt(0, pool.length - 1), 1)[0]);
    }
    return choices;
  };

  /** Three random blessings, never re-offering one already taken. */
  LevelUp.buildBlessingChoices = function (p) {
    const ids = WS.BlessingOrder.filter((id) => !p.blessingsTaken || !p.blessingsTaken[id]);
    const choices = [];
    for (let i = 0; i < WS.min(3, ids.length); i++) {
      const id = ids.splice(WS.randInt(0, ids.length - 1), 1)[0];
      const b = WS.Blessings[id];
      choices.push({
        type: 'blessing', id, art: b.art, quality: b.quality || 'legendary',
        name: b.name,
        description: WS.template(b.description, b),
        note: 'Blessing - permanent for this run',
      });
    }
    return choices;
  };

  LevelUp.apply = function (p, choice) {
    if (choice.type === 'blessing') {
      const b = WS.Blessings[choice.id];
      b.apply(p, b);
      p.blessingNames.push(b.name);
      p.blessingsTaken = p.blessingsTaken || {};
      p.blessingsTaken[choice.id] = true;
      WS.Audio.play('evolve');
      WS.Game.announce(b.name, 'The blessing takes hold.', 2.5, { kind: 'glory' });
      return;
    }

    if (choice.type === 'union') {
      for (const id of choice.unionFrom) WS.Player.removeWeapon(p, id);
      const w = WS.Player.addWeapon(p, choice.id);
      if (w) { w.level = WS.WEAPON_MAX_LEVEL; p.weaponLevels[choice.id] = WS.WEAPON_MAX_LEVEL; }
      p.unionsForged[choice.id] = true;
      WS.Save.stats.unions++;
      WS.Audio.play('evolve');
      WS.FX.shake(6, 0.5);
      WS.Game.announce(choice.name + '!', 'Two weapons become one.', 3.0, { kind: 'glory' });

    } else if (choice.type === 'new_weapon') {
      WS.Player.addWeapon(p, choice.id);
      WS.Audio.play('chest');

    } else if (choice.type === 'weapon_rank') {
      WS.Player.levelWeapon(p, choice.id);
      WS.Audio.play('select');

    } else if (choice.type === 'evolve') {
      const w = WS.Player.getWeapon(p, choice.id);
      if (w && !w.evolved) {
        w.evolved = true;
        WS.Save.stats.evolutions++;
        WS.Audio.play('evolve');
        WS.FX.shake(5, 0.4);
        WS.Game.announce(w.data.evolveName + '!', 'Your weapon has grown into something else.', 3.0,
          { kind: 'glory' });
      }

    } else if (choice.type === 'stat') {
      const up = WS.Upgrades[choice.id];
      up.apply(p, up);
      p.upgradeLevels[choice.id] = (p.upgradeLevels[choice.id] || 0) + 1;
      WS.Audio.play('select');

    } else if (choice.type === 'bread') {
      WS.Player.heal(p, choice.heal || 60, 'food');
      if (choice.gold > 0) WS.Game.addGold(WS.floor(choice.gold * WS.Game.run.goldMult), p.x, p.y);
      WS.Audio.play('potion');

    } else if (choice.type === 'breaking_point') {
      p.damageMultiplier += WS.Config.limitBreakDamage;
      p.limitBreaks++;
      WS.Audio.play('evolve');
      WS.FX.notice(p.x, p.y, 'BREAKING POINT!', '#ff8a3c');
    }
    WS.Achievements.check();
  };

  /** Removes a boon (and its future offers) from this run's pool. */
  LevelUp.banish = function (p, choice) {
    if (choice.type === 'bread' || choice.type === 'blessing'
      || choice.type === 'breaking_point' || choice.type === 'union') return false;
    p.banished[choice.id] = true;
    return true;
  };

  WS.LevelUp = LevelUp;

})(window.WS);

/* ===== src/game/arena.js ===== */
/* The Eclipse Arena: a scripted duel with Aethelgard, driven by telegraphed
 * ground hazards rather than the ordinary boss pattern loop.
 *
 *   Solar Flare   - expanding rings with openings you must find and stand in
 *   Sunfall Spears- a grid of squares; only a few are safe when they fall
 *   Eclipse Cross - a spinning four-arm cutter, telegraphed before it bites
 *   Umbral Chains - anchors that drag you inward until you break them
 *
 * Phase 2 at 60% health overlaps two tracks at once; Phase 3 at 20% turns the
 * lights out and starts a hard enrage. */
'use strict';
(function (WS) {

  const Arena = {
    active: false,
    hazards: [],
    anchors: [],
    boss: null,
    phase: 1,
    trackA: 0,
    trackB: 0,
    enrage: 0,
    pullTimer: 0,
    darkness: 0,
  };

  Arena.tuning = {
    phase2HP: 60, phase3HP: 20, enrageTime: 45,
    ringDamage: 26, ringSpeed: 165, ringGapP1: 40, ringGapP2: 26, ringGapsP2: 7,
    ringSpinP2: 0.5, ringDelay: 1.4,
    spearDamage: 30, gridSafeP1: 4, gridSafeP2: 5, spearTele: 1.6, spearInterval: 8.5,
    cutterDamage: 32, cutterSpin: 0.7, cutterTele: 1.2, cutterInterval: 9.0,
    chainInterval: 11.0, chainBreak: 50,
  };

  const BOUNDS = { minX: 260, maxX: 1020, minY: 90, maxY: 630 };
  const CX = (BOUNDS.minX + BOUNDS.maxX) / 2;
  const CY = (BOUNDS.minY + BOUNDS.maxY) / 2;

  Arena.bounds = BOUNDS;

  Arena.begin = function () {
    this.active = true;
    this.hazards.length = 0;
    this.anchors.length = 0;
    this.phase = 1;
    this.trackA = 6;
    this.trackB = 14;
    this.enrage = 0;
    this.pullTimer = 0;
    this.darkness = 0;
    WS.Game.arenaBounds = BOUNDS;

    this.boss = WS.Enemy.spawn('aethelgard', CX, CY - 120, 1, true);
    if (this.boss) {
      WS.Game.announce(this.boss.template.name, this.boss.template.yell, 4.0,
        { kind: 'dread', art: this.boss.template.art, tint: this.boss.template.tint });
      WS.Audio.play('boss');
    }
  };

  Arena.stop = function () {
    this.active = false;
    this.hazards.length = 0;
    this.anchors.length = 0;
    this.boss = null;
    WS.Game.arenaBounds = null;
  };

  /* ------------------------------------------------------------ hazards -- */
  /** True when `angle` sits inside one of a ring's evenly-spaced openings. */
  function inGap(h, angle) {
    const half = (h.gapWidth * WS.PI / 180) * 0.5;
    for (let i = 0; i < h.gapCount; i++) {
      const centre = h.gapBase + h.gapRot + (i / h.gapCount) * WS.TAU;
      let d = ((angle - centre + WS.PI * 3) % WS.TAU) - WS.PI;
      if (WS.abs(d) <= half) return true;
    }
    return false;
  }

  Arena.ring = function (gapBase, gapWidth, damage, speed, gapCount, spin, delay) {
    this.hazards.push({
      shape: 'ring', cx: CX, cy: CY, r: 26, speed, thick: 30,
      gapBase, gapWidth, gapCount: gapCount || 1, gapRot: 0, spin: spin || 0,
      damage, delay: delay || 0, life: 9, hit: false,
    });
  };

  Arena.spears = function (safeCount) {
    const cols = 5, rows = 4;
    const w = (BOUNDS.maxX - BOUNDS.minX) / cols;
    const h = (BOUNDS.maxY - BOUNDS.minY) / rows;
    const cells = [];
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) cells.push({ cx, cy });
    }
    WS.shuffle(cells);
    const safe = new Set(cells.slice(0, safeCount).map((c) => c.cy * cols + c.cx));
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const isSafe = safe.has(cy * cols + cx);
        this.hazards.push({
          shape: 'square', safe: isSafe,
          x: BOUNDS.minX + cx * w, y: BOUNDS.minY + cy * h, w, h,
          telegraph: this.tuning.spearTele,
          damage: isSafe ? 0 : this.tuning.spearDamage,
          life: this.tuning.spearTele + 0.7, hit: false,
        });
      }
    }
    WS.Game.toast('Sunfall Spears', 'Find the ground that is not marked.');
  };

  Arena.cutter = function () {
    this.hazards.push({
      shape: 'cutter', cx: CX, cy: CY,
      ang: WS.random() * WS.PI * 0.5, spin: this.tuning.cutterSpin,
      half: 0.12, len: 900, damage: this.tuning.cutterDamage,
      telegraph: this.tuning.cutterTele, life: this.tuning.cutterTele + 7, hitTimer: 0,
    });
    WS.Game.toast('Eclipse Cross', 'Stay inside a turning quadrant.');
  };

  Arena.chains = function () {
    // Six anchors ring the arena, dragging the survivor inward until broken.
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * WS.TAU + WS.random() * 0.3;
      this.anchors.push({
        x: CX + WS.cos(a) * 300,
        y: CY + WS.sin(a) * 190,
        health: this.tuning.chainBreak,
        pulse: WS.random() * WS.TAU,
      });
    }
    this.pullTimer = 0;
    WS.Game.toast('Umbral Chains', 'Run through the anchors to break them.');
    WS.Audio.play('warn');
  };

  /* ------------------------------------------------------------- update -- */
  Arena.update = function (dt) {
    if (!this.active) return;
    const player = WS.Game.player;
    const boss = this.boss;

    if (boss && !boss._dead) {
      const pct = (boss.health / boss.maxHealth) * 100;
      if (this.phase === 1 && pct <= this.tuning.phase2HP) {
        this.phase = 2;
        WS.Game.announce('Umbral Divide', 'The eclipse splits the sky.', 3.0);
        WS.Audio.play('boss');
        this.trackB = 2;
      } else if (this.phase === 2 && pct <= this.tuning.phase3HP) {
        this.phase = 3;
        this.enrage = this.tuning.enrageTime;
        WS.Game.announce('Total Darkness', 'It is ending this, one way or another.', 3.0);
        WS.Audio.play('boss');
      }
      // Aethelgard hovers, drifting a little so it never feels like scenery.
      boss.x = CX + WS.cos(WS.Game.run.time * 0.4) * 90;
      boss.y = CY - 120 + WS.sin(WS.Game.run.time * 0.55) * 40;
    }

    if (this.phase === 3) {
      this.darkness = WS.min(1, this.darkness + dt * 0.5);
      this.enrage -= dt;
      if (this.enrage <= 0) {
        // Hard enrage: the arena is wiped.
        WS.Player.takeDamage(player, 99999, 'Aethelgard, the Eclipse Sovereign');
        this.enrage = 5;
      }
    }

    const speedUp = this.phase === 3 ? 0.65 : 1;

    /* ---- cast tracks ----------------------------------------------------- */
    this.trackA -= dt;
    if (this.trackA <= 0) {
      this.trackA = (this.phase >= 2 ? 7.5 : 9.5) * speedUp;
      const t = this.tuning;
      if (this.phase >= 2) {
        this.ring(WS.random() * WS.TAU, t.ringGapP2, t.ringDamage, t.ringSpeed, t.ringGapsP2, t.ringSpinP2, 0.7);
        this.ring(WS.random() * WS.TAU, t.ringGapP2, t.ringDamage, t.ringSpeed, t.ringGapsP2, t.ringSpinP2, 0.7 + t.ringDelay);
      } else {
        this.ring(WS.random() * WS.TAU, t.ringGapP1 * 2, t.ringDamage, t.ringSpeed, 1, 0, 0.6);
        this.ring(WS.random() * WS.TAU, t.ringGapP1, t.ringDamage, t.ringSpeed, 1, 0, 0.6 + t.ringDelay);
      }
      WS.Game.toast('Solar Flare', 'Stand in the opening.');
    }

    this.trackB -= dt;
    if (this.trackB <= 0) {
      if (this.phase === 1) {
        this.trackB = this.tuning.spearInterval;
        this.spears(this.tuning.gridSafeP1);
      } else {
        // Phase 2+ rotates the three heavier mechanics.
        const pickRoll = WS.randInt(0, 2);
        if (pickRoll === 0) { this.trackB = this.tuning.spearInterval * speedUp; this.spears(this.tuning.gridSafeP2); }
        else if (pickRoll === 1) { this.trackB = this.tuning.cutterInterval * speedUp; this.cutter(); }
        else { this.trackB = this.tuning.chainInterval * speedUp; this.chains(); }
      }
    }

    /* ---- hazard resolution ----------------------------------------------- */
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const h = this.hazards[i];
      h.life -= dt;
      if (h.life <= 0) { this.hazards.splice(i, 1); continue; }

      if (h.shape === 'ring') {
        if (h.delay > 0) { h.delay -= dt; continue; }
        h.r += h.speed * dt;
        h.gapRot += h.spin * dt;
        const [, , d] = WS.normalize(player.x - h.cx, player.y - h.cy);
        if (!h.hit && WS.abs(d - h.r) < h.thick * 0.5 + player.radius * 0.5) {
          const a = WS.atan2(player.y - h.cy, player.x - h.cx);
          if (!inGap(h, a)) {
            h.hit = true;
            WS.Player.takeDamage(player, h.damage, 'Solar Flare');
          }
        }
        if (h.r > 900) this.hazards.splice(i, 1);

      } else if (h.shape === 'square') {
        if (h.safe) continue;                 // marked green; nothing lands here
        if (h.telegraph > 0) {
          h.telegraph -= dt;
          if (h.telegraph <= 0) {
            // The spear lands the moment the telegraph expires.
            if (player.x >= h.x && player.x <= h.x + h.w
              && player.y >= h.y && player.y <= h.y + h.h) {
              WS.Player.takeDamage(player, h.damage, 'Sunfall Spear');
            }
            WS.FX.flash(h.x + h.w / 2, h.y + h.h / 2, h.w * 0.5, [1.0, 0.86, 0.45], 0.3);
            WS.Audio.play('hit');
          }
        }

      } else if (h.shape === 'cutter') {
        if (h.telegraph > 0) { h.telegraph -= dt; continue; }
        h.ang += h.spin * dt;
        h.hitTimer -= dt;
        if (h.hitTimer <= 0) {
          const pa = WS.atan2(player.y - h.cy, player.x - h.cx);
          for (let arm = 0; arm < 4; arm++) {
            const armAng = h.ang + arm * WS.PI * 0.5;
            let diff = ((pa - armAng + WS.PI * 3) % WS.TAU) - WS.PI;
            if (WS.abs(diff) <= h.half) {
              h.hitTimer = 0.8;
              WS.Player.takeDamage(player, h.damage, 'Eclipse Cross');
              break;
            }
          }
        }
      }
      if (!WS.Game.running) return;
    }

    /* ---- umbral chains --------------------------------------------------- */
    if (this.anchors.length) {
      this.pullTimer -= dt;
      for (let i = this.anchors.length - 1; i >= 0; i--) {
        const an = this.anchors[i];
        an.pulse += dt * 4;
        if (WS.dist2(an.x, an.y, player.x, player.y) < (player.radius + 26) ** 2) {
          an.health -= 100 * dt;
          WS.FX.flash(an.x, an.y, 34, [0.75, 0.45, 1.0], 0.2);
          if (an.health <= 0) {
            this.anchors.splice(i, 1);
            WS.FX.burst(an.x, an.y, 12, '#b34ff2', 200, 0.5, 3);
            WS.Audio.play('hit');
            if (!this.anchors.length) WS.Game.toast('Umbral Chains', 'The pull relents.');
          }
          continue;
        }
      }
      // The chains drag the survivor toward the centre while any remain.
      if (this.anchors.length) {
        const [dx, dy] = WS.normalize(CX - player.x, CY - player.y);
        const pull = 26 * this.anchors.length;
        player.x = WS.clamp(player.x + dx * pull * dt, BOUNDS.minX, BOUNDS.maxX);
        player.y = WS.clamp(player.y + dy * pull * dt, BOUNDS.minY, BOUNDS.maxY);
        if (this.pullTimer <= 0) {
          this.pullTimer = 2.5;
          WS.Enemy.spawn('shadow_weaver',
            CX + WS.randRange(-200, 200), CY + WS.randRange(-120, 120), 1, true);
        }
      }
    }
  };

  Arena.onBossDead = function () {
    // Enemy.kill already counted the kill before handing off to us.
    WS.Save.stats.bosses.aethelgard = (WS.Save.stats.bosses.aethelgard || 0) + 1;
    WS.Save.save();
    this.stop();
    WS.Game.announce('The eclipse breaks.', 'Aethelgard is undone.', 3.0, { kind: 'glory' });
    WS.Audio.play('victory');

      time: 0,
      mode: 'normal',
      kills: 0,
      gold: 0,

      deathsSlain: 0,

    WS.XP.update(dt);

/* The prologue: what the night is, and why you are standing in it.
 *
 * Drawn, not filmed. There is no video here and there could not be - the game
 * ships without a single asset file, and a cinematic that broke that would
 * cost more than it is worth. Every beat below is the same procedural
 * vocabulary the game already paints with: the survivor from render/hero.js,
 * creature silhouettes from render/sprites.js, and the gem the renderer draws
 * on the field. What the words say, the picture is doing.
 *
 * It rides the game's own frame loop rather than starting a second one, which
 * is why Renderer.draw checks for it first. That matters more than it looks:
 * the loop in main.js is the one with the fault net around it, so a thrown
 * error here costs a frame instead of leaving a new player staring at a frozen
 * title before they have played a second of the game.

 * game uses - the world is painted, the writing is typeset.

'use strict';
(function (WS) {

  const W = WS.CONST.WORLD_WIDTH, H = WS.CONST.WORLD_HEIGHT;
  const GROUND = H * 0.60;          // the horizon everything stands on
  const TEXT_TOP = H * 0.72;        // nothing is drawn below this - the words live there

  const P = { active: false, done: null, layer: null, t: 0, last: null, scene: 0 };

  /* ------------------------------------------------------------- scenery -- */
  /* Seeded once so the sky does not reshuffle itself between frames, and so

  let stars = null, trees = null, crowd = null;
  function buildScenery() {
    const seed = WS.getSeed();
    WS.setSeed(20260909);
    stars = [];
    for (let i = 0; i < 160; i++) {
      stars.push({ x: WS.random() * W, y: WS.random() * GROUND * 0.92,
        r: 0.4 + WS.random() * 1.1, tw: WS.random() * WS.TAU });
    }
    trees = [];
    for (let i = 0; i < 26; i++) {
      trees.push({ x: -40 + WS.random() * (W + 80), h: 40 + WS.random() * 70,
        w: 14 + WS.random() * 20, y: GROUND - 6 + WS.random() * 14 });
    }
    crowd = [];
    const kinds = ['mongrel', 'ghoul', 'skeleton', 'wolf', 'gilkin', 'kerchief', 'geist'];
    for (let i = 0; i < 34; i++) {
      crowd.push({ id: kinds[i % kinds.length],
        x: -80 + WS.random() * (W + 160),
        y: GROUND - 30 + WS.random() * 80,
        s: 34 + WS.random() * 22, dir: WS.random() < 0.5 ? -1 : 1,
        lag: WS.random() });

    g.addColorStop(0.72, lift > 0 ? mix('#080b12', '#1a1620', lift) : '#080b12');
    g.addColorStop(1, lift > 0 ? mix('#0b0e15', '#4a2f22', lift) : '#0b0e15');
    ctx.fillStyle = g;

      if (a <= 0.02) continue;
      ctx.globalAlpha = a;

   * creature drawn that way reads as a small grey animal rather than as a

  const SIL = new Map();

    let c = SIL.get(key);

    c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;

    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.strokeStyle = lift > 0 ? `rgba(255,190,120,${(0.10 + 0.35 * lift).toFixed(3)})`

    ctx.save();

    ctx.lineTo(0, size); ctx.lineTo(-size * 0.72, 0);

    if (carry > 0.02) {

      }
      ctx.restore();
    },

    stand(ctx, t, k) {
      sky(ctx, t, 0); ground(ctx, 0); treeline(ctx, 0);
      const cx = W * 0.5, cy = GROUND - 56;
      const r = 190 + 26 * WS.sin(t * 1.6);
      // the ring of held light, and the dark stopped at the edge of it
      const g = ctx.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
      g.addColorStop(0, 'rgba(245,197,107,.16)');
      g.addColorStop(1, 'rgba(245,197,107,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, WS.TAU); ctx.fill();
      ctx.strokeStyle = `rgba(245,197,107,${(0.30 + 0.2 * WS.sin(t * 1.6)).toFixed(3)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, WS.TAU); ctx.stroke();
      ctx.save();
      for (const c of crowd) {
        const a = c.lag * WS.TAU + t * 0.25;
        const d = r + 26 + WS.sin(t * 1.1 + c.lag * 5) * 14;
        const x = cx + WS.cos(a) * d, y = cy + WS.sin(a) * d * 0.45;
        const sprite = silhouette((WS.Enemies[c.id] || WS.Enemies.mongrel).art,
          c.s * 0.9, '#04050a');

      }

    dawn(ctx, t, k) {

      g.addColorStop(1, `rgba(255,196,110,${(0.34 * k).toFixed(3)})`);
      ctx.fillStyle = g;

      ctx.restore();

    },

    title(ctx, t, k) {

      const g = ctx.createLinearGradient(0, GROUND - 130, 0, GROUND);

      g.addColorStop(1, 'rgba(255,196,110,.34)');

    this.last = null;

    const lore = WS.Lore.prologue;

    layer.id = 'prologue';
    /* The same logotype the menu uses, from the same CSS - not a second one
       that will quietly drift from it. */
    layer.innerHTML = '<div class="lines"></div><div class="title">'
      + '<h1 class="game-title"><span class="art"></span><span class="nm"></span>'
      + '<span class="wm"></span></h1><em></em></div>';

    layer.querySelector('.art').textContent = words.length > 2 ? words[0] : '';
    layer.querySelector('.nm').textContent = words[words.length - 2] || 'Ember';
    layer.querySelector('.wm').textContent = words[words.length - 1] || 'Watch';
    const skip = document.createElement('button');
    skip.className = 'skip';
    skip.textContent = lore.skip || 'skip';
    skip.addEventListener('click', () => P.finish());
    layer.append(skip);
    layer.querySelector('.title em').textContent = lore.subtitle || '';
    (document.getElementById('stage') || document.body).append(layer);

    this.onTap = (e) => { if (e.target !== skip) P.finish(); };

    if (!now) { this.finish(); return; }

    beat(ctx, this.t, WS.clamp(now.k, 0, 1));

    const v = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.30, W / 2, H * 0.42, H * 0.86);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.74)');

    ctx.fillRect(0, 0, W, H);

    const s2 = ctx.createLinearGradient(0, TEXT_TOP - 90, 0, H);
    s2.addColorStop(0, 'rgba(4,5,8,0)');
    s2.addColorStop(0.55, 'rgba(4,5,8,.80)');
    s2.addColorStop(1, 'rgba(4,5,8,.95)');

      const box = this.layer.querySelector('.lines');
      box.style.opacity = now.scene.lines && now.scene.lines.length ? fade.toFixed(3) : '0';

  P.beats = BEATS;

/* Canvas renderer. The world is a fixed 1280x720 space letterboxed into the
 * viewport, so gameplay is identical at every window size. Draw order is
 * strictly ground -> ground effects -> entities (y-sorted) -> air -> effects,
 * which keeps a 300-enemy field readable. */
'use strict';
(function (WS) {

  const R = {
    canvas: null,
    ctx: null,
    scale: 1,
    offsetX: 0,
    offsetY: 0,
    ground: null,      // pre-rendered tiling ground pattern
    props: [],

  };

  const W = WS.CONST.WORLD_WIDTH, H = WS.CONST.WORLD_HEIGHT;

  // The in-world type stack, matching the DOM's --ui token. Canvas has no
  // cascade, so the fallbacks have to be spelled out at every call site;
  // naming it once keeps world text and panel text from drifting apart.
  const UI_FONT = "'Archivo', 'Segoe UI', system-ui, sans-serif";

  R.init = function (canvas) {

    this.ctx = canvas.getContext('2d');

   *

   * and not one line of code read it. A control that lies is worse than no
   * control: the player on the weak machine turns it down, nothing changes,
   * and they conclude the game is simply badly made.
   *
   * What actually costs frames here is not the flat fills - it is the gradient
   * objects built per entity per frame, and there can be hundreds. So the
   * `lite` path spends flat colour where `high` spends a gradient, and drops
   * the second-order flourishes (trails, ground graduations, the crowd ring)
   * that are lovely and not load-bearing. The game still reads correctly; it
   * just stops painting the parts that only ever said "this is expensive".
   *
   * Cached rather than read per draw call, because the read would otherwise
   * happen a few hundred times a frame to answer a question that changes when
   * the player opens a menu. */
  R.applyQuality = function () {
    this.lite = WS.Save.settings.quality === 'balanced';

    const dpr = WS.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    this.canvas.width = WS.floor(vw * dpr);
    this.canvas.height = WS.floor(vh * dpr);
    this.canvas.style.width = vw + 'px';
    this.canvas.style.height = vh + 'px';
    this.dpr = dpr;
    this.scale = WS.min(vw / W, vh / H);
    this.offsetX = (vw - W * this.scale) * 0.5;
    this.offsetY = (vh - H * this.scale) * 0.5;

    const tile = document.createElement('canvas');

    const g = tile.getContext('2d');
    g.fillStyle = WS.hex(map.ground);
    g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 220; i++) {

      const r = 6 + WS.random() * 26;
      g.globalAlpha = 0.05 + WS.random() * 0.10;
      g.fillStyle = WS.hex(WS.random() < 0.5 ? map.groundAlt : WS.shade(map.ground, 0.6));
      g.beginPath(); g.ellipse(x, y, r, r * 0.62, WS.random() * WS.PI, 0, WS.TAU); g.fill();
    }

    for (const f of WS.Familiar.list) draws.push(f);
