        WS.Audio.play('evolve');
        WS.FX.shake(5, 0.4);
        WS.Game.announce(w.data.evolveName + '!', 'Your weapon has evolved', 3.0);
      }

    } else if (choice.type === 'stat') {
      const up = WS.Upgrades[choice.id];
      up.apply(p, up);
      p.upgradeLevels[choice.id] = (p.upgradeLevels[choice.id] || 0) + 1;
      WS.Audio.play('select');

    } else if (choice.type === 'bread') {
      WS.Player.heal(p, choice.heal || 60, 'food');
      if (choice.gold > 0) WS.Game.addGold(WS.floor(choice.gold * WS.Game.run.goldMult), p.x, p.y);
      WS.Audio.play('potion');

    } else if (choice.type === 'limit_break') {
      p.damageMultiplier += WS.Config.limitBreakDamage;
      p.limitBreaks++;
      WS.Audio.play('evolve');
      WS.FX.notice(p.x, p.y, 'LIMIT BREAK!', '#ff8a3c');
    }
    WS.Achievements.check();
  };

  /** Removes a boon (and its future offers) from this run's pool. */
  LevelUp.banish = function (p, choice) {
    if (choice.type === 'bread' || choice.type === 'blessing'
      || choice.type === 'limit_break' || choice.type === 'union') return false;
    p.banished[choice.id] = true;
    return true;
  };

  WS.LevelUp = LevelUp;

})(window.WS);

/* ===== src/game/arena.js ===== */
/* The Eclipse Arena: a scripted duel with Aethelgard, driven by telegraphed
 * ground hazards rather than the ordinary boss pattern loop.
 *
 *   Solar Flare   - expanding rings with openings you must find and stand in
 *   Sunfall Spears- a grid of squares; only a few are safe when they fall
 *   Eclipse Cross - a spinning four-arm cutter, telegraphed before it bites
 *   Umbral Chains - anchors that drag you inward until you break them
 *
 * Phase 2 at 60% health overlaps two tracks at once; Phase 3 at 20% turns the
 * lights out and starts a hard enrage. */
'use strict';
(function (WS) {

  const Arena = {
    active: false,
    hazards: [],
    anchors: [],
    boss: null,
    phase: 1,
    trackA: 0,
    trackB: 0,
    enrage: 0,
    pullTimer: 0,
    darkness: 0,
  };

  Arena.tuning = {
    phase2HP: 60, phase3HP: 20, enrageTime: 45,
    ringDamage: 26, ringSpeed: 165, ringGapP1: 40, ringGapP2: 26, ringGapsP2: 7,
    ringSpinP2: 0.5, ringDelay: 1.4,
    spearDamage: 30, gridSafeP1: 4, gridSafeP2: 5, spearTele: 1.6, spearInterval: 8.5,
    cutterDamage: 32, cutterSpin: 0.7, cutterTele: 1.2, cutterInterval: 9.0,
    chainInterval: 11.0, chainBreak: 50,
  };

  const BOUNDS = { minX: 260, maxX: 1020, minY: 90, maxY: 630 };
  const CX = (BOUNDS.minX + BOUNDS.maxX) / 2;
  const CY = (BOUNDS.minY + BOUNDS.maxY) / 2;

  Arena.bounds = BOUNDS;

  Arena.begin = function () {
    this.active = true;
    this.hazards.length = 0;
    this.anchors.length = 0;
    this.phase = 1;
    this.trackA = 6;
    this.trackB = 14;
    this.enrage = 0;
    this.pullTimer = 0;
    this.darkness = 0;
    WS.Game.arenaBounds = BOUNDS;

    this.boss = WS.Enemy.spawn('aethelgard', CX, CY - 120, 1, true);
    if (this.boss) {
      WS.Game.announce(this.boss.template.name, this.boss.template.yell, 4.0);
      WS.Audio.play('boss');
    }
  };

  Arena.stop = function () {
    this.active = false;
    this.hazards.length = 0;
    this.anchors.length = 0;
    this.boss = null;
    WS.Game.arenaBounds = null;
  };

  /* ------------------------------------------------------------ hazards -- */
  /** True when `angle` sits inside one of a ring's evenly-spaced openings. */
  function inGap(h, angle) {
    const half = (h.gapWidth * WS.PI / 180) * 0.5;
    for (let i = 0; i < h.gapCount; i++) {
      const centre = h.gapBase + h.gapRot + (i / h.gapCount) * WS.TAU;
      let d = ((angle - centre + WS.PI * 3) % WS.TAU) - WS.PI;
      if (WS.abs(d) <= half) return true;
    }
    return false;
  }

  Arena.ring = function (gapBase, gapWidth, damage, speed, gapCount, spin, delay) {
    this.hazards.push({
      shape: 'ring', cx: CX, cy: CY, r: 26, speed, thick: 30,
      gapBase, gapWidth, gapCount: gapCount || 1, gapRot: 0, spin: spin || 0,
      damage, delay: delay || 0, life: 9, hit: false,
    });
  };

  Arena.spears = function (safeCount) {
    const cols = 5, rows = 4;
    const w = (BOUNDS.maxX - BOUNDS.minX) / cols;
    const h = (BOUNDS.maxY - BOUNDS.minY) / rows;
    const cells = [];
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) cells.push({ cx, cy });
    }
    WS.shuffle(cells);
    const safe = new Set(cells.slice(0, safeCount).map((c) => c.cy * cols + c.cx));
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const isSafe = safe.has(cy * cols + cx);
        this.hazards.push({
          shape: 'square', safe: isSafe,
          x: BOUNDS.minX + cx * w, y: BOUNDS.minY + cy * h, w, h,
          telegraph: this.tuning.spearTele,
          damage: isSafe ? 0 : this.tuning.spearDamage,
          life: this.tuning.spearTele + 0.7, hit: false,
        });
      }
    }
    WS.Game.toast('Sunfall Spears', 'Find the ground that is not marked.');
  };

  Arena.cutter = function () {
    this.hazards.push({
      shape: 'cutter', cx: CX, cy: CY,
      ang: WS.random() * WS.PI * 0.5, spin: this.tuning.cutterSpin,
      half: 0.12, len: 900, damage: this.tuning.cutterDamage,
      telegraph: this.tuning.cutterTele, life: this.tuning.cutterTele + 7, hitTimer: 0,
    });
    WS.Game.toast('Eclipse Cross', 'Stay inside a turning quadrant.');
  };

  Arena.chains = function () {
    // Six anchors ring the arena, dragging the survivor inward until broken.
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * WS.TAU + WS.random() * 0.3;
      this.anchors.push({
        x: CX + WS.cos(a) * 300,
        y: CY + WS.sin(a) * 190,
        health: this.tuning.chainBreak,
        pulse: WS.random() * WS.TAU,
      });
    }
    this.pullTimer = 0;
    WS.Game.toast('Umbral Chains', 'Run through the anchors to break them.');
    WS.Audio.play('warn');
  };

  /* ------------------------------------------------------------- update -- */
  Arena.update = function (dt) {
    if (!this.active) return;
    const player = WS.Game.player;
    const boss = this.boss;

    if (boss && !boss._dead) {
      const pct = (boss.health / boss.maxHealth) * 100;
      if (this.phase === 1 && pct <= this.tuning.phase2HP) {
        this.phase = 2;
        WS.Game.announce('Umbral Divide', 'The eclipse splits the sky.', 3.0);
        WS.Audio.play('boss');
        this.trackB = 2;
      } else if (this.phase === 2 && pct <= this.tuning.phase3HP) {
        this.phase = 3;
        this.enrage = this.tuning.enrageTime;
        WS.Game.announce('Total Darkness', 'It is ending this, one way or another.', 3.0);
        WS.Audio.play('boss');
      }
      // Aethelgard hovers, drifting a little so it never feels like scenery.
      boss.x = CX + WS.cos(WS.Game.run.time * 0.4) * 90;
      boss.y = CY - 120 + WS.sin(WS.Game.run.time * 0.55) * 40;
    }

    if (this.phase === 3) {
      this.darkness = WS.min(1, this.darkness + dt * 0.5);
      this.enrage -= dt;
      if (this.enrage <= 0) {
        // Hard enrage: the arena is wiped.
        WS.Player.takeDamage(player, 99999, 'Aethelgard, the Eclipse Sovereign');
        this.enrage = 5;
      }
    }

    const speedUp = this.phase === 3 ? 0.65 : 1;

    /* ---- cast tracks ----------------------------------------------------- */
    this.trackA -= dt;
    if (this.trackA <= 0) {
      this.trackA = (this.phase >= 2 ? 7.5 : 9.5) * speedUp;
      const t = this.tuning;
      if (this.phase >= 2) {
        this.ring(WS.random() * WS.TAU, t.ringGapP2, t.ringDamage, t.ringSpeed, t.ringGapsP2, t.ringSpinP2, 0.7);
        this.ring(WS.random() * WS.TAU, t.ringGapP2, t.ringDamage, t.ringSpeed, t.ringGapsP2, t.ringSpinP2, 0.7 + t.ringDelay);
      } else {
        this.ring(WS.random() * WS.TAU, t.ringGapP1 * 2, t.ringDamage, t.ringSpeed, 1, 0, 0.6);
        this.ring(WS.random() * WS.TAU, t.ringGapP1, t.ringDamage, t.ringSpeed, 1, 0, 0.6 + t.ringDelay);
      }
      WS.Game.toast('Solar Flare', 'Stand in the opening.');
    }

    this.trackB -= dt;
    if (this.trackB <= 0) {
      if (this.phase === 1) {
        this.trackB = this.tuning.spearInterval;
        this.spears(this.tuning.gridSafeP1);
      } else {
        // Phase 2+ rotates the three heavier mechanics.
        const pickRoll = WS.randInt(0, 2);
        if (pickRoll === 0) { this.trackB = this.tuning.spearInterval * speedUp; this.spears(this.tuning.gridSafeP2); }
        else if (pickRoll === 1) { this.trackB = this.tuning.cutterInterval * speedUp; this.cutter(); }
        else { this.trackB = this.tuning.chainInterval * speedUp; this.chains(); }
      }
    }

    /* ---- hazard resolution ----------------------------------------------- */
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const h = this.hazards[i];
      h.life -= dt;
      if (h.life <= 0) { this.hazards.splice(i, 1); continue; }

      if (h.shape === 'ring') {
        if (h.delay > 0) { h.delay -= dt; continue; }
        h.r += h.speed * dt;
        h.gapRot += h.spin * dt;
        const [, , d] = WS.normalize(player.x - h.cx, player.y - h.cy);
        if (!h.hit && WS.abs(d - h.r) < h.thick * 0.5 + player.radius * 0.5) {
          const a = WS.atan2(player.y - h.cy, player.x - h.cx);
          if (!inGap(h, a)) {
            h.hit = true;
            WS.Player.takeDamage(player, h.damage, 'Solar Flare');
          }
        }
        if (h.r > 900) this.hazards.splice(i, 1);

      } else if (h.shape === 'square') {
        if (h.safe) continue;                 // marked green; nothing lands here
        if (h.telegraph > 0) {
          h.telegraph -= dt;
          if (h.telegraph <= 0) {
            // The spear lands the moment the telegraph expires.
            if (player.x >= h.x && player.x <= h.x + h.w
              && player.y >= h.y && player.y <= h.y + h.h) {
              WS.Player.takeDamage(player, h.damage, 'Sunfall Spear');
            }
            WS.FX.flash(h.x + h.w / 2, h.y + h.h / 2, h.w * 0.5, [1.0, 0.86, 0.45], 0.3);
            WS.Audio.play('hit');
          }
        }

      } else if (h.shape === 'cutter') {
        if (h.telegraph > 0) { h.telegraph -= dt; continue; }
        h.ang += h.spin * dt;
        h.hitTimer -= dt;
        if (h.hitTimer <= 0) {
          const pa = WS.atan2(player.y - h.cy, player.x - h.cx);
          for (let arm = 0; arm < 4; arm++) {
            const armAng = h.ang + arm * WS.PI * 0.5;
            let diff = ((pa - armAng + WS.PI * 3) % WS.TAU) - WS.PI;
            if (WS.abs(diff) <= h.half) {
              h.hitTimer = 0.8;
              WS.Player.takeDamage(player, h.damage, 'Eclipse Cross');
              break;
            }
          }
        }
      }
      if (!WS.Game.running) return;
    }

    /* ---- umbral chains --------------------------------------------------- */
    if (this.anchors.length) {
      this.pullTimer -= dt;
      for (let i = this.anchors.length - 1; i >= 0; i--) {
        const an = this.anchors[i];
        an.pulse += dt * 4;
        if (WS.dist2(an.x, an.y, player.x, player.y) < (player.radius + 26) ** 2) {
          an.health -= 100 * dt;
          WS.FX.flash(an.x, an.y, 34, [0.75, 0.45, 1.0], 0.2);
          if (an.health <= 0) {
            this.anchors.splice(i, 1);
            WS.FX.burst(an.x, an.y, 12, '#b34ff2', 200, 0.5, 3);
            WS.Audio.play('hit');
            if (!this.anchors.length) WS.Game.toast('Umbral Chains', 'The pull relents.');
          }
          continue;
        }
      }
      // The chains drag the survivor toward the centre while any remain.
      if (this.anchors.length) {
        const [dx, dy] = WS.normalize(CX - player.x, CY - player.y);
        const pull = 26 * this.anchors.length;
        player.x = WS.clamp(player.x + dx * pull * dt, BOUNDS.minX, BOUNDS.maxX);
        player.y = WS.clamp(player.y + dy * pull * dt, BOUNDS.minY, BOUNDS.maxY);
        if (this.pullTimer <= 0) {
          this.pullTimer = 2.5;
          WS.Enemy.spawn('shadow_weaver',
            CX + WS.randRange(-200, 200), CY + WS.randRange(-120, 120), 1, true);
        }
      }
    }
  };

  Arena.onBossDead = function () {
    // Enemy.kill already counted the kill before handing off to us.
    WS.Save.stats.bosses.aethelgard = (WS.Save.stats.bosses.aethelgard || 0) + 1;
    WS.Save.save();
    this.stop();
    WS.Game.announce('The eclipse breaks.', 'Aethelgard is undone.', 3.0);
    WS.Audio.play('victory');
    WS.FX.screen('rgba(255,230,174,.35)', 1.0);
    WS.Achievements.check();
    WS.Game.endRun('arena_victory');
  };

  WS.Arena = Arena;

})(window.WS);

/* ===== src/game/game.js ===== */
/* Orchestration: run lifecycle, the fixed-step simulation, banners and toasts,
 * gold, victory and defeat. The UI layer reads this state and never mutates the
 * simulation directly. */
'use strict';
(function (WS) {

  const Game = {
    state: 'menu',      // menu | blessing | playing | levelup | paused | over
    running: false,
    leveling: false,
    pendingLevelUps: 0,
    player: null,
    run: null,
    arenaBounds: null,
    accumulator: 0,
    banner: null,
    toasts: [],
    levelChoices: null,
    selection: { character: null, map: null },
  };

  Game.init = function () {
    WS.FX.init();
    WS.Enemy.init();
    WS.Projectile.init();
    WS.XP.init();
    WS.Pickup.init();
    WS.Familiar.init();
    this.selection.character = WS.Config.startCharacter;
    this.selection.map = WS.Config.startMap;
  };

  /* --------------------------------------------------------------- run --- */
  function newRun(mapId, characterId) {
    const map = WS.Maps[mapId];
    const diffId = WS.Save.settings.difficulty;
    const diff = WS.Config.difficulties[diffId] || WS.Config.difficulties.veteran;
    return {
      mapId, map, characterId,
      time: 0,
      mode: 'normal',
      kills: 0,
      gold: 0,
      gemsCollected: 0,
      bossesSlain: 0,
      deathsSlain: 0,
      damageDone: 0,
      damageTaken: 0,
      damagePrevented: 0,
      healingDone: 0,
      damageByWeapon: {},
      healingBySource: {},
      noHitStreak: 0,
      bestNoHitStreak: 0,
      metamorphoses: 0,
      victorious: false,
      finalBossSeen: false,
      hyper: !!(WS.Save.db.unlocks.hyper[mapId] && WS.Save.db.hyperArmed),
      goldMult: map.goldMult * diff.gold,
      diffScale: diff.scale,
      diffInterval: diff.interval,
      killedBy: null,
    };
  }

  Game.startRun = function (mapId, characterId) {
    this.run = newRun(mapId, characterId);
    this.arenaBounds = null;
    WS.FX.clear();
    WS.Enemy.clear();
    WS.Projectile.clear();
    WS.XP.clear();
    WS.Pickup.clear();
    WS.Familiar.reset();
    this.toasts.length = 0;
    this.banner = null;
    this.pendingLevelUps = 0;
    this.leveling = false;

    this.player = WS.Player.create(characterId);
    WS.WaveManager.reset(this.run.map);
    WS.Renderer.buildScenery(this.run.map);

    WS.Save.stats.totalRuns++;
    WS.Save.save();

    if (this.run.map.arena) {
      // The arena hands out a ready-made kit and skips the blessing draft.
      WS.Player.grantArenaLoadout(this.player);
      this.running = true;
      this.state = 'playing';
      WS.Arena.begin();
      WS.Audio.playMusic(this.run.map.music);
      WS.UI.enterGame();
      return;
    }

    // Every run opens with a blessing draft, then the first wave.
    this.state = 'blessing';
    this.running = false;
    WS.Audio.playMusic(this.run.map.music);
    WS.UI.openBlessing(WS.LevelUp.buildBlessingChoices(this.player));
  };

  Game.beginWaves = function () {
    this.running = true;
    this.state = 'playing';
    WS.UI.enterGame();
    // Veteran's Instincts: start the run already owed some level-ups.
    if (this.player.startLevelUps > 0) {
      this.pendingLevelUps += this.player.startLevelUps;
      this.openLevelUp();
    }
  };

  Game.pause = function () {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    WS.Input.releaseAll();
    WS.UI.openPause();
  };

  Game.resume = function () {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    WS.UI.closeOverlay();
  };

  Game.quitToMenu = function () {
    this.running = false;
    this.state = 'menu';
    this.player = null;
    this.run = null;
    this.arenaBounds = null;
    WS.Arena.stop();
    WS.FX.clear();
    WS.Enemy.clear();
    WS.Projectile.clear();
    WS.XP.clear();
    WS.Pickup.clear();
    WS.Familiar.reset();
    WS.Audio.playMusic('menu');
    WS.UI.openMenu();
  };

  /* ------------------------------------------------------------ economy -- */
  Game.addGold = function (amount, x, y) {
    if (amount <= 0) return;
    this.run.gold += amount;
    WS.Save.addGold(amount);
    if (x !== undefined) WS.FX.gold(x, y, amount);
  };

  /* ------------------------------------------------------- presentation -- */
  Game.announce = function (title, subtitle, duration) {
    this.banner = { title, subtitle, life: duration || 2.5, maxLife: duration || 2.5 };
  };

  Game.toast = function (title, body) {
    this.toasts.push({ title, body, life: 4.5 });
    if (this.toasts.length > 3) this.toasts.shift();
  };

  /* ---------------------------------------------------------- level-ups -- */
  Game.openLevelUp = function () {
    if (this.leveling || this.pendingLevelUps <= 0) return;
    this.leveling = true;
    this.state = 'levelup';
    this.levelChoices = WS.LevelUp.buildChoices(this.player);
    WS.Audio.play('level');
    WS.Input.releaseAll();
    WS.UI.openLevelUp(this.levelChoices);
  };

  Game.chooseLevelUp = function (choice) {
    WS.LevelUp.apply(this.player, choice);
    this.pendingLevelUps--;
    this.leveling = false;
    if (this.pendingLevelUps > 0) {
      this.openLevelUp();
    } else {
      this.state = 'playing';
      WS.UI.closeOverlay();
    }
  };

  Game.rerollLevelUp = function () {
    if (this.player.rerolls <= 0) return false;
    this.player.rerolls--;
    this.levelChoices = WS.LevelUp.buildChoices(this.player);
    WS.Audio.play('ui');
    WS.UI.openLevelUp(this.levelChoices);
    return true;
  };

  Game.banishLevelUp = function (choice) {
    if (this.player.banishes <= 0) return false;
    if (!WS.LevelUp.banish(this.player, choice)) return false;
    this.player.banishes--;
    this.levelChoices = WS.LevelUp.buildChoices(this.player);
    WS.Audio.play('ui');
    WS.UI.openLevelUp(this.levelChoices);
    return true;
  };

  Game.chooseBlessing = function (choice) {
    WS.LevelUp.apply(this.player, choice);
    WS.UI.closeOverlay();
    this.beginWaves();
  };

  /* ------------------------------------------------------- run outcomes -- */
  Game.victory = function () {
    const run = this.run;
    if (run.victorious) return;
    run.victorious = true;
    WS.Save.stats.totalVictories++;
    WS.Save.db.unlocks.hyper[run.mapId] = true;
    WS.Save.save();
    WS.Audio.play('victory');
    WS.FX.screen('rgba(245,197,107,.35)', 1.2);
    this.announce('Victory!', 'The battlefield is yours. Fight on, or claim it.', 4.0);
    this.state = 'over';
    this.running = false;
    WS.Achievements.check();
    WS.UI.openVictory();
  };

  Game.continueEndless = function () {
    this.run.mode = 'endless';
    this.running = true;
    this.state = 'playing';
    WS.UI.closeOverlay();
    this.announce('True Endless', 'Nothing is coming to save you.', 3.0);
  };

  Game.endRun = function (reason) {
    if (!this.running && this.state === 'over') return;
    this.running = false;
    this.state = 'over';
    const run = this.run;
    const stats = WS.Save.stats;

    stats.totalTime += run.time;
    stats.bestRunTime = WS.max(stats.bestRunTime, run.time);
    stats.bestBossesInRun = WS.max(stats.bestBossesInRun, run.bossesSlain);
    stats.bestDamage = WS.max(stats.bestDamage, run.damageDone);
    stats.bestNoHitStreak = WS.max(stats.bestNoHitStreak, run.bestNoHitStreak);
    stats.bestTime[run.mapId] = WS.max(stats.bestTime[run.mapId] || 0, run.time);
    WS.Save.save();
    WS.Achievements.check();
    WS.Save.save();

    if (reason === 'defeated') {
      WS.Audio.play('death');
      WS.FX.screen('rgba(226,72,61,.35)', 1.0);
    }
    WS.Arena.stop();
    WS.UI.openGameOver(reason);
  };

  /* -------------------------------------------------------------- tick --- */
  Game.tick = function (dt) {
    const run = this.run;
    const player = this.player;
    run.time += dt;

    run.noHitStreak += dt;
    run.bestNoHitStreak = WS.max(run.bestNoHitStreak, run.noHitStreak);
    // The streak achievement is checked live, so it can fire mid-run.
    if (run.noHitStreak >= 180 && !WS.Save.db.achievements.lights_favor) {
      WS.Save.stats.bestNoHitStreak = WS.max(WS.Save.stats.bestNoHitStreak, run.noHitStreak);
      WS.Achievements.check();
    }

    WS.Player.update(player, dt);
    if (!this.running) return;

    if (run.map.arena) WS.Arena.update(dt);
    else WS.WaveManager.update(dt, run);
    if (!this.running) return;

    WS.Enemy.update(dt);
    if (!this.running) return;
    WS.Projectile.update(dt);
    if (!this.running) return;
    WS.Familiar.update(dt);
    WS.XP.update(dt);
    if (!this.running || this.leveling) return;
    WS.Pickup.update(dt);
    if (!this.running) return;
    WS.FX.update(dt);

    // Victory is banked the moment the survivor reaches 30:00.
    if (!run.victorious && !run.map.arena && run.time >= WS.Config.deathTime) {
      this.victory();
      return;
    }

    // The score tightens as the field fills and the clock runs down.
    WS.Audio.setIntensity(WS.min(1,
      WS.Enemy.count() / 90 * 0.6 + WS.min(1, run.time / 1500) * 0.4));
  };

  /** Fixed-step update with a catch-up cap, so one frame hitch never turns
   *  into a death spiral of simulation ticks. */
  Game.update = function (frameDt) {
    // Banners and toasts keep running while the game is paused or choosing.
    if (this.banner) {
      this.banner.life -= frameDt;
      if (this.banner.life <= 0) this.banner = null;
    }
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      this.toasts[i].life -= frameDt;
      if (this.toasts[i].life <= 0) this.toasts.splice(i, 1);
    }

    if (this.state !== 'playing' || !this.running) {
      if (this.state === 'levelup' || this.state === 'paused') WS.FX.update(frameDt);
      return;
    }

    WS.Input.poll();
    const step = WS.CONST.TICK_RATE;
    this.accumulator += WS.min(frameDt, 0.25);
    let ticks = 0;
    while (this.accumulator >= step && ticks < WS.CONST.MAX_TICKS_PER_FRAME) {
      this.accumulator -= step;
      ticks++;
      this.tick(step);
      if (this.state !== 'playing') break;
    }
    if (ticks >= WS.CONST.MAX_TICKS_PER_FRAME) this.accumulator = 0;
  };

  WS.Game = Game;

})(window.WS);

/* ===== src/render/renderer.js ===== */
/* Canvas renderer. The world is a fixed 1280x720 space letterboxed into the
 * viewport, so gameplay is identical at every window size. Draw order is
 * strictly ground -> ground effects -> entities (y-sorted) -> air -> effects,
 * which keeps a 300-enemy field readable. */
'use strict';
(function (WS) {

  const R = {
    canvas: null,
    ctx: null,
    scale: 1,
    offsetX: 0,
    offsetY: 0,
    ground: null,      // pre-rendered tiling ground pattern
    props: [],
    vignette: null,
  };

  const W = WS.CONST.WORLD_WIDTH, H = WS.CONST.WORLD_HEIGHT;

  R.init = function (canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  };

  R.resize = function () {
    const dpr = WS.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    this.canvas.width = WS.floor(vw * dpr);
    this.canvas.height = WS.floor(vh * dpr);
    this.canvas.style.width = vw + 'px';
    this.canvas.style.height = vh + 'px';
    this.dpr = dpr;
    this.scale = WS.min(vw / W, vh / H);
    this.offsetX = (vw - W * this.scale) * 0.5;
    this.offsetY = (vh - H * this.scale) * 0.5;
    this.viewW = vw; this.viewH = vh;
  };

  /** Window coords -> world coords (for touch input and debugging). */
  R.toWorld = function (px, py) {
    return [(px - this.offsetX) / this.scale, (py - this.offsetY) / this.scale];
  };

  /* ------------------------------------------------------------ scenery -- */
  R.buildScenery = function (map) {
    // Ground: a 256px tile of mottled earth in the zone's palette, drawn once
    // and repeated, so the field never costs more than one fillRect a frame.
    const tile = document.createElement('canvas');
    tile.width = tile.height = 256;
    const g = tile.getContext('2d');
    g.fillStyle = WS.hex(map.ground);
    g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 220; i++) {
      const x = WS.random() * 256, y = WS.random() * 256;
      const r = 6 + WS.random() * 26;
      g.globalAlpha = 0.05 + WS.random() * 0.10;
      g.fillStyle = WS.hex(WS.random() < 0.5 ? map.groundAlt : WS.shade(map.ground, 0.6));
      g.beginPath(); g.ellipse(x, y, r, r * 0.62, WS.random() * WS.PI, 0, WS.TAU); g.fill();
    }
    g.globalAlpha = 1;
    this.ground = this.ctx.createPattern(tile, 'repeat');
    this.groundTint = map.ground;

    // Props: scattered decoration, drawn dark so they never fight the horde.
    this.props.length = 0;
    if (map.props && map.props.length) {
      for (let i = 0; i < 46; i++) {
        const kind = map.props[WS.randInt(0, map.props.length - 1)];
        this.props.push({
          kind,
          x: WS.randRange(-60, W + 60),
          y: WS.randRange(-40, H + 40),
          size: WS.randRange(46, 96),
          alpha: WS.randRange(0.35, 0.7),
        });
      }
      this.props.sort((a, b) => a.y - b.y);
    }
  };

  /* --------------------------------------------------------------- draw -- */
  function shadow(ctx, x, y, r, alpha) {
    ctx.globalAlpha = alpha === undefined ? 0.32 : alpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.4, 0, 0, WS.TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function healthBar(ctx, e) {
    if (e.health >= e.maxHealth) return;
    const w = e.radius * 2, h = 3;
    const x = e.x - w / 2, y = e.y - e.radius * 1.9;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(x, y, w, h);
    const pct = WS.clamp(e.health / e.maxHealth, 0, 1);
    ctx.fillStyle = e.boss ? '#e2483d' : e.elite ? '#f5c56b' : '#c6483d';
    ctx.fillRect(x, y, w * pct, h);
  }

  R.draw = function (time) {
    const ctx = this.ctx;
    const game = WS.Game;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.viewW, this.viewH);

    // Letterbox surround: the Arclight void.
    ctx.fillStyle = '#07080c';
    ctx.fillRect(0, 0, this.viewW, this.viewH);

    ctx.save();
    ctx.translate(this.offsetX + WS.FX.shakeX * this.scale, this.offsetY + WS.FX.shakeY * this.scale);
    ctx.scale(this.scale, this.scale);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    /* ---- ground ---------------------------------------------------------- */
    if (this.ground) {
      ctx.fillStyle = this.ground;
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = '#0b0d12';
      ctx.fillRect(0, 0, W, H);
    }

    if (!game.player) { ctx.restore(); this.drawVignette(ctx); return; }
    const player = game.player;
    const run = game.run;

    /* ---- props ----------------------------------------------------------- */
    for (const p of this.props) {
      ctx.globalAlpha = p.alpha;
      const sprite = WS.Sprites.prop(p.kind, p.size);
      ctx.drawImage(sprite, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    /* ---- ground effects (zones, auras, arena hazards) -------------------- */
    this.drawZones(ctx, time);
    this.drawAuras(ctx, player, time);
    if (WS.Arena.active) this.drawArena(ctx, time);

    /* ---- gems and pickups ------------------------------------------------ */
    this.drawGems(ctx, time);
    this.drawPickups(ctx, time);

    /* ---- entities, y-sorted --------------------------------------------- */
    const draws = [];
    for (let i = 0; i < WS.Enemy.pool.count; i++) draws.push(WS.Enemy.pool.active[i]);
    for (const f of WS.Familiar.list) draws.push(f);
    draws.push(player);
    draws.sort((a, b) => a.y - b.y);

    for (const e of draws) {
      if (e === player) this.drawPlayer(ctx, player, time);
      else if (e.spec) this.drawFamiliar(ctx, e, time);
      else this.drawEnemy(ctx, e, time);
    }

    /* ---- air: bolts, orbits, beams -------------------------------------- */
    this.drawOrbits(ctx, player);
    this.drawBolts(ctx);
    this.drawBeams(ctx);

    /* ---- effects --------------------------------------------------------- */
    this.drawFlashes(ctx);
    this.drawParticles(ctx);
    this.drawTexts(ctx);

    ctx.restore();

    this.drawVignette(ctx);
    if (WS.FX.flashScreen) {
      const f = WS.FX.flashScreen;
      ctx.globalAlpha = WS.clamp(f.life / f.maxLife, 0, 1);
      ctx.fillStyle = f.colour;
      ctx.fillRect(0, 0, this.viewW, this.viewH);
      ctx.globalAlpha = 1;
    }
    if (WS.Arena.active && WS.Arena.darkness > 0) {
      // Total Darkness closes in around the survivor.
      const cx = this.offsetX + player.x * this.scale;
      const cy = this.offsetY + player.y * this.scale;
      const r = (330 - 140 * WS.Arena.darkness) * this.scale;
      const grd = ctx.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(1, `rgba(0,0,0,${0.82 * WS.Arena.darkness})`);
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, this.viewW, this.viewH);
    }
    this.drawBanner(ctx, run);
  };

  /* ------------------------------------------------------------ entities - */
  R.drawEnemy = function (ctx, e, time) {
    const t = e.template;
    const size = e.spriteSize;
    const bob = WS.sin(e.bob) * (e.boss ? 3 : 2);
    shadow(ctx, e.x, e.y + e.radius * 0.55, e.radius * 0.85);

    if (e.elite || e.boss) {
      // Champions get an arc-lit ground ring so they read out of a crowd.
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.2 * WS.sin(time * 3);
      ctx.strokeStyle = e.boss ? '#e05ad8' : '#f5c56b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(e.x, e.y + e.radius * 0.55, e.radius * 1.25, e.radius * 0.5, 0, 0, WS.TAU);
      ctx.stroke();
      ctx.restore();
    }

    const sprite = WS.Sprites.creature(t.art, e.chilled ? [0.55, 0.8, 1.0] : t.tint, size);
    ctx.save();
    ctx.translate(e.x, e.y + bob);
    if (e.facing < 0) ctx.scale(-1, 1);
    ctx.drawImage(sprite, -size / 2, -size * 0.62, size, size);
    ctx.restore();

    if (e.flash > 0) {
      // A hit tints the silhouette rather than replacing it.
      ctx.save();
      ctx.globalAlpha = WS.clamp(e.flash / 0.09, 0, 1) * 0.75;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = e.flashCrit ? '#ffd45c' : '#ff6b5c';
      ctx.beginPath();
      ctx.ellipse(e.x, e.y + bob, e.radius * 0.95, e.radius * 1.05, 0, 0, WS.TAU);
      ctx.fill();
      ctx.restore();
    }

    if (WS.Save.settings.showHealthBars || e.elite || e.boss) healthBar(ctx, e);

    if (e.boss) {
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f2c9ff';
      ctx.fillText(t.name, e.x, e.y - e.radius * 2.1);
    } else if (e.elite) {
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f5c56b';
      ctx.fillText(t.name, e.x, e.y - e.radius * 2.1);
    }
  };

  R.drawFamiliar = function (ctx, fam, time) {
    const size = 46;
    const lift = fam.pounce > 0 ? -10 * (fam.pounce / 0.18) : WS.sin(fam.bob * 3) * 2;
    shadow(ctx, fam.x, fam.y + 12, 15, 0.25);
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.translate(fam.x, fam.y + lift);
    if (fam.facing < 0) ctx.scale(-1, 1);
    const icon = WS.Icons.glyph(fam.spec.art, fam.spec.tint, size);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(icon, -size / 2, -size * 0.7, size, size);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  };

  R.drawPlayer = function (ctx, p, time) {
    const size = 78;
    const demon = p.metaTimer > 0;
    const bob = p.moving ? WS.sin(p.walkCycle) * 2.5 : WS.sin(p.walkCycle) * 1.2;
    shadow(ctx, p.x, p.y + p.radius * 0.7, p.radius * 0.9);
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#f5c56b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + p.radius * 0.7, p.radius * 1.15, p.radius * 0.46, 0, 0, WS.TAU);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    if (p.invulnerable > 0) ctx.globalAlpha = (WS.floor(p.invulnerable * 12) % 2 === 0) ? 0.45 : 0.95;
    ctx.translate(p.x, p.y + bob);
    if (p.spinTimer > 0) ctx.rotate(time * 14);
    else if (p.facing < 0) ctx.scale(-1, 1);
    const sprite = WS.Sprites.hero(p.characterId, p.character.color, size, demon);
    ctx.drawImage(sprite, -size / 2, -size * 0.66, size, size);
    ctx.restore();
    ctx.globalAlpha = 1;

    if (demon) {
      // The fel corona is the only sign the empowerment is still running.
      const pulse = 58 + 7 * WS.sin(time * 9);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const grd = ctx.createRadialGradient(p.x, p.y, 8, p.x, p.y, pulse);
      grd.addColorStop(0, 'rgba(140,242,74,.35)');
      grd.addColorStop(1, 'rgba(140,242,74,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, WS.TAU); ctx.fill();
      ctx.restore();
    }
    if (p.blockReady) {
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.2 * WS.sin(time * 4);
      ctx.strokeStyle = '#ffe6ae';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 9, 0, WS.TAU); ctx.stroke();
      ctx.restore();
    }
  };

  /* ------------------------------------------------------------- effects - */
  R.drawAuras = function (ctx, p, time) {
    ctx.save();
    if (p.chillRank > 0) {
      const r = (WS.Config.chillRangeBase + WS.Config.chillRangePerRank * p.chillRank) * p.areaMultiplier;
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = '#59bfff';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, WS.TAU); ctx.fill();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#8fd8ff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, WS.TAU); ctx.stroke();
    }
    if (p.retRank > 0) {
      const r = (WS.Config.retributionRange + WS.Config.retributionRangePerRank * p.retRank) * p.areaMultiplier;
      ctx.globalAlpha = 0.10 + 0.04 * WS.sin(time * 5);
      ctx.fillStyle = '#ffdf7a';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, WS.TAU); ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#ffe6ae'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, WS.TAU); ctx.stroke();
    }
    // Pickup radius: a faint hairline so the magnet stat is legible.
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#f5c56b'; ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.pickupRadius, 0, WS.TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  };

  R.drawZones = function (ctx, time) {
    const zones = WS.Projectile.zones;
    ctx.save();
    for (let i = 0; i < zones.count; i++) {
      const z = zones.active[i];
      const fade = WS.clamp(z.life / z.maxLife, 0, 1);
      const grd = ctx.createRadialGradient(z.x, z.y, z.radius * 0.2, z.x, z.y, z.radius);
      grd.addColorStop(0, WS.rgb(z.colour, 0.30 * fade));
      grd.addColorStop(1, WS.rgb(z.colour, 0.02));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, WS.TAU); ctx.fill();
      ctx.globalAlpha = 0.55 * fade;
      ctx.strokeStyle = WS.rgb(z.colour, 1);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.radius * (0.98 + 0.02 * WS.sin(time * 4 + z.phase)), 0, WS.TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };

  R.drawGems = function (ctx, time) {
    const gems = WS.XP.pool;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < gems.count; i++) {
      const g = gems.active[i];
      const s = g.size * (1 + 0.08 * WS.sin(time * 5 + g.spin));
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.spin);
      ctx.fillStyle = WS.rgb(g.colour, 0.95);
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  };

  R.drawPickups = function (ctx, time) {
    const pool = WS.Pickup.pool;
    for (let i = 0; i < pool.count; i++) {
      const p = pool.active[i];
      const lift = WS.sin(p.bob) * 3;
      shadow(ctx, p.x, p.y + p.radius * 0.7, p.radius * 0.7, 0.24);
      const size = p.type.size;
      const icon = WS.Icons.glyph(p.type.art, p.type.tint, size);
      ctx.drawImage(icon, p.x - size / 2, p.y - size / 2 + lift, size, size);
      if (p.type.noMagnet) {
        // Destination pickups get a beacon so they are findable across a field.
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.25 * WS.sin(time * 4);
        ctx.strokeStyle = WS.hex(p.type.tint);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.9 + 6 * WS.sin(time * 2), 0, WS.TAU); ctx.stroke();
        ctx.restore();
      }
    }
  };

  /** Steel keeps a silhouette; magic stays a streak of light. Drawn in the
   *  bolt's local space, already rotated to its heading. */
  function drawBoltShape(ctx, b, r) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    switch (b.art) {
      case 'dagger':
        ctx.beginPath();
        ctx.moveTo(r * 1.9, 0); ctx.lineTo(0, -r * 0.5);
        ctx.lineTo(-r * 1.0, 0); ctx.lineTo(0, r * 0.5);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(60,44,30,.95)';
        ctx.fillRect(-r * 1.5, -r * 0.28, r * 0.6, r * 0.56);
        break;
      case 'arrow':
        ctx.fillRect(-r * 1.6, -r * 0.16, r * 3.0, r * 0.32);
        ctx.beginPath();
        ctx.moveTo(r * 1.9, 0); ctx.lineTo(r * 0.7, -r * 0.55); ctx.lineTo(r * 0.7, r * 0.55);
        ctx.closePath(); ctx.fill();
        break;
      case 'axe':
      case 'sword':
        ctx.beginPath();
        ctx.moveTo(r * 1.7, 0); ctx.lineTo(0, -r * 0.75);
        ctx.lineTo(-r * 1.2, 0); ctx.lineTo(0, r * 0.75);
        ctx.closePath(); ctx.fill();
        break;
      case 'shield':
        ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, WS.TAU); ctx.fill();
        ctx.strokeStyle = WS.rgb(b.colour, 1);
        ctx.lineWidth = WS.max(1.5, r * 0.28);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, WS.TAU); ctx.stroke();
        break;
      default:
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.2, r * 0.55, 0, 0, WS.TAU);
        ctx.fill();
    }
  }

  R.drawBolts = function (ctx) {
    const bolts = WS.Projectile.bolts;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < bolts.count; i++) {
      const b = bolts.active[i];
      const r = b.radius;
      ctx.save();
      ctx.translate(b.x, b.y);
      const ang = b.spinRate ? b.spin : WS.atan2(b.vy, b.vx);
      ctx.rotate(ang);
      const c = b.colour;
      const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.4);
      grd.addColorStop(0, WS.rgb(c, 0.95));
      grd.addColorStop(0.4, WS.rgb(c, 0.45));
      grd.addColorStop(1, WS.rgb(c, 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, WS.TAU); ctx.fill();
      drawBoltShape(ctx, b, r);
      ctx.restore();
    }
    // Hostile bolts read as hard-edged, so they never blur into friendly fire.
    const host = WS.Projectile.hostiles;
    for (let i = 0; i < host.count; i++) {
      const h = host.active[i];
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.spin);
      const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, h.radius * 2.2);
      grd.addColorStop(0, WS.rgb(h.colour, 1));
      grd.addColorStop(1, WS.rgb(h.colour, 0));
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, 0, h.radius * 2.2, 0, WS.TAU); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.radius * 0.8, 0, WS.TAU); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  };

  R.drawOrbits = function (ctx, player) {
    const orbits = WS.Projectile.orbits;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < orbits.count; i++) {
      const o = orbits.active[i];
      for (let n = 0; n < o.count; n++) {
        const a = o.angle + (n / o.count) * WS.TAU;
        const x = player.x + WS.cos(a) * o.radius;
        const y = player.y + WS.sin(a) * o.radius;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(a + o.angle * 2);
        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, o.size);
        grd.addColorStop(0, WS.rgb(o.colour, 0.9));
        grd.addColorStop(1, WS.rgb(o.colour, 0));
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(0, 0, o.size, 0, WS.TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath();
        ctx.moveTo(0, -o.size * 0.7); ctx.lineTo(o.size * 0.28, 0);
        ctx.lineTo(0, o.size * 0.7); ctx.lineTo(-o.size * 0.28, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  };

  R.drawBeams = function (ctx) {
    const beams = WS.Projectile.beams;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < beams.count; i++) {
      const b = beams.active[i];
      const fade = WS.clamp(b.life / b.maxLife, 0, 1);
      ctx.globalAlpha = fade;
      ctx.strokeStyle = WS.rgb(b.colour, 0.55);
      ctx.lineWidth = b.width;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = WS.max(1.5, b.width * 0.25);
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
    ctx.restore();
  };

  R.drawFlashes = function (ctx) {
    const flashes = WS.FX.flashes;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flashes.count; i++) {
      const f = flashes.active[i];
      const t = 1 - WS.clamp(f.life / f.maxLife, 0, 1);
      const r = f.radius * (0.35 + 0.65 * t);
      ctx.globalAlpha = (1 - t) * 0.75;
      ctx.strokeStyle = WS.rgb(f.colour, 1);
      ctx.lineWidth = WS.max(1.5, f.radius * 0.06 * (1 - t) + 1);
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, WS.TAU); ctx.stroke();
      ctx.globalAlpha = (1 - t) * 0.22;
      ctx.fillStyle = WS.rgb(f.colour, 1);
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, WS.TAU); ctx.fill();
    }
    ctx.restore();
  };

  R.drawParticles = function (ctx) {
    const parts = WS.FX.particles;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < parts.count; i++) {
      const p = parts.active[i];
      ctx.globalAlpha = WS.clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.colour;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, WS.TAU); ctx.fill();
    }
    ctx.restore();
  };

  R.drawTexts = function (ctx) {
    const texts = WS.FX.texts;
    ctx.save();
    ctx.textAlign = 'center';
    for (let i = 0; i < texts.count; i++) {
      const t = texts.active[i];
      const fade = WS.clamp(t.life / t.maxLife, 0, 1);
      ctx.globalAlpha = fade;
      ctx.font = `700 ${t.size}px system-ui, "Segoe UI", sans-serif`;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(4,6,10,.85)';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.colour;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.restore();
  };

  /* -------------------------------------------------------------- arena -- */
  R.drawArena = function (ctx, time) {
    const A = WS.Arena;
    const b = A.bounds;

    ctx.save();
    // The arena floor: a lit disc inside the void.
    ctx.fillStyle = 'rgba(20,14,38,.55)';
    ctx.fillRect(b.minX, b.minY, b.maxX - b.minX, b.maxY - b.minY);
    ctx.strokeStyle = 'rgba(245,197,107,.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.minX, b.minY, b.maxX - b.minX, b.maxY - b.minY);

    for (const h of A.hazards) {
      if (h.shape === 'ring') {
        if (h.delay > 0) continue;
        ctx.save();
        ctx.lineWidth = h.thick;
        ctx.strokeStyle = 'rgba(255,190,90,.45)';
        // Draw the ring in segments, leaving the openings dark.
        const steps = 180;
        ctx.beginPath();
        for (let i = 0; i < steps; i++) {
          const a0 = (i / steps) * WS.TAU;
          const inside = (() => {
            const half = (h.gapWidth * WS.PI / 180) * 0.5;
            for (let k = 0; k < h.gapCount; k++) {
              const centre = h.gapBase + h.gapRot + (k / h.gapCount) * WS.TAU;
              let d = ((a0 - centre + WS.PI * 3) % WS.TAU) - WS.PI;
              if (WS.abs(d) <= half) return true;
            }
            return false;
          })();
          if (inside) continue;
          ctx.moveTo(h.cx + WS.cos(a0) * h.r, h.cy + WS.sin(a0) * h.r);
          ctx.arc(h.cx, h.cy, h.r, a0, a0 + WS.TAU / steps);
        }
        ctx.stroke();
        ctx.restore();

      } else if (h.shape === 'square') {
        if (h.telegraph > 0) {
          // Safe ground reads green and steady; doomed ground reddens as the
          // spear falls, so the choice is legible at a glance.
          const k = 1 - h.telegraph / WS.Arena.tuning.spearTele;
          ctx.fillStyle = h.safe
            ? 'rgba(61,220,122,.14)'
            : `rgba(226,72,61,${0.12 + 0.26 * k})`;
          ctx.fillRect(h.x + 3, h.y + 3, h.w - 6, h.h - 6);
          ctx.strokeStyle = h.safe ? 'rgba(110,240,160,.75)' : 'rgba(255,140,110,.75)';
          ctx.lineWidth = 2;
          ctx.strokeRect(h.x + 3, h.y + 3, h.w - 6, h.h - 6);
        }

      } else if (h.shape === 'cutter') {
        const telegraphing = h.telegraph > 0;
        ctx.save();
        ctx.translate(h.cx, h.cy);
        ctx.rotate(h.ang);
        ctx.globalAlpha = telegraphing ? (0.25 + 0.25 * WS.sin(time * 14)) : 0.75;
        ctx.fillStyle = telegraphing ? 'rgba(255,180,90,.6)' : 'rgba(255,120,60,.75)';
        for (let arm = 0; arm < 4; arm++) {
          ctx.save();
          ctx.rotate(arm * WS.PI * 0.5);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(WS.cos(-h.half) * h.len, WS.sin(-h.half) * h.len);
          ctx.lineTo(WS.cos(h.half) * h.len, WS.sin(h.half) * h.len);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }
    }

    for (const an of A.anchors) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const r = 22 + 4 * WS.sin(an.pulse);
      const grd = ctx.createRadialGradient(an.x, an.y, 2, an.x, an.y, r);
      grd.addColorStop(0, 'rgba(179,79,242,.9)');
      grd.addColorStop(1, 'rgba(179,79,242,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(an.x, an.y, r, 0, WS.TAU); ctx.fill();
      ctx.restore();
      // The chain itself, drawn to the survivor.
      const p = WS.Game.player;
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#b34ff2';
      ctx.setLineDash([6, 8]);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(an.x, an.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  };

  /* ------------------------------------------------------------- chrome -- */
  R.drawVignette = function (ctx) {
    const grd = ctx.createRadialGradient(
      this.viewW / 2, this.viewH / 2, WS.min(this.viewW, this.viewH) * 0.35,
      this.viewW / 2, this.viewH / 2, WS.max(this.viewW, this.viewH) * 0.75);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, this.viewW, this.viewH);
  };

  /** The Arclight banner: a swept arc of light with the announcement over it. */
  R.drawBanner = function (ctx) {
    const b = WS.Game.banner;
    if (!b) return;
    const k = WS.clamp(b.life / b.maxLife, 0, 1);
    const appear = WS.clamp((1 - k) * 5, 0, 1);       // sweep in over the first fifth
    const fade = WS.clamp(k * 3, 0, 1);
    const alpha = WS.min(appear, fade);
    const y = this.viewH * 0.22;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';

    const w = WS.min(this.viewW * 0.8, 900) * appear;
    const grd = ctx.createLinearGradient(this.viewW / 2 - w / 2, 0, this.viewW / 2 + w / 2, 0);
    grd.addColorStop(0, 'rgba(245,197,107,0)');
    grd.addColorStop(0.5, 'rgba(245,197,107,.85)');
    grd.addColorStop(1, 'rgba(245,197,107,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(this.viewW / 2 - w / 2, y + 26, w, 1.5);

    ctx.font = '600 30px system-ui, "Segoe UI", sans-serif';
    ctx.letterSpacing = '2px';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(4,6,10,.8)';
    ctx.strokeText(b.title, this.viewW / 2, y);
    ctx.fillStyle = '#ffe6ae';
    ctx.fillText(b.title, this.viewW / 2, y);

    if (b.subtitle) {
      ctx.font = '400 15px system-ui, "Segoe UI", sans-serif';
      ctx.fillStyle = '#c9cfdd';
      ctx.strokeText(b.subtitle, this.viewW / 2, y + 52);
      ctx.fillText(b.subtitle, this.viewW / 2, y + 52);
    }
    ctx.restore();
  };

  WS.Renderer = R;

})(window.WS);

/* ===== src/ui/ui.js ===== */
/* The Arclight UI layer: menus, overlays and the heads-up display.
 * The DOM owns everything that is text or chrome; the canvas owns the world.
 * This layer reads game state and never mutates the simulation directly - it
 * calls into WS.Game for anything that changes the run. */
'use strict';
(function (WS) {

  const UI = {
    root: null, overlay: null, hud: null,
    tab: 'roster',
    banishMode: false,
    els: {},
  };

  /* ------------------------------------------------------------- helpers - */
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function icon(art, colour, size) {
    const img = new Image();
    img.src = WS.Icons.url(art, colour, size || 64);
    img.width = size || 64; img.height = size || 64;
    img.alt = '';
    return img;
  }

  function qualityColour(key) {
    return WS.CONST.QUALITY[key] || WS.CONST.QUALITY.common;
  }

  /** A choice's accent: its school palette for weapons, its quality otherwise. */
  function choiceColour(choice) {
    if (choice.school) return WS.CONST.COLORS[choice.school];
    if (choice.quality) return qualityColour(choice.quality);
    if (choice.type === 'evolve' || choice.type === 'union') return qualityColour('legendary');
    if (choice.type === 'new_weapon') return qualityColour('rare');
    if (choice.type === 'bread') return qualityColour('common');
    return qualityColour('uncommon');
  }

  function svgArc(radius, stroke, cls) {
    const ns = 'http://www.w3.org/2000/svg';
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', '50%'); c.setAttribute('cy', '50%');
    c.setAttribute('r', radius);
    c.setAttribute('class', cls);
    if (stroke) c.setAttribute('stroke-width', stroke);
    return c;
  }

  /* ================================================================= HUD == */
  UI.buildHUD = function () {
    const hud = this.hud;
    hud.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';

    /* -- portrait + arcs -------------------------------------------------- */
    const portraitWrap = el('div'); portraitWrap.id = 'hud-portrait';
    const gauge = el('div', 'gauge-wrap');
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 92 92');
    const rHP = 43, rXP = 36;
    const tHP = svgArc(rHP, 5, 'track');
    const aHP = svgArc(rHP, 5, 'arc-hp');
    const tXP = svgArc(rXP, 3, 'track');
    const aXP = svgArc(rXP, 3, 'arc-xp');
    svg.append(tHP, aHP, tXP, aXP);
    const portrait = el('div', 'portrait');
    const lvl = el('div', 'lvl', 'LV 1');
    gauge.append(svg, portrait, lvl);

    const vitals = el('div'); vitals.id = 'hud-vitals';
    const name = el('div', 'name', '');
    const hpText = el('div', 'hp-text', '');
    const meters = el('div'); meters.id = 'hud-meters';
    vitals.append(name, hpText, meters);
    portraitWrap.append(gauge, vitals);

    /* -- timer rail ------------------------------------------------------- */
    const timer = el('div'); timer.id = 'hud-timer';
    const timeText = el('div', 'time', '0:00');
    const rail = el('div', 'rail');
    const railFill = el('div', 'fill');
    rail.append(railFill);
    for (const at of WS.Config.bossTimes) {
      const tick = el('i', 'tick');
      tick.style.left = (at / WS.Config.deathTime * 100) + '%';
      rail.append(tick);
    }
    const mode = el('div', 'label mode', '');
    timer.append(timeText, rail, mode);

    /* -- boss arc --------------------------------------------------------- */
    const boss = el('div', 'hidden'); boss.id = 'hud-boss';
    const bossName = el('div', 'boss-name', '');
    const bossSvg = document.createElementNS(ns, 'svg');
    bossSvg.setAttribute('viewBox', '0 0 720 26');
    bossSvg.setAttribute('preserveAspectRatio', 'none');
    const bTrack = document.createElementNS(ns, 'path');
    bTrack.setAttribute('class', 'b-track');
    bTrack.setAttribute('d', 'M4,22 Q360,-6 716,22');
    const bFill = document.createElementNS(ns, 'path');
    bFill.setAttribute('class', 'b-fill');
    bFill.setAttribute('d', 'M4,22 Q360,-6 716,22');
    bossSvg.append(bTrack, bFill);
    boss.append(bossName, bossSvg);

    /* -- gold / kills ----------------------------------------------------- */
    const stats = el('div'); stats.id = 'hud-stats';
    const goldLine = el('div', 'stat-line gold');
    const goldV = el('span', 'v', '0');
    goldLine.append(el('span', 'label', 'Gold'), goldV);
    const killLine = el('div', 'stat-line');
    const killV = el('span', 'v', '0');
    killLine.append(el('span', 'label', 'Slain'), killV);
    stats.append(goldLine, killLine);

    const weapons = el('div'); weapons.id = 'hud-weapons';
    const passives = el('div'); passives.id = 'hud-passives';
    const toasts = el('div'); toasts.id = 'hud-toasts';

    hud.append(portraitWrap, timer, boss, stats, weapons, passives, toasts);

    this.els = {
      aHP, aXP, portrait, lvl, name, hpText, meters,
      timeText, railFill, mode,
      boss, bossName, bFill,
      goldV, killV, weapons, passives, toasts,
      hpCirc: 2 * Math.PI * rHP, xpCirc: 2 * Math.PI * rXP,
      bossLen: 0,
      weaponSlots: new Map(), passiveSlots: new Map(), toastNodes: new Map(),
    };
    aHP.style.strokeDasharray = this.els.hpCirc;
    aXP.style.strokeDasharray = this.els.xpCirc;
    // Measure the boss curve once so the fill can be dash-offset along it.
    this.els.bossLen = (bFill.getTotalLength && bFill.getTotalLength()) || 745;
    bFill.style.strokeDasharray = this.els.bossLen;
  };

  UI.enterGame = function () {
    this.closeOverlay();
    this.hud.classList.remove('hidden');
    const p = WS.Game.player;
    // The portrait shows the survivor's actual silhouette, not a glyph.
    this.els.portrait.innerHTML = '';
    const img = new Image();
    img.src = WS.Sprites.hero(p.characterId, p.character.color, 64).toDataURL();
    img.width = img.height = 64;
    this.els.portrait.append(img);
    this.els.name.textContent = p.character.name;
    this.rebuildWeapons();
    this.rebuildPassives();
  };

  UI.rebuildWeapons = function () {
    const wrap = this.els.weapons;
    wrap.innerHTML = '';
    this.els.weaponSlots.clear();
    const ns = 'http://www.w3.org/2000/svg';
    for (const w of WS.Game.player.weapons) {
      const slot = el('div', 'wslot');
      if (w.evolved) slot.classList.add('evolved');
      const img = icon(w.data.art, WS.Weapon.colour(w), 52);
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 60 60');
      const track = svgArc(26, 2.5, 'cd-track');
      const arc = svgArc(26, 2.5, 'cd-arc');
      const circ = 2 * Math.PI * 26;
      arc.style.strokeDasharray = circ;
      svg.append(track, arc);
      const rank = el('div', 'rank', w.evolved ? 'MAX' : String(w.level));
      slot.append(img, svg, rank);
      slot.title = `${w.evolved ? w.data.evolveName : w.data.name}\n${w.data.description}`;
      wrap.append(slot);
      this.els.weaponSlots.set(w.id, { arc, circ, rank, slot });
    }
  };

  UI.rebuildPassives = function () {
    const wrap = this.els.passives;
    wrap.innerHTML = '';
    const p = WS.Game.player;
    for (const id of WS.UpgradeOrder) {
      const rank = p.upgradeLevels[id];
      if (!rank) continue;
      const up = WS.Upgrades[id];
      const slot = el('div', 'pslot');
      slot.append(icon(up.art, qualityColour(up.quality), 34), el('div', 'rank', String(rank)));
      slot.title = `${up.name} - rank ${rank}/${up.max}\n${up.description}`;
      wrap.append(slot);
    }
  };

  UI.updateHUD = function () {
    const game = WS.Game;
    if (!game.player || !game.run) return;
    const p = game.player, run = game.run, e = this.els;

    const hpPct = WS.clamp(p.health / p.maxHealth, 0, 1);
    e.aHP.style.strokeDashoffset = e.hpCirc * (1 - hpPct);
    e.aHP.style.stroke = hpPct < 0.28 ? '#ff5a4a' : 'var(--blood)';
    const xpPct = WS.clamp(p.xp / p.xpToNext, 0, 1);
    e.aXP.style.strokeDashoffset = -e.xpCirc * (1 - xpPct);
    e.lvl.textContent = 'LV ' + p.level;
    e.hpText.innerHTML = `${WS.max(0, WS.floor(p.health))}<small> / ${WS.floor(p.maxHealth)}</small>`;

    e.timeText.textContent = WS.formatTime(run.time);
    e.railFill.style.width = WS.min(100, run.time / WS.Config.deathTime * 100) + '%';
    const modeBits = [];
    if (run.hyper) modeBits.push('Hyper');
    if (run.mode === 'endless') modeBits.push('True Endless');
    else if (run.victorious) modeBits.push('Overtime');
    if (run.map.arena) modeBits.push('Eclipse Arena - Phase ' + WS.Arena.phase);
    e.mode.textContent = modeBits.join(' · ');

    e.goldV.textContent = WS.formatNumber(run.gold);
    e.killV.textContent = WS.formatNumber(run.kills);

    // Boss arc: whichever boss has the most health left is the one shown.
    let boss = null;
    for (let i = 0; i < WS.Enemy.pool.count; i++) {
      const en = WS.Enemy.pool.active[i];
      if (en.boss && (!boss || en.health > boss.health)) boss = en;
    }
    if (boss) {
      e.boss.classList.remove('hidden');
      e.bossName.textContent = boss.template.name;
      const pct = WS.clamp(boss.health / boss.maxHealth, 0, 1);
      e.bFill.style.strokeDashoffset = e.bossLen * (1 - pct);
    } else {
      e.boss.classList.add('hidden');
    }

    // Weapon cooldown arcs.
    for (const w of p.weapons) {
      const slot = e.weaponSlots.get(w.id);
      if (!slot) { this.rebuildWeapons(); break; }
      const total = WS.Weapon.cooldown(p, w);
      const k = WS.clamp(1 - w.cooldown / total, 0, 1);
      slot.arc.style.strokeDashoffset = slot.circ * (1 - k);
      const label = w.evolved ? 'MAX' : String(w.level);
      if (slot.rank.textContent !== label) {
        slot.rank.textContent = label;
        slot.slot.classList.toggle('evolved', !!w.evolved);
      }
    }
    if (e.weaponSlots.size !== p.weapons.length) this.rebuildWeapons();

    // Resource meters: fel while attuned, Metamorphosis while transformed.
    this.updateMeters(p);
    this.updateToasts();
  };

  UI.updateMeters = function (p) {
    const wrap = this.els.meters;
    const want = [];
    if (p.metaTimer > 0) {
      const total = WS.Config.metaDuration + WS.Config.metaDurationPerRank * p.soulRending;
      want.push({ key: 'meta', cls: 'meta', label: 'Metamorphosis', pct: p.metaTimer / total });
    } else if (p.felAttuned > 0) {
      want.push({ key: 'fel', cls: 'fel', label: 'Fel', pct: p.fel / WS.Config.felToMeta });
    }
    if (wrap.childElementCount !== want.length
      || (want.length && wrap.firstChild.dataset.key !== want[0].key)) {
      wrap.innerHTML = '';
      for (const m of want) {
        const node = el('div', 'meter ' + m.cls);
        node.dataset.key = m.key;
        const label = el('div', 'meter-label', m.label);
        const track = el('div', 'meter-track');
        const fill = el('div', 'meter-fill');
        track.append(fill);
        node.append(label, track);
        wrap.append(node);
      }
    }
    let i = 0;
    for (const m of want) {
      const fill = wrap.children[i].querySelector('.meter-fill');
      if (fill) fill.style.width = WS.clamp(m.pct, 0, 1) * 100 + '%';
      i++;
    }
  };

  UI.updateToasts = function () {
    const wrap = this.els.toasts;
    const live = WS.Game.toasts;
    if (wrap.childElementCount === live.length) return;
    wrap.innerHTML = '';
    for (const t of live) {
      const node = el('div', 'toast');
      node.append(el('div', 't-title', t.title));
      if (t.body) node.append(el('div', 't-body', t.body));
      wrap.append(node);
    }
  };

  /* ============================================================ overlays == */
  UI.closeOverlay = function () {
    this.overlay.classList.add('hidden');
    this.overlay.innerHTML = '';
    this.banishMode = false;
  };

  function shell(title, sub) {
    const inner = el('div', 'overlay-inner');
    const head = el('div', 'overlay-head');
    const h1 = el('h1', null, title);
    head.append(h1);
    if (sub) head.append(el('div', 'sub', sub));
    const body = el('div', 'overlay-body');
    const foot = el('div', 'overlay-foot');
    inner.append(head, body, foot);
    return { inner, head, body, foot };
  }

  UI.show = function (inner) {
    this.overlay.innerHTML = '';
    this.overlay.append(inner);
    this.overlay.classList.remove('hidden');
  };

  /* ------------------------------------------------------------- cards --- */
  function cardFor(choice, onPick) {
    const colour = choiceColour(choice);
    const card = el('div', 'card bracketed');
    card.style.setProperty('--q', WS.hex(colour));
    const img = icon(choice.art || 'rune', colour, 64);
    img.className = 'icon';
    card.append(img);
    card.append(el('div', 'card-name', choice.name));
    if (choice.note) card.append(el('div', 'card-note', choice.note));
    card.append(el('div', 'card-body', choice.description || ''));
    if (choice.detail && WS.Save.settings.levelUpTooltips) {
      card.append(el('div', 'card-detail', choice.detail));
    }
    card.addEventListener('click', () => onPick(choice));
    return card;
  }

  /* ---------------------------------------------------------- main menu -- */
  UI.openMenu = function () {
    this.hud.classList.add('hidden');
    const s = shell('WoWSurvivors 2', 'Arclight');

    const title = el('div'); title.id = 'title-wrap';
    const h = el('h1', 'game-title');
    h.innerHTML = 'WoW<b>Survivors</b> 2';
    const sub = el('div', 'game-sub', 'A Warcraft arcade survival game');
    title.append(h, sub);
    s.head.replaceChildren(title);

    const tabs = el('div', 'tabs');
    const panes = el('div');
    const TABS = [
      ['roster', 'Survivor'],
      ['battlefields', 'Battlefield'],
      ['trainer', 'Trainer'],
      ['codex', 'Codex'],
      ['bestiary', 'Bestiary'],
      ['stats', 'Statistics'],
      ['settings', 'Settings'],
    ];
    const render = () => {
      for (const btn of tabs.children) btn.classList.toggle('active', btn.dataset.tab === UI.tab);
      panes.replaceChildren(UI.buildPane(UI.tab, render));
    };
    for (const [id, label] of TABS) {
      const b = el('button', 'tab', label);
      b.dataset.tab = id;
      b.addEventListener('click', () => { UI.tab = id; WS.Audio.play('ui'); render(); });
      tabs.append(b);
    }
    s.body.append(tabs, panes);
    render();

    const bank = el('div', 'bank');
    bank.append(el('span', 'label', 'Banked'), el('span', 'v', WS.formatNumber(WS.Save.db.gold) + 'g'));

    const begin = el('button', 'btn primary', 'Begin Run');
    begin.addEventListener('click', () => {
      const c = WS.Game.selection.character, m = WS.Game.selection.map;
      if (!WS.Save.isCharacterUnlocked(c) || !WS.Save.isMapUnlocked(m)) return;
      WS.Audio.init(); WS.Audio.resume();
      WS.Audio.play('select');
      WS.Game.startRun(m, c);
    });

    const diff = el('button', 'btn', '');
    const setDiffLabel = () => {
      const d = WS.Config.difficulties[WS.Save.settings.difficulty];
      diff.textContent = 'Difficulty: ' + d.label;
    };
    setDiffLabel();
    diff.addEventListener('click', () => {
      const order = WS.Config.difficultyOrder;
      const i = order.indexOf(WS.Save.settings.difficulty);
      WS.Save.settings.difficulty = order[(i + 1) % order.length];
      WS.Save.save();
      setDiffLabel();
      WS.Audio.play('ui');
    });

    const hyper = el('button', 'btn', '');
    const setHyperLabel = () => {
      hyper.textContent = 'Hyper: ' + (WS.Save.db.hyperArmed ? 'ON' : 'off');
      hyper.disabled = !Object.keys(WS.Save.db.unlocks.hyper).length;
    };
    setHyperLabel();
    hyper.addEventListener('click', () => {
      WS.Save.db.hyperArmed = !WS.Save.db.hyperArmed;
      WS.Save.save(); setHyperLabel(); WS.Audio.play('ui');
    });

    s.foot.append(bank, el('div', 'spacer'), diff, hyper, begin);
    this.show(s.inner);
  };

  UI.buildPane = function (tab, rerender) {
    if (tab === 'roster') return this.paneRoster();
    if (tab === 'battlefields') return this.paneMaps();
    if (tab === 'trainer') return this.paneTrainer(rerender);
    if (tab === 'codex') return this.paneCodex();
    if (tab === 'bestiary') return this.paneBestiary();
    if (tab === 'stats') return this.paneStats();
    return this.paneSettings(rerender);
  };

  UI.paneRoster = function () {
    const grid = el('div', 'pick-grid');
    grid.style.marginTop = '16px';
    for (const id of WS.CharacterOrder) {
      const c = WS.Characters[id];
      const unlocked = WS.Save.isCharacterUnlocked(id);
      const node = el('div', 'pick' + (unlocked ? '' : ' locked')
        + (WS.Game.selection.character === id ? ' selected' : ''));
      const img = new Image();
      img.src = WS.Sprites.hero(id, unlocked ? c.color : [0.18, 0.19, 0.24], 46).toDataURL();
      img.width = img.height = 46;
      if (!unlocked) img.style.filter = 'brightness(.6) contrast(.7)';
      const main = el('div');
      main.append(el('div', 'pick-name', unlocked ? c.name : '???'));
      main.append(el('div', 'pick-sub', unlocked
        ? `${c.className} · ${WS.Weapons[c.weapon].name}`
        : c.unlockHint || 'Locked'));
      if (unlocked) {
        main.append(el('div', 'pick-sub', WS.template(c.perk, c)));
      }
      node.append(img, main);
      if (unlocked) {
        node.addEventListener('click', () => {
          WS.Game.selection.character = id;
          WS.Audio.play('select');
          for (const n of grid.children) n.classList.remove('selected');
          node.classList.add('selected');
        });
      }
      grid.append(node);
    }
    return grid;
  };

  UI.paneMaps = function () {
    const grid = el('div', 'pick-grid');
    grid.style.marginTop = '16px';
    for (const id of WS.MapOrder) {
      const m = WS.Maps[id];
      const unlocked = WS.Save.isMapUnlocked(id);
      const node = el('div', 'pick' + (unlocked ? '' : ' locked')
        + (WS.Game.selection.map === id ? ' selected' : ''));
      const art = { forest: 'leaf', plains: 'wheat', haunted: 'deadtree', savannah: 'sun', glacier: 'crystal', arena: 'sovereign' }[m.art] || 'rune';
      node.append(icon(art, m.groundAlt, 46));
      const main = el('div');
      main.append(el('div', 'pick-name', m.name));
      main.append(el('div', 'pick-sub', unlocked ? m.subtitle : (m.unlockHint || 'Locked')));
      if (unlocked) {
        const bits = [`Difficulty x${m.difficulty}`, `Gold x${m.goldMult}`];
        if (WS.Save.db.unlocks.hyper[id]) bits.push('Hyper unlocked');
        main.append(el('div', 'pick-sub', bits.join(' · ')));
      }
      node.append(main);
      if (unlocked) {
        node.addEventListener('click', () => {
          WS.Game.selection.map = id;
          WS.Audio.play('select');
          for (const n of grid.children) n.classList.remove('selected');
          node.classList.add('selected');
        });
      }
      grid.append(node);
    }
    return grid;
  };

  UI.paneTrainer = function (rerender) {
    const wrap = el('div');
    wrap.style.marginTop = '16px';
    const intro = el('div', 'card-body',
      'Permanent training, bought with banked gold and applied to every future run.');
    intro.style.marginBottom = '12px';
    const rows = el('div', 'rows');
    for (const id of WS.MetaUpgradeOrder) {
      const m = WS.MetaUpgrades[id];
      const rank = WS.Save.metaRank(id);
      const cost = WS.Save.metaCost(id);
      const row = el('div', 'row');
      row.append(icon(m.art, WS.CONST.COLORS.arc, 40));
      const main = el('div', 'row-main');
      main.append(el('div', 'row-name', m.name));
      main.append(el('div', 'row-sub', `${m.description} · Rank ${rank}/${m.max}`));
      if (m.max <= 10) {
        const pips = el('div', 'rank-pips');
        for (let i = 0; i < m.max; i++) {
          const pip = el('i');
          if (i < rank) pip.classList.add('on');
          pips.append(pip);
        }
        main.append(pips);
      }
      row.append(main);
      if (cost === null) {
        row.append(el('div', 'row-value', 'MAXED'));
      } else {
        const buy = el('button', 'btn small', `${WS.formatNumber(cost)}g`);
        buy.disabled = WS.Save.db.gold < cost;
        buy.addEventListener('click', () => {
          if (WS.Save.buyMeta(id)) { WS.Audio.play('coin'); rerender(); }
        });
        row.append(buy);
      }
      rows.append(row);
    }
    wrap.append(intro, rows);
    return wrap;
  };

    wrap.style.marginTop = '16px';

    const achHead = el('h3'); achHead.className = 'panel-title'; achHead.style.padding = '0 0 10px';
    achHead.textContent = 'Achievements';
    const achRows = el('div', 'rows');
    for (const id of WS.AchievementOrder) {
      const a = WS.Achievements[id];
      const done = !!WS.Save.db.achievements[id];
      const row = el('div', 'row ' + (done ? 'done' : 'undone'));
      row.append(icon(a.art, done ? WS.CONST.QUALITY.uncommon : [0.35, 0.38, 0.45], 40));
      const main = el('div', 'row-main');
      main.append(el('div', 'row-name', a.name));
      main.append(el('div', 'row-sub', a.description));
      row.append(main);
      if (a.reward) row.append(el('div', 'row-value', WS.Achievements.rewardText(a)));
      achRows.append(row);
    }

    const comboHead = el('h3'); comboHead.className = 'panel-title'; comboHead.style.padding = '20px 0 10px';
    comboHead.textContent = 'Discoveries';
    const comboRows = el('div', 'rows');
    for (const id of WS.ComboOrder) {
      const c = WS.Combos[id];
      const found = !!WS.Save.db.combos[id];
      const row = el('div', 'row ' + (found ? 'done' : 'undone'));
      row.append(icon(found ? 'arcane' : 'rune', found ? WS.CONST.QUALITY.epic : [0.35, 0.38, 0.45], 40));
      const main = el('div', 'row-main');
      main.append(el('div', 'row-name', found ? c.name : '? ? ?'));
      main.append(el('div', 'row-sub', found

        : c.hint));
      row.append(main);
      comboRows.append(row);

  UI.paneBestiary = function () {
    const wrap = el('div');
    wrap.style.marginTop = '16px';
    const rows = el('div', 'rows');
    const all = [];
    for (const id of Object.keys(WS.Enemies)) all.push([id, WS.Enemies[id], 'Creature']);
    for (const id of Object.keys(WS.Elites)) all.push([id, WS.Elites[id], 'Elite']);
    for (const id of Object.keys(WS.Bosses)) all.push([id, WS.Bosses[id], 'Boss']);
    for (const [id, t, kind] of all) {
      const kills = WS.Save.stats.bestiary[id] || WS.Save.stats.bosses[id] || 0;
      const known = kills > 0;
      const row = el('div', 'row ' + (known ? '' : 'undone'));
      const img = new Image();
      img.src = WS.Sprites.creature(t.art, known ? t.tint : [0.3, 0.32, 0.38], 40).toDataURL();
      img.width = img.height = 40;
      row.append(img);
      const main = el('div', 'row-main');
      main.append(el('div', 'row-name', known ? t.name : '???'));
      main.append(el('div', 'row-sub', known
        ? `${kind} · ${t.family} · ${t.health} health · ${t.damage} damage`
        : `${kind} - not yet slain`));
      row.append(main);
      row.append(el('div', 'row-value', known ? `${WS.formatNumber(kills)} slain` : ''));
      rows.append(row);
    }
    wrap.append(rows);
    return wrap;
  };

  UI.paneStats = function () {
    const s = WS.Save.stats;
    const wrap = el('div');
    wrap.style.marginTop = '16px';
    const grid = el('div', 'stat-grid');
    const items = [
      ['Runs', WS.formatNumber(s.totalRuns)],
      ['Victories', WS.formatNumber(s.totalVictories)],
      ['Enemies slain', WS.formatNumber(s.totalKills)],
      ['Gold earned', WS.formatNumber(s.totalGold)],
      ['Gems gathered', WS.formatNumber(s.gemsCollected)],
      ['Time survived', WS.formatTime(s.totalTime)],
      ['Longest run', WS.formatTime(s.bestRunTime)],
      ['Highest level', WS.formatNumber(s.bestLevel)],
      ['Best damage in a run', WS.formatNumber(s.bestDamage)],
      ['Evolutions', WS.formatNumber(s.evolutions)],
      ['Unions forged', WS.formatNumber(s.unions)],
      ['Longest unhurt streak', WS.formatTime(s.bestNoHitStreak)],
    ];
    for (const [label, value] of items) {
      const node = el('div', 'stat');
      node.append(el('div', 'stat-value', value));

    }

      best.append(row);
    }
    wrap.append(grid, best);
    return wrap;
