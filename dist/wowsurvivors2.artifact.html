/* ===== src/ui/arclight.css ===== */
/* ===========================================================================
   ARCLIGHT UI - "The Endless Night: gilt, gable, candlelight."
   An illuminated manuscript that happens to be a game interface. Wine-dark
   ground, gilt metal frames, parchment pages, tarot cards with gabled tops,
   and everything lit as if by candle. See docs/ARCLIGHT-UI.md.
   ======================================================================== */

:root {
  /* -- ground ---------------------------------------------------------- */
  --night:        #0a0710;
  --night-deep:   #06040a;
  --night-warm:   #0d0913;
  --vellum-dark:  #1a1220;   /* card interiors */
  --slate-dark:   #1c1322;
  --ink-plate:    #231525;   /* darkest ink / portrait ground */

  /* -- gilt ------------------------------------------------------------ */
  --gilt-hi:      #efdcb0;
  --gilt-lit:     #e6ca8e;
  --gilt:         #d9b467;
  --gilt-mid:     #c39b46;
  --gilt-deep:    #a9873c;
  --gilt-shadow:  #7a5a24;
  --gilt-dark:    #6b4f1d;
  --gilt-darkest: #5d4419;
  --boss-rivet:   #f4e6c0;
  --leaf:         #e6d0a2;   /* gold ink on dark */
  --leaf-dim:     rgba(232, 207, 143, .68);
  --leaf-faint:   rgba(232, 207, 143, .42);
  --candle:       #e2c07a;

  /* -- parchment ------------------------------------------------------- */
  --parchment:    #e2d2ae;
  --ink:          #231525;
  --ink-soft:     rgba(35, 21, 37, .87);
  --ink-dim:      rgba(35, 21, 37, .66);
  --ink-faint:    rgba(35, 21, 37, .45);
  --rule:         rgba(122, 90, 36, .5);
  --rule-soft:    rgba(122, 90, 36, .22);

  /* -- blood ----------------------------------------------------------- */
  --blood:        #8f1526;
  --blood-lit:    #9e2230;
  --blood-deep:   #5e0c17;
  --blood-bar:    #a83030;
  --blood-bar-lo: #63101c;
  --health:       #b8442f;
  --health-lo:    #7a1220;
  --blood-pale:   #eeb6ab;

  /* -- other registers ------------------------------------------------- */
  --arcane:       #9a86c4;   /* experience */
  --arcane-mid:   #6a55a0;
  --arcane-lo:    #3a2c60;
  --ember:        #c9835c;   /* damage */
  --verdant:      #6fb494;   /* healing */
  --verdant-deep: #1c5c46;

  /* -- surfaces -------------------------------------------------------- */
  --gilt-inset:   inset 0 0 0 1px rgba(217, 180, 103, .35);
  --gilt-inset-2: inset 0 0 0 1px rgba(217, 180, 103, .45);
  --grain:        radial-gradient(rgba(242, 223, 174, .05) .6px, transparent .7px);
  --grain-paper:  radial-gradient(rgba(60, 40, 24, .085) .6px, transparent .7px);

  --gable:        polygon(50% 0, 100% 22%, 100% 100%, 0 100%, 0 22%);
  --gable-tall:   polygon(50% 0, 100% 13%, 100% 100%, 0 100%, 0 13%);
  --gable-card:   polygon(50% 0, 100% 15%, 100% 100%, 0 100%, 0 15%);
  --gable-wide:   polygon(50% 0, 100% 26%, 100% 100%, 0 100%, 0 26%);

  --gilt-edge:    linear-gradient(160deg, #7a5a24, #e2c07a 45%, #7a5a24);
  --gilt-edge-rich: linear-gradient(152deg, #6b4f1d, #e6ca8e 30%, #efdcb0 42%, #c39b46 58%, #6b4f1d 82%, #a9873c);
  --gilt-frame:   linear-gradient(150deg, #6b4f1d, #e6ca8e 26%, #c39b46 52%, #6b4f1d 78%, #a9873c);

  --display: 'Cinzel Decorative', 'Cinzel', Georgia, 'Times New Roman', serif;
  --title:   'Cinzel', Georgia, 'Times New Roman', serif;
  --prose:   'EB Garamond', Georgia, 'Times New Roman', serif;
  --figure:  'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;

  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--night-deep);
  color: var(--leaf);
  font-family: var(--prose);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  touch-action: none;
}

#stage { position: fixed; inset: 0; }
#game-canvas { position: absolute; inset: 0; display: block; }

/* The candlelit ground the whole interface sits on. */
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background-image: var(--grain);
  background-size: 22px 22px;
  opacity: .55;
}

.hidden { display: none !important; }

/* ------------------------------------------------------------ lettering */
.kicker {
  font: 400 10.5px var(--title); letter-spacing: .24em;
  text-transform: uppercase; color: var(--leaf-dim);
}
.kicker-wide { letter-spacing: .36em; }
.kicker-blood { color: rgba(143, 21, 38, .95); }
.kicker-ink { color: rgba(35, 21, 37, .78); }
.figure { font-family: var(--figure); font-variant-numeric: tabular-nums; }
.numeral { font-family: var(--title); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------- ornaments */
/* A tracked line flanked by hairlines and rotated diamonds. */
.ornament {
  display: flex; align-items: center; justify-content: center; gap: 16px;
}
.ornament .bar { flex: 1; max-width: 190px; height: 1px; }
.ornament .bar.l { background: linear-gradient(90deg, rgba(217,180,103,0), rgba(217,180,103,.7)); }
.ornament .bar.r { background: linear-gradient(90deg, rgba(217,180,103,.7), rgba(217,180,103,0)); }
.ornament .lozenge { width: 7px; height: 7px; background: var(--gilt); transform: rotate(45deg); flex: none; }
.ornament .text {
  font: 400 11px var(--title); letter-spacing: .36em;
  color: rgba(235, 213, 158, .86); white-space: nowrap;
}

/* ------------------------------------------------------------- gables */
/* The tarot silhouette: a gilt edge with a face clipped to the same gable. */
.gable { background: var(--gilt-edge); padding: 2px; clip-path: var(--gable); }
.gable > .pane { height: 100%; clip-path: var(--gable); }

/* ------------------------------------------------------------ buttons */
.btn {
  appearance: none; cursor: pointer; border: 0; padding: 2px;
  background: linear-gradient(150deg, #6b4f1d, #e6ca8e 30%, #efdcb0 44%, #c39b46 60%, #6b4f1d);
  clip-path: var(--gable-wide);
  font-family: var(--title);
  transition: filter .18s var(--ease), transform .12s var(--ease);
}
.btn > span {
  display: block; clip-path: var(--gable-wide);
  background: linear-gradient(180deg, #2a1520, #150a12);
  padding: 15px 30px 12px; text-align: center;
  font: 500 12px var(--title); letter-spacing: .30em; text-transform: uppercase;
  color: var(--leaf); text-shadow: 0 0 20px rgba(255, 190, 110, .2);
}
.btn:hover { filter: brightness(1.18); }
.btn:active { transform: translateY(1px); }
.btn:disabled { filter: grayscale(.8) brightness(.55); cursor: not-allowed; }
.btn.small > span { padding: 10px 18px 8px; font-size: 10.5px; letter-spacing: .22em; }

/* A plain inset chip - reroll, banish, tabs. */
.chip {
  appearance: none; cursor: pointer; border: 0;
  padding: 9px 20px;
  background: rgba(242, 223, 174, .06);
  box-shadow: var(--gilt-inset-2);
  font: 400 11px var(--title); letter-spacing: .22em; text-transform: uppercase;
  color: var(--leaf);
  transition: background .18s var(--ease), color .18s var(--ease);
}
.chip:hover { background: rgba(242, 223, 174, .13); }
.chip.blood {
  background: rgba(143, 21, 38, .18);
  box-shadow: inset 0 0 0 1px rgba(158, 34, 48, .6);
  color: var(--blood-pale);
}
.chip.blood:hover { background: rgba(143, 21, 38, .3); }
.chip:disabled { opacity: .35; cursor: not-allowed; }
.chip.active { background: rgba(242, 223, 174, .16); color: var(--gilt-hi); }

/* =========================================================== overlays == */
#overlay {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: 22px;
  background-color: rgba(8, 5, 12, .84);
  background-image:
    radial-gradient(58% 50% at 50% 34%, rgba(255, 196, 120, .10), rgba(0,0,0,0) 70%),
    var(--grain);
  background-size: auto, 26px 26px;
}
#overlay.hidden { display: none; }

.sheet {
  width: min(1280px, 100%); max-height: 100%;
  display: flex; flex-direction: column;
  animation: rise .28s var(--ease);
}
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* --- the illuminated spread: a gilt frame around parchment pages ------- */
.spread {
  position: relative;
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--gilt-frame);
  padding: 5px; gap: 5px;
  filter: drop-shadow(0 22px 28px rgba(0, 0, 0, .7));
  min-height: 0;
}
.spread.single { grid-template-columns: 1fr; }
.spread .rivet {
  position: absolute; width: 5px; height: 5px; border-radius: 50%; z-index: 3;
  background: radial-gradient(circle at 34% 30%, #f4e6c0, #8a6a2c);
}
.spread .rivet.tl { left: 12px; top: 12px; }
.spread .rivet.tr { right: 12px; top: 12px; }
.spread .rivet.bl { left: 12px; bottom: 12px; }
.spread .rivet.br { right: 12px; bottom: 12px; }

.page {
  position: relative; min-height: 0;
  padding: 30px 30px 26px;
  background-color: var(--parchment);
  background-image: var(--grain-paper),
    radial-gradient(80% 70% at 20% 0%, rgba(255, 250, 236, .45), rgba(0,0,0,0) 60%);
  background-size: 3.5px 3.5px, auto;
  color: var(--ink);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.page.right {
  background-image: var(--grain-paper),
    radial-gradient(80% 70% at 80% 0%, rgba(255, 250, 236, .45), rgba(0,0,0,0) 60%);
}
/* The gutter: the shadow where the pages meet the spine. */
.page::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 26px;
  background: linear-gradient(90deg, rgba(0,0,0,0), rgba(60, 38, 20, .22));
  pointer-events: none;
}
.page.right::after { right: auto; left: 0; background: linear-gradient(270deg, rgba(0,0,0,0), rgba(60, 38, 20, .22)); }

.page-head {
  display: flex; align-items: flex-start; gap: 16px;
  padding-bottom: 16px; flex: none;
  border-bottom: 1px solid var(--rule);
  box-shadow: 0 4px 0 -3px var(--rule);
}
.page-head .sigil {
  flex: none; width: 62px; height: 62px; display: grid; place-items: center;
  background: linear-gradient(150deg, #8f1526, #5e0c17);
  box-shadow: inset 0 0 0 1px rgba(232, 207, 143, .5);
  font: 700 34px var(--display); color: var(--leaf);
}
.page-head h2 {
  margin: 0; font: 500 34px/1 var(--title); letter-spacing: .02em; color: var(--ink);
}
.page-head .sub {
  font: 400 16px var(--prose); font-style: italic; color: var(--ink-dim); margin-top: 5px;
}
.page-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; }
.page-body::-webkit-scrollbar { width: 7px; }
.page-body::-webkit-scrollbar-thumb { background: rgba(122, 90, 36, .35); }

/* The seal in the top-right corner of a page: run number, gold, etc. */
.seal {
  position: absolute; right: 30px; top: 24px; transform: rotate(-6deg);
  width: 62px; height: 62px; border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(122, 90, 36, .55), inset 0 0 0 6px rgba(122, 90, 36, .3);
  display: grid; place-items: center; text-align: center; z-index: 2;
}
.seal .k { font: 400 10px var(--title); letter-spacing: .2em; color: rgba(35, 21, 37, .78); }
.seal .v { font: 400 19px var(--title); font-variant-numeric: tabular-nums; color: rgba(143, 21, 38, .88); }

/* --- roster rows ------------------------------------------------------ */
.entry {
  position: relative; display: flex; align-items: baseline; gap: 12px;
  padding: 9px 8px; cursor: pointer;
  border-bottom: 1px solid var(--rule-soft);
  transition: background .16s var(--ease);
}
.entry:hover { background: rgba(122, 90, 36, .08); }
.entry .mark {
  position: absolute; left: -4px; top: 50%; width: 6px; height: 6px; margin-top: -3px;
  background: transparent; transform: rotate(45deg);
}
.entry.selected { background: rgba(143, 21, 38, .09); }
.entry.selected .mark { background: var(--blood); }
.entry .cls {
  flex: none; width: 118px;
  font: 400 10.5px var(--title); letter-spacing: .14em; color: rgba(35, 21, 37, .78);
}
.entry .name { font: 500 16px var(--title); letter-spacing: .01em; color: rgba(31, 25, 20, .92); }
.entry .title { font: 400 15px/1.3 var(--prose); color: rgba(31, 25, 20, .58); }
.entry.locked { cursor: not-allowed; }
.entry.locked .name { color: rgba(31, 25, 20, .45); }
.entry.locked .title { color: rgba(31, 25, 20, .42); font-style: italic; }

/* --- dotted leader stat lines ---------------------------------------- */
.leaders { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 26px; }
.leaders.one-col { grid-template-columns: 1fr; }
.leader { display: flex; align-items: baseline; gap: 8px; }
.leader .k { font: 400 10px var(--title); letter-spacing: .13em; color: rgba(35, 21, 37, .78); }
.leader .dots { flex: 1; border-bottom: 1px dotted rgba(122, 90, 36, .6); transform: translateY(-4px); }
.leader .v {
  font: 400 16px var(--title); font-variant-numeric: tabular-nums;
  letter-spacing: .02em; color: var(--ink);
}

/* --- a called-out passage (perk, flavour) ----------------------------- */
.passage {
  padding: 14px 16px;
  background: linear-gradient(90deg, rgba(143, 21, 38, .1), rgba(143, 21, 38, .02));
  border-left: 3px solid var(--blood);
}
.passage p { margin: 6px 0 0; font: 400 17px/1.4 var(--prose); color: var(--ink-soft); }

/* --- the boss schedule rail ------------------------------------------ */
.schedule { position: relative; height: 1px; background: rgba(122, 90, 36, .55); margin: 22px 4px 0; }
.schedule .tick {
  position: absolute; top: -4px; width: 8px; height: 8px; margin-left: -4px;
  background: var(--ink); transform: rotate(45deg);
}
.schedule .death {
  position: absolute; top: -8px; right: -6px; width: 16px; height: 16px;
  background: linear-gradient(150deg, #992430, #5a0e18); transform: rotate(45deg);
  box-shadow: 0 0 10px rgba(153, 36, 48, .35);
}
.schedule .from {
  position: absolute; top: 11px; left: -2px;
  font: 400 10px var(--figure); font-variant-numeric: tabular-nums; color: rgba(35, 21, 37, .78);
}
.schedule .to {
  position: absolute; top: 11px; right: -4px;
  font: 400 9.5px var(--title); letter-spacing: .12em; color: rgba(143, 21, 38, .95);
}

/* ============================================================ cards === */
/* A tarot card: gilt edge, parchment face, cut shoulders, a little askew. */
.card {
  width: 252px; cursor: pointer;
  filter: drop-shadow(0 22px 24px rgba(0, 0, 0, .85));
  transition: transform .18s var(--ease), filter .18s var(--ease);
  background: none; border: 0; padding: 0;
}
.card .edge {
  clip-path: var(--gable-card); padding: 4px;
  background: linear-gradient(152deg, #6b4f1d, #e6ca8e 32%, #efdcb0 44%, #c39b46 60%, #6b4f1d);
}
.card .face {
  clip-path: var(--gable-card);
  background-color: var(--parchment);
  background-image: var(--grain-paper);
  background-size: 3.5px 3.5px;
  padding: 34px 18px 18px;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 300px; text-align: center;
}
.card:hover { filter: drop-shadow(0 26px 30px rgba(0, 0, 0, .9)) brightness(1.05); }
.card .kick {
  font: 400 9.5px var(--title); letter-spacing: .2em; color: rgba(143, 21, 38, .92);
}
.card .name { font: 500 24px/1.05 var(--title); letter-spacing: .01em; color: var(--ink); }
.card .hr { flex: none; align-self: center; width: 38px; height: 1px; background: rgba(122, 90, 36, .6); }
.card .body { margin: 0; font: 400 16px/1.35 var(--prose); color: var(--ink-soft); }
.card .foot {
  margin-top: auto; padding-top: 9px; border-top: 1px solid rgba(122, 90, 36, .35);
  font: 400 14px/1.3 var(--prose); font-style: italic; color: var(--ink-dim);
}
.card .plate { align-self: center; }
.card.arcana .plate { width: 132px; height: 150px; flex: none; }
.card.arcana .plate img { width: 104px; height: 104px; }

/* The taller Arcana card, dealt at the start of a run. */
.card.arcana { width: 296px; filter: drop-shadow(0 26px 30px rgba(0, 0, 0, .78)); }
.card.arcana .edge {
  clip-path: var(--gable-tall); padding: 6px;
  background: linear-gradient(152deg, #6b4f1d, #e6ca8e 30%, #efdcb0 42%, #c39b46 58%, #6b4f1d 82%, #a9873c);
}
.card.arcana .face {
  clip-path: var(--gable-tall);
  background-image: var(--grain-paper), radial-gradient(90% 60% at 50% 8%, rgba(255,250,236,.5), rgba(0,0,0,0) 60%);
  background-size: 3.5px 3.5px, auto;
  padding: 44px 22px 26px; min-height: 512px; gap: 16px; position: relative;
}
.card.arcana .numeral-mark { font: 400 21px var(--title); letter-spacing: .08em; color: var(--blood); }
.card.arcana .name { font-size: 25px; }
/* Corner pins and side flourishes, as on a real card back. */
.card.arcana .face::before,
.card.arcana .face::after {
  content: ""; position: absolute; bottom: 9px; width: 4px; height: 4px;
  background: var(--gilt-shadow); transform: rotate(45deg);
}
.card.arcana .face::before { left: 9px; }
.card.arcana .face::after { right: 9px; }

.hand { display: flex; gap: 22px; justify-content: center; align-items: flex-start; }
.hand.arcana-hand { gap: 34px; }

/* The dark portrait plate inside a card. */
.plate-gable {
  flex: none; background: var(--gilt-edge); padding: 2px; clip-path: var(--gable);
}
.plate-gable > .pane {
  height: 100%; clip-path: var(--gable);
  background-color: var(--vellum-dark);
  background-image:
    radial-gradient(70% 60% at 50% 24%, rgba(255, 198, 124, .26), rgba(0,0,0,0) 70%),
    radial-gradient(rgba(242, 223, 174, .14) .8px, transparent .9px);
  background-size: auto, 5px 5px;
  display: grid; place-items: center;
}
.plate-gable img { width: 100%; height: 100%; object-fit: contain; }

/* =============================================================== HUD == */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud.hidden { display: none; }

/* --- the experience rail across the very top ------------------------- */
#hud-top { position: absolute; left: 0; right: 0; top: 0; padding: 14px 22px 0; }
#xp-rail {
  height: 11px; position: relative;
  background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(20,12,24,.5));
  box-shadow: var(--gilt-inset);
}
#xp-rail .fill {
  position: absolute; top: 1px; bottom: 1px; left: 1px;
  background: linear-gradient(180deg, #9a86c4, #6a55a0 60%, #3a2c60);
  box-shadow: 0 0 10px rgba(140, 112, 200, .2);
}
#xp-rail .head {
  position: absolute; top: -2px; width: 13px; height: 13px; margin-left: -6px;
  background: linear-gradient(150deg, #efdcb0, #c39b46); transform: rotate(45deg);
  box-shadow: 0 0 10px rgba(230, 196, 131, .32);
}
#xp-underline {
  height: 1px; margin-top: 3px;
  background: linear-gradient(90deg, rgba(154,134,196,0), rgba(154,134,196,.3) 30%, rgba(154,134,196,.3) 70%, rgba(154,134,196,0));
}

#hud-row { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 13px; }

/* --- portrait + name + health ---------------------------------------- */
#hud-who { display: flex; gap: 12px; align-items: flex-start; }
#hud-portrait { width: 48px; height: 52px; }
#hud-portrait .pane {
  background-color: var(--ink-plate);
  background-image: radial-gradient(rgba(242, 223, 174, .2) .9px, transparent 1px);
  background-size: 5px 5px;
  display: grid; place-items: center;
}
#hud-portrait img { width: 44px; height: 44px; }
#hud-vitals { display: flex; flex-direction: column; gap: 6px; padding-top: 3px; }
#hud-vitals .line { display: flex; align-items: baseline; gap: 10px; }
#hud-vitals .who { font: 500 16px var(--title); letter-spacing: .03em; color: var(--leaf); }
#hud-vitals .lvl {
  font: 400 9.5px var(--figure); font-variant-numeric: tabular-nums;
  letter-spacing: .16em; color: var(--leaf-dim);
}
#hp-bar {
  width: 230px; height: 9px; position: relative;
  background: rgba(0, 0, 0, .55); box-shadow: inset 0 0 0 1px rgba(217, 180, 103, .3);
}
#hp-bar .fill {
  position: absolute; top: 1px; bottom: 1px; left: 1px;
  background: linear-gradient(180deg, #b8442f, #7a1220);
}
#hp-text {
  font: 400 9.5px var(--figure); font-variant-numeric: tabular-nums;
  letter-spacing: .1em; color: rgba(232, 207, 143, .7);
}
/* Desecration and fel ride under the health bar in their own registers. */
#hud-meters { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.meter { width: 230px; }
.meter .label {
  font: 400 8.5px var(--title); letter-spacing: .2em; color: var(--leaf-faint); margin-bottom: 2px;
}
.meter .track { height: 5px; background: rgba(0,0,0,.5); box-shadow: inset 0 0 0 1px rgba(217,180,103,.22); position: relative; }
.meter .fill { position: absolute; top: 1px; bottom: 1px; left: 1px; width: 0; }
.meter.fel .fill { background: linear-gradient(180deg, #8fd35a, #3e7a24); }
.meter.meta .fill { background: linear-gradient(180deg, #eaffd8, #8fd35a); }

/* --- the clock and the boss ------------------------------------------ */
#hud-clock { text-align: center; }
#clock {
  font: 400 48px/.95 var(--title); font-variant-numeric: tabular-nums;
  letter-spacing: .04em; color: var(--leaf);
  text-shadow: 0 2px 0 rgba(0,0,0,.8), 0 0 36px rgba(255, 190, 110, .14);
}
#hud-boss { margin-top: 12px; width: 440px; display: flex; align-items: center; gap: 10px; }
#hud-boss.hidden { display: none; }
#hud-boss .orb {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, rgba(255,150,150,.4), rgba(0,0,0,0) 60%),
              radial-gradient(circle, #992430, #5a0e18);
  box-shadow: inset 0 0 0 2px rgba(242, 223, 174, .18);
}
#boss-bar {
  flex: 1; height: 15px; position: relative;
  background: rgba(0, 0, 0, .6); box-shadow: inset 0 0 0 1px rgba(217, 180, 103, .4);
}
#boss-bar .fill {
  position: absolute; top: 1px; bottom: 1px; left: 1px;
  background: linear-gradient(180deg, #a83030, #63101c);
  box-shadow: 0 0 12px rgba(168, 48, 48, .2);
}
#boss-bar .ticks {
  position: absolute; inset: 1px;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 1px, rgba(0,0,0,0) 1px 10%);
}
#boss-bar .name {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 400 10.5px var(--title); letter-spacing: .24em; color: rgba(255, 238, 222, .92);
  white-space: nowrap; overflow: hidden;
}

/* --- the tallies ------------------------------------------------------ */
#hud-tallies { display: flex; gap: 24px; padding-top: 6px; }
.tally { text-align: right; }
.tally .k { font: 400 9.5px var(--title); letter-spacing: .18em; color: rgba(232, 207, 143, .62); }
.tally .v {
  font: 400 22px var(--title); font-variant-numeric: tabular-nums;
  letter-spacing: .02em; color: var(--leaf);
}
.tally.dmg .v { color: var(--ember); }
.tally.heal .v { color: var(--verdant); }
.tally.gold .v { color: var(--candle); }

/* --- the foot: arms, difficulty, passives ---------------------------- */
#hud-foot {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 0 22px 16px; z-index: 3;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
}
#hud-arms { display: flex; gap: 8px; }
.arm { width: 50px; height: 54px; position: relative; }
.arm .pane {
  background-color: var(--slate-dark);
  background-image: radial-gradient(rgba(242, 223, 174, .16) .9px, transparent 1px);
  background-size: 5px 5px;
  position: relative; display: grid; place-items: center;
}
.arm img { width: 40px; height: 40px; }
.arm .rank {
  position: absolute; right: 4px; bottom: 2px;
  font: 400 12px var(--title); color: var(--leaf);
  text-shadow: 0 1px 2px rgba(0,0,0,.9);
}
.arm.evolved { filter: drop-shadow(0 0 7px rgba(230, 196, 131, .45)); }
#hud-diff {
  text-align: center; padding-bottom: 8px; flex: 1;
  font: 400 16px var(--prose); font-style: italic; color: rgba(232, 207, 143, .64);
}
#hud-passives { display: flex; gap: 6px; flex-wrap: wrap-reverse; justify-content: flex-end; max-width: 34vw; }
.rune {
  width: 32px; height: 32px; position: relative;
  background: rgba(242, 223, 174, .06); box-shadow: inset 0 0 0 1px rgba(217, 180, 103, .3);
  display: grid; place-items: center;
}
.rune img { width: 24px; height: 24px; }
.rune .rank {
  position: absolute; right: 1px; bottom: 0;
  font: 400 9px var(--title); color: var(--leaf-dim);
  text-shadow: 0 1px 2px rgba(0,0,0,.9);
}

/* --- toasts ----------------------------------------------------------- */
#hud-toasts {
  position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
  width: min(520px, 76vw);
  display: flex; flex-direction: column-reverse; gap: 6px; align-items: center;
}
.toast {
  width: 100%; padding: 9px 16px;
  background: linear-gradient(90deg, rgba(26, 18, 32, .95), rgba(10, 7, 16, .9));
  box-shadow: var(--gilt-inset);
  border-left: 2px solid var(--gilt);
  animation: rise .22s var(--ease);
}
.toast .t { font: 400 11px var(--title); letter-spacing: .18em; color: var(--leaf); }
.toast .b { font: 400 15px/1.3 var(--prose); color: rgba(232, 207, 143, .62); margin-top: 2px; }

/* ---------------------------------------------------- the level-up band */
/* Not a full-screen takeover: a lit band across the middle of the field. */
#overlay.band { background: none; padding: 0; align-items: stretch; }
#overlay.band .sheet {
  position: absolute; left: 0; right: 0; top: 136px; bottom: 92px;
  width: auto; max-height: none;
  align-items: center; justify-content: center; gap: 18px;
  padding: 0 22px;
  background-image:
    radial-gradient(58% 58% at 50% 46%, rgba(255, 190, 120, .09), rgba(0,0,0,0) 70%),
    linear-gradient(rgba(6,4,9,.72), rgba(6,4,9,.93) 22%, rgba(6,4,9,.93) 78%, rgba(6,4,9,.72));
}
#overlay.band .sheet::before,
#overlay.band .sheet::after {
  content: ""; position: absolute; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, rgba(217,180,103,0), rgba(217,180,103,.4) 50%, rgba(217,180,103,0));
}
#overlay.band .sheet::before { top: 0; }
#overlay.band .sheet::after { bottom: 0; }
.band-head { text-align: center; }
.band-head .eyebrow {
  font: 400 10.5px var(--title); letter-spacing: .36em;
  color: rgba(235, 213, 158, .8); margin-bottom: 10px;
}
.band-head .title {
  font: 700 34px var(--display); color: var(--leaf);
  text-shadow: 0 2px 0 rgba(0,0,0,.7), 0 0 30px rgba(255, 190, 110, .13);
}
.band-foot { display: flex; align-items: center; gap: 14px; }

/* -------------------------------------------------- full-screen titles */
.rite { text-align: center; margin-bottom: 34px; }
.rite .title {
  font: 700 52px/1 var(--display); letter-spacing: .04em; color: var(--leaf);
  text-shadow: 0 2px 0 rgba(0,0,0,.7), 0 -1px 0 rgba(255, 241, 206, .18), 0 0 44px rgba(255, 190, 110, .12);
  margin-top: 18px;
}
.rite .sub {
  margin-top: 14px; font: 400 19px var(--prose); font-style: italic;
  color: rgba(232, 207, 143, .66);
}

/* ------------------------------------------------------------- ledgers */
/* The pause / death sheet: two parchment pages of accounts. */
.ledger h3 {
  margin: 0 0 10px; font: 400 10.5px var(--title); letter-spacing: .24em;
  text-transform: uppercase; color: rgba(143, 21, 38, .92);
}
.ledger > * + h3, .ledger .page-body > * + h3 { margin-top: 20px; }
.arm-row { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--rule-soft); }
.arm-row .glyph { flex: none; width: 40px; height: 40px; }
.arm-row .n { font: 500 17px var(--title); color: var(--ink); }
.arm-row .s { font: 400 14px/1.35 var(--prose); color: var(--ink-dim); margin-top: 2px; }

/* ---------------------------------------------------------------- misc */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; flex: none; }
.tab {

/* ===== src/core/util.js ===== */
/* WoWSurvivors 2 - core utilities.
 * Loaded first; every other file hangs off the global WS namespace, mirroring
 * the addon's `WS` table so ported logic reads the same. Classic scripts (no
 * ES modules) so the game runs straight off the filesystem. */
'use strict';
window.WS = window.WS || {};
(function (WS) {

  const M = Math;
  WS.PI = M.PI; WS.TAU = M.PI * 2;
  WS.min = M.min; WS.max = M.max; WS.abs = M.abs;
  WS.floor = M.floor; WS.ceil = M.ceil; WS.round = M.round;
  WS.sqrt = M.sqrt; WS.sin = M.sin; WS.cos = M.cos; WS.atan2 = M.atan2;

  WS.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  WS.lerp = (a, b, t) => a + (b - a) * t;

  /** Returns unit dx, dy and the original length. Zero-safe. */
  WS.normalize = function (dx, dy) {
    const d = M.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) return [0, 0, 0];
    return [dx / d, dy / d, d];
  };
  WS.dist = (ax, ay, bx, by) => M.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
  WS.dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);

  /* ---------------------------------------------------------------- random */
  // Deterministic-ish xorshift so a seeded run can be reproduced for debugging.
  let seed = (Date.now() ^ 0x9e3779b9) >>> 0;

  WS.weightedPick = function (list) {
    let total = 0;
    for (const e of list) total += (e.weight || 1);
    let roll = WS.random() * total;
    for (const e of list) {

      if (roll <= 0) return e;
    }
    return list[list.length - 1];
  };

    return arr;
  };

  WS.formatTime = function (seconds) {
    const s = WS.max(0, WS.floor(seconds));

  };

    ? `rgb(${(c[0] * 255) | 0},${(c[1] * 255) | 0},${(c[2] * 255) | 0})`

  /* ------------------------------------------------------------------ pool */
  /** Fixed-capacity object pool. `active` is a dense array; Release swaps the
   *  tail into the freed slot, so iteration must handle in-place removal. */
  WS.Pool = class Pool {
    constructor(factory, reset, cap) {
      this.factory = factory; this.reset = reset; this.cap = cap || 512;
      this.active = []; this.free = [];
    }
    get count() { return this.active.length; }
    acquire() {
      if (this.active.length >= this.cap) return null;
      const o = this.free.pop() || this.factory();
      o._dead = false;
      this.active.push(o);
      return o;
    }
    release(o) {
      const i = this.active.indexOf(o);
      if (i < 0) return;
      this.active[i] = this.active[this.active.length - 1];
      this.active.pop();
      o._dead = true;
      if (this.reset) this.reset(o);
      this.free.push(o);
    }
    releaseAt(i) {
      const o = this.active[i];
      this.active[i] = this.active[this.active.length - 1];
      this.active.pop();
      o._dead = true;
      if (this.reset) this.reset(o);
      this.free.push(o);
      return o;
    }
    releaseAll() {
      while (this.active.length) this.releaseAt(this.active.length - 1);
    }
  };

  /* ---------------------------------------------------------- spatial hash */
  /** Uniform grid over the world, rebuilt once per tick. Collision queries in
   *  the addon used an 80px hash; same here. */
  WS.Grid = class Grid {
    constructor(cell) { this.cell = cell || 80; this.buckets = new Map(); }
    clear() { this.buckets.clear(); }
    key(x, y) { return ((y / this.cell) | 0) * 4096 + ((x / this.cell) | 0); }
    insert(e) {
      const k = this.key(e.x, e.y);
      let b = this.buckets.get(k);
      if (!b) { b = []; this.buckets.set(k, b); }
      b.push(e);
    }
    /** Calls fn(entity) for everything in the cells overlapping the radius. */
    query(x, y, radius, fn) {
      const c = this.cell;
      const x0 = ((x - radius) / c) | 0, x1 = ((x + radius) / c) | 0;
      const y0 = ((y - radius) / c) | 0, y1 = ((y + radius) / c) | 0;
      for (let gy = y0; gy <= y1; gy++) {
        for (let gx = x0; gx <= x1; gx++) {
          const b = this.buckets.get(gy * 4096 + gx);
          if (!b) continue;
          for (let i = 0; i < b.length; i++) fn(b[i]);
        }
      }
    }
  };

  /* --------------------------------------------------------------- helpers */
  /** Substitutes {field}, {field%}, {field*%} and {field~%} in a description,
   *  exactly like the addon's tooltip templating:
   *    {v}    -> raw value            {v%}   -> value x100
   *    {v*%}  -> (value-1) x100       {v~%}  -> (1-value) x100 */
  WS.template = function (text, source) {
    if (!text) return '';
    return text.replace(/\{(\w+)([%*~]*)\}/g, (all, key, op) => {
      const v = source[key];
      if (v === undefined) return all;
      if (op === '%') return String(WS.round(v * 100));
      if (op === '*%') return String(WS.round((v - 1) * 100));
      if (op === '~%') return String(WS.round((1 - v) * 100));
      return String(WS.round(v * 100) / 100);
    });
  };

  WS.CONST = {
    TICK_RATE: 1 / 60,          // the browser build simulates at 60 Hz
    MAX_TICKS_PER_FRAME: 5,
    PLAYER_DAMAGE_SCALE: 0.91,
    PLAYER_SPEED_SCALE: 0.91,
    PLAYER_COOLDOWN_SCALE: 1.099,
    ENEMY_SCALE: 1.08,
    WORLD_WIDTH: 1280,
    WORLD_HEIGHT: 720,

    PLAYER_RADIUS: 18,

      fire: [1.00, 0.45, 0.10],
      frost: [0.35, 0.75, 1.00],
      nature: [0.35, 0.85, 0.35],
      holy: [1.00, 0.88, 0.35],
      shadow: [0.70, 0.30, 0.95],
      enemy: [1.00, 0.30, 0.25],
      elite: [1.00, 0.70, 0.10],
      boss: [0.90, 0.20, 0.90],
      gold: [1.00, 0.82, 0.10],
      heal: [0.25, 0.90, 0.30],

      gemMid: [0.25, 0.55, 1.00],
      gemHigh: [0.75, 0.35, 1.00],

})(window.WS);

/* ===== src/core/save.js ===== */
/* Persistence. One localStorage key holds the whole account: banked gold,
 * unlocks, Trainer ranks, settings, statistics, and the discovery codex.
 * Schema is versioned; an unknown version is merged onto the defaults rather
 * than discarded, so a save from an older build keeps its gold. */
'use strict';
(function (WS) {

  const KEY = 'wowsurvivors2.save.v1';
  const SCHEMA = 1;

  function defaults() {
    return {
      schema: SCHEMA,
      gold: 0,
      hyperArmed: false,
      meta: {},
      unlocks: {
        characters: { mage: true, priest: true },
        maps: { elwynn: true },
        hyper: {},
      },
      achievements: {},
      combos: {},          // discovery codex
      settings: Object.assign({}, WS.Config.defaultSettings),
      statistics: {
        totalKills: 0,
        totalGold: 0,
        totalRuns: 0,
        totalVictories: 0,
        totalTime: 0,
        gemsCollected: 0,
        bestRunTime: 0,
        bestLevel: 0,
        bestBossesInRun: 0,
        bestNoHitStreak: 0,
        bestDamage: 0,
        maxWeapons: 0,
        evolutions: 0,
        unions: 0,
        coffinsOpened: 0,
        runebladesClaimed: 0,
        warglaivesClaimed: 0,
        bestTime: {},      // per map
        bosses: {},        // bossId -> kills
        families: {},      // family -> kills
        bestiary: {},      // enemyId -> kills
      },
    };
  }

  /** Recursively fills missing keys from `src` into `dst`. */
  function merge(dst, src) {
    for (const k of Object.keys(src)) {
      if (dst[k] === undefined || dst[k] === null) {
        dst[k] = (typeof src[k] === 'object' && !Array.isArray(src[k]))
          ? JSON.parse(JSON.stringify(src[k])) : src[k];
      } else if (typeof src[k] === 'object' && !Array.isArray(src[k]) && typeof dst[k] === 'object') {
        merge(dst[k], src[k]);
      }
    }
    return dst;
  }

  WS.Save = {
    db: null,

    load() {
      let raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
      let data = null;
      if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
      this.db = merge(data || {}, defaults());
      this.db.schema = SCHEMA;
      return this.db;
    },

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.db)); } catch (e) { /* quota / blocked */ }
    },

    reset() {
      this.db = defaults();
      this.save();
    },

    /** Unlocks everything, for showcasing the whole roster. */
    unlockAll() {
      for (const id of WS.CharacterOrder) this.db.unlocks.characters[id] = true;
      for (const id of WS.MapOrder) this.db.unlocks.maps[id] = true;
      this.save();
    },

    get settings() { return this.db.settings; },
    get stats() { return this.db.statistics; },

    isCharacterUnlocked(id) { return !!this.db.unlocks.characters[id]; },
    isMapUnlocked(id) { return !!this.db.unlocks.maps[id]; },

    addGold(n) {
      this.db.gold += n;
      this.db.statistics.totalGold += n;
    },

    metaRank(id) { return this.db.meta[id] || 0; },

    /** Cost of the NEXT rank; null once the upgrade is maxed. */
    metaCost(id) {
      const m = WS.MetaUpgrades[id];
      const rank = this.metaRank(id);
      if (rank >= m.max) return null;
      return m.cost * (rank + 1);
    },

    buyMeta(id) {
      const cost = this.metaCost(id);
      if (cost === null || this.db.gold < cost) return false;
      this.db.gold -= cost;
      this.db.meta[id] = this.metaRank(id) + 1;
      this.save();
      return true;
    },

    recordKill(template, id) {
      const s = this.db.statistics;
      s.totalKills++;
      if (template.family) s.families[template.family] = (s.families[template.family] || 0) + 1;
      if (id) s.bestiary[id] = (s.bestiary[id] || 0) + 1;
    },

    discoverCombo(id) {
      if (this.db.combos[id]) return false;
      this.db.combos[id] = true;
      this.save();
      return true;
    },
  };

})(window.WS);

'use strict';
(function (WS) {

  const Input = {
    keys: { up: false, down: false, left: false, right: false },
    pressed: new Set(),
    onKey: null,        // set by the UI for menu navigation / hotkeys
    touchVector: null,
    gamepadIndex: null,
  };

  const MAP = {
    KeyW: 'up', ArrowUp: 'up',
    KeyS: 'down', ArrowDown: 'down',
    KeyA: 'left', ArrowLeft: 'left',
    KeyD: 'right', ArrowRight: 'right',
  };

  Input.init = function () {
    window.addEventListener('keydown', (e) => {
      const dir = MAP[e.code];
      if (dir) { this.keys[dir] = true; e.preventDefault(); }
      if (!this.pressed.has(e.code)) {
        this.pressed.add(e.code);
        if (this.onKey) this.onKey(e);
      }
      // Keep the page from scrolling under the canvas.
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      const dir = MAP[e.code];
      if (dir) this.keys[dir] = false;
      this.pressed.delete(e.code);
    });

    // Losing focus mid-run must not leave the survivor sprinting into a wall.
    window.addEventListener('blur', () => this.releaseAll());

    window.addEventListener('gamepadconnected', (e) => { this.gamepadIndex = e.gamepad.index; });
    window.addEventListener('gamepaddisconnected', () => { this.gamepadIndex = null; });
  };

  Input.releaseAll = function () {
    this.keys.up = this.keys.down = this.keys.left = this.keys.right = false;
    this.pressed.clear();
  };

  /** Virtual stick for touch devices; the UI feeds it a unit vector. */
  Input.setTouchVector = function (v) { this.touchVector = v; };

  /** Folds gamepad + touch into the same boolean directions the sim reads. */
  Input.poll = function () {
    const t = this.touchVector;
    if (t) {
      this.keys.left = t.x < -0.3; this.keys.right = t.x > 0.3;
      this.keys.up = t.y < -0.3; this.keys.down = t.y > 0.3;
      return;
    }
    if (this.gamepadIndex === null || !navigator.getGamepads) return;
    const pad = navigator.getGamepads()[this.gamepadIndex];
    if (!pad) return;
    const dead = 0.28;
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    if (WS.abs(ax) > dead || WS.abs(ay) > dead) {
      this.keys.left = ax < -dead; this.keys.right = ax > dead;
      this.keys.up = ay < -dead; this.keys.down = ay > dead;
    }
    // D-pad, for pads that report it as buttons 12-15.
    if (pad.buttons.length > 15) {
      if (pad.buttons[12].pressed) this.keys.up = true;
      if (pad.buttons[13].pressed) this.keys.down = true;
      if (pad.buttons[14].pressed) this.keys.left = true;
      if (pad.buttons[15].pressed) this.keys.right = true;
    }
  };

  WS.Input = Input;

})(window.WS);

 * with no image files and still gets per-enemy silhouettes.
 *
 * House style: a three-quarter-from-above view. Bodies are built from stacked
 * ellipses lit from the upper left, outlined in a darkened shade of their own

      const cx = s / 2, cy = s * 0.58, u = s / 100;
      poly(g, [[cx - 14 * u, cy - 34 * u], [cx - 10 * u, cy - 50 * u], [cx - 4 * u, cy - 36 * u],
      [cx, cy - 54 * u], [cx + 4 * u, cy - 36 * u], [cx + 10 * u, cy - 50 * u],
      [cx + 14 * u, cy - 34 * u]], '#9fd8ff', '#5aa0d0', u);       // ice crown
    },

    warlock(g, s, p) { CREATURES.necromancer(g, s, p); },

    /* --- undead ----------------------------------------------------------- */
    skeleton(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.strokeStyle = p.mid; g.lineWidth = 4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx, cy - 8 * u); g.lineTo(cx, cy + 18 * u); g.stroke();
      for (let i = 0; i < 4; i++) {                                // ribs
        const ry = cy - 4 * u + i * 6 * u;
        g.beginPath(); g.ellipse(cx, ry, 12 * u - i * 1.2 * u, 3 * u, 0, WS.PI * 0.05, WS.PI * 0.95); g.stroke();
      }
      g.beginPath(); g.moveTo(cx - 14 * u, cy - 4 * u); g.lineTo(cx - 22 * u, cy + 14 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 14 * u, cy - 4 * u); g.lineTo(cx + 22 * u, cy + 14 * u); g.stroke();
      shaded(g, cx, cy - 20 * u, 11 * u, 11 * u, p);               // skull
      g.fillStyle = '#101018';
      g.beginPath(); g.ellipse(cx - 4 * u, cy - 21 * u, 3 * u, 3.6 * u, 0, 0, WS.TAU); g.fill();
      g.beginPath(); g.ellipse(cx + 4 * u, cy - 21 * u, 3 * u, 3.6 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 21 * u, 4 * u, 1.5 * u, '#8fe6ff');
      g.fillStyle = p.lo; g.fillRect(cx - 5 * u, cy - 13 * u, 10 * u, 3 * u);
      blade(g, cx + 24 * u, cy + 6 * u, 30 * u, 5 * u, 0.6, '#b9c0cc', '#5c6270');
    },

    ghoul(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 3 * u, cy + 4 * u, 21 * u, 22 * u, p, 0.18);  // lopsided
      shaded(g, cx - 24 * u, cy + 6 * u, 8 * u, 15 * u, p, -0.6);  // dragging arm
      poly(g, [[cx - 32 * u, cy + 16 * u], [cx - 26 * u, cy + 26 * u], [cx - 22 * u, cy + 14 * u]], p.hi, p.line, u);
      shaded(g, cx - 2 * u, cy - 18 * u, 12 * u, 11 * u, p, -0.25);
      g.fillStyle = '#2a1414';                                     // hanging jaw
      g.beginPath(); g.ellipse(cx - 2 * u, cy - 10 * u, 6 * u, 5 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx - 2 * u, cy - 21 * u, 4 * u, 1.8 * u, '#d9ff7a');
      rimLight(g, cx, cy, 24 * u, p.hi);
    },

    geist(g, s, p) {
      const cx = s / 2, cy = s * 0.62, u = s / 100;
      shaded(g, cx, cy, 15 * u, 14 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 3.5 * u; g.lineCap = 'round';
      for (const dir of [-1, 1]) {
        g.beginPath();
        g.moveTo(cx + dir * 10 * u, cy - 2 * u);
        g.quadraticCurveTo(cx + dir * 30 * u, cy - 16 * u, cx + dir * 24 * u, cy + 16 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 16 * u, 11 * u, 10 * u, p);
      g.fillStyle = '#141a20';                                     // stitched mask
      g.fillRect(cx - 11 * u, cy - 19 * u, 22 * u, 6 * u);
      eyes(g, cx, cy - 16 * u, 4.5 * u, 1.8 * u, '#9ff5ff');
    },

    abomination(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 6 * u, 30 * u, 28 * u, p);
      g.strokeStyle = p.dark; g.lineWidth = 2 * u;                 // stitches
      for (let i = -2; i <= 2; i++) {
        g.beginPath(); g.moveTo(cx + i * 9 * u, cy - 14 * u); g.lineTo(cx + i * 9 * u, cy + 26 * u); g.stroke();
      }
      shaded(g, cx - 30 * u, cy - 2 * u, 11 * u, 17 * u, p, -0.35);
      shaded(g, cx + 30 * u, cy - 2 * u, 11 * u, 17 * u, p, 0.35);
      blade(g, cx + 38 * u, cy + 6 * u, 34 * u, 8 * u, 0.75, '#aeb6c4', '#5a6070');
      shaded(g, cx - 4 * u, cy - 24 * u, 13 * u, 11 * u, p, -0.2); // sagging head
      eyes(g, cx - 4 * u, cy - 25 * u, 5 * u, 2 * u, '#bfff6b');
      rimLight(g, cx, cy, 32 * u, p.hi);
    },

    wraith(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.save();
      const grd = g.createLinearGradient(0, cy - 34 * u, 0, cy + 30 * u);
      grd.addColorStop(0, p.hi); grd.addColorStop(0.6, p.mid); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(cx - 20 * u, cy + 30 * u);
      g.quadraticCurveTo(cx - 24 * u, cy - 22 * u, cx, cy - 36 * u);
      g.quadraticCurveTo(cx + 24 * u, cy - 22 * u, cx + 20 * u, cy + 30 * u);
      g.quadraticCurveTo(cx, cy + 18 * u, cx - 20 * u, cy + 30 * u);
      g.fill();
      g.restore();
      g.fillStyle = 'rgba(6,8,14,.85)';
      g.beginPath(); g.ellipse(cx, cy - 20 * u, 9 * u, 11 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 21 * u, 4 * u, 2.2 * u, '#cfe6ff');
    },

    reaper(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      CREATURES.wraith(g, s, p);
      g.save();                                                    // the scythe
      g.strokeStyle = '#d8e4f2'; g.lineWidth = 3.5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 26 * u, cy + 34 * u); g.lineTo(cx + 34 * u, cy - 40 * u); g.stroke();
      g.beginPath();
      g.moveTo(cx + 34 * u, cy - 40 * u);
      g.quadraticCurveTo(cx - 4 * u, cy - 52 * u, cx - 12 * u, cy - 24 * u);
      g.lineWidth = 5 * u; g.strokeStyle = '#eef6ff'; g.stroke();
      g.restore();
      g.save(); g.globalAlpha = 0.5; g.strokeStyle = '#9fd8ff'; g.lineWidth = 2 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
    },

    sovereign(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.save();                                                    // eclipse disc
      const grd = g.createRadialGradient(cx, cy, 6 * u, cx, cy, 46 * u);
      grd.addColorStop(0, '#1a1030'); grd.addColorStop(0.7, '#2a1a4a'); grd.addColorStop(1, '#0d0820');
      g.fillStyle = grd;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.fill();
      g.shadowColor = '#ffe6ae'; g.shadowBlur = 26 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 3 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
      for (let i = 0; i < 8; i++) {                                // corona spears
        const a = (i / 8) * WS.TAU + 0.2;
        blade(g, cx + WS.cos(a) * 44 * u, cy + WS.sin(a) * 44 * u, 22 * u, 4 * u, a + WS.PI / 2, '#ffd98f', '#a97c2f');
      }
      g.fillStyle = '#0a0714';
      g.beginPath(); g.ellipse(cx, cy - 4 * u, 13 * u, 16 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 6 * u, 5 * u, 2.6 * u, '#fff3d0');
    },

    /* --- beasts ----------------------------------------------------------- */
    wolf(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx - 2 * u, cy + 2 * u, 26 * u, 15 * u, p);        // long body
      poly(g, [[cx + 22 * u, cy - 2 * u], [cx + 40 * u, cy - 14 * u], [cx + 26 * u, cy + 6 * u]], p.lo, p.line, u); // tail
      shaded(g, cx - 22 * u, cy - 6 * u, 13 * u, 11 * u, p);       // head
      poly(g, [[cx - 34 * u, cy - 6 * u], [cx - 44 * u, cy - 2 * u], [cx - 32 * u, cy + 2 * u]], p.hi, p.line, u);  // muzzle
      poly(g, [[cx - 28 * u, cy - 14 * u], [cx - 30 * u, cy - 26 * u], [cx - 20 * u, cy - 16 * u]], p.lo, p.line, u);
      poly(g, [[cx - 16 * u, cy - 14 * u], [cx - 14 * u, cy - 26 * u], [cx - 8 * u, cy - 15 * u]], p.lo, p.line, u);
      eyes(g, cx - 26 * u, cy - 8 * u, 4 * u, 1.6 * u, '#ffe08a');
      g.strokeStyle = p.dark; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (const dx of [-10, 4, 14]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 10 * u); g.lineTo(cx + dx * u, cy + 20 * u); g.stroke();
      }
      rimLight(g, cx - 2 * u, cy, 24 * u, p.hi, 0.35);
    },

    cat(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx - 2 * u, cy + 2 * u, 25 * u, 14 * u, p);        // low, long body
      g.strokeStyle = p.dark; g.lineWidth = 2.6 * u; g.lineCap = 'round';
      for (let i = -1; i <= 2; i++) {                              // stripes
        g.beginPath();
        g.moveTo(cx + i * 9 * u, cy - 9 * u);
        g.lineTo(cx + i * 9 * u + 4 * u, cy + 9 * u);
        g.stroke();
      }
      g.lineWidth = 4 * u;                                         // curled tail
      g.strokeStyle = p.lo;
      g.beginPath();
      g.moveTo(cx + 22 * u, cy);
      g.quadraticCurveTo(cx + 42 * u, cy - 6 * u, cx + 36 * u, cy - 24 * u);
      g.stroke();
      shaded(g, cx - 22 * u, cy - 6 * u, 12 * u, 11 * u, p);       // round head
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 31 * u, cy - 24 * u], [cx - 22 * u, cy - 15 * u]], p.lo, p.line, u);
      poly(g, [[cx - 18 * u, cy - 15 * u], [cx - 15 * u, cy - 25 * u], [cx - 10 * u, cy - 14 * u]], p.lo, p.line, u);
      eyes(g, cx - 24 * u, cy - 7 * u, 4.5 * u, 1.8 * u, '#c9f26b');
      g.strokeStyle = p.dark; g.lineWidth = 3 * u;
      for (const dx of [-14, 0, 12]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 9 * u); g.lineTo(cx + dx * u, cy + 19 * u); g.stroke();
      }
      rimLight(g, cx - 2 * u, cy, 24 * u, p.hi, 0.35);
    },

    boar(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx, cy + 2 * u, 24 * u, 18 * u, p);
      g.strokeStyle = p.dark; g.lineWidth = 2.5 * u;               // bristles
      for (let i = -3; i <= 3; i++) {
        g.beginPath(); g.moveTo(cx + i * 6 * u, cy - 14 * u); g.lineTo(cx + i * 6 * u, cy - 24 * u); g.stroke();
      }
      shaded(g, cx - 22 * u, cy + 2 * u, 12 * u, 11 * u, p);
      poly(g, [[cx - 32 * u, cy + 4 * u], [cx - 42 * u, cy + 6 * u], [cx - 32 * u, cy + 10 * u]], p.hi, p.line, u);
      g.strokeStyle = '#efe3cc'; g.lineWidth = 3 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 32 * u, cy + 6 * u); g.quadraticCurveTo(cx - 40 * u, cy - 2 * u, cx - 34 * u, cy - 8 * u); g.stroke();
      eyes(g, cx - 24 * u, cy - 2 * u, 4 * u, 1.4 * u, '#ff9d6b');
      rimLight(g, cx, cy, 24 * u, p.hi, 0.35);
    },

    quilboar(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 4 * u, 22 * u, 24 * u, p);
      g.strokeStyle = p.hi; g.lineWidth = 3.4 * u; g.lineCap = 'round';
      for (let i = 0; i < 7; i++) {                                // quills
        const a = WS.PI * (0.15 + i * 0.1);
        g.beginPath();
        g.moveTo(cx - WS.cos(a) * 20 * u, cy - WS.sin(a) * 20 * u);
        g.lineTo(cx - WS.cos(a) * 36 * u, cy - WS.sin(a) * 36 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 20 * u, 13 * u, 11 * u, p);
      poly(g, [[cx - 6 * u, cy - 14 * u], [cx + 6 * u, cy - 14 * u], [cx, cy - 6 * u]], p.hi);
      eyes(g, cx, cy - 22 * u, 5 * u, 1.8 * u, '#ffcf6b');
      blade(g, cx + 24 * u, cy + 4 * u, 28 * u, 6 * u, 0.55, '#cdd3de', '#6b7280');
    },

    raptor(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx + 2 * u, cy, 20 * u, 14 * u, p, -0.15);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 16 * u, cy - 2 * u); g.quadraticCurveTo(cx + 40 * u, cy - 8 * u, cx + 44 * u, cy - 24 * u); g.stroke();
      g.strokeStyle = p.dark; g.lineWidth = 4 * u;                 // raised legs
      g.beginPath(); g.moveTo(cx, cy + 8 * u); g.lineTo(cx - 6 * u, cy + 22 * u); g.lineTo(cx + 4 * u, cy + 26 * u); g.stroke();
      shaded(g, cx - 20 * u, cy - 14 * u, 12 * u, 9 * u, p, -0.3);
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 42 * u, cy - 10 * u], [cx - 28 * u, cy - 6 * u]], p.hi, p.line, u);
      poly(g, [[cx - 20 * u, cy - 22 * u], [cx - 12 * u, cy - 34 * u], [cx - 10 * u, cy - 20 * u]], p.lo, p.line, u); // crest
      eyes(g, cx - 23 * u, cy - 16 * u, 3.5 * u, 1.6 * u, '#ffe066');
    },

    strider(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 6 * u, cy + 10 * u); g.lineTo(cx - 10 * u, cy + 32 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 6 * u, cy + 10 * u); g.lineTo(cx + 12 * u, cy + 32 * u); g.stroke();
      shaded(g, cx, cy, 20 * u, 17 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u;                   // long neck
      g.beginPath(); g.moveTo(cx - 8 * u, cy - 10 * u); g.quadraticCurveTo(cx - 22 * u, cy - 30 * u, cx - 14 * u, cy - 40 * u); g.stroke();
      shaded(g, cx - 14 * u, cy - 42 * u, 9 * u, 8 * u, p);
      poly(g, [[cx - 22 * u, cy - 42 * u], [cx - 34 * u, cy - 40 * u], [cx - 22 * u, cy - 36 * u]], p.hi, p.line, u);
      eyes(g, cx - 14 * u, cy - 44 * u, 3.5 * u, 1.5 * u, '#ffe9a8');
    },

    vulture(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // layered wings
        poly(g, [[cx + dir * 5 * u, cy - 8 * u], [cx + dir * 46 * u, cy - 26 * u],
        [cx + dir * 40 * u, cy - 2 * u], [cx + dir * 14 * u, cy + 8 * u]], p.lo, p.line, u);
        poly(g, [[cx + dir * 8 * u, cy - 4 * u], [cx + dir * 38 * u, cy - 10 * u],
        [cx + dir * 20 * u, cy + 10 * u]], p.dark, p.line, u * 0.8);
      }
      shaded(g, cx, cy + 2 * u, 14 * u, 16 * u, p);
      shaded(g, cx, cy - 16 * u, 8 * u, 8 * u, p);
      poly(g, [[cx - 6 * u, cy - 16 * u], [cx - 20 * u, cy - 12 * u], [cx - 6 * u, cy - 10 * u]], '#e8b455', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3 * u, 1.4 * u, '#ffd166');
    },

    spider(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.strokeStyle = p.lo; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        for (const dir of [-1, 1]) {
          const a = -0.55 + i * 0.38;
          g.beginPath();
          g.moveTo(cx + dir * 6 * u, cy);
          g.quadraticCurveTo(cx + dir * (26 + i * 3) * u, cy + WS.sin(a) * 26 * u - 12 * u,
            cx + dir * (34 - i * 2) * u, cy + WS.sin(a) * 34 * u + 8 * u);
          g.stroke();
        }
      }
      shaded(g, cx + 4 * u, cy + 4 * u, 18 * u, 16 * u, p);        // abdomen
      shaded(g, cx - 14 * u, cy - 4 * u, 11 * u, 10 * u, p);       // cephalothorax
      g.save(); g.shadowColor = '#ff6b6b'; g.shadowBlur = 8 * u; g.fillStyle = '#ff8a8a';
      for (const [ox, oy] of [[-4, -3], [0, -5], [-6, 1], [1, 0]]) {
        g.beginPath(); g.arc(cx - 16 * u + ox * u, cy - 5 * u + oy * u, 1.5 * u, 0, WS.TAU); g.fill();
      }
      g.restore();
    },

    worgen(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      shaded(g, cx, cy + 6 * u, 22 * u, 26 * u, p);
      shaded(g, cx - 24 * u, cy + 4 * u, 9 * u, 16 * u, p, -0.5);
      shaded(g, cx + 24 * u, cy + 4 * u, 9 * u, 16 * u, p, 0.5);
      for (const dir of [-1, 1]) {
        poly(g, [[cx + dir * 30 * u, cy + 16 * u], [cx + dir * 40 * u, cy + 24 * u], [cx + dir * 28 * u, cy + 24 * u]], '#e9edf5', '#8a90a0', u);
      }
      shaded(g, cx, cy - 22 * u, 13 * u, 12 * u, p);
      poly(g, [[cx - 8 * u, cy - 24 * u], [cx - 16 * u, cy - 42 * u], [cx - 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx + 8 * u, cy - 24 * u], [cx + 16 * u, cy - 42 * u], [cx + 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx - 7 * u, cy - 16 * u], [cx + 7 * u, cy - 16 * u], [cx, cy - 6 * u]], p.hi);
      g.fillStyle = '#fff'; // bared teeth
      for (let i = -2; i <= 2; i++) poly(g, [[cx + i * 3 * u, cy - 12 * u], [cx + i * 3 * u + 1.4 * u, cy - 8 * u], [cx + i * 3 * u + 2.8 * u, cy - 12 * u]], '#fff');
      eyes(g, cx, cy - 26 * u, 5 * u, 2 * u, '#ffe14d');
      rimLight(g, cx, cy, 26 * u, p.hi);
    },

    harpy(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // feathered wings
        for (let i = 0; i < 4; i++) {
          poly(g, [
            [cx + dir * 8 * u, cy - 8 * u],
            [cx + dir * (24 + i * 8) * u, cy - (26 - i * 5) * u],
            [cx + dir * (18 + i * 7) * u, cy - (10 - i * 4) * u],
          ], i % 2 ? p.mid : p.lo, p.line, u * 0.8);
        }
      }
      shaded(g, cx, cy + 4 * u, 13 * u, 18 * u, p);
      shaded(g, cx, cy - 16 * u, 10 * u, 9 * u, p);
      poly(g, [[cx - 4 * u, cy - 16 * u], [cx - 16 * u, cy - 12 * u], [cx - 4 * u, cy - 10 * u]], '#f0c469', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3.5 * u, 1.5 * u, '#d9f4ff');
      g.strokeStyle = '#e8c98f'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(cx - 5 * u, cy + 20 * u); g.lineTo(cx - 9 * u, cy + 30 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 5 * u, cy + 20 * u); g.lineTo(cx + 9 * u, cy + 30 * u); g.stroke();
    },

    centaur(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 4 * u, cy + 8 * u, 26 * u, 15 * u, p);        // horse barrel
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      for (const dx of [-14, -4, 12, 22]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 18 * u); g.lineTo(cx + dx * u + 2 * u, cy + 32 * u); g.stroke();
      }
      poly(g, [[cx + 28 * u, cy + 4 * u], [cx + 44 * u, cy - 6 * u], [cx + 30 * u, cy + 12 * u]], p.lo, p.line, u);
      shaded(g, cx - 12 * u, cy - 14 * u, 13 * u, 16 * u, p);      // humanoid torso
      shaded(g, cx - 12 * u, cy - 32 * u, 10 * u, 9 * u, p);
      eyes(g, cx - 12 * u, cy - 33 * u, 4 * u, 1.6 * u, '#ffd98f');
      g.strokeStyle = '#cfd6e2'; g.lineWidth = 3 * u;              // spear
      g.beginPath(); g.moveTo(cx - 30 * u, cy + 20 * u); g.lineTo(cx + 6 * u, cy - 44 * u); g.stroke();
      poly(g, [[cx + 6 * u, cy - 44 * u], [cx + 12 * u, cy - 34 * u], [cx, cy - 36 * u]], '#e7ecf5', '#8a90a0', u);
    },

    golem(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.fillStyle = p.mid; g.strokeStyle = p.line; g.lineWidth = 2 * u;
      g.fillRect(cx - 22 * u, cy - 14 * u, 44 * u, 38 * u);
      g.strokeRect(cx - 22 * u, cy - 14 * u, 44 * u, 38 * u);
      g.fillStyle = p.lo;
      g.fillRect(cx - 30 * u, cy - 8 * u, 10 * u, 26 * u);
      g.fillRect(cx + 20 * u, cy - 8 * u, 10 * u, 26 * u);
      g.fillStyle = p.hi;
      g.fillRect(cx - 14 * u, cy - 30 * u, 28 * u, 18 * u);        // head block
      g.strokeRect(cx - 14 * u, cy - 30 * u, 28 * u, 18 * u);
      g.save(); g.shadowColor = '#ff9d3c'; g.shadowBlur = 12 * u;  // furnace eye
      g.fillStyle = '#ffb45c';
      g.fillRect(cx - 8 * u, cy - 24 * u, 16 * u, 5 * u);
      g.fillRect(cx - 6 * u, cy + 2 * u, 12 * u, 12 * u);
      g.restore();
      blade(g, cx + 34 * u, cy + 6 * u, 30 * u, 9 * u, 0.9, '#b9c0cc', '#5c6270'); // scythe arm
    },
  };

  /* --------------------------------------------------------- the survivor - */
  // Player sprites share one frame and differ by robe/armour colour, silhouette
  // accessory (staff, blades, bow...) and a class glyph on the chest.
  const HEROES = {
    mage: { accessory: 'staff', cloak: true },
    priest: { accessory: 'staff', cloak: true, halo: true },
    rogue: { accessory: 'daggers', hood: true },
    hunter: { accessory: 'bow' },
    warrior: { accessory: 'axe', bulk: 1.15 },
    warlock: { accessory: 'orb', cloak: true, hood: true },
    shaman: { accessory: 'totem', cloak: true },
    paladin: { accessory: 'shield', bulk: 1.1, halo: true },
    death_knight: { accessory: 'runeblade', bulk: 1.1, cloak: true },
    demon_hunter: { accessory: 'glaives', horns: true },
  };

  function drawHero(g, s, tint, cfg, demon) {
    const cx = s / 2, cy = s * 0.56, u = s / 100;
    const p = palette(demon ? [0.45, 0.95, 0.25] : tint);
    const bulk = cfg.bulk || 1;

    if (cfg.cloak) {                                               // cloak behind
      poly(g, [[cx - 20 * u * bulk, cy + 30 * u], [cx - 13 * u, cy - 18 * u],
      [cx + 13 * u, cy - 18 * u], [cx + 20 * u * bulk, cy + 30 * u]],
        p.lo, p.line, u);
    }
    shaded(g, cx, cy + 6 * u, 15 * u * bulk, 20 * u, p);           // torso
    shaded(g, cx - 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, -0.35);
    shaded(g, cx + 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, 0.35);
    g.fillStyle = p.dark;                                          // legs
    g.fillRect(cx - 9 * u, cy + 20 * u, 7 * u, 14 * u);
    g.fillRect(cx + 2 * u, cy + 20 * u, 7 * u, 14 * u);

    const skin = { hi: '#f2d9bd', mid: '#d9b494', lo: '#a07f63', line: '#5d4738', glow: '#fff' };
    shaded(g, cx, cy - 16 * u, 10 * u, 10 * u, demon ? p : skin);
    if (cfg.hood) {
      poly(g, [[cx - 12 * u, cy - 12 * u], [cx, cy - 34 * u], [cx + 12 * u, cy - 12 * u]], p.mid, p.line, u);
      g.fillStyle = 'rgba(6,8,14,.8)';
      g.beginPath(); g.ellipse(cx, cy - 17 * u, 7 * u, 8 * u, 0, 0, WS.TAU); g.fill();
    }
    if (cfg.horns || demon) {
      poly(g, [[cx - 8 * u, cy - 22 * u], [cx - 18 * u, cy - 42 * u], [cx - 3 * u, cy - 26 * u]], p.hi, p.line, u);
      poly(g, [[cx + 8 * u, cy - 22 * u], [cx + 18 * u, cy - 42 * u], [cx + 3 * u, cy - 26 * u]], p.hi, p.line, u);
    }
    if (cfg.halo) {
      g.save(); g.globalAlpha = 0.85; g.shadowColor = '#ffe6ae'; g.shadowBlur = 12 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 2 * u;
      g.beginPath(); g.ellipse(cx, cy - 32 * u, 12 * u, 4 * u, 0, 0, WS.TAU); g.stroke();
      g.restore();
    }
    eyes(g, cx, cy - 17 * u, 4 * u, 1.6 * u, demon ? '#d9ff6b' : '#8fd8ff');

    switch (cfg.accessory) {
      case 'staff':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3 * u; g.lineCap = 'round';
        g.beginPath(); g.moveTo(cx + 22 * u, cy + 28 * u); g.lineTo(cx + 26 * u, cy - 38 * u); g.stroke();
        g.save(); g.shadowColor = WS.hex(tint); g.shadowBlur = 16 * u;
        g.fillStyle = WS.hex(WS.mix(tint, [1, 1, 1], 0.5));
        g.beginPath(); g.arc(cx + 26 * u, cy - 42 * u, 6 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'daggers':
        blade(g, cx - 22 * u, cy + 10 * u, 20 * u, 4 * u, -0.5, '#e2e7f0', '#767c8c');
        blade(g, cx + 22 * u, cy + 10 * u, 20 * u, 4 * u, 0.5, '#e2e7f0', '#767c8c');
        break;
      case 'bow':
        g.strokeStyle = '#a97f4a'; g.lineWidth = 3 * u;
        g.beginPath(); g.arc(cx + 24 * u, cy, 22 * u, -1.1, 1.1); g.stroke();
        g.strokeStyle = '#e8edf6'; g.lineWidth = 1.2 * u;
        g.beginPath(); g.moveTo(cx + 34 * u, cy - 19 * u); g.lineTo(cx + 34 * u, cy + 19 * u); g.stroke();
        break;
      case 'axe':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3.5 * u;
        g.beginPath(); g.moveTo(cx + 20 * u, cy + 26 * u); g.lineTo(cx + 30 * u, cy - 26 * u); g.stroke();
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 46 * u, cy - 18 * u], [cx + 30 * u, cy - 6 * u]], '#d4dae6', '#767c8c', u);
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 16 * u, cy - 16 * u], [cx + 30 * u, cy - 6 * u]], '#b9c0cc', '#767c8c', u);
        break;
      case 'orb':
        g.save(); g.shadowColor = '#9d5bff'; g.shadowBlur = 18 * u;
        g.fillStyle = '#b98cff';
        g.beginPath(); g.arc(cx + 24 * u, cy - 4 * u, 7 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'totem':
        g.fillStyle = '#8b6a44'; g.fillRect(cx + 20 * u, cy - 20 * u, 9 * u, 44 * u);
        g.save(); g.shadowColor = '#4db8ff'; g.shadowBlur = 14 * u;
        g.fillStyle = '#7fd4ff'; g.fillRect(cx + 21 * u, cy - 14 * u, 7 * u, 7 * u);
        g.restore();
        break;
      case 'shield':
        poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 14 * u, cy - 18 * u], [cx - 12 * u, cy + 8 * u],
        [cx - 22 * u, cy + 20 * u], [cx - 32 * u, cy + 6 * u]], '#e0d3a8', '#8a7440', u * 1.2);
        g.save(); g.shadowColor = '#ffe6ae'; g.shadowBlur = 10 * u;
        g.fillStyle = '#fff2cc';
        g.beginPath(); g.arc(cx - 22 * u, cy - 1 * u, 4 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'runeblade':
        blade(g, cx + 24 * u, cy + 26 * u, 52 * u, 6 * u, 0.32, '#cfd8e6', '#5f6878');
        g.save(); g.globalAlpha = 0.85; g.strokeStyle = '#5be0ff'; g.lineWidth = 1.6 * u;
        g.shadowColor = '#5be0ff'; g.shadowBlur = 10 * u;
        g.beginPath(); g.moveTo(cx + 26 * u, cy + 14 * u); g.lineTo(cx + 34 * u, cy - 22 * u); g.stroke();
        g.restore();
        break;
      case 'glaives':
        for (const dir of [-1, 1]) {
          g.save();
          g.translate(cx + dir * 26 * u, cy + 4 * u); g.rotate(dir * 0.5);
          g.strokeStyle = '#7dff45'; g.lineWidth = 2.4 * u;
          g.shadowColor = '#7dff45'; g.shadowBlur = 12 * u;
          g.beginPath(); g.arc(0, 0, 14 * u, -0.9, 1.4); g.stroke();
          g.beginPath(); g.arc(0, 0, 8 * u, 1.4, -0.9, true); g.stroke();
          g.restore();
        }
        break;
    }
    rimLight(g, cx, cy + 4 * u, 22 * u, p.hi, 0.4);
  }

  /* ------------------------------------------------------------- props ---- */
  const PROPS = {
    tree(g, s) {
      const u = s / 100, cx = s / 2, cy = s * 0.7;
      g.fillStyle = '#2a1f14'; g.fillRect(cx - 5 * u, cy - 6 * u, 10 * u, 30 * u);
      for (let i = 0; i < 3; i++) {
        ellipse(g, cx, cy - 18 * u - i * 14 * u, (32 - i * 7) * u, (18 - i * 3) * u,
          i === 2 ? '#2f4a26' : i === 1 ? '#26401f' : '#1e3419');
      }
    },
    deadtree(g, s) {
      const u = s / 100, cx = s / 2, cy = s * 0.8;
      g.strokeStyle = '#2c2a33'; g.lineWidth = 6 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - 44 * u); g.stroke();
      g.lineWidth = 3.5 * u;
      for (const [ax, ay] of [[-24, -30], [22, -36], [-16, -46], [18, -52]]) {
        g.beginPath(); g.moveTo(cx, cy - 26 * u); g.lineTo(cx + ax * u, cy + ay * u); g.stroke();
      }
    },
    stump(g, s) {
      const u = s / 100;
      ellipse(g, s / 2, s * 0.62, 20 * u, 12 * u, '#3b2c1c');
      ellipse(g, s / 2, s * 0.58, 15 * u, 8 * u, '#5a452c');
    },
    rock(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 24 * u, s * 0.7], [s / 2 - 14 * u, s * 0.42], [s / 2 + 10 * u, s * 0.38],
      [s / 2 + 24 * u, s * 0.62], [s / 2 + 8 * u, s * 0.74]], '#3c4048', '#22252b', u);
    },
    flower(g, s) {
      const u = s / 100;
      g.strokeStyle = '#3f5a2c'; g.lineWidth = 2 * u;
      g.beginPath(); g.moveTo(s / 2, s * 0.72); g.lineTo(s / 2, s * 0.5); g.stroke();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * WS.TAU;
        ellipse(g, s / 2 + WS.cos(a) * 7 * u, s * 0.48 + WS.sin(a) * 7 * u, 5 * u, 5 * u, '#c98fd6');
      }
      ellipse(g, s / 2, s * 0.48, 4 * u, 4 * u, '#ffe27a');
    },
    mushroom(g, s) {
      const u = s / 100;
      g.fillStyle = '#c9c4b4'; g.fillRect(s / 2 - 4 * u, s * 0.52, 8 * u, 18 * u);
      ellipse(g, s / 2, s * 0.52, 18 * u, 11 * u, '#6b4a7a');
      ellipse(g, s / 2 - 6 * u, s * 0.5, 3 * u, 2 * u, '#d8cfe6');
    },
    grave(g, s) {
      const u = s / 100;
      g.fillStyle = '#4a4f58';
      g.beginPath();
      g.moveTo(s / 2 - 16 * u, s * 0.74); g.lineTo(s / 2 - 16 * u, s * 0.46);
      g.arc(s / 2, s * 0.46, 16 * u, WS.PI, 0);
      g.lineTo(s / 2 + 16 * u, s * 0.74); g.closePath(); g.fill();
      g.strokeStyle = '#2b2f36'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(s / 2, s * 0.44); g.lineTo(s / 2, s * 0.64); g.stroke();
      g.beginPath(); g.moveTo(s / 2 - 8 * u, s * 0.52); g.lineTo(s / 2 + 8 * u, s * 0.52); g.stroke();
    },
    bone(g, s) {
      const u = s / 100;
      g.strokeStyle = '#8f94a0'; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(s / 2 - 18 * u, s * 0.6); g.lineTo(s / 2 + 18 * u, s * 0.56); g.stroke();
      g.fillStyle = '#a3a8b4';
      for (const [x, y] of [[-20, 56], [-18, 66], [20, 52], [22, 62]]) {
        ellipse(g, s / 2 + x * u, s * (y / 100), 5 * u, 5 * u, '#a3a8b4');
      }
    },
    skull(g, s) {
      const u = s / 100;
      ellipse(g, s / 2, s * 0.56, 16 * u, 15 * u, '#9aa0ac');
      g.fillStyle = '#20242c';
      ellipse(g, s / 2 - 6 * u, s * 0.55, 4 * u, 5 * u, '#20242c');
      ellipse(g, s / 2 + 6 * u, s * 0.55, 4 * u, 5 * u, '#20242c');
      g.fillRect(s / 2 - 6 * u, s * 0.64, 12 * u, 6 * u);
    },
    wheat(g, s) {
      const u = s / 100;
      g.strokeStyle = '#8f7a3c'; g.lineWidth = 2 * u;
      for (const dx of [-10, 0, 10]) {
        g.beginPath(); g.moveTo(s / 2 + dx * u, s * 0.74); g.quadraticCurveTo(s / 2 + dx * u + 4 * u, s * 0.56, s / 2 + dx * u, s * 0.4); g.stroke();
        ellipse(g, s / 2 + dx * u, s * 0.4, 4 * u, 8 * u, '#c9a94c');
      }
    },
    fence(g, s) {
      const u = s / 100;
      g.fillStyle = '#4a3a26';
      g.fillRect(s / 2 - 22 * u, s * 0.44, 5 * u, 30 * u);
      g.fillRect(s / 2 + 17 * u, s * 0.44, 5 * u, 30 * u);
      g.fillRect(s / 2 - 24 * u, s * 0.52, 48 * u, 4 * u);
      g.fillRect(s / 2 - 24 * u, s * 0.62, 48 * u, 4 * u);
    },
    gear(g, s) {
      const u = s / 100;
      g.save(); g.translate(s / 2, s * 0.58);
      g.fillStyle = '#585d68';
      for (let i = 0; i < 8; i++) {
        g.rotate(WS.TAU / 8);
        g.fillRect(-3 * u, -20 * u, 6 * u, 8 * u);
      }
      g.beginPath(); g.arc(0, 0, 14 * u, 0, WS.TAU); g.fill();
      g.fillStyle = '#2b2f36';
      g.beginPath(); g.arc(0, 0, 5 * u, 0, WS.TAU); g.fill();
      g.restore();
    },
    cactus(g, s) {
      const u = s / 100;
      g.fillStyle = '#3d5a34';
      g.fillRect(s / 2 - 6 * u, s * 0.36, 12 * u, 38 * u);
      g.fillRect(s / 2 - 18 * u, s * 0.5, 8 * u, 16 * u);
      g.fillRect(s / 2 + 10 * u, s * 0.46, 8 * u, 20 * u);
    },
    grass(g, s) {
      const u = s / 100;
      g.strokeStyle = '#6b6a3c'; g.lineWidth = 2 * u; g.lineCap = 'round';
      for (const dx of [-12, -4, 4, 12]) {
        g.beginPath(); g.moveTo(s / 2 + dx * u, s * 0.72);
        g.quadraticCurveTo(s / 2 + dx * u + 6 * u, s * 0.58, s / 2 + dx * u + 2 * u, s * 0.44); g.stroke();
      }
    },
    spire(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 14 * u, s * 0.76], [s / 2 - 6 * u, s * 0.3], [s / 2 + 4 * u, s * 0.26],
      [s / 2 + 14 * u, s * 0.72]], '#39485c', '#22303f', u);
    },
    crystal(g, s) {
      const u = s / 100;
      g.save(); g.shadowColor = '#7fd4ff'; g.shadowBlur = 14 * u;
      poly(g, [[s / 2, s * 0.3], [s / 2 + 11 * u, s * 0.56], [s / 2, s * 0.72], [s / 2 - 11 * u, s * 0.56]],
        '#6fbfe8', '#a9e6ff', u);
      g.restore();
    },
    ice(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 20 * u, s * 0.68], [s / 2 - 6 * u, s * 0.48], [s / 2 + 8 * u, s * 0.54],
      [s / 2 + 20 * u, s * 0.7]], 'rgba(160,210,240,.5)', 'rgba(210,240,255,.7)', u);
    },
  };

  /* -------------------------------------------------------------- API ----- */
  WS.Sprites = {
    /** Cached creature sprite. `size` is the full canvas edge in world units. */
    creature(art, tint, size) {
      size = WS.round(size);
      const key = `c:${art}:${WS.hex(tint)}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const g = c.getContext('2d');
      const draw = CREATURES[art] || CREATURES.kobold;
      draw(g, res, palette(tint));
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    hero(id, tint, size, demon) {
      size = WS.round(size);
      const key = `h:${id}:${WS.hex(tint)}:${size}:${demon ? 1 : 0}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      drawHero(c.getContext('2d'), res, tint, HEROES[id] || HEROES.mage, demon);
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    prop(kind, size) {
      size = WS.round(size);
      const key = `p:${kind}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const draw = PROPS[kind] || PROPS.rock;
      draw(c.getContext('2d'), res);
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    has(art) { return !!CREATURES[art]; },
    clear() { cache.clear(); },
  };

})(window.WS);

/* ===== src/render/icons.js ===== */
/* Procedural ability icons. Each glyph is drawn in a normalised 100x100 space
 * on an obsidian plate with an arc-lit rim, so weapons, passives, blessings and
 * achievements all share one visual language (see docs/ARCLIGHT-UI.md). */
'use strict';
(function (WS) {

  const cache = new Map();

  /* Every glyph draws inside 0..100 with the ctx already translated. */
  const G = {
    /* ---- weapons -------------------------------------------------------- */
    missile(g, c) {
      for (let i = 0; i < 3; i++) {
        g.save(); g.translate(0, i * 14 - 14); g.rotate(-0.25);
        g.strokeStyle = c; g.lineWidth = 5; g.lineCap = 'round';
        g.beginPath(); g.moveTo(18, 62); g.quadraticCurveTo(50, 40, 82, 46); g.stroke();
        g.restore();
      }
    },
    ember(g, c) {
      g.fillStyle = c;
      g.beginPath();
      g.moveTo(50, 12); g.quadraticCurveTo(76, 42, 68, 62);
      g.quadraticCurveTo(62, 86, 50, 88); g.quadraticCurveTo(38, 86, 32, 62);
      g.quadraticCurveTo(24, 42, 50, 12); g.fill();
      g.fillStyle = '#fff6d8';
      g.beginPath(); g.ellipse(50, 66, 10, 14, 0, 0, WS.TAU); g.fill();
    },
    shard(g, c) {
      g.fillStyle = c; g.strokeStyle = '#eaf7ff'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(50, 8); g.lineTo(76, 46); g.lineTo(50, 92); g.lineTo(24, 46);
      g.closePath(); g.fill(); g.stroke();
    },
    spark(g, c) {
      g.strokeStyle = c; g.lineWidth = 7; g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath(); g.moveTo(62, 8); g.lineTo(36, 46); g.lineTo(56, 50); g.lineTo(34, 92); g.stroke();
    },
    ring(g, c) {

      for (const r of [18, 30, 42]) { g.globalAlpha = r === 42 ? 0.4 : 0.9; g.beginPath(); g.arc(50, 50, r, 0, WS.TAU); g.stroke(); }
      g.globalAlpha = 1;

    beam(g, c) {

      grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(0.45, c); grd.addColorStop(1, '#eaffd8');
      g.fillStyle = grd; g.fillRect(8, 40, 84, 20);

      g.globalAlpha = 1;
      g.lineWidth = 4; g.lineCap = 'round';
      for (const dx of [-20, 0, 20]) { g.beginPath(); g.moveTo(50 + dx, 50); g.lineTo(50 + dx * 0.8, 22); g.stroke(); }
    },
    bolt(g, c) {
      g.fillStyle = c;
      g.beginPath(); g.ellipse(50, 50, 20, 34, -0.4, 0, WS.TAU); g.fill();
      g.globalAlpha = 0.5; g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(43, 40, 7, 12, -0.4, 0, WS.TAU); g.fill();
      g.globalAlpha = 1;
    },
    dagger(g) {
      g.fillStyle = '#dfe4ee'; g.strokeStyle = '#7b8394'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(50, 6); g.lineTo(60, 56); g.lineTo(50, 66); g.lineTo(40, 56); g.closePath();
      g.fill(); g.stroke();

    sword(g) {

    },
    axe(g) {

      g.beginPath(); g.moveTo(50, 92); g.lineTo(50, 26); g.stroke();
      g.fillStyle = '#d8dee9'; g.strokeStyle = '#7b8394'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(50, 18); g.quadraticCurveTo(88, 26, 78, 54); g.quadraticCurveTo(62, 44, 50, 46); g.closePath(); g.fill(); g.stroke();

    arrow(g, c) {

/* Sound. Everything is synthesised at play time through WebAudio - no audio

    cursed: { root: 110.00, scale: [0, 1, 3, 7, 8], wave: 'sine', tempo: 1.9 },       // A phrygian

/* Screen effects: floating combat text, expanding flashes, particles, shake.

'use strict';
(function (WS) {

  const FX = {
    texts: null,

  };

  FX.init = function () {
    this.texts = new WS.Pool(() => ({}), null, WS.CONST.MAX_FLOATING_TEXT);
    this.flashes = new WS.Pool(() => ({}), null, 90);
    this.particles = new WS.Pool(() => ({}), null, 400);
  };

  FX.clear = function () {
    this.texts.releaseAll();
    this.flashes.releaseAll();
    this.particles.releaseAll();
    this.shakeMag = 0; this.shakeTime = 0; this.shakeX = 0; this.shakeY = 0;
    this.flashScreen = null;

  /* ---------------------------------------------------------------- text -- */

    const t = FX.texts.acquire();
    if (!t) return;
    t.x = x; t.y = y; t.text = text; t.colour = colour;
    t.size = size; t.life = life; t.maxLife = life;
    t.vx = WS.randRange(-14, 14); t.vy = rise;
  }

  FX.damage = function (x, y, amount, crit) {
    if (!WS.Save.settings.damageNumbers) return;
    push(x + WS.randRange(-6, 6), y - 8, String(WS.floor(amount)),
      crit ? '#ffd45c' : '#f2f4f8', crit ? 20 : 14, crit ? 0.85 : 0.6, -46);
  };

  FX.playerHurt = function (x, y, amount) {
    push(x, y - 20, '-' + WS.floor(amount), '#ff6b5c', 20, 0.9, -50);
  };

  FX.heal = function (x, y, amount) {
    if (!WS.Save.settings.healNumbers) return;
    push(x, y - 26, '+' + WS.floor(amount), '#5fe08a', 16, 0.9, -40);
  };

  FX.notice = function (x, y, text, colour) {
    push(x, y - 30, text, colour || '#e8ecf6', 15, 1.1, -34);
  };

  FX.gold = function (x, y, amount) {
    push(x, y - 20, '+' + WS.floor(amount) + 'g', '#f5c56b', 15, 1.0, -38);
  };

  /* --------------------------------------------------------------- flash -- */
  /** An expanding ring of light: the workhorse impact effect. */
  FX.flash = function (x, y, radius, colour, life) {
    const f = FX.flashes.acquire();

    f.life = life || 0.30; f.maxLife = f.life;

    this.flashScreen = { colour, life, maxLife: life };
  };

  FX.burst = function (x, y, count, colour, speed, life, size) {
    for (let i = 0; i < count; i++) {
      const p = FX.particles.acquire();
      if (!p) return;
      const a = WS.random() * WS.TAU;
      const v = speed * WS.randRange(0.35, 1);
      p.x = x; p.y = y;
      p.vx = WS.cos(a) * v; p.vy = WS.sin(a) * v;

      p.vx = (dx * c - dy * s) * v; p.vy = (dx * s + dy * c) * v;

  FX.shake = function (magnitude, duration) {

      this.shakeTime = duration;
      this.shakeMax = duration;

  FX.update = function (dt) {

      t.life -= dt;
      if (t.life <= 0) { this.texts.releaseAt(i); continue; }

      t.y += t.vy * dt;

      const f = this.flashes.active[i];
      f.life -= dt;
      if (f.life <= 0) { this.flashes.releaseAt(i); continue; }

    i = 0;
    while (i < this.particles.count) {
      const p = this.particles.active[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.releaseAt(i); continue; }

      p.y += p.vy * dt;

      this.shakeTime -= dt;

      const m = this.shakeMag * k;
      this.shakeX = WS.randRange(-m, m);
      this.shakeY = WS.randRange(-m, m);
      if (this.shakeTime <= 0) { this.shakeX = 0; this.shakeY = 0; this.shakeMag = 0; }

/* ===== src/game/projectile.js ===== */
/* Everything that flies, lingers, or spins: friendly bolts, hostile bolts,
 * ground zones, orbiting blades and beams. One pool per kind, all capped. */
'use strict';
(function (WS) {

  const P = {
    bolts: null,      // friendly projectiles
    hostiles: null,   // enemy projectiles
    zones: null,      // lingering damage fields
    orbits: null,     // blades circling the survivor
    beams: null,      // instant lines, rendered while they fade
  };

  P.init = function () {
    this.bolts = new WS.Pool(() => ({ hitBy: new Map() }), (b) => b.hitBy.clear(), WS.CONST.MAX_PROJECTILES);
    this.hostiles = new WS.Pool(() => ({}), null, 220);
    this.zones = new WS.Pool(() => ({ hitBy: new Map() }), (z) => z.hitBy.clear(), 24);
    this.orbits = new WS.Pool(() => ({ hitBy: new Map() }), (o) => o.hitBy.clear(), 32);

  };

  P.clear = function () {
