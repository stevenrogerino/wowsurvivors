<title>WoWSurvivors 2</title>
<style>
/* ===========================================================================
   ARCLIGHT UI - the design language for WoWSurvivors 2.
   Obsidian substrate, arc light for everything that measures or matters.
   See docs/ARCLIGHT-UI.md for the rules this file implements.
   ======================================================================== */

:root {
  --void:        #07080c;
  --obsidian:    #0b0d12;
  --obsidian-2:  #141926;
  --obsidian-3:  #1b2233;
  --rim:         rgba(255,255,255,.08);
  --rim-strong:  rgba(255,255,255,.16);

  --arc:         #f5c56b;
  --arc-hot:     #ffe6ae;
  --arcane:      #8f7bff;
  --frost:       #59bfff;
  --fel:         #8cf24a;
  --blood:       #e2483d;
  --holy:        #ffdf7a;
  --shadow-s:    #b34ff2;

  --ink:         #e8ecf6;
  --ink-dim:     #8b93a7;
  --ink-faint:   #5a6275;

  --q-common:    #e8ecf6;
  --q-uncommon:  #3ddc7a;
  --q-rare:      #59bfff;
  --q-epic:      #b34ff2;
  --q-legendary: #f5c56b;

  --ease: cubic-bezier(.2,.8,.2,1);
  --font: "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  touch-action: none;
}

#stage { position: fixed; inset: 0; }
#game-canvas { position: absolute; inset: 0; display: block; }

/* --------------------------------------------------------------- helpers */
.label {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-dim); font-weight: 600;
}
.num { font-variant-numeric: tabular-nums; font-weight: 700; }
.hidden { display: none !important; }

/* Corner brackets - the Arclight frame. Applied to .panel and .card. */
.bracketed { position: relative; }
.bracketed::before, .bracketed::after {
  content: ""; position: absolute; width: 14px; height: 14px;
  border-color: var(--arc); border-style: solid; opacity: .75; pointer-events: none;
}
.bracketed::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
.bracketed::after  { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

.panel {
  background: linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim);
  border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.55);
}
.panel-title {
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--arc); font-weight: 700;
  padding: 14px 18px 0;
}

/* ------------------------------------------------------------- buttons */
.btn {
  appearance: none; cursor: pointer; font-family: inherit;
  background: linear-gradient(180deg, var(--obsidian-3), var(--obsidian-2));
  border: 1px solid var(--rim); border-radius: 2px;
  color: var(--ink);
  padding: 10px 20px;
  font-size: 12px; font-weight: 600; letter-spacing: .10em; text-transform: uppercase;
  transition: border-color .18s var(--ease), color .18s var(--ease), transform .12s var(--ease), background .18s var(--ease);
  position: relative;
}
.btn:hover { border-color: var(--arc); color: var(--arc-hot); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; border-color: var(--rim); color: var(--ink-faint); }
.btn.primary {
  background: linear-gradient(180deg, rgba(245,197,107,.20), rgba(245,197,107,.06));
  border-color: rgba(245,197,107,.55); color: var(--arc-hot);
}
.btn.primary:hover { border-color: var(--arc-hot); background: linear-gradient(180deg, rgba(245,197,107,.32), rgba(245,197,107,.10)); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: 10px; }

/* ------------------------------------------------------------- overlays */
#overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(7,8,12,.72), rgba(7,8,12,.94));
  backdrop-filter: blur(3px);
  z-index: 20;
  padding: 24px;
}
#overlay.hidden { display: none; }
.overlay-inner {
  width: min(1180px, 100%); max-height: 100%;
  display: flex; flex-direction: column; gap: 18px;
  animation: sweep-in .26s var(--ease);
}
@keyframes sweep-in {
  from { opacity: 0; transform: translateY(10px) scale(.995); }
  to   { opacity: 1; transform: none; }
}

.overlay-head { display: flex; align-items: baseline; gap: 16px; }
.overlay-head h1 {
  margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--arc-hot);
}
.overlay-head .sub { color: var(--ink-dim); font-size: 13px; }
.overlay-body { overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
.overlay-body::-webkit-scrollbar { width: 8px; }
.overlay-body::-webkit-scrollbar-thumb { background: var(--obsidian-3); border-radius: 4px; }
.overlay-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.overlay-foot .spacer { flex: 1; }

/* ---------------------------------------------------------------- title */
#title-wrap { text-align: center; margin-bottom: 6px; }
#title-wrap .game-title {
  font-size: clamp(34px, 6vw, 62px); font-weight: 300; letter-spacing: .22em;
  text-transform: uppercase; margin: 0;
  color: var(--ink);
}
#title-wrap .game-title b { font-weight: 700; color: var(--arc); }
#title-wrap .game-sub {
  font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
  color: var(--ink-faint); margin-top: 8px;
}
.title-arc { display: block; margin: 14px auto 0; }

/* ---------------------------------------------------------------- cards */
.card-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.card {
  width: 268px; min-height: 300px;
  background: linear-gradient(180deg, var(--obsidian-2), var(--obsidian));
  border: 1px solid var(--rim); border-radius: 2px;
  padding: 20px 18px 18px;
  cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease);
  position: relative; overflow: hidden;
}
.card::before {
  /* the quality arc across the top of the card */
  content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--q, var(--arc)), transparent);
  opacity: .8;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--q, var(--arc));
  box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.6), 0 0 34px -12px var(--q, var(--arc));
}
.card .icon { width: 64px; height: 64px; image-rendering: auto; }
.card .card-name { font-size: 17px; font-weight: 600; color: var(--q, var(--ink)); }
.card .card-note {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
}
.card .card-body { font-size: 13px; line-height: 1.45; color: var(--ink-dim); }
.card .card-detail {
  font-size: 12px; line-height: 1.4; color: var(--ink-faint);
  border-top: 1px solid var(--rim); padding-top: 8px; margin-top: auto;
}
.card.locked { cursor: not-allowed; opacity: .5; }
.card.locked:hover { transform: none; border-color: var(--rim); box-shadow: none; }
.card.selected { border-color: var(--arc); box-shadow: 0 0 0 1px var(--arc), 0 0 40px -14px var(--arc); }

/* -------------------------------------------------------- pick grids */
.pick-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px;
}
.pick {
  display: flex; gap: 12px; align-items: center;
  background: var(--obsidian); border: 1px solid var(--rim); border-radius: 2px;
  padding: 12px; cursor: pointer; text-align: left;
  transition: border-color .16s var(--ease), background .16s var(--ease), transform .12s var(--ease);
}
.pick:hover { border-color: var(--arc); transform: translateY(-2px); }
.pick.selected { border-color: var(--arc); background: rgba(245,197,107,.07); }
.pick.locked { opacity: .45; cursor: not-allowed; }
.pick.locked:hover { transform: none; border-color: var(--rim); }
.pick img { width: 46px; height: 46px; flex: none; }
.pick .pick-name { font-size: 14px; font-weight: 600; }
.pick .pick-sub { font-size: 11px; color: var(--ink-dim); margin-top: 2px; line-height: 1.35; }

/* ------------------------------------------------------------ list rows */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 14px;
  background: var(--obsidian); border: 1px solid var(--rim); border-radius: 2px;
  padding: 10px 14px;
}
.row img { width: 40px; height: 40px; flex: none; }
.row .row-main { flex: 1; min-width: 0; }
.row .row-name { font-size: 14px; font-weight: 600; }
.row .row-sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
.row .row-value { font-size: 13px; color: var(--arc); white-space: nowrap; }
.row.done { border-color: rgba(61,220,122,.35); }
.row.done .row-name { color: var(--q-uncommon); }
.row.undone { opacity: .62; }

.rank-pips { display: flex; gap: 3px; margin-top: 6px; }
.rank-pips i {
  width: 14px; height: 3px; background: var(--obsidian-3); border-radius: 1px; display: block;
}
.rank-pips i.on { background: var(--arc); }

/* ------------------------------------------------------------ stat grid */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.stat {
  background: var(--obsidian); border: 1px solid var(--rim); padding: 12px 14px; border-radius: 2px;
}
.stat .stat-value { font-size: 22px; font-weight: 700; color: var(--arc); font-variant-numeric: tabular-nums; }
.stat .stat-label { margin-top: 4px; }

/* =============================================================== the HUD */
#hud {
  position: absolute; inset: 0; pointer-events: none; z-index: 10;
  font-family: var(--font);
}
#hud.hidden { display: none; }

/* -- portrait cluster, top left ------------------------------------------ */
#hud-portrait {
  position: absolute; top: 18px; left: 18px;
  display: flex; align-items: center; gap: 14px;
}
.gauge-wrap { position: relative; width: 92px; height: 92px; }
.gauge-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.gauge-wrap .track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 5; }
.gauge-wrap .arc-hp { fill: none; stroke: var(--blood); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .12s linear; }
.gauge-wrap .arc-xp { fill: none; stroke: var(--arc); stroke-width: 3; stroke-linecap: round; }
.gauge-wrap .portrait {
  position: absolute; inset: 14px; border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, var(--obsidian-3), var(--obsidian));
  border: 1px solid var(--rim);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.gauge-wrap .portrait img { width: 100%; height: 100%; }
.gauge-wrap .lvl {
  position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  background: var(--obsidian); border: 1px solid var(--arc); color: var(--arc-hot);
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  padding: 1px 7px; border-radius: 2px;
}
#hud-vitals { display: flex; flex-direction: column; gap: 3px; }
#hud-vitals .hp-text { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
#hud-vitals .hp-text small { color: var(--ink-faint); font-size: 12px; font-weight: 500; }
#hud-vitals .name { font-size: 12px; color: var(--ink-dim); }

/* -- resource meters (fel / desecration) --------------------------------- */
#hud-meters { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
.meter { width: 150px; }
.meter .meter-track {
  height: 4px; background: rgba(255,255,255,.09); border-radius: 2px; overflow: hidden;
}
.meter .meter-fill { height: 100%; width: 0%; border-radius: 2px; transition: width .15s linear; }
.meter.fel .meter-fill { background: linear-gradient(90deg, #5aa832, var(--fel)); }
.meter.meta .meter-fill { background: linear-gradient(90deg, var(--fel), #eaffd8); }
.meter .meter-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px; }

/* -- timer rail, top centre ---------------------------------------------- */
#hud-timer {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  text-align: center; width: min(560px, 60vw);
}
#hud-timer .time { font-size: 30px; font-weight: 300; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
#hud-timer .rail { position: relative; height: 3px; background: rgba(255,255,255,.10); margin-top: 8px; }
#hud-timer .rail .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(245,197,107,.35), var(--arc)); }
#hud-timer .rail .tick { position: absolute; top: -3px; width: 1px; height: 9px; background: rgba(255,255,255,.28); }
#hud-timer .rail .tick.passed { background: var(--arc); }
#hud-timer .mode { margin-top: 6px; color: var(--arc); }

/* -- boss arc, under the timer ------------------------------------------- */
#hud-boss {
  position: absolute; top: 108px; left: 50%; transform: translateX(-50%);
  width: min(720px, 74vw); text-align: center;
}
#hud-boss.hidden { display: none; }
#hud-boss .boss-name { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #f2c9ff; }
#hud-boss svg { display: block; width: 100%; height: 26px; overflow: visible; }
#hud-boss .b-track { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 4; }
#hud-boss .b-fill { fill: none; stroke: var(--blood); stroke-width: 4; stroke-linecap: round; }

/* -- gold / kills, top right --------------------------------------------- */
#hud-stats {
  position: absolute; top: 18px; right: 18px; text-align: right;
  display: flex; flex-direction: column; gap: 8px;
}
#hud-stats .stat-line { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
#hud-stats .stat-line .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
#hud-stats .gold .v { color: var(--arc); }

/* -- weapon strip, bottom left ------------------------------------------- */
#hud-weapons {
  position: absolute; bottom: 18px; left: 18px;
  display: flex; gap: 10px; align-items: flex-end;
}
.wslot { position: relative; width: 52px; height: 52px; }
.wslot img { width: 52px; height: 52px; display: block; }
.wslot svg { position: absolute; inset: -4px; transform: rotate(-90deg); pointer-events: none; }
.wslot .cd-track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 2.5; }
.wslot .cd-arc { fill: none; stroke: var(--arc); stroke-width: 2.5; stroke-linecap: round; }
.wslot .rank {
  position: absolute; bottom: -3px; right: -3px;
  background: var(--obsidian); border: 1px solid var(--rim);
  font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 2px; color: var(--ink);
}
.wslot.evolved .rank { border-color: var(--arc); color: var(--arc); }
.wslot.evolved::after {
  content: ""; position: absolute; inset: -6px; border: 1px solid rgba(245,197,107,.45);
  border-radius: 3px; pointer-events: none;
}

/* -- passive pips, bottom right ------------------------------------------ */
#hud-passives {
  position: absolute; bottom: 18px; right: 18px;
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  max-width: 40vw;
}
.pslot { position: relative; width: 34px; height: 34px; }
.pslot img { width: 34px; height: 34px; display: block; opacity: .92; }
.pslot .rank {
  position: absolute; bottom: -2px; right: -2px;
  background: var(--obsidian); font-size: 8px; font-weight: 700; padding: 0 3px;
  border: 1px solid var(--rim); border-radius: 2px; color: var(--ink-dim);
}

/* -- toasts, bottom centre ----------------------------------------------- */
#hud-toasts {
  position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column-reverse; gap: 6px; align-items: center;
  width: min(560px, 80vw);
}
.toast {
  width: 100%;
  background: linear-gradient(90deg, rgba(20,25,38,.96), rgba(11,13,18,.92));
  border: 1px solid var(--rim); border-left: 2px solid var(--arc);
  padding: 9px 14px; border-radius: 2px;
  animation: sweep-in .22s var(--ease);
}
.toast .t-title { font-size: 12px; font-weight: 700; color: var(--arc-hot); letter-spacing: .05em; }
.toast .t-body { font-size: 12px; color: var(--ink-dim); margin-top: 2px; line-height: 1.35; }

/* -- reroll / banish bar on the level-up ---------------------------------- */
.choice-bar { display: flex; gap: 10px; align-items: center; justify-content: center; }
.choice-bar .count { color: var(--arc); font-weight: 700; }
.banish-mode .card { border-color: rgba(226,72,61,.55); }
.banish-mode .card:hover { border-color: var(--blood); box-shadow: 0 0 30px -12px var(--blood); }

/* -- the build sheet on pause -------------------------------------------- */
.sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .sheet { grid-template-columns: 1fr; } }
.sheet h3 {
  margin: 0 0 10px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--arc); font-weight: 700;
}
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.kv span:first-child { color: var(--ink-dim); }
.kv span:last-child { font-variant-numeric: tabular-nums; }

/* -- settings ------------------------------------------------------------- */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px;
  background: var(--obsidian); border: 1px solid var(--rim); border-radius: 2px; }
.setting .s-name { font-size: 13px; }
.setting .s-desc { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
.switch {
  width: 42px; height: 22px; border-radius: 11px; background: var(--obsidian-3);
  border: 1px solid var(--rim); position: relative; cursor: pointer; flex: none;
  transition: background .18s var(--ease), border-color .18s var(--ease);
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--ink-faint); transition: transform .18s var(--ease), background .18s var(--ease);
}
.switch.on { background: rgba(245,197,107,.22); border-color: var(--arc); }
.switch.on::after { transform: translateX(20px); background: var(--arc); }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 140px; height: 3px;
  background: var(--obsidian-3); border-radius: 2px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--arc); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: var(--arc);
  border: none; cursor: pointer;
}

/* -- tabs ----------------------------------------------------------------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rim); }
.tab {
  appearance: none; background: none; border: none; cursor: pointer; font-family: inherit;
  padding: 10px 16px; color: var(--ink-dim);
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .16s var(--ease), border-color .16s var(--ease);
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--arc); border-bottom-color: var(--arc); }

/* -- gold banner on menus -------------------------------------------------*/
.bank {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--rim); border-radius: 2px; padding: 6px 12px;
  background: var(--obsidian);
}
.bank .v { color: var(--arc); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; }

/* -- touch stick (mobile) -------------------------------------------------*/
#stick {
  position: absolute; width: 132px; height: 132px; border-radius: 50%;
  border: 1px solid var(--rim); background: rgba(11,13,18,.45);
  pointer-events: none; z-index: 15; display: none;
}
#stick .nub {
  position: absolute; width: 52px; height: 52px; border-radius: 50%;
  background: rgba(245,197,107,.30); border: 1px solid var(--arc);
  left: 40px; top: 40px;
}
body.touch #stick.active { display: block; }

/* -- small screens --------------------------------------------------------*/
@media (max-width: 720px) {
  .card { width: 100%; min-height: 0; }
  #hud-portrait { top: 10px; left: 10px; gap: 10px; }
  .gauge-wrap { width: 72px; height: 72px; }
  #hud-timer .time { font-size: 22px; }
  #hud-weapons { bottom: 10px; left: 10px; gap: 6px; }
  .wslot, .wslot img { width: 42px; height: 42px; }
  #hud-passives { bottom: 10px; right: 10px; }
  .overlay-head h1 { font-size: 22px; }
}

</style>
<div id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="overlay" class="hidden"></div>
    <div id="stick"><div class="nub"></div></div>
  </div>
<script>
/* ===== src/core/util.js ===== */
/* WoWSurvivors 2 - core utilities.
 * Loaded first; every other file hangs off the global WS namespace, mirroring
 * the addon's `WS` table so ported logic reads the same. Classic scripts (no
 * ES modules) so the game runs straight off the filesystem. */
'use strict';
window.WS = window.WS || {};
(function (WS) {

  const M = Math;
  WS.PI = M.PI; WS.TAU = M.PI * 2;
  WS.min = M.min; WS.max = M.max; WS.abs = M.abs;
  WS.floor = M.floor; WS.ceil = M.ceil; WS.round = M.round;
  WS.sqrt = M.sqrt; WS.sin = M.sin; WS.cos = M.cos; WS.atan2 = M.atan2;

  WS.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  WS.lerp = (a, b, t) => a + (b - a) * t;

  /** Returns unit dx, dy and the original length. Zero-safe. */
  WS.normalize = function (dx, dy) {
    const d = M.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) return [0, 0, 0];
    return [dx / d, dy / d, d];
  };
  WS.dist = (ax, ay, bx, by) => M.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));

  /** Fixed-capacity object pool. `active` is a dense array; Release swaps the
   *  tail into the freed slot, so iteration must handle in-place removal. */
  WS.Pool = class Pool {
    constructor(factory, reset, cap) {
      this.factory = factory; this.reset = reset; this.cap = cap || 512;
      this.active = []; this.free = [];
    }
    get count() { return this.active.length; }
    acquire() {
      if (this.active.length >= this.cap) return null;
      const o = this.free.pop() || this.factory();
      o._dead = false;
      this.active.push(o);
      return o;
    }
    release(o) {
      const i = this.active.indexOf(o);
      if (i < 0) return;
      this.active[i] = this.active[this.active.length - 1];
      this.active.pop();
      o._dead = true;
      if (this.reset) this.reset(o);
      this.free.push(o);
    }
    releaseAt(i) {
      const o = this.active[i];
      this.active[i] = this.active[this.active.length - 1];
      this.active.pop();
      o._dead = true;
      if (this.reset) this.reset(o);
      this.free.push(o);
      return o;
    }
    releaseAll() {
      while (this.active.length) this.releaseAt(this.active.length - 1);
    }
  };

  /* ---------------------------------------------------------- spatial hash */
  /** Uniform grid over the world, rebuilt once per tick. Collision queries in
   *  the addon used an 80px hash; same here. */
  WS.Grid = class Grid {
    constructor(cell) { this.cell = cell || 80; this.buckets = new Map(); }
    clear() { this.buckets.clear(); }
    key(x, y) { return ((y / this.cell) | 0) * 4096 + ((x / this.cell) | 0); }
    insert(e) {
      const k = this.key(e.x, e.y);
      let b = this.buckets.get(k);
      if (!b) { b = []; this.buckets.set(k, b); }
      b.push(e);
    }
    /** Calls fn(entity) for everything in the cells overlapping the radius. */
    query(x, y, radius, fn) {
      const c = this.cell;
      const x0 = ((x - radius) / c) | 0, x1 = ((x + radius) / c) | 0;
      const y0 = ((y - radius) / c) | 0, y1 = ((y + radius) / c) | 0;

        for (let gx = x0; gx <= x1; gx++) {

   *  exactly like the addon's tooltip templating:

    return text.replace(/\{(\w+)([%*~]*)\}/g, (all, key, op) => {

      if (op === '%') return String(WS.round(v * 100));
      if (op === '*%') return String(WS.round((v - 1) * 100));
      if (op === '~%') return String(WS.round((1 - v) * 100));
      return String(WS.round(v * 100) / 100);
    });
  };

  WS.CONST = {
    TICK_RATE: 1 / 60,          // the browser build simulates at 60 Hz
    MAX_TICKS_PER_FRAME: 5,
    PLAYER_DAMAGE_SCALE: 0.91,
    PLAYER_SPEED_SCALE: 0.91,
    PLAYER_COOLDOWN_SCALE: 1.099,
    ENEMY_SCALE: 1.08,

/* ===== src/core/save.js ===== */
/* Persistence. One localStorage key holds the whole account: banked gold,
 * unlocks, Trainer ranks, settings, statistics, and the discovery codex.
 * Schema is versioned; an unknown version is merged onto the defaults rather
 * than discarded, so a save from an older build keeps its gold. */
'use strict';
(function (WS) {

  const KEY = 'wowsurvivors2.save.v1';
  const SCHEMA = 1;

  function defaults() {
    return {
      schema: SCHEMA,
      gold: 0,
      hyperArmed: false,
      meta: {},
      unlocks: {
        characters: { mage: true, priest: true },
        maps: { elwynn: true },
        hyper: {},
      },
      achievements: {},
      combos: {},          // discovery codex
      settings: Object.assign({}, WS.Config.defaultSettings),
      statistics: {
        totalKills: 0,
        totalGold: 0,
        totalRuns: 0,
        totalVictories: 0,
        totalTime: 0,
        gemsCollected: 0,
        bestRunTime: 0,
        bestLevel: 0,
        bestBossesInRun: 0,
        bestNoHitStreak: 0,
        bestDamage: 0,
        maxWeapons: 0,
        evolutions: 0,
        unions: 0,
        coffinsOpened: 0,
        runebladesClaimed: 0,
        warglaivesClaimed: 0,
        bestTime: {},      // per map
        bosses: {},        // bossId -> kills
        families: {},      // family -> kills
        bestiary: {},      // enemyId -> kills
      },
    };
  }

  /** Recursively fills missing keys from `src` into `dst`. */
  function merge(dst, src) {
    for (const k of Object.keys(src)) {
      if (dst[k] === undefined || dst[k] === null) {
        dst[k] = (typeof src[k] === 'object' && !Array.isArray(src[k]))
          ? JSON.parse(JSON.stringify(src[k])) : src[k];
      } else if (typeof src[k] === 'object' && !Array.isArray(src[k]) && typeof dst[k] === 'object') {
        merge(dst[k], src[k]);
      }
    }
    return dst;
  }

  WS.Save = {
    db: null,

    load() {
      let raw = null;
      try { raw = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
      let data = null;
      if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
      this.db = merge(data || {}, defaults());
      this.db.schema = SCHEMA;
      return this.db;
    },

    save() {
      try { localStorage.setItem(KEY, JSON.stringify(this.db)); } catch (e) { /* quota / blocked */ }
    },

    reset() {
      this.db = defaults();
      this.save();
    },

    /** Unlocks everything, for showcasing the whole roster. */
    unlockAll() {
      for (const id of WS.CharacterOrder) this.db.unlocks.characters[id] = true;
      for (const id of WS.MapOrder) this.db.unlocks.maps[id] = true;
      this.save();
    },

    get settings() { return this.db.settings; },
    get stats() { return this.db.statistics; },

    isCharacterUnlocked(id) { return !!this.db.unlocks.characters[id]; },
    isMapUnlocked(id) { return !!this.db.unlocks.maps[id]; },

    addGold(n) {
      this.db.gold += n;
      this.db.statistics.totalGold += n;
    },

    metaRank(id) { return this.db.meta[id] || 0; },

    /** Cost of the NEXT rank; null once the upgrade is maxed. */
    metaCost(id) {
      const m = WS.MetaUpgrades[id];
      const rank = this.metaRank(id);
      if (rank >= m.max) return null;
      return m.cost * (rank + 1);
    },

    buyMeta(id) {
      const cost = this.metaCost(id);
      if (cost === null || this.db.gold < cost) return false;
      this.db.gold -= cost;
      this.db.meta[id] = this.metaRank(id) + 1;
      this.save();
      return true;
    },

    recordKill(template, id) {
      const s = this.db.statistics;
      s.totalKills++;
      if (template.family) s.families[template.family] = (s.families[template.family] || 0) + 1;
      if (id) s.bestiary[id] = (s.bestiary[id] || 0) + 1;
    },

    discoverCombo(id) {
      if (this.db.combos[id]) return false;
      this.db.combos[id] = true;
      this.save();
      return true;
    },
  };

})(window.WS);

/* ===== src/core/input.js ===== */
/* Keyboard, gamepad and touch input, normalised to one direction state.
 * Key handling is intentionally layout-agnostic where it can be: WASD and the
 * arrows both move, and `code` is used so AZERTY/Dvorak still walk. */
'use strict';
(function (WS) {

  const Input = {
    keys: { up: false, down: false, left: false, right: false },
    pressed: new Set(),
    onKey: null,        // set by the UI for menu navigation / hotkeys
    touchVector: null,
    gamepadIndex: null,
  };

  const MAP = {
    KeyW: 'up', ArrowUp: 'up',
    KeyS: 'down', ArrowDown: 'down',
    KeyA: 'left', ArrowLeft: 'left',
    KeyD: 'right', ArrowRight: 'right',
  };

  Input.init = function () {
    window.addEventListener('keydown', (e) => {
      const dir = MAP[e.code];
      if (dir) { this.keys[dir] = true; e.preventDefault(); }
      if (!this.pressed.has(e.code)) {
        this.pressed.add(e.code);
        if (this.onKey) this.onKey(e);
      }
      // Keep the page from scrolling under the canvas.
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      const dir = MAP[e.code];
      if (dir) this.keys[dir] = false;
      this.pressed.delete(e.code);
    });

    // Losing focus mid-run must not leave the survivor sprinting into a wall.
    window.addEventListener('blur', () => this.releaseAll());

    window.addEventListener('gamepadconnected', (e) => { this.gamepadIndex = e.gamepad.index; });
    window.addEventListener('gamepaddisconnected', () => { this.gamepadIndex = null; });
  };

  Input.releaseAll = function () {
    this.keys.up = this.keys.down = this.keys.left = this.keys.right = false;
    this.pressed.clear();
  };

  /** Virtual stick for touch devices; the UI feeds it a unit vector. */
  Input.setTouchVector = function (v) { this.touchVector = v; };

  /** Folds gamepad + touch into the same boolean directions the sim reads. */
  Input.poll = function () {
    const t = this.touchVector;
    if (t) {
      this.keys.left = t.x < -0.3; this.keys.right = t.x > 0.3;
      this.keys.up = t.y < -0.3; this.keys.down = t.y > 0.3;
      return;
    }
    if (this.gamepadIndex === null || !navigator.getGamepads) return;
    const pad = navigator.getGamepads()[this.gamepadIndex];
    if (!pad) return;
    const dead = 0.28;
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    if (WS.abs(ax) > dead || WS.abs(ay) > dead) {
      this.keys.left = ax < -dead; this.keys.right = ax > dead;
      this.keys.up = ay < -dead; this.keys.down = ay > dead;
    }
    // D-pad, for pads that report it as buttons 12-15.
    if (pad.buttons.length > 15) {
      if (pad.buttons[12].pressed) this.keys.up = true;
      if (pad.buttons[13].pressed) this.keys.down = true;
      if (pad.buttons[14].pressed) this.keys.left = true;
      if (pad.buttons[15].pressed) this.keys.right = true;
    }
  };

  WS.Input = Input;

})(window.WS);

 * with no image files and still gets per-enemy silhouettes.
 *
 * House style: a three-quarter-from-above view. Bodies are built from stacked
 * ellipses lit from the upper left, outlined in a darkened shade of their own

      const grd = g.createRadialGradient(cx, cy, 6 * u, cx, cy, 46 * u);
      grd.addColorStop(0, '#1a1030'); grd.addColorStop(0.7, '#2a1a4a'); grd.addColorStop(1, '#0d0820');
      g.fillStyle = grd;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.fill();
      g.shadowColor = '#ffe6ae'; g.shadowBlur = 26 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 3 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
      for (let i = 0; i < 8; i++) {                                // corona spears
        const a = (i / 8) * WS.TAU + 0.2;
        blade(g, cx + WS.cos(a) * 44 * u, cy + WS.sin(a) * 44 * u, 22 * u, 4 * u, a + WS.PI / 2, '#ffd98f', '#a97c2f');
      }
      g.fillStyle = '#0a0714';
      g.beginPath(); g.ellipse(cx, cy - 4 * u, 13 * u, 16 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 6 * u, 5 * u, 2.6 * u, '#fff3d0');
    },

    /* --- beasts ----------------------------------------------------------- */
    wolf(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx - 2 * u, cy + 2 * u, 26 * u, 15 * u, p);        // long body
      poly(g, [[cx + 22 * u, cy - 2 * u], [cx + 40 * u, cy - 14 * u], [cx + 26 * u, cy + 6 * u]], p.lo, p.line, u); // tail
      shaded(g, cx - 22 * u, cy - 6 * u, 13 * u, 11 * u, p);       // head
      poly(g, [[cx - 34 * u, cy - 6 * u], [cx - 44 * u, cy - 2 * u], [cx - 32 * u, cy + 2 * u]], p.hi, p.line, u);  // muzzle
      poly(g, [[cx - 28 * u, cy - 14 * u], [cx - 30 * u, cy - 26 * u], [cx - 20 * u, cy - 16 * u]], p.lo, p.line, u);
      poly(g, [[cx - 16 * u, cy - 14 * u], [cx - 14 * u, cy - 26 * u], [cx - 8 * u, cy - 15 * u]], p.lo, p.line, u);
      eyes(g, cx - 26 * u, cy - 8 * u, 4 * u, 1.6 * u, '#ffe08a');
      g.strokeStyle = p.dark; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (const dx of [-10, 4, 14]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 10 * u); g.lineTo(cx + dx * u, cy + 20 * u); g.stroke();
      }
      rimLight(g, cx - 2 * u, cy, 24 * u, p.hi, 0.35);
    },

    cat(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx - 2 * u, cy + 2 * u, 25 * u, 14 * u, p);        // low, long body
      g.strokeStyle = p.dark; g.lineWidth = 2.6 * u; g.lineCap = 'round';
      for (let i = -1; i <= 2; i++) {                              // stripes
        g.beginPath();
        g.moveTo(cx + i * 9 * u, cy - 9 * u);
        g.lineTo(cx + i * 9 * u + 4 * u, cy + 9 * u);
        g.stroke();
      }
      g.lineWidth = 4 * u;                                         // curled tail
      g.strokeStyle = p.lo;
      g.beginPath();
      g.moveTo(cx + 22 * u, cy);
      g.quadraticCurveTo(cx + 42 * u, cy - 6 * u, cx + 36 * u, cy - 24 * u);
      g.stroke();
      shaded(g, cx - 22 * u, cy - 6 * u, 12 * u, 11 * u, p);       // round head
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 31 * u, cy - 24 * u], [cx - 22 * u, cy - 15 * u]], p.lo, p.line, u);
      poly(g, [[cx - 18 * u, cy - 15 * u], [cx - 15 * u, cy - 25 * u], [cx - 10 * u, cy - 14 * u]], p.lo, p.line, u);
      eyes(g, cx - 24 * u, cy - 7 * u, 4.5 * u, 1.8 * u, '#c9f26b');
      g.strokeStyle = p.dark; g.lineWidth = 3 * u;
      for (const dx of [-14, 0, 12]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 9 * u); g.lineTo(cx + dx * u, cy + 19 * u); g.stroke();
      }
      rimLight(g, cx - 2 * u, cy, 24 * u, p.hi, 0.35);
    },

    boar(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx, cy + 2 * u, 24 * u, 18 * u, p);
      g.strokeStyle = p.dark; g.lineWidth = 2.5 * u;               // bristles
      for (let i = -3; i <= 3; i++) {
        g.beginPath(); g.moveTo(cx + i * 6 * u, cy - 14 * u); g.lineTo(cx + i * 6 * u, cy - 24 * u); g.stroke();
      }
      shaded(g, cx - 22 * u, cy + 2 * u, 12 * u, 11 * u, p);
      poly(g, [[cx - 32 * u, cy + 4 * u], [cx - 42 * u, cy + 6 * u], [cx - 32 * u, cy + 10 * u]], p.hi, p.line, u);
      g.strokeStyle = '#efe3cc'; g.lineWidth = 3 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 32 * u, cy + 6 * u); g.quadraticCurveTo(cx - 40 * u, cy - 2 * u, cx - 34 * u, cy - 8 * u); g.stroke();
      eyes(g, cx - 24 * u, cy - 2 * u, 4 * u, 1.4 * u, '#ff9d6b');
      rimLight(g, cx, cy, 24 * u, p.hi, 0.35);
    },

    quilboar(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 4 * u, 22 * u, 24 * u, p);
      g.strokeStyle = p.hi; g.lineWidth = 3.4 * u; g.lineCap = 'round';
      for (let i = 0; i < 7; i++) {                                // quills
        const a = WS.PI * (0.15 + i * 0.1);
        g.beginPath();
        g.moveTo(cx - WS.cos(a) * 20 * u, cy - WS.sin(a) * 20 * u);
        g.lineTo(cx - WS.cos(a) * 36 * u, cy - WS.sin(a) * 36 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 20 * u, 13 * u, 11 * u, p);
      poly(g, [[cx - 6 * u, cy - 14 * u], [cx + 6 * u, cy - 14 * u], [cx, cy - 6 * u]], p.hi);
      eyes(g, cx, cy - 22 * u, 5 * u, 1.8 * u, '#ffcf6b');
      blade(g, cx + 24 * u, cy + 4 * u, 28 * u, 6 * u, 0.55, '#cdd3de', '#6b7280');
    },

    raptor(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx + 2 * u, cy, 20 * u, 14 * u, p, -0.15);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 16 * u, cy - 2 * u); g.quadraticCurveTo(cx + 40 * u, cy - 8 * u, cx + 44 * u, cy - 24 * u); g.stroke();
      g.strokeStyle = p.dark; g.lineWidth = 4 * u;                 // raised legs
      g.beginPath(); g.moveTo(cx, cy + 8 * u); g.lineTo(cx - 6 * u, cy + 22 * u); g.lineTo(cx + 4 * u, cy + 26 * u); g.stroke();
      shaded(g, cx - 20 * u, cy - 14 * u, 12 * u, 9 * u, p, -0.3);
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 42 * u, cy - 10 * u], [cx - 28 * u, cy - 6 * u]], p.hi, p.line, u);
      poly(g, [[cx - 20 * u, cy - 22 * u], [cx - 12 * u, cy - 34 * u], [cx - 10 * u, cy - 20 * u]], p.lo, p.line, u); // crest
      eyes(g, cx - 23 * u, cy - 16 * u, 3.5 * u, 1.6 * u, '#ffe066');
    },

    strider(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 6 * u, cy + 10 * u); g.lineTo(cx - 10 * u, cy + 32 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 6 * u, cy + 10 * u); g.lineTo(cx + 12 * u, cy + 32 * u); g.stroke();
      shaded(g, cx, cy, 20 * u, 17 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u;                   // long neck
      g.beginPath(); g.moveTo(cx - 8 * u, cy - 10 * u); g.quadraticCurveTo(cx - 22 * u, cy - 30 * u, cx - 14 * u, cy - 40 * u); g.stroke();
      shaded(g, cx - 14 * u, cy - 42 * u, 9 * u, 8 * u, p);
      poly(g, [[cx - 22 * u, cy - 42 * u], [cx - 34 * u, cy - 40 * u], [cx - 22 * u, cy - 36 * u]], p.hi, p.line, u);
      eyes(g, cx - 14 * u, cy - 44 * u, 3.5 * u, 1.5 * u, '#ffe9a8');
    },

    vulture(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // layered wings
        poly(g, [[cx + dir * 5 * u, cy - 8 * u], [cx + dir * 46 * u, cy - 26 * u],
        [cx + dir * 40 * u, cy - 2 * u], [cx + dir * 14 * u, cy + 8 * u]], p.lo, p.line, u);
        poly(g, [[cx + dir * 8 * u, cy - 4 * u], [cx + dir * 38 * u, cy - 10 * u],
        [cx + dir * 20 * u, cy + 10 * u]], p.dark, p.line, u * 0.8);
      }
      shaded(g, cx, cy + 2 * u, 14 * u, 16 * u, p);
      shaded(g, cx, cy - 16 * u, 8 * u, 8 * u, p);
      poly(g, [[cx - 6 * u, cy - 16 * u], [cx - 20 * u, cy - 12 * u], [cx - 6 * u, cy - 10 * u]], '#e8b455', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3 * u, 1.4 * u, '#ffd166');
    },

    spider(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.strokeStyle = p.lo; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        for (const dir of [-1, 1]) {
          const a = -0.55 + i * 0.38;
          g.beginPath();
          g.moveTo(cx + dir * 6 * u, cy);
          g.quadraticCurveTo(cx + dir * (26 + i * 3) * u, cy + WS.sin(a) * 26 * u - 12 * u,
            cx + dir * (34 - i * 2) * u, cy + WS.sin(a) * 34 * u + 8 * u);
          g.stroke();
        }
      }
      shaded(g, cx + 4 * u, cy + 4 * u, 18 * u, 16 * u, p);        // abdomen
      shaded(g, cx - 14 * u, cy - 4 * u, 11 * u, 10 * u, p);       // cephalothorax
      g.save(); g.shadowColor = '#ff6b6b'; g.shadowBlur = 8 * u; g.fillStyle = '#ff8a8a';
      for (const [ox, oy] of [[-4, -3], [0, -5], [-6, 1], [1, 0]]) {
        g.beginPath(); g.arc(cx - 16 * u + ox * u, cy - 5 * u + oy * u, 1.5 * u, 0, WS.TAU); g.fill();
      }
      g.restore();
    },

    worgen(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      shaded(g, cx, cy + 6 * u, 22 * u, 26 * u, p);
      shaded(g, cx - 24 * u, cy + 4 * u, 9 * u, 16 * u, p, -0.5);
      shaded(g, cx + 24 * u, cy + 4 * u, 9 * u, 16 * u, p, 0.5);
      for (const dir of [-1, 1]) {
        poly(g, [[cx + dir * 30 * u, cy + 16 * u], [cx + dir * 40 * u, cy + 24 * u], [cx + dir * 28 * u, cy + 24 * u]], '#e9edf5', '#8a90a0', u);
      }
      shaded(g, cx, cy - 22 * u, 13 * u, 12 * u, p);
      poly(g, [[cx - 8 * u, cy - 24 * u], [cx - 16 * u, cy - 42 * u], [cx - 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx + 8 * u, cy - 24 * u], [cx + 16 * u, cy - 42 * u], [cx + 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx - 7 * u, cy - 16 * u], [cx + 7 * u, cy - 16 * u], [cx, cy - 6 * u]], p.hi);
      g.fillStyle = '#fff'; // bared teeth
      for (let i = -2; i <= 2; i++) poly(g, [[cx + i * 3 * u, cy - 12 * u], [cx + i * 3 * u + 1.4 * u, cy - 8 * u], [cx + i * 3 * u + 2.8 * u, cy - 12 * u]], '#fff');
      eyes(g, cx, cy - 26 * u, 5 * u, 2 * u, '#ffe14d');
      rimLight(g, cx, cy, 26 * u, p.hi);
    },

    harpy(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // feathered wings
        for (let i = 0; i < 4; i++) {
          poly(g, [
            [cx + dir * 8 * u, cy - 8 * u],
            [cx + dir * (24 + i * 8) * u, cy - (26 - i * 5) * u],
            [cx + dir * (18 + i * 7) * u, cy - (10 - i * 4) * u],
          ], i % 2 ? p.mid : p.lo, p.line, u * 0.8);
        }
      }
      shaded(g, cx, cy + 4 * u, 13 * u, 18 * u, p);
      shaded(g, cx, cy - 16 * u, 10 * u, 9 * u, p);
      poly(g, [[cx - 4 * u, cy - 16 * u], [cx - 16 * u, cy - 12 * u], [cx - 4 * u, cy - 10 * u]], '#f0c469', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3.5 * u, 1.5 * u, '#d9f4ff');
      g.strokeStyle = '#e8c98f'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(cx - 5 * u, cy + 20 * u); g.lineTo(cx - 9 * u, cy + 30 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 5 * u, cy + 20 * u); g.lineTo(cx + 9 * u, cy + 30 * u); g.stroke();
    },

    centaur(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 4 * u, cy + 8 * u, 26 * u, 15 * u, p);        // horse barrel
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      for (const dx of [-14, -4, 12, 22]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 18 * u); g.lineTo(cx + dx * u + 2 * u, cy + 32 * u); g.stroke();
      }
      poly(g, [[cx + 28 * u, cy + 4 * u], [cx + 44 * u, cy - 6 * u], [cx + 30 * u, cy + 12 * u]], p.lo, p.line, u);
      shaded(g, cx - 12 * u, cy - 14 * u, 13 * u, 16 * u, p);      // humanoid torso
      shaded(g, cx - 12 * u, cy - 32 * u, 10 * u, 9 * u, p);
      eyes(g, cx - 12 * u, cy - 33 * u, 4 * u, 1.6 * u, '#ffd98f');
      g.strokeStyle = '#cfd6e2'; g.lineWidth = 3 * u;              // spear
      g.beginPath(); g.moveTo(cx - 30 * u, cy + 20 * u); g.lineTo(cx + 6 * u, cy - 44 * u); g.stroke();
      poly(g, [[cx + 6 * u, cy - 44 * u], [cx + 12 * u, cy - 34 * u], [cx, cy - 36 * u]], '#e7ecf5', '#8a90a0', u);
    },

    golem(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.fillStyle = p.mid; g.strokeStyle = p.line; g.lineWidth = 2 * u;
      g.fillRect(cx - 22 * u, cy - 14 * u, 44 * u, 38 * u);
      g.strokeRect(cx - 22 * u, cy - 14 * u, 44 * u, 38 * u);
      g.fillStyle = p.lo;
      g.fillRect(cx - 30 * u, cy - 8 * u, 10 * u, 26 * u);
      g.fillRect(cx + 20 * u, cy - 8 * u, 10 * u, 26 * u);
      g.fillStyle = p.hi;
      g.fillRect(cx - 14 * u, cy - 30 * u, 28 * u, 18 * u);        // head block
      g.strokeRect(cx - 14 * u, cy - 30 * u, 28 * u, 18 * u);
      g.save(); g.shadowColor = '#ff9d3c'; g.shadowBlur = 12 * u;  // furnace eye
      g.fillStyle = '#ffb45c';
      g.fillRect(cx - 8 * u, cy - 24 * u, 16 * u, 5 * u);
      g.fillRect(cx - 6 * u, cy + 2 * u, 12 * u, 12 * u);
      g.restore();
      blade(g, cx + 34 * u, cy + 6 * u, 30 * u, 9 * u, 0.9, '#b9c0cc', '#5c6270'); // scythe arm
    },
  };

  /* --------------------------------------------------------- the survivor - */
  // Player sprites share one frame and differ by robe/armour colour, silhouette
  // accessory (staff, blades, bow...) and a class glyph on the chest.
  const HEROES = {
    mage: { accessory: 'staff', cloak: true },
    priest: { accessory: 'staff', cloak: true, halo: true },
    rogue: { accessory: 'daggers', hood: true },
    hunter: { accessory: 'bow' },
    warrior: { accessory: 'axe', bulk: 1.15 },
    warlock: { accessory: 'orb', cloak: true, hood: true },
    shaman: { accessory: 'totem', cloak: true },
    paladin: { accessory: 'shield', bulk: 1.1, halo: true },
    death_knight: { accessory: 'runeblade', bulk: 1.1, cloak: true },
    demon_hunter: { accessory: 'glaives', horns: true },
  };

  function drawHero(g, s, tint, cfg, demon) {
    const cx = s / 2, cy = s * 0.56, u = s / 100;
    const p = palette(demon ? [0.45, 0.95, 0.25] : tint);
    const bulk = cfg.bulk || 1;

    if (cfg.cloak) {                                               // cloak behind
      poly(g, [[cx - 20 * u * bulk, cy + 30 * u], [cx - 13 * u, cy - 18 * u],
      [cx + 13 * u, cy - 18 * u], [cx + 20 * u * bulk, cy + 30 * u]],
        p.lo, p.line, u);
    }
    shaded(g, cx, cy + 6 * u, 15 * u * bulk, 20 * u, p);           // torso
    shaded(g, cx - 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, -0.35);
    shaded(g, cx + 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, 0.35);
    g.fillStyle = p.dark;                                          // legs
    g.fillRect(cx - 9 * u, cy + 20 * u, 7 * u, 14 * u);
    g.fillRect(cx + 2 * u, cy + 20 * u, 7 * u, 14 * u);

    const skin = { hi: '#f2d9bd', mid: '#d9b494', lo: '#a07f63', line: '#5d4738', glow: '#fff' };
    shaded(g, cx, cy - 16 * u, 10 * u, 10 * u, demon ? p : skin);
    if (cfg.hood) {
      poly(g, [[cx - 12 * u, cy - 12 * u], [cx, cy - 34 * u], [cx + 12 * u, cy - 12 * u]], p.mid, p.line, u);
      g.fillStyle = 'rgba(6,8,14,.8)';
      g.beginPath(); g.ellipse(cx, cy - 17 * u, 7 * u, 8 * u, 0, 0, WS.TAU); g.fill();
    }
    if (cfg.horns || demon) {
      poly(g, [[cx - 8 * u, cy - 22 * u], [cx - 18 * u, cy - 42 * u], [cx - 3 * u, cy - 26 * u]], p.hi, p.line, u);
      poly(g, [[cx + 8 * u, cy - 22 * u], [cx + 18 * u, cy - 42 * u], [cx + 3 * u, cy - 26 * u]], p.hi, p.line, u);
    }
    if (cfg.halo) {
      g.save(); g.globalAlpha = 0.85; g.shadowColor = '#ffe6ae'; g.shadowBlur = 12 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 2 * u;
      g.beginPath(); g.ellipse(cx, cy - 32 * u, 12 * u, 4 * u, 0, 0, WS.TAU); g.stroke();
      g.restore();
    }
    eyes(g, cx, cy - 17 * u, 4 * u, 1.6 * u, demon ? '#d9ff6b' : '#8fd8ff');

    switch (cfg.accessory) {
      case 'staff':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3 * u; g.lineCap = 'round';
        g.beginPath(); g.moveTo(cx + 22 * u, cy + 28 * u); g.lineTo(cx + 26 * u, cy - 38 * u); g.stroke();
        g.save(); g.shadowColor = WS.hex(tint); g.shadowBlur = 16 * u;
        g.fillStyle = WS.hex(WS.mix(tint, [1, 1, 1], 0.5));
        g.beginPath(); g.arc(cx + 26 * u, cy - 42 * u, 6 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'daggers':
        blade(g, cx - 22 * u, cy + 10 * u, 20 * u, 4 * u, -0.5, '#e2e7f0', '#767c8c');
        blade(g, cx + 22 * u, cy + 10 * u, 20 * u, 4 * u, 0.5, '#e2e7f0', '#767c8c');
        break;
      case 'bow':
        g.strokeStyle = '#a97f4a'; g.lineWidth = 3 * u;
        g.beginPath(); g.arc(cx + 24 * u, cy, 22 * u, -1.1, 1.1); g.stroke();
        g.strokeStyle = '#e8edf6'; g.lineWidth = 1.2 * u;
        g.beginPath(); g.moveTo(cx + 34 * u, cy - 19 * u); g.lineTo(cx + 34 * u, cy + 19 * u); g.stroke();
        break;
      case 'axe':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3.5 * u;
        g.beginPath(); g.moveTo(cx + 20 * u, cy + 26 * u); g.lineTo(cx + 30 * u, cy - 26 * u); g.stroke();
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 46 * u, cy - 18 * u], [cx + 30 * u, cy - 6 * u]], '#d4dae6', '#767c8c', u);
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 16 * u, cy - 16 * u], [cx + 30 * u, cy - 6 * u]], '#b9c0cc', '#767c8c', u);
        break;
      case 'orb':
        g.save(); g.shadowColor = '#9d5bff'; g.shadowBlur = 18 * u;
        g.fillStyle = '#b98cff';
        g.beginPath(); g.arc(cx + 24 * u, cy - 4 * u, 7 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'totem':
        g.fillStyle = '#8b6a44'; g.fillRect(cx + 20 * u, cy - 20 * u, 9 * u, 44 * u);
        g.save(); g.shadowColor = '#4db8ff'; g.shadowBlur = 14 * u;
        g.fillStyle = '#7fd4ff'; g.fillRect(cx + 21 * u, cy - 14 * u, 7 * u, 7 * u);
        g.restore();
        break;
      case 'shield':
        poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 14 * u, cy - 18 * u], [cx - 12 * u, cy + 8 * u],
        [cx - 22 * u, cy + 20 * u], [cx - 32 * u, cy + 6 * u]], '#e0d3a8', '#8a7440', u * 1.2);
        g.save(); g.shadowColor = '#ffe6ae'; g.shadowBlur = 10 * u;
        g.fillStyle = '#fff2cc';
        g.beginPath(); g.arc(cx - 22 * u, cy - 1 * u, 4 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'runeblade':
        blade(g, cx + 24 * u, cy + 26 * u, 52 * u, 6 * u, 0.32, '#cfd8e6', '#5f6878');
        g.save(); g.globalAlpha = 0.85; g.strokeStyle = '#5be0ff'; g.lineWidth = 1.6 * u;
        g.shadowColor = '#5be0ff'; g.shadowBlur = 10 * u;

  /** Draws the obsidian plate + arc rim shared by every icon. */
  function plate(g, s, accent) {
    const r = s * 0.16;
    const grd = g.createLinearGradient(0, 0, 0, s);
    grd.addColorStop(0, '#191f2c');
    grd.addColorStop(1, '#0b0e15');
    g.fillStyle = grd;
    g.beginPath(); g.roundRect(0.5, 0.5, s - 1, s - 1, r); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 1;
    g.stroke();
    // The arc: a lit quarter along the top-left corner.
    g.save();
    g.strokeStyle = accent; g.globalAlpha = 0.85; g.lineWidth = s * 0.035; g.lineCap = 'round';
    g.beginPath(); g.arc(s / 2, s / 2, s * 0.46, WS.PI * 0.78, WS.PI * 1.32); g.stroke();
    g.restore();
  }

  WS.Icons = {
    /** Cached icon canvas. `art` is a glyph name, `color` an [r,g,b] accent. */
    get(art, color, size) {
      size = WS.round(size || 64);
      const accent = WS.hex(color || WS.CONST.COLORS.arc);
      const key = `i:${art}:${accent}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      c = document.createElement('canvas');
      c.width = size; c.height = size;
      const g = c.getContext('2d');
      plate(g, size, accent);
      g.save();
      const inset = size * 0.16;
      g.translate(inset, inset);
      g.scale((size - inset * 2) / 100, (size - inset * 2) / 100);
      g.save();
      g.shadowColor = accent; g.shadowBlur = 10;
      (G[art] || G.rune)(g, accent);
      g.restore();
      g.restore();
      cache.set(key, c);
      return c;
    },

    /** The bare glyph with no obsidian plate, for world-space objects: a coin
     *  lying in the grass should not look like a UI tile. */
    glyph(art, color, size) {
      size = WS.round(size || 32);
      const accent = WS.hex(color || WS.CONST.COLORS.arc);
      const key = `w:${art}:${accent}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * 2;
      c = document.createElement('canvas');
      c.width = res; c.height = res;
      const g = c.getContext('2d');
      g.save();
      g.scale(res / 100, res / 100);
      g.shadowColor = accent;
      g.shadowBlur = 12;
      g.lineWidth = 1;
      (G[art] || G.rune)(g, accent);
      g.restore();
      cache.set(key, c);
      return c;

  };

  FX.clear = function () {
    this.texts.releaseAll();
    this.flashes.releaseAll();

    this.flashScreen = null;

    if (!t) return;
    t.x = x; t.y = y; t.text = text; t.colour = colour;
    t.size = size; t.life = life; t.maxLife = life;

  }

  FX.damage = function (x, y, amount, crit) {
    if (!WS.Save.settings.damageNumbers) return;
    push(x + WS.randRange(-6, 6), y - 8, String(WS.floor(amount)),
      crit ? '#ffd45c' : '#f2f4f8', crit ? 20 : 14, crit ? 0.85 : 0.6, -46);
  };

  FX.playerHurt = function (x, y, amount) {
    push(x, y - 20, '-' + WS.floor(amount), '#ff6b5c', 20, 0.9, -50);
  };

  FX.heal = function (x, y, amount) {
    if (!WS.Save.settings.healNumbers) return;
    push(x, y - 26, '+' + WS.floor(amount), '#5fe08a', 16, 0.9, -40);
  };

  FX.notice = function (x, y, text, colour) {
    push(x, y - 30, text, colour || '#e8ecf6', 15, 1.1, -34);
  };

  FX.gold = function (x, y, amount) {
    push(x, y - 20, '+' + WS.floor(amount) + 'g', '#f5c56b', 15, 1.0, -38);
  };

  /* --------------------------------------------------------------- flash -- */

    if (!f) return;

    f.life = life || 0.30; f.maxLife = f.life;
  };

    this.flashScreen = { colour, life, maxLife: life };
  };

  /* ----------------------------------------------------------- particles -- */
  FX.burst = function (x, y, count, colour, speed, life, size) {
    for (let i = 0; i < count; i++) {
      const p = FX.particles.acquire();
      if (!p) return;
      const a = WS.random() * WS.TAU;
      const v = speed * WS.randRange(0.35, 1);
      p.x = x; p.y = y;
      p.vx = WS.cos(a) * v; p.vy = WS.sin(a) * v;

    h.srcName = srcName;
