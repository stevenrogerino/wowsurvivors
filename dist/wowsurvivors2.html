    if (player.lifesteal > 0) WS.Player.lifesteal(player, dealt * player.lifesteal);
    if (b.procChain > 0 && WS.random() < b.procChain) {
      WS.Weapon.chainFrom(e.x, e.y, b.damage * 0.6, 3, 220, b.source);
    }
    WS.FX.spray(b.x, b.y, -b.vx, -b.vy, 4, WS.hex(b.colour), 90, 0.3);
  }

  /* ------------------------------------------------------------- update -- */
  P.update = function (dt) {
    const player = WS.Game.player;
    const W = WS.CONST.WORLD_WIDTH, H = WS.CONST.WORLD_HEIGHT;

    /* ---- friendly bolts -------------------------------------------------- */
    let i = 0;
    while (i < this.bolts.count) {
      const b = this.bolts.active[i];
      b.life -= dt;
      if (b.life <= 0) { this.bolts.releaseAt(i); continue; }

      if (b.homing) {
        // Re-acquire when the current mark dies, so a homing bolt keeps working
        // through a crowd instead of flying off into nothing.
        if (!b.homingTarget || b.homingTarget._dead) {
          b.homingTarget = WS.Enemy.findNearest(b.x, b.y, WS.Config.homingReacquireRange);
        }
        if (b.homingTarget) {
          const [tx, ty] = WS.normalize(b.homingTarget.x - b.x, b.homingTarget.y - b.y);
          const speed = WS.sqrt(b.vx * b.vx + b.vy * b.vy);
          b.vx = WS.lerp(b.vx, tx * speed, WS.min(1, 6 * dt));
          b.vy = WS.lerp(b.vy, ty * speed, WS.min(1, 6 * dt));
        }
      }

      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.spin += b.spinRate * dt;

      if (b.x < -OFF || b.x > W + OFF || b.y < -OFF || b.y > H + OFF) {
        this.bolts.releaseAt(i); continue;
      }

      const e = WS.Enemy.findCollision(b.x, b.y, b.radius, b.hitBy);
      if (e) {
        b.hitBy.set(e, e.spawnId);
        resolveHit(b, e);

        if (b.bounces > 0) {
          // Ricochet: turn toward another target rather than dying.
          b.bounces--;
          const next = WS.Enemy.findNearest(b.x, b.y, 320, new Set([e]));
          if (next) {
            const speed = WS.sqrt(b.vx * b.vx + b.vy * b.vy);
            const [nx, ny] = WS.normalize(next.x - b.x, next.y - b.y);
            b.vx = nx * speed; b.vy = ny * speed;
            b.life = WS.max(b.life, 1.2);
          } else { this.bolts.releaseAt(i); continue; }
        } else if (b.pierce > 0) {
          b.pierce--;
        } else {
          WS.FX.flash(b.x, b.y, b.radius * 2.4, b.colour, 0.18);
          this.bolts.releaseAt(i); continue;
        }
      }
      i++;
    }

    /* ---- hostile bolts --------------------------------------------------- */
    i = 0;
    while (i < this.hostiles.count) {
      const h = this.hostiles.active[i];
      h.life -= dt;
      if (h.life <= 0) { this.hostiles.releaseAt(i); continue; }
      if (WS.Enemy.freezeTimer <= 0) {
        h.x += h.vx * dt;
        h.y += h.vy * dt;
      }
      h.spin += dt * 6;
      if (h.x < -OFF || h.x > W + OFF || h.y < -OFF || h.y > H + OFF) {
        this.hostiles.releaseAt(i); continue;
      }
      const reach = h.radius + player.radius;
      if (WS.dist2(h.x, h.y, player.x, player.y) <= reach * reach) {
        const connected = WS.Player.takeDamage(player, h.damage, h.srcName);
        if (connected && player.thornsRank > 0 && h.srcEnemy && !h.srcEnemy._dead) {
          // Thorns reflects a ranged hit back to whoever cast it.
          WS.Enemy.hit(h.srcEnemy,
            (WS.Config.thornsFlat + h.damage * WS.Config.thornsDamagePct) * player.thornsRank, 'thorns');
        }
        if (h.slowFactor) WS.Player.applySlow(player, h.slowFactor, h.slowDuration);
        WS.FX.flash(h.x, h.y, 22, h.colour, 0.2);
        this.hostiles.releaseAt(i);
        if (!WS.Game.running) return;
        continue;
      }
      i++;
    }

    /* ---- ground zones ---------------------------------------------------- */
    i = 0;
    while (i < this.zones.count) {
      const z = this.zones.active[i];
      z.life -= dt;
      if (z.life <= 0) { this.zones.releaseAt(i); continue; }
      z.tick -= dt;
      if (z.tick <= 0) {
        z.tick = z.tickRate;
        z.hitBy.clear();
        WS.Enemy.damageArea(z.x, z.y, z.radius, z.damage, z.hitBy, null, z.source);
        if (z.heal && WS.dist2(z.x, z.y, player.x, player.y) < z.radius * z.radius) {
          WS.Player.heal(player, z.heal, 'holy');
        }
      }
      i++;
    }

    /* ---- orbiting blades ------------------------------------------------- */
    i = 0;
    while (i < this.orbits.count) {
      const o = this.orbits.active[i];
      o.life -= dt;
      if (o.life <= 0) { this.orbits.releaseAt(i); continue; }
      o.angle += o.speed * dt;
      o.tick -= dt;
      if (o.tick <= 0) {
        o.tick = 0.18;              // each blade can re-hit ~5 times a second
        o.hitBy.clear();
        for (let n = 0; n < o.count; n++) {
          const a = o.angle + (n / o.count) * WS.TAU;
          const bx = player.x + WS.cos(a) * o.radius;
          const by = player.y + WS.sin(a) * o.radius;
          const before = WS.Enemy.pool.count;
          WS.Enemy.damageArea(bx, by, o.size, o.damage, o.hitBy, null, o.source);
          if (o.procChain > 0 && WS.Enemy.pool.count !== before) {
            if (WS.random() < o.procChain) WS.Weapon.chainFrom(bx, by, o.damage * 0.7, 3, 220, o.source);
          }
        }
      }
      i++;
    }

    /* ---- beams ----------------------------------------------------------- */
    i = 0;
    while (i < this.beams.count) {
      const b = this.beams.active[i];
      b.life -= dt;
      if (b.life <= 0) { this.beams.releaseAt(i); continue; }
      i++;
    }
  };

  WS.Projectile = P;

})(window.WS);

/* ===== src/game/enemy.js ===== */
/* The horde: spawning, chasing, ranged volleys, boss patterns, damage intake.
 * Enemies are pooled with a hard cap; when the field is full the oldest fodder
 * far from the survivor is evicted so elites and bosses always get a slot. */
'use strict';
(function (WS) {

  const Enemy = {
    pool: null,
    grid: null,
    freezeTimer: 0,
    spawnCounter: 0,
  };

  Enemy.init = function () {
    this.pool = new WS.Pool(() => ({}), null, WS.CONST.MAX_ENEMIES);
    this.grid = new WS.Grid(80);
    this.freezeTimer = 0;
  };

  Enemy.clear = function () {
    this.pool.releaseAll();
    this.grid.clear();
    this.freezeTimer = 0;
  };

  Enemy.count = function () { return this.pool.count; };

  /** Frees a slot by dropping the trash mob furthest from the survivor. */
  function evictFodder() {
    const player = WS.Game.player;
    let worst = -1, worstDist = 0;
    for (let i = 0; i < Enemy.pool.count; i++) {
      const e = Enemy.pool.active[i];
      if (e.boss || e.elite) continue;
      const d = WS.dist2(e.x, e.y, player.x, player.y);
      if (d > worstDist) { worstDist = d; worst = i; }
    }
    if (worst >= 0) { Enemy.pool.releaseAt(worst); return true; }
    return false;
  }

  /* -------------------------------------------------------------- spawn -- */
  Enemy.spawn = function (id, x, y, scale, force) {
    let template = WS.Enemies[id] || WS.Elites[id] || WS.Bosses[id];
    if (!template) return null;
    const isBoss = !!WS.Bosses[id];
    const isElite = !!WS.Elites[id];

    if (this.pool.count >= WS.CONST.MAX_ENEMIES) {
      if (!(isBoss || isElite || force) || !evictFodder()) return null;
    }
    const e = this.pool.acquire();
    if (!e) return null;

    scale = scale || 1;
    e.id = id;
    e.template = template;
    e.x = x; e.y = y;
    e.radius = template.radius;
    e.boss = isBoss;
    e.elite = isElite;
    e.stationary = !!template.stationary;
    e.maxHealth = WS.floor(template.health * scale * WS.CONST.ENEMY_SCALE);
    e.health = e.maxHealth;
    e.damage = template.damage * scale * WS.CONST.ENEMY_SCALE;
    e.xp = WS.max(1, WS.floor(template.xp * WS.min(scale, 3)));
    e.speed = template.speed * (1 + 0.08 * (WS.Game.player ? WS.Game.player.curse : 0));
    e.contactCooldown = 0.3;
    e.slowTimer = 0; e.slowFactor = 1;
    e.chargeTimer = 0;
    e.flash = 0;
    e.chilled = false;
    e.invuln = 0;
    e.spawnId = ++this.spawnCounter;
    e.patternIndex = 0;
    e.windup = 0;
    e.chargeDir = null;
    e.telegraph = null;      // {kind, life, maxLife, ...} drawn by the renderer
    e.attackTimer = template.interval || 3.6;
    e.rangedTimer = template.ranged ? WS.randRange(0.4, template.ranged.cooldown) : null;
    e.finalBoss = false;
    e.bob = WS.random() * WS.TAU;      // idle animation offset, so a crowd breathes
    e.facing = 1;
    e.spriteSize = template.radius * (isBoss ? 3.4 : 3.0);
    return e;
  };

  /** Spawns just off-screen on a ring around the survivor. */
  Enemy.spawnRing = function (id, distance, scale, force) {
    const player = WS.Game.player;
    const a = WS.random() * WS.TAU;
    const W = WS.CONST.WORLD_WIDTH, H = WS.CONST.WORLD_HEIGHT;
    const x = WS.clamp(player.x + WS.cos(a) * distance, -120, W + 120);
    const y = WS.clamp(player.y + WS.sin(a) * distance, -120, H + 120);
    return this.spawn(id, x, y, scale, force);
  };

  /** A scripted swarm: a full ring that closes in on the survivor. */
  Enemy.spawnCircle = function (id, count, distance, scale) {
    const player = WS.Game.player;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * WS.TAU + WS.randRange(-0.1, 0.1);
      this.spawn(id,
        player.x + WS.cos(a) * distance,
        player.y + WS.sin(a) * distance, scale);
    }
  };

  /* ------------------------------------------------------------ queries -- */
  Enemy.buildGrid = function () {
    this.grid.clear();
    for (let i = 0; i < this.pool.count; i++) this.grid.insert(this.pool.active[i]);
  };

  /** First enemy overlapping (x,y,radius) that `hitBy` has not already hit. */
  Enemy.findCollision = function (x, y, radius, hitBy) {
    let found = null;
    this.grid.query(x, y, radius + 40, (e) => {
      if (found || e._dead) return;
      if (hitBy && hitBy.get(e) === e.spawnId) return;
      const reach = radius + e.radius;
      if (WS.dist2(x, y, e.x, e.y) <= reach * reach) found = e;
    });
    return found;
  };

  /** Nearest enemy within range. `excluded` is a Set (chain lightning hops). */
  Enemy.findNearest = function (x, y, range, excluded) {
    let best = null, bestDist = range * range;
    for (let i = 0; i < this.pool.count; i++) {
      const e = this.pool.active[i];
      if (e._dead || (excluded && excluded.has(e))) continue;
      const d = WS.dist2(x, y, e.x, e.y);
      if (d < bestDist) { bestDist = d; best = e; }
    }
    return best;
  };

  Enemy.freezeAll = function (duration) {
    this.freezeTimer = WS.max(this.freezeTimer, duration);
    WS.FX.screen('rgba(120,200,255,.28)', 0.5);
    WS.Audio.play('freeze');
  };

  /* ------------------------------------------------------------- update -- */
  Enemy.update = function (dt) {
    const player = WS.Game.player;
    const cfg = WS.Config;

    if (this.freezeTimer > 0) this.freezeTimer -= dt;
    const timeFrozen = this.freezeTimer > 0;

    const chillRank = player.chillRank;
    const chillRange = (cfg.chillRangeBase + cfg.chillRangePerRank * chillRank) * player.areaMultiplier;
    const chillFactor = 1 - cfg.chillSlowPerRank * chillRank;

    let i = 0;
    while (i < this.pool.count) {
      const e = this.pool.active[i];
      const t = e.template;
      const [dx, dy, distance] = WS.normalize(player.x - e.x, player.y - e.y);

      // Time freeze halts everything except Death itself.
      const frozen = timeFrozen && t.family !== 'death';

      let speed = e.speed;
      if (frozen) speed = 0;
      const inChill = chillRank > 0 && !e.boss && distance < chillRange;
      if (inChill) speed *= chillFactor;
      e.chilled = inChill;
      if (e.slowTimer > 0) {
        e.slowTimer -= dt;
        speed *= e.slowFactor;
      }
      if (e.windup > 0) {
        // The tell: the boss plants, and the ground in front of it lights up.
        e.windup -= dt;
        speed = 0;
        if (e.windup <= 0) {
          e.chargeTimer = 1.1;
          e.chargeDir = [dx, dy];
          WS.FX.shake(5, 0.25);
          WS.Audio.play('warn');
        }
      } else if (e.chargeTimer > 0) {
        e.chargeTimer -= dt;
        speed *= 3.2;
      }

      let advance = !e.stationary;
      if (t.ranged && distance <= t.ranged.range) advance = false;
      if (advance && distance > 1) {
        e.x += dx * speed * dt;
        e.y += dy * speed * dt;
      }
      e.facing = dx < 0 ? -1 : 1;
      e.bob += dt * (advance ? 9 : 3);

      // Contact. The swing always triggers Thorns, even if the survivor dodges,
      // blocks, or is mid-invulnerability; takeDamage decides what lands.
      let struck = false;
      e.contactCooldown -= dt;
      if (!frozen && e.contactCooldown <= 0 && distance < e.radius + player.radius) {
        e.contactCooldown = e.boss ? cfg.contactCooldownBoss : cfg.contactCooldownNormal;
        struck = true;
        WS.Player.takeDamage(player, e.damage, t.name);
        if (!WS.Game.running) return;
      }

      if (e.rangedTimer !== null && !frozen) {
        e.rangedTimer -= dt;
        if (e.rangedTimer <= 0 && distance <= t.ranged.range * 1.15) {
          e.rangedTimer = t.ranged.cooldown;
          const r = t.ranged;
          WS.Projectile.spawnHostile(e.x, e.y, dx * r.speed, dy * r.speed,
            e.damage * 0.75, r.school, t.name, e, r.slowFactor, r.slowDuration);
        }
      }

      if (e.boss && !t.arena && !frozen) {
        e.attackTimer -= dt;
        if (e.attackTimer <= 0) {
          this.bossAttack(e, dx, dy);
          e.attackTimer = t.interval || 3.6;
        }
      }

      if (e.flash > 0) e.flash -= dt;
      if (e.invuln > 0) e.invuln -= dt;
      if (e.telegraph) {
        e.telegraph.life -= dt;
        if (e.telegraph.life <= 0) e.telegraph = null;
      }

      // Thorns last, so reflecting a fatal hit cannot corrupt this update.
      if (struck && player.thornsRank > 0) {
        this.hit(e, (cfg.thornsFlat + e.damage * cfg.thornsDamagePct) * player.thornsRank, 'thorns');
      }

      if (!e._dead) i++;
    }
    this.buildGrid();
  };

  /* ------------------------------------------------------ boss patterns -- */
  Enemy.bossAttack = function (e, dx, dy) {
    const t = e.template;
    const pattern = t.patterns[e.patternIndex];
    e.patternIndex = (e.patternIndex + 1) % t.patterns.length;
    const school = t.school || 'shadow';

    if (pattern.type === 'summon') {
      const scale = 1 + WS.Game.run.time / 600;
      for (let n = 0; n < (pattern.count || 6); n++) {
        const a = WS.random() * WS.TAU;
        const range = 60 + WS.random() * 70;
        this.spawn(pattern.id, e.x + WS.cos(a) * range, e.y + WS.sin(a) * range, scale);
      }
      WS.FX.flash(e.x, e.y, e.radius * 2.4, WS.CONST.COLORS.shadow, 0.4);
      e.telegraph = { kind: 'ring', life: 0.4, maxLife: 0.4, radius: e.radius * 3 };
    } else if (pattern.type === 'volley') {
      const bolts = pattern.bolts || 7;
      for (let s = 1; s <= bolts; s++) {
        const spread = (s - (bolts + 1) / 2) * 0.16;
        const c = WS.cos(spread), sn = WS.sin(spread);
        WS.Projectile.spawnHostile(e.x, e.y,
          (dx * c - dy * sn) * 260, (dx * sn + dy * c) * 260,
          e.damage * 0.7, school, t.name, e);
      }
    } else if (pattern.type === 'ring') {
      const bolts = pattern.bolts || 10;
      for (let s = 0; s < bolts; s++) {
        const a = (s / bolts) * WS.TAU;
        WS.Projectile.spawnHostile(e.x, e.y,
          WS.cos(a) * 220, WS.sin(a) * 220, e.damage * 0.6, school, t.name, e);
      }
    } else if (pattern.type === 'charge') {
      // Telegraph first: three quarters of a second planted, with the lane
      // ahead marked, then the charge itself.
      e.windup = 0.75;
      e.telegraph = { kind: 'lane', life: 0.75, maxLife: 0.75, dx, dy, length: 460, width: e.radius * 2.2 };
      WS.FX.flash(e.x, e.y, e.radius * 1.6, WS.CONST.COLORS.enemy, 0.5);
    }
  };

  /* ------------------------------------------------------ damage intake -- */
  /** Central strike entry: rolls the survivor's crit and prints the number. */
  Enemy.hit = function (e, amount, source) {
    const player = WS.Game.player;
    const crit = WS.random() < player.critChance;
    if (crit) amount *= player.critDamage;
    this.damage(e, amount, crit, source);
    WS.FX.damage(e.x, e.y - e.radius * 0.6, amount, crit);
    WS.Audio.play(crit ? 'crit' : 'hit');
    return amount;
  };

  Enemy.damage = function (e, amount, isCrit, source) {
    if (!e || e._dead) return;
    if (e.invuln > 0) return;
    const player = WS.Game.player;
    // Overkill is normally discarded; the Demon Hunter's fel meter drinks it.
    if (player && player.felAttuned > 0 && amount > e.health) {
      WS.Player.gainFel(player, amount - WS.max(0, e.health));
    }
    e.health -= amount;
    e.flash = 0.09;
    e.flashCrit = isCrit;
    const run = WS.Game.run;
    run.damageDone += amount;
    const key = source || 'untagged';
    run.damageByWeapon[key] = (run.damageByWeapon[key] || 0) + amount;
    if (e.health <= 0) this.kill(e);
  };

  Enemy.damageArea = function (x, y, radius, amount, hitBy, knockback, source) {
    let i = 0;
    while (i < this.pool.count) {
      const e = this.pool.active[i];
      const reach = radius + e.radius;
      if ((!hitBy || hitBy.get(e) !== e.spawnId) && WS.dist2(x, y, e.x, e.y) <= reach * reach) {
        if (hitBy) hitBy.set(e, e.spawnId);
        if (knockback && !e.boss) {
          const [kx, ky] = WS.normalize(e.x - x, e.y - y);
          e.x += kx * knockback;
          e.y += ky * knockback;
        }
        this.hit(e, amount, source);
        if (!e._dead) i++;
      } else i++;
    }
  };

  /** Damage everything within halfWidth of the segment (beams). */
  Enemy.damageLine = function (x1, y1, x2, y2, halfWidth, amount, source) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq <= 0) return;
    let i = 0;
    while (i < this.pool.count) {
      const e = this.pool.active[i];
      let t = ((e.x - x1) * dx + (e.y - y1) * dy) / lenSq;
      t = WS.clamp(t, 0, 1);
      const px = x1 + dx * t, py = y1 + dy * t;
      const reach = halfWidth + e.radius;
      if (WS.dist2(e.x, e.y, px, py) <= reach * reach) {
        this.hit(e, amount, source);
        if (!e._dead) i++;
      } else i++;
    }
  };

  Enemy.applySlow = function (e, factor, duration) {
    if (!e || e._dead) return;
    if (e.slowTimer <= 0 || factor < e.slowFactor) e.slowFactor = factor;
    e.slowTimer = WS.max(e.slowTimer, duration);
  };

  /* ---------------------------------------------------------------- kill - */
  Enemy.kill = function (e) {
    const run = WS.Game.run;
    const t = e.template;
    const player = WS.Game.player;

    WS.FX.corpse(e);
    WS.FX.burst(e.x, e.y, e.boss ? 26 : e.elite ? 14 : 7,
      WS.hex(t.tint), e.boss ? 260 : 150, 0.5, e.boss ? 5 : 3);
    if (e.boss) WS.FX.stop(0.16);
    else if (e.elite) WS.FX.stop(0.05);
    WS.XP.spawnGem(e.x, e.y, e.xp);
    WS.Pickup.onKill(e);
    WS.Save.recordKill(t, e.id);
    run.kills++;
    WS.Audio.play('enemyHit');

    if (player.bloodthirst && run.kills % player.bloodthirstInterval === 0) {
      WS.Player.heal(player,
        WS.floor(player.maxHealth * player.bloodthirstHealPct) + player.bloodthirstHealFlat,
        'bloodthirst');
    }

    if (e.boss) {
      run.bossesSlain++;
      if (e.id === 'aethelgard') {
        this.pool.release(e);
        WS.Arena.onBossDead();
        return;
      }
      if (e.id === 'death_itself') run.deathsSlain++;
      WS.Save.stats.bosses[e.id] = (WS.Save.stats.bosses[e.id] || 0) + 1;
      const gold = WS.floor((t.gold || 40) * run.goldMult * player.goldMultiplier);
      WS.Game.addGold(gold, e.x, e.y);
      for (let n = 0; n < 8; n++) {
        WS.XP.spawnGem(e.x + WS.randRange(-34, 34), e.y + WS.randRange(-34, 34), WS.floor(e.xp / 8));
      }
      WS.Audio.play('explode');
      WS.FX.shake(7, 0.4);
      WS.FX.flash(e.x, e.y, e.radius * 4, WS.CONST.COLORS.boss, 0.6);
      WS.Game.announce(t.name + ' has been slain!', null, 2.5);
      WS.Achievements.check();
      const wasFinal = e.finalBoss;
      this.pool.release(e);
      if (wasFinal) WS.Game.victory();
      return;
    }

    this.pool.release(e);
  };

  WS.Enemy = Enemy;

})(window.WS);

/* ===== src/game/weapon.js ===== */
/* Weapon behaviors: turn a weapon's data plus the survivor's stats into
 * projectiles, zones, orbits and beams. A new weapon usually needs only data
 * in src/data/weapons.js; a genuinely new pattern gets a handler here. */
'use strict';
(function (WS) {

  const Weapon = {};

  // One scratch spec per shot; fields are copied out by launchBolt.
  const spec = {};
  const RETRY_COOLDOWN = 0.25;   // nothing in range - look again shortly

  /* --------------------------------------------------------- derivation -- */
  function damageOf(player, w) {
    const cfg = WS.Config, d = w.data;
    const step = d.rankDamageStep || cfg.rankDamageStep;
    let base = d.damage * (1 + step * (w.level - 1))
      * player.damageMultiplier * (w.mods.damageMult || 1);
    if (w.evolved) base *= (d.evolveDamageMult || cfg.evolveDamageMult);
    if (player.metaTimer > 0) base *= cfg.metaDamageMult;
    if (!d.noNerf) base *= WS.CONST.PLAYER_DAMAGE_SCALE;
    return base;
  }

  function countOf(player, w) {
    const cfg = WS.Config, d = w.data;
    let count = d.projectiles || 1;
    if (w.level >= (d.projRankA || cfg.projRankA)) count++;
    if (w.level >= (d.projRankB || cfg.projRankB)) count++;
    count += player.projectileBonus + (w.mods.extraProjectiles || 0);
    if (w.evolved) count += (d.evolveProjectiles || cfg.evolveProjectiles);
    return count;
  }

  function areaOf(player, w, base) {
    const cfg = WS.Config, d = w.data;
    const step = d.rankAreaStep || cfg.rankAreaStep;
    const evo = w.evolved ? (d.evolveAreaMult || cfg.evolveAreaMult) : 1;
    return base * player.areaMultiplier * (1 + step * (w.level - 1)) * evo * (w.mods.areaMult || 1);
  }

  function speedOf(player, w) {
    let s = (w.data.speed || 400) * player.projectileSpeed;
    if (!w.data.noNerf) s *= WS.CONST.PLAYER_SPEED_SCALE;
    return s;
  }

  function durationOf(player, w, base) {
    return base * (1 + WS.Config.rankDurationStep * (w.level - 1));
  }

  Weapon.cooldown = function (player, w) {
    const d = w.data, cfg = WS.Config;
    let base = d.cooldown * player.cooldownMultiplier
      * (w.evolved ? (d.evolveCooldownMult || cfg.evolveCooldownMult) : 1);
    if (!d.noNerf) base *= WS.CONST.PLAYER_COOLDOWN_SCALE;
    if (player.metaTimer > 0) base *= cfg.metaCooldownMult;
    // A runaway multiplier must never silently switch a weapon off.
    if (!(base > 0) || base > 20) base = 20;
    if (base < 0.05) base = 0.05;
    return base;
  };

  /** The colour a weapon paints with - data may override its school palette. */
  function schoolColour(w) {
    if (w.evolved && w.data.evolvedColor) return w.data.evolvedColor;
    return w.data.color || WS.CONST.COLORS[w.data.school];
  }

  Weapon.colour = schoolColour;

  /** The behavior actually used: an evolution may change it (Moonfire). */
  function behaviorOf(w) {
    return (w.evolved && w.data.evolvedBehavior) || w.data.behavior;
  }
  Weapon.behaviorOf = behaviorOf;

  function fillSpec(player, w) {
    const d = w.data, cfg = WS.Config;
    spec.damage = damageOf(player, w);
    spec.life = d.life || 2.0;
    spec.radius = (d.radius || 8) * (1 + cfg.rankRadiusStep * (w.level - 1))
      * (w.evolved ? cfg.evolveRadiusMult : 1);
    spec.pierce = (d.pierce || 0) + (w.evolved ? cfg.evolvePierce : 0);
    spec.art = d.art;
    spec.colour = schoolColour(w);
    spec.homingTarget = null;
    const splash = d.splash || w.mods.splash;
    spec.splash = splash ? areaOf(player, w, splash) : null;
    spec.slowFactor = d.slowFactor || w.mods.slowFactor;
    spec.slowDuration = d.slowDuration || w.mods.slowDuration;
    spec.bounces = 0;
    spec.source = w.id;
    spec.heal = (w.evolved ? (d.evolvedHeal || 0) : 0) + (w.mods.healBonus || 0) + (d.heal || 0);
    spec.procChain = d.procChain || w.mods.procChain || 0;
    spec.spinRate = d.art === 'dagger' || d.art === 'axe' ? 14 : 0;
    return spec;
  }

  /* ---------------------------------------------------------- behaviors -- */
  Weapon.behaviors = {};

  function fireAimedShot(player, w, target) {
    const d = w.data;
    fillSpec(player, w);
    const speed = speedOf(player, w);
    const [dx, dy] = WS.normalize(target.x - player.x, target.y - player.y);
    spec.homingTarget = (d.homing || w.mods.homing) ? target : null;
    WS.Projectile.launchBolt(player.x, player.y, dx * speed, dy * speed, spec);
  }

  Weapon.behaviors.aimed = function (player, w) {
    const d = w.data;
    const target = WS.Enemy.findNearest(player.x, player.y, d.range || 560);
    if (!target) { w.cooldown = RETRY_COOLDOWN; return false; }
    const count = countOf(player, w);
    if (d.burst) {
      // Magic-missile style: the rest of the volley trickles out one at a time,
      // each re-acquiring the nearest enemy (see player.js).
      fireAimedShot(player, w, target);
      w.burstShots = count - 1;
      w.burstTimer = 0.09;
    } else {
      for (let i = 0; i < count; i++) {
        const t = i === 0 ? target : (WS.Enemy.findNearest(player.x, player.y, d.range || 560) || target);
        fireAimedShot(player, w, t);
      }
    }
    return true;
  };

  Weapon.fireBurstShot = function (player, w) {
    const d = w.data;
    const target = WS.Enemy.findNearest(player.x, player.y, d.range || 560);
    if (!target) return;
    fireAimedShot(player, w, target);
  };

  Weapon.behaviors.spray = function (player, w) {
    const d = w.data;
    const target = WS.Enemy.findNearest(player.x, player.y, d.range || 560);
    if (!target) { w.cooldown = RETRY_COOLDOWN; return false; }
    fillSpec(player, w);
    const speed = speedOf(player, w);
    const count = countOf(player, w);
    const [dx, dy] = WS.normalize(target.x - player.x, target.y - player.y);
    const spread = d.spread || 0.16;
    for (let i = 0; i < count; i++) {
      const a = (i - (count - 1) / 2) * spread;
      const c = WS.cos(a), s = WS.sin(a);
      WS.Projectile.launchBolt(player.x, player.y,
        (dx * c - dy * s) * speed, (dx * s + dy * c) * speed, spec);
    }
    return true;
  };

  Weapon.behaviors.ring = function (player, w) {
    fillSpec(player, w);
    const speed = speedOf(player, w);
    const count = countOf(player, w);
    const offset = WS.random() * WS.TAU;
    for (let i = 0; i < count; i++) {
      const a = offset + (i / count) * WS.TAU;
      WS.Projectile.launchBolt(player.x, player.y, WS.cos(a) * speed, WS.sin(a) * speed, spec);
    }
    return true;
  };

  Weapon.behaviors.nova = function (player, w) {
    const d = w.data;
    const radius = areaOf(player, w, d.radius || 150);
    const damage = damageOf(player, w);
    const colour = schoolColour(w);
    const heal = (w.evolved ? (d.evolvedHeal || 0) : 0) + (w.mods.healBonus || 0) + (d.heal || 0);

    WS.Enemy.damageArea(player.x, player.y, radius, damage, null, d.knockback, w.id);
    WS.FX.flash(player.x, player.y, radius, colour, d.expandTime || 0.35);
    WS.FX.flash(player.x, player.y, radius * 0.6, colour, (d.expandTime || 0.35) * 0.7);
    if (heal > 0) WS.Player.heal(player, heal, 'holy');
    WS.Audio.play('cast');
    return true;
  };

  Weapon.behaviors.zone = function (player, w) {
    const d = w.data;
    WS.Projectile.spawnZone(player.x, player.y,
      areaOf(player, w, d.radius || 120),
      damageOf(player, w),
      durationOf(player, w, d.duration || 4),
      d.tickRate || 0.5,
      schoolColour(w), w.id,
      (w.evolved ? (d.evolvedHeal || 0) : 0) + (w.mods.healBonus || 0));
    WS.Audio.play('cast');
    return true;
  };

  Weapon.behaviors.chain = function (player, w) {
    const d = w.data;
    const range = areaOf(player, w, d.range || 250);
    const first = WS.Enemy.findNearest(player.x, player.y, range * 1.6);
    if (!first) { w.cooldown = RETRY_COOLDOWN; return false; }
    const chains = (d.chains || 4) + player.projectileBonus + (w.evolved ? 2 : 0);
    Weapon.chainFrom(player.x, player.y, damageOf(player, w), chains, range, w.id, schoolColour(w));
    WS.Audio.play('cast');
    return true;
  };

  /** Shared lightning hop, also used by the Windseeker proc. */
  Weapon.chainFrom = function (x, y, damage, chains, range, source, colour) {
    colour = colour || WS.CONST.COLORS.nature;
    const visited = new Set();
    let px = x, py = y;
    for (let i = 0; i < chains; i++) {
      const target = WS.Enemy.findNearest(px, py, range, visited);
      if (!target) break;
      visited.add(target);
      WS.Projectile.spawnBeam(px, py, target.x, target.y, 4, colour, 0.16);
      WS.Enemy.hit(target, damage * (1 - i * 0.06), source);
      WS.FX.flash(target.x, target.y, 22, colour, 0.18);
      px = target.x; py = target.y;
      if (target._dead) continue;
    }
  };

  Weapon.behaviors.orbit = function (player, w) {
    const d = w.data, cfg = WS.Config;
    let count = (d.projectiles || 2) + player.projectileBonus + (w.mods.extraProjectiles || 0);
    let speed = d.orbitSpeed || 4.2;
    if (w.evolved) { count += cfg.evolveOrbitBlades; speed *= cfg.evolveOrbitSpeed; }
    if (w.level >= cfg.projRankA) count++;
    if (w.level >= cfg.projRankB) count++;

    if (w.mods.novaOnCast) {
      // Divine Storm discovery: the whirl opens with a pulse of Light.
      const r = 130 * player.areaMultiplier;
      WS.Enemy.damageArea(player.x, player.y, r, damageOf(player, w) * 0.8, null, 20, w.id);
      WS.FX.flash(player.x, player.y, r, WS.CONST.COLORS.holy, 0.3);
    }

    WS.Projectile.spawnOrbit(player, count,
      areaOf(player, w, d.orbitRadius || 85), speed,
      damageOf(player, w) * 0.5,             // orbits re-hit often, so per-tick is lower
      areaOf(player, w, d.radius || 20),
      durationOf(player, w, d.duration || 3.2),
      schoolColour(w), w.id, d.procChain || w.mods.procChain || 0);
    player.spinTimer = durationOf(player, w, d.duration || 3.2);
    WS.Audio.play('cast');
    return true;
  };

  Weapon.behaviors.storm = function (player, w) {
    const d = w.data;
    const strikes = (d.strikes || 5) + player.projectileBonus + (w.evolved ? 2 : 0);
    const radius = areaOf(player, w, d.stormRadius || 230);
    const splash = areaOf(player, w, d.splash || 60);
    const damage = damageOf(player, w);
    const colour = schoolColour(w);
    let landed = 0;
    for (let i = 0; i < strikes; i++) {
      const target = WS.Enemy.findNearest(player.x, player.y, radius,
        null);
      let sx, sy;
      if (target && WS.random() < 0.85) {
        sx = target.x + WS.randRange(-30, 30);
        sy = target.y + WS.randRange(-30, 30);
      } else {
        const a = WS.random() * WS.TAU, r = WS.random() * radius;
        sx = player.x + WS.cos(a) * r;
        sy = player.y + WS.sin(a) * r;
      }
      WS.Enemy.damageArea(sx, sy, splash, damage, null, null, w.id);
      WS.FX.flash(sx, sy, splash, colour, 0.32);
      WS.FX.burst(sx, sy, 5, WS.hex(colour), 110, 0.35, 2.5);
      landed++;
    }
    if (landed) WS.Audio.play('cast');
    return true;
  };

  Weapon.behaviors.bounce = function (player, w) {
    const d = w.data;
    const target = WS.Enemy.findNearest(player.x, player.y, d.range || 600);
    if (!target) { w.cooldown = RETRY_COOLDOWN; return false; }
    fillSpec(player, w);
    spec.bounces = (d.bounces || 3) + (w.mods.extraBounces || 0)
      + player.projectileBonus + (w.evolved ? 3 : 0);
    spec.spinRate = 16;
    const speed = speedOf(player, w);
    const count = 1 + (w.evolved ? 1 : 0);
    for (let i = 0; i < count; i++) {
      const t = i === 0 ? target : (WS.Enemy.findNearest(player.x, player.y, d.range || 600, new Set([target])) || target);
      const [dx, dy] = WS.normalize(t.x - player.x, t.y - player.y);
      WS.Projectile.launchBolt(player.x, player.y, dx * speed, dy * speed, spec);
    }
    return true;
  };

  Weapon.behaviors.beam = function (player, w) {
    const d = w.data;
    const target = WS.Enemy.findNearest(player.x, player.y, d.range || 620);
    if (!target) { w.cooldown = RETRY_COOLDOWN; return false; }
    const [dx, dy] = WS.normalize(target.x - player.x, target.y - player.y);
    const range = areaOf(player, w, d.range || 620);
    let width = areaOf(player, w, d.beamWidth || 26);
    if (player.metaTimer > 0) width *= (d.metaWidthMult || 1.8);
    const x2 = player.x + dx * range, y2 = player.y + dy * range;
    const damage = damageOf(player, w);
    WS.Enemy.damageLine(player.x, player.y, x2, y2, width * 0.5, damage, w.id);
    WS.Projectile.spawnBeam(player.x, player.y, x2, y2, width, schoolColour(w), 0.22);
    WS.FX.flash(player.x, player.y, width, schoolColour(w), 0.2);
    WS.Audio.play('cast');
    return true;
  };

  /* --------------------------------------------------------------- fire -- */
  Weapon.fire = function (player, w) {
    const handler = Weapon.behaviors[behaviorOf(w)];
    if (!handler) return;
    const fired = handler(player, w);
    if (fired === false) return;
    // A muzzle flash in the weapon's own colour, so a six-weapon build reads
    // as six distinct instruments rather than one undifferentiated stream.
    const b = behaviorOf(w);
    if (b === 'aimed' || b === 'spray' || b === 'ring' || b === 'bounce') {
      WS.FX.flash(player.x, player.y, 26, schoolColour(w), 0.16);
    }
    if (w.data.behavior === 'aimed') WS.Audio.play('cast');
  };

  /* ---------------------------------------------------------- describe -- */
  /** Human-readable current stats, used by the pause sheet and tooltips. */
  Weapon.describe = function (player, w) {
    const d = w.data;
    const lines = [];
    const behavior = behaviorOf(w);
    lines.push(['Damage', WS.round(damageOf(player, w))]);
    lines.push(['Cooldown', Weapon.cooldown(player, w).toFixed(2) + 's']);
    if (behavior === 'nova' || behavior === 'zone') {
      lines.push(['Radius', WS.round(areaOf(player, w, d.radius || 120))]);
    } else if (behavior === 'chain') {
      lines.push(['Chains', (d.chains || 4) + player.projectileBonus + (w.evolved ? 2 : 0)]);
    } else if (behavior === 'orbit') {
      lines.push(['Blades', (d.projectiles || 2) + player.projectileBonus + (w.evolved ? WS.Config.evolveOrbitBlades : 0)]);
    } else if (behavior === 'storm') {
      lines.push(['Strikes', (d.strikes || 5) + player.projectileBonus + (w.evolved ? 2 : 0)]);
    } else if (behavior === 'beam') {
      lines.push(['Width', WS.round(areaOf(player, w, d.beamWidth || 26))]);
    } else {
      lines.push(['Projectiles', countOf(player, w)]);
      if ((d.pierce || 0) > 0 || w.evolved) {
        lines.push(['Pierce', (d.pierce || 0) + (w.evolved ? WS.Config.evolvePierce : 0)]);
      }
    }
    return lines;
  };

  WS.Weapon = Weapon;

})(window.WS);

/* ===== src/game/player.js ===== */
/* The survivor: stats, movement, weapon cadence, experience, damage intake,
 * and the two mirrored resource systems - Desecration (wasted healing becomes
 * shadow damage) and Fel (wasted overkill becomes Metamorphosis). */
'use strict';
(function (WS) {

  const Player = {};

  /** XP to go from `level` to `level+1`. The curve steepens sharply past a
   *  threshold so a finished build is a late-run milestone, not a coast. */
  Player.xpForLevel = function (level) {
    const c = WS.Config;
    const n = level - 1;
    let base = c.xpBase + c.xpLinear * n + n * n * c.xpQuad;
    if (level > c.xpSteepFrom) {
      const d = level - c.xpSteepFrom;
      base += d * d * c.xpSteepMag;
    }
    return WS.floor(base);
  };

  Player.create = function (characterId) {
    const c = WS.Characters[characterId];
    const p = {
      characterId,
      character: c,
      x: WS.CONST.WORLD_WIDTH * 0.5,
      y: WS.CONST.WORLD_HEIGHT * 0.5,
      radius: WS.CONST.PLAYER_RADIUS,

      maxHealth: c.maxHealth,
      health: c.maxHealth,
      healthRegen: c.healthRegen || 0,
      moveSpeed: c.moveSpeed,
      armor: c.armor,
      pickupRadius: c.pickupRadius,

      damageMultiplier: 1,
      cooldownMultiplier: 1,
      areaMultiplier: 1,
      projectileBonus: 0,
      projectileSpeed: 1,
      critChance: WS.Config.baseCritChance,
      critDamage: WS.Config.baseCritDamage,
      luck: 1,
      goldMultiplier: 1,
      xpMultiplier: 1,
      healingMult: 1,

      level: 1,
      xp: 0,
      xpToNext: Player.xpForLevel(1),

      rerolls: WS.Config.baseRerolls,
      banishes: WS.Config.baseBanishes,
      startLevelUps: 0,
      revives: 0,

      weapons: [],
      weaponLevels: {},
      upgradeLevels: {},
      banished: {},
      combosActive: {},
      blessingsTaken: {},
      blessingNames: [],
      unionsForged: {},

      desecration: 0, desecrationOverheal: 0, desecrationShare: 0,
      desecrationPool: 0, desecrationTimer: 0, desecrationDealt: 0,
      felAttuned: 0, fel: 0, felBonus: 0, soulRending: 0, metaTimer: 0,
      metamorphoses: 0,
      summonDamage: 0, summonHaste: 0,
      lifesteal: 0, lifestealCarry: 0,

      invulnerable: 0,
      regenCarry: 0,
      healBatch: 0, healBatchTimer: 1,
      moving: false,
      facing: 1,
      spinTimer: 0,
      slowTimer: 0, slowFactor: 1,
      walkCycle: 0,

      blockRank: 0, blockTimer: 0, blockInterval: 0, blockReady: false,
      chillRank: 0, curse: 0, retRank: 0, retTimer: 0,
      thornsRank: 0, dodgeChance: 0,
      limitBreaks: 0,
      runEggs: 0,

      bloodthirst: false, momentum: false, overflow: 0,
    };

    // Trainer lessons first, then the survivor's own perk, so percentages
    // stack on top of trained bases.
    for (const id of Object.keys(WS.Save.db.meta)) {
      const m = WS.MetaUpgrades[id];
      const rank = WS.Save.db.meta[id];
      if (m && rank > 0) m.apply(p, rank, m);
    }
    if (c.apply) c.apply(p, c);

    Player.addWeapon(p, c.weapon);
    return p;
  };

  /* ------------------------------------------------------------ weapons -- */
  Player.addWeapon = function (p, id) {
    if (p.weaponLevels[id]) return Player.levelWeapon(p, id);
    const w = { id, data: WS.Weapons[id], level: 1, cooldown: 0.35, mods: {}, burstShots: 0, burstTimer: 0 };
    p.weapons.push(w);
    p.weaponLevels[id] = 1;
    WS.ComboSystem.check(p);
    WS.Save.stats.maxWeapons = WS.max(WS.Save.stats.maxWeapons, p.weapons.length);
    return w;
  };

  Player.levelWeapon = function (p, id) {
    const level = p.weaponLevels[id] || 0;
    if (level >= WS.WEAPON_MAX_LEVEL) return false;
    p.weaponLevels[id] = level + 1;
    const w = Player.getWeapon(p, id);
    if (w) { w.level = level + 1; return true; }
    return false;
  };

  Player.getWeapon = function (p, id) {
    for (const w of p.weapons) if (w.id === id) return w;
    return null;
  };

  Player.removeWeapon = function (p, id) {
    delete p.weaponLevels[id];
    for (let i = p.weapons.length - 1; i >= 0; i--) {
      if (p.weapons[i].id === id) p.weapons.splice(i, 1);
    }
  };

  /** The Eclipse Arena hands out a ready-made kit so the duel tests the
   *  boss's mechanics rather than a 30-minute build-up. */
  Player.grantArenaLoadout = function (p) {
    const kit = [
      { id: 'arcane_missiles', evolved: true },
      { id: 'holy_nova', evolved: true },
      { id: 'chain_lightning', evolved: true },
      { id: 'fan_of_knives', evolved: true },
      { id: 'consecration', evolved: false },
    ];
    for (const slot of kit) {
      Player.addWeapon(p, slot.id);
      p.weaponLevels[slot.id] = WS.WEAPON_MAX_LEVEL;
      const w = Player.getWeapon(p, slot.id);
      if (w) { w.level = WS.WEAPON_MAX_LEVEL; w.evolved = slot.evolved; }
    }
    // Whatever the survivor brought of their own is brought up to the same
    // standard, so no slot in the arena kit is dead weight.
    for (const w of p.weapons) {
      if (w.level < WS.WEAPON_MAX_LEVEL) {
        w.level = WS.WEAPON_MAX_LEVEL;
        p.weaponLevels[w.id] = WS.WEAPON_MAX_LEVEL;
      }
    }
    const passives = { might: 4, haste: 3, fleetfoot: 3, armor: 3, vitality: 3, dodge: 2, area: 3, precision: 3 };
    for (const id of Object.keys(passives)) {
      const up = WS.Upgrades[id];
      for (let n = 0; n < passives[id]; n++) up.apply(p, up);
      p.upgradeLevels[id] = passives[id];
    }
    WS.ComboSystem.check(p);
  };

  /* ------------------------------------------------------------- update -- */
  Player.update = function (p, dt) {
    const keys = WS.Input.keys;
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    const moving = dx !== 0 || dy !== 0;

    let speed = p.moveSpeed;
    if (p.slowTimer > 0) { p.slowTimer -= dt; speed *= p.slowFactor; }

    if (moving) {
      const n = WS.normalize(dx, dy);
      dx = n[0]; dy = n[1];
      const ab = WS.Game.arenaBounds;
      const minX = (ab ? ab.minX : 0) + p.radius;
      const maxX = (ab ? ab.maxX : WS.CONST.WORLD_WIDTH) - p.radius;
      const minY = (ab ? ab.minY : 0) + p.radius;
      const maxY = (ab ? ab.maxY : WS.CONST.WORLD_HEIGHT) - p.radius;
      p.x = WS.clamp(p.x + dx * speed * dt, minX, maxX);
      p.y = WS.clamp(p.y + dy * speed * dt, minY, maxY);
      if (dx !== 0) p.facing = dx < 0 ? -1 : 1;
      p.walkCycle += dt * 11;
    } else {
      p.walkCycle += dt * 2.5;
    }
    p.moving = moving;

    if (p.spinTimer > 0) p.spinTimer -= dt;

    // Divine Bulwark recharges over time and flares when it comes back up.
    if (p.blockRank > 0 && !p.blockReady) {
      p.blockTimer -= dt;
      if (p.blockTimer <= 0) {
        p.blockReady = true;
        WS.FX.flash(p.x, p.y, 44, WS.CONST.COLORS.holy, 0.3);
      }
    }

    // Passive regeneration. With Desecration running it keeps ticking at full
    // health, because that overflow is exactly the fuel.
    if (p.healthRegen > 0 && (p.health < p.maxHealth || p.desecration > 0)) {
      p.regenCarry += p.healthRegen * p.healingMult * dt;
      if (p.regenCarry >= 1) {
        const whole = WS.floor(p.regenCarry);
        p.regenCarry -= whole;
        Player.applyHeal(p, whole, 'regen');
      }
    }

    // Metamorphosis.
    if (p.metaTimer > 0) {
      p.metaTimer -= dt;
      if (p.metaTimer <= 0) {
        p.metaTimer = 0;
        if (p.fel >= WS.Config.felToMeta) {
          p.fel = 0;
          Player.metamorphose(p);
        } else {
          WS.FX.flash(p.x, p.y, 110, [0.45, 0.85, 0.30], 0.4);
          WS.FX.notice(p.x, p.y, 'The fel recedes', '#9fe66b');
        }
      }
    }

    // Desecration: release the pooled conversion as one shadow pulse.
    if (p.desecrationPool > 0) {
      p.desecrationTimer -= dt;
      if (p.desecrationTimer <= 0) {
        p.desecrationTimer = WS.Config.desecrationInterval;
        const coeff = WS.Config.desecrationCoefficient;
        const dmg = WS.floor(p.desecrationPool * coeff);
        if (dmg >= 1) {
          // Spend only what was dealt and keep the remainder, or a modest
          // healing build would be floored to nothing every single tick.
          p.desecrationPool -= dmg / coeff;
          p.desecrationDealt += dmg;
          const radius = WS.Config.desecrationRadius * p.areaMultiplier;
          WS.Enemy.damageArea(p.x, p.y, radius, dmg, null, null, 'desecration');
          const punch = WS.min(1, dmg / 60);
          WS.FX.flash(p.x, p.y, radius * (0.86 + 0.24 * punch), [0.42, 0.12, 0.55], 0.32);
          WS.FX.flash(p.x, p.y, radius * (0.60 + 0.18 * punch), [0.30, 0.80 + 0.2 * punch, 0.22], 0.28);
          if (punch >= 0.85) WS.FX.shake(3, 0.16);
        }
      }
    }

    // Batch the continuous trickle into one green "+N" a second.
    p.healBatchTimer -= dt;
    if (p.healBatchTimer <= 0) {
      p.healBatchTimer = 1.0;
      if (p.healBatch > 0) {
        WS.FX.heal(p.x, p.y, p.healBatch);
        p.healBatch = 0;
      }
    }

    if (p.invulnerable > 0) p.invulnerable -= dt;

    // Retribution Aura: sears everything nearby twice a second.
    if (p.retRank > 0) {
      const cfg = WS.Config;
      const range = (cfg.retributionRange + cfg.retributionRangePerRank * p.retRank) * p.areaMultiplier;
      p.retTimer -= dt;
      if (p.retTimer <= 0) {
        p.retTimer = cfg.retributionTick;
        const dmg = (cfg.retributionBase + cfg.retributionPerRank * p.retRank)
          * p.damageMultiplier * WS.CONST.PLAYER_DAMAGE_SCALE;
        WS.Enemy.damageArea(p.x, p.y, range, dmg, null, null, 'retribution');
      }
    }

    // Automatic attacks. Momentum hastens firing while moving.
    const haste = (p.momentum && moving) ? (1 + p.momentumHaste) : 1;
    for (const w of p.weapons) {
      if (w.burstShots > 0) {
        w.burstTimer -= dt;
        if (w.burstTimer <= 0) {
          w.burstTimer = 0.09;
          w.burstShots--;
          WS.Weapon.fireBurstShot(p, w);
        }
      }
      w.cooldown -= dt * haste;
      if (w.cooldown <= 0) {
        WS.Weapon.fire(p, w);
        w.cooldown = WS.Weapon.cooldown(p, w);
      }
    }
  };

  /* ---------------------------------------------------- xp / level-ups --- */
  Player.gainXP = function (p, amount) {
    // Arcane Overflow: a gathered gem may discharge every weapon at once.
    if (p.overflow && WS.random() < p.overflow) {
      for (const w of p.weapons) WS.Weapon.fire(p, w);
      WS.FX.flash(p.x, p.y, 60, WS.CONST.COLORS.arcane, 0.3);
    }

    p.xp += amount * p.xpMultiplier;
    while (p.xp >= p.xpToNext) {
      p.xp -= p.xpToNext;
      p.level++;
      p.xpToNext = Player.xpForLevel(p.level);
      WS.Game.pendingLevelUps++;
      // Small automatic growth, so a level is a reward before the boon choice.
      p.maxHealth += 2;
      p.health = WS.min(p.maxHealth, p.health + 2);
      WS.Save.stats.bestLevel = WS.max(WS.Save.stats.bestLevel, p.level);
    }
    if (WS.Game.pendingLevelUps > 0 && !WS.Game.leveling) WS.Game.openLevelUp();
  };

  /* ------------------------------------------------------------ healing -- */
  const IMMEDIATE_HEAL = { potion: true, food: true, vitality: true, bloodthirst: true };

  Player.recordHeal = function (amount, source) {
    if (amount <= 0) return;
    const run = WS.Game.run;
    if (!run) return;
    run.healingDone += amount;
    run.healingBySource[source] = (run.healingBySource[source] || 0) + amount;
  };

  Player.desecrate = function (p, amount) {
    if (amount <= 0 || p.desecration <= 0) return;
    p.desecrationPool += amount;
  };

  /** Splits a heal into the part that lands and the part that would be wasted,
   *  feeding both into desecration at their own rates. */
  Player.applyHeal = function (p, scaled, source) {
    const room = WS.max(0, p.maxHealth - p.health);
    const gained = WS.min(scaled, room);
    if (p.desecration > 0) {
      Player.desecrate(p, (scaled - gained) * p.desecrationOverheal + gained * p.desecrationShare);
    }
    if (gained <= 0) return 0;
    p.health += gained;
    Player.recordHeal(gained, source);
    if (IMMEDIATE_HEAL[source]) WS.FX.heal(p.x, p.y, gained);
    else p.healBatch += gained;
    return gained;
  };

  Player.heal = function (p, amount, source) {
    // No early-out at full health: overheal is a resource Desecration eats,
    // so the heal still has to be measured.
    const scaled = WS.floor(amount * p.healingMult);
    if (scaled <= 0) return 0;
    return Player.applyHeal(p, scaled, source || 'other');
  };

  Player.lifesteal = function (p, amount) {
    if (amount <= 0) return;
    if (p.health >= p.maxHealth && p.desecration <= 0) return;
    p.lifestealCarry += amount;
    const whole = WS.floor(p.lifestealCarry);
    if (whole >= 1) {
      p.lifestealCarry -= whole;
      Player.heal(p, whole, 'lifesteal');
    }
  };

  Player.grantRunEggs = function (p, n) {
    if (n <= 0) return;
    p.runEggs += n;
    p.damageMultiplier += WS.Config.eggRunDamage * n;
    p.maxHealth += WS.Config.eggRunHealth * n;
    p.health += WS.Config.eggRunHealth * n;
  };

  /* ----------------------------------------------------------------- fel - */
  Player.gainFel = function (p, amount) {
    if (amount <= 0 || p.felAttuned <= 0) return;
    const cfg = WS.Config;
    let rate = cfg.felPerOverkill + cfg.felPerRank * p.soulRending + p.felBonus;
    // Charging during the form is throttled, or 100% uptime would be trivial.
    if (p.metaTimer > 0) rate *= cfg.metaFelRate;
    const need = cfg.felToMeta;
    p.fel = WS.min(need, p.fel + amount * rate);
    if (p.fel >= need && p.metaTimer <= 0) {
      p.fel = 0;                              // the whole bar is spent
      Player.metamorphose(p);
    }
  };

  Player.metamorphose = function (p) {
    const cfg = WS.Config;
    p.metaTimer = cfg.metaDuration + cfg.metaDurationPerRank * p.soulRending;
    p.metamorphoses++;
    const run = WS.Game.run;
    if (run) run.metamorphoses = (run.metamorphoses || 0) + 1;
    if (p.metamorphoses <= 1) {
      WS.Game.announce('Metamorphosis!', 'The fel takes hold.', 2.0);
      WS.Audio.play('evolve');
    }
    WS.FX.shake(10, 0.5);
    WS.FX.screen('rgba(120,255,60,.18)', 0.4);
    WS.FX.flash(p.x, p.y, 90, [0.85, 1.0, 0.55], 0.4);
    WS.FX.flash(p.x, p.y, 190, [0.55, 1.0, 0.20], 0.5);
    WS.FX.burst(p.x, p.y, 24, '#8cf24a', 300, 0.7, 4);
  };

  /* ------------------------------------------------------------- damage -- */
  Player.applySlow = function (p, factor, duration) {
    if (!factor) return;
    p.slowFactor = WS.min(p.slowFactor, factor);
    p.slowTimer = WS.max(p.slowTimer, duration || 1);
  };

  /** True if the hit connected (false while invulnerable). A dodge still
   *  counts as connected - the attacker's swing is used up - but deals none. */
  Player.takeDamage = function (p, amount, srcName) {
    if (p.invulnerable > 0) return false;
    const run = WS.Game.run;

    if (p.dodgeChance && WS.random() < p.dodgeChance) {
      p.invulnerable = WS.Config.dodgeInvulnerable;
      run.damagePrevented += amount;
      WS.FX.notice(p.x, p.y, 'Dodge', '#bfe6ff');
      return true;
    }

    if (p.blockReady) {
      p.blockReady = false;
      p.blockTimer = p.blockInterval;
      p.invulnerable = WS.Config.hitInvulnerable;
      run.damagePrevented += amount;
      WS.FX.notice(p.x, p.y, 'BLOCK', '#ffe08a');
      WS.FX.flash(p.x, p.y, 60, WS.CONST.COLORS.holy, 0.3);
      return true;
    }

    // Armor is a diminishing % reduction, never a flat subtraction, so it
    // matters against big hits and cannot trivialise small ones.
    const armor = p.armor || 0;
    const reduction = armor > 0 ? armor / (armor + WS.Config.armorConstant) : 0;
    const taken = WS.max(1, WS.floor(amount * (1 - reduction)));
    run.damagePrevented += (amount - taken);
    run.damageTaken += taken;
    p.health -= taken;
    p.invulnerable = WS.Config.hitInvulnerable;
    run.noHitStreak = 0;
    WS.FX.playerHurt(p.x, p.y, taken);
    WS.FX.shake(5, 0.22);
    WS.Audio.play('playerHurt');

    if (p.health <= 0) {
      if (p.revives > 0) {
        p.revives--;
        p.health = WS.floor(p.maxHealth * 0.5);
        p.invulnerable = 2.5;
        WS.FX.flash(p.x, p.y, 130, WS.CONST.COLORS.nature, 0.6);
        WS.Enemy.damageArea(p.x, p.y, 170, 200, null, 90, 'reincarnation');
        WS.Game.announce('Reincarnation!', 'The ancestors are not done with you.', 2.5);
        WS.Audio.play('level');
        return true;
      }
      run.killedBy = { name: srcName || 'the endless horde' };
      WS.Game.endRun('defeated');
    }
    return true;
  };

  WS.Player = Player;

})(window.WS);

/* ===== src/game/xp.js ===== */
/* Experience gems: tiered by value, pooled, and merged into an existing gem
 * when the field saturates so a late swarm never loses experience to the cap. */
'use strict';
(function (WS) {

  const XP = { pool: null, vacuumTimer: 0 };

  XP.init = function () {
    this.pool = new WS.Pool(() => ({}), null, WS.CONST.MAX_GEMS);
    this.vacuumTimer = 0;
  };

  XP.clear = function () {
    this.vacuumTimer = 0;
    if (this.pool) this.pool.releaseAll();
  };

  function style(gem) {
    const C = WS.CONST.COLORS;
    if (gem.value >= 25) { gem.size = 9; gem.colour = C.gemHigh; gem.tier = 2; }
    else if (gem.value >= 8) { gem.size = 7.5; gem.colour = C.gemMid; gem.tier = 1; }
    else { gem.size = 6; gem.colour = C.gemLow; gem.tier = 0; }
  }

  XP.spawnGem = function (x, y, value) {
    if (value <= 0) return;
    if (this.pool.count >= WS.CONST.MAX_GEMS) {
      const gem = this.pool.active[WS.randInt(0, this.pool.count - 1)];
      gem.value += value;
      style(gem);
      return;
    }
    const gem = this.pool.acquire();
    if (!gem) return;
    gem.x = x + WS.randRange(-6, 6);
    gem.y = y + WS.randRange(-6, 6);
    gem.value = value;
    gem.radius = 8;
    gem.spin = WS.random() * WS.TAU;
    style(gem);
  };

  /** Lodestone: a brief one-shot sweep of everything currently on the field.
   *  Timed, so it does not keep magnetising gems that drop afterwards. */
  XP.vacuumAll = function () { this.vacuumTimer = 1.5; };

  XP.update = function (dt) {
    const player = WS.Game.player;
    if (this.vacuumTimer > 0) this.vacuumTimer -= dt;
    const vacuum = this.vacuumTimer > 0;

    let i = 0;
    while (i < this.pool.count) {
      const gem = this.pool.active[i];
      const [dx, dy, distance] = WS.normalize(player.x - gem.x, player.y - gem.y);
      gem.spin += dt * 2;
      if (vacuum) {
        gem.x += dx * 900 * dt;
        gem.y += dy * 900 * dt;
      } else if (distance < player.pickupRadius) {
        const pull = WS.max(160, 420 * (1 - distance / player.pickupRadius));
        gem.x += dx * pull * dt;
        gem.y += dy * pull * dt;
      }
      if (distance < player.radius + gem.radius + 5) {
        WS.Game.run.gemsCollected++;
        WS.Save.stats.gemsCollected++;
        if (vacuum) WS.Audio.play('gem');
        const value = gem.value;
        this.pool.releaseAt(i);
        WS.Player.gainXP(player, value);
        if (WS.Game.leveling || !WS.Game.running) return;
      } else i++;
    }
  };

  WS.XP = XP;

})(window.WS);

/* ===== src/game/pickup.js ===== */
/* Ground pickups: coins, potions, chests, sapper charges, lodestones, bronze
 * hourglasses, supply caches, and the two story objects (the coffin and the
 * egg merchant). Everything drifts toward the survivor once inside pickup
 * range, except destination pickups you have to walk to. */
'use strict';
(function (WS) {

  const TYPES = {
    coin: { art: 'coin', tint: [1.0, 0.82, 0.20], size: 15 },
    potion: { art: 'potion', tint: [1.0, 0.40, 0.40], size: 17 },
    chest: { art: 'chest', tint: [0.9, 0.70, 0.30], size: 22 },
    bomb: { art: 'bomb', tint: [1.0, 0.50, 0.30], size: 19 },
    stone: { art: 'stone', tint: [0.5, 0.90, 1.0], size: 18 },
    cache: { art: 'cache', tint: [1.0, 0.90, 0.60], size: 24 },
    hourglass: { art: 'hourglass', tint: [0.6, 0.85, 1.0], size: 20 },
    coffin: { art: 'coffin', tint: [0.85, 0.85, 0.95], size: 30, noMagnet: true },
    runeblade: { art: 'runeblade', tint: [0.85, 0.20, 0.25], size: 30, noMagnet: true },
    warglaive: { art: 'warglaive', tint: [0.55, 1.0, 0.25], size: 30, noMagnet: true },
    merchant: { art: 'merchant', tint: [0.95, 0.85, 0.45], size: 30, noMagnet: true },

  Pickup.clear = function () { if (this.pool) this.pool.releaseAll(); };

  /** Coins are the only expendable pickup; everything else is preserved when
   *  the field fills up. Returns the pickup, or null if there was no room. */
  Pickup.spawn = function (kind, x, y, value) {
    if (this.pool.count >= WS.CONST.MAX_PICKUPS) {
      let coin = -1;
      for (let i = 0; i < this.pool.count; i++) {
        if (this.pool.active[i].kind === 'coin') { coin = i; break; }
      }
      if (coin < 0) return null;
      this.pool.releaseAt(coin);
    }
    const p = this.pool.acquire();
    if (!p) return null;
    p.kind = kind;
    p.type = TYPES[kind];
    p.x = x; p.y = y;
    p.value = value || 0;
    p.radius = p.type.size * 0.5;
    p.bob = WS.random() * WS.TAU;
    p.life = 0;
    p.snooze = 0;
    return p;
  };

  /** Death-roll, called for every kill. Elites and bosses always leave a chest. */
  Pickup.onKill = function (enemy) {
    const player = WS.Game.player;
    const cfg = WS.Config;
    const luck = player.luck;

    if (enemy.elite) {
      this.spawn('chest', enemy.x, enemy.y, WS.floor((18 + WS.randInt(0, 26)) * WS.Game.run.goldMult));
      return;
    }
    if (enemy.boss) return;   // bosses pay out directly in Enemy.kill

    if (WS.random() < cfg.dropChanceGold * luck) {
      this.spawn('coin', enemy.x, enemy.y, WS.floor((3 + WS.randInt(0, 4)) * WS.Game.run.goldMult));
    } else if (WS.random() < cfg.dropChancePotion * luck) {
      this.spawn('potion', enemy.x, enemy.y);
    } else if (WS.random() < cfg.dropChanceBomb * luck) {
      this.spawn('bomb', enemy.x, enemy.y);
    } else if (WS.random() < cfg.dropChanceStone * luck) {
      this.spawn('stone', enemy.x, enemy.y);

      this.spawn('hourglass', enemy.x, enemy.y);

    WS.FX.flash(x, y, 520, [1.0, 0.65, 0.25], 0.55);
    WS.FX.screen('rgba(255,180,80,.22)', 0.35);
    const enemies = WS.Enemy.pool.active;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.boss) WS.Enemy.hit(e, e.maxHealth * 0.08, 'bomb');
      else WS.Enemy.damage(e, e.health + 1, false, 'bomb');

  function collect(p, pickup) {

      WS.Audio.play('potion');

    } else if (kind === 'coin') {

      WS.Audio.play('coin');

    } else if (kind === 'chest') {
      // Chests roll for a jackpot: one, three, or five payouts.
      const roll = WS.random();
      const rolls = roll < 0.03 ? 5 : roll < 0.15 ? 3 : 1;
      const total = WS.floor(pickup.value * p.goldMultiplier * (rolls === 1 ? 1 : rolls * 0.8));
      WS.Game.addGold(total, pickup.x, pickup.y);
      WS.Audio.play('chest');
      if (rolls > 1) {
        WS.Game.toast(rolls === 5 ? 'JACKPOT!' : 'Treasure!', `The chest pays out ${rolls}x.`);
        WS.FX.flash(pickup.x, pickup.y, 90, WS.CONST.COLORS.gold, 0.5);
      }

    } else if (kind === 'bomb') {

    } else if (kind === 'cache') {

      WS.Audio.play('chest');

      else if (roll === 2) { WS.XP.vacuumAll(); WS.FX.notice(p.x, p.y, 'Lodestone!', '#8fe0ff'); }
      else if (roll === 3) { WS.Enemy.freezeAll(WS.Config.hourglassFreeze); WS.FX.notice(p.x, p.y, 'Time stops!', '#bfe6ff'); }
      else {
        WS.Player.heal(p, WS.floor(p.maxHealth * WS.Config.potionHealPct * 2), 'potion');

      WS.Save.stats.coffinsOpened = (WS.Save.stats.coffinsOpened || 0) + 1;
      WS.Save.save();
      WS.Game.announce('Bartholomew the Adequate rises!',
        'He files a complaint, then hands you the shield.', 3.5);
      WS.Game.addGold(WS.floor(80 * run.goldMult), p.x, p.y);
      WS.Achievements.check();

      WS.Game.addGold(WS.floor(120 * run.goldMult), p.x, p.y);
      WS.Player.addWeapon(p, 'death_strike');

    } else if (kind === 'warglaive') {
      WS.Save.stats.warglaivesClaimed = (WS.Save.stats.warglaivesClaimed || 0) + 1;
      WS.Save.save();
      WS.Game.announce('The warglaives find you.', 'You were never going to refuse.', 3.5);
      WS.Game.addGold(WS.floor(120 * run.goldMult), p.x, p.y);
      WS.Player.addWeapon(p, 'fel_beam');
      WS.Achievements.check();
      WS.Audio.play('evolve');

    } else if (kind === 'merchant') {
      // The Egg Merchant sells run-only eggs; "Buy All" spends every coin.
      const cost = WS.Config.eggVendorCost;
      const affordable = WS.floor(run.gold / cost);
      if (affordable <= 0) {

        return false;   // leave the merchant standing

    while (i < this.pool.count) {

      pickup.bob += dt * 3;
      pickup.life += dt;
      const [dx, dy, distance] = WS.normalize(player.x - pickup.x, player.y - pickup.y);

/* ===== src/game/familiar.js ===== */
/* Familiars: summons that HUNT. Each picks the nearest enemy, bounds it down,
 * bites, then peels off and retargets. Spirit wolves are fast and light;
 * ghouls are slower to close and slower to swing, but hit far harder with a
 * wider sweep. Granted in-run by Spirit Companion / Raise Dead. */
'use strict';
(function (WS) {

  const MAX = 6;   // shared cap across every summon kind

  const Familiar = {
    list: [],
    tuning: {
      dashSpeed: 340,
      biteRadius: 46,
      biteCooldown: 0.55,
      dmgBase: 14,
      dmgPerLevel: 1.0,
      huntRange: 560,
      leash: 440,
      wanderSpeed: 150,
      ghoulSpeedMult: 0.70,
      ghoulRadiusMult: 1.35,
      ghoulCdMult: 1.45,
      ghoulDmgMult: 2.10,
    },
    KINDS: {
      wolf: { art: 'spiritwolf', tint: [0.60, 0.85, 1.00], source: 'wolves' },
      ghoul: {
        art: 'risen', tint: [0.55, 0.90, 0.40], source: 'ghouls',
        speedMult: 'ghoulSpeedMult', radiusMult: 'ghoulRadiusMult',
        cdMult: 'ghoulCdMult', dmgMult: 'ghoulDmgMult',
      },
    },
  };

  Familiar.init = function () { this.list = []; };
  Familiar.reset = function () { this.list.length = 0; };

  Familiar.add = function (kind) {
    if (this.list.length >= MAX) return;
    const player = WS.Game.player;
    const spec = this.KINDS[kind] || this.KINDS.wolf;
    this.list.push({
      kind, spec,
      x: player.x + WS.randRange(-50, 50),
      y: player.y + WS.randRange(-50, 50),
      target: null,
      biteTimer: 0,
      pounce: 0,
      bob: WS.random() * WS.TAU,
      facing: 1,
    });
    WS.FX.flash(player.x, player.y, 60, spec.tint, 0.4);
  };

  Familiar.update = function (dt) {
    const player = WS.Game.player;
    const t = this.tuning;

    for (const fam of this.list) {
      const spec = fam.spec;
      const speedMult = spec.speedMult ? t[spec.speedMult] : 1;
      const radiusMult = spec.radiusMult ? t[spec.radiusMult] : 1;
      const cdMult = spec.cdMult ? t[spec.cdMult] : 1;
      const dmgMult = spec.dmgMult ? t[spec.dmgMult] : 1;

      // Retarget when the mark dies or strays out of the hunt.
      if (!fam.target || fam.target._dead
        || WS.dist(fam.x, fam.y, fam.target.x, fam.target.y) > t.huntRange) {
        fam.target = WS.Enemy.findNearest(fam.x, fam.y, t.huntRange);
      }

      // Leash: past this the summon breaks off and comes home.
      const homeDist = WS.dist(fam.x, fam.y, player.x, player.y);
      let tx, ty, speed;
      if (homeDist > t.leash) {
        [tx, ty] = WS.normalize(player.x - fam.x, player.y - fam.y);
        speed = t.dashSpeed * speedMult;
        fam.target = null;
      } else if (fam.target) {
        [tx, ty] = WS.normalize(fam.target.x - fam.x, fam.target.y - fam.y);
        speed = t.dashSpeed * speedMult * (1 + player.summonHaste * 0.25);
      } else {
        // Nothing to hunt: lope around the survivor.
        const a = fam.bob;
        const ox = player.x + WS.cos(a) * 70, oy = player.y + WS.sin(a) * 70;
        [tx, ty] = WS.normalize(ox - fam.x, oy - fam.y);
        speed = t.wanderSpeed;
      }
      fam.x += tx * speed * dt;
      fam.y += ty * speed * dt;
      if (tx !== 0) fam.facing = tx < 0 ? -1 : 1;
      fam.bob += dt * 3;
      if (fam.pounce > 0) fam.pounce -= dt;

      fam.biteTimer -= dt * (1 + player.summonHaste);
      if (fam.biteTimer <= 0 && fam.target) {
        const reach = t.biteRadius * radiusMult * 0.6 + fam.target.radius;
        if (WS.dist2(fam.x, fam.y, fam.target.x, fam.target.y) <= reach * reach) {
          fam.biteTimer = t.biteCooldown * cdMult;
          fam.pounce = 0.18;
          const damage = (t.dmgBase + t.dmgPerLevel * player.level)
            * dmgMult
            * player.damageMultiplier
            * (1 + player.summonDamage)
            * WS.CONST.PLAYER_DAMAGE_SCALE;
          WS.Enemy.damageArea(fam.x, fam.y, t.biteRadius * radiusMult * player.areaMultiplier,
            damage, null, null, spec.source);
          WS.FX.flash(fam.x, fam.y, t.biteRadius * radiusMult * 0.8, spec.tint, 0.2);
        }
      }
    }
  };

  WS.Familiar = Familiar;

})(window.WS);

/* ===== src/game/combos.js ===== */
/* Discoveries: the moment a survivor carries both weapons of a pair, the combo
 * activates for the run, toasts, and is written into the permanent codex. */
'use strict';
(function (WS) {

  const ComboSystem = {};

  ComboSystem.check = function (p) {
    for (const id of WS.ComboOrder) {
      if (p.combosActive[id]) continue;
      const combo = WS.Combos[id];
      const w1 = WS.Player.getWeapon(p, combo.weapons[0]);
      const w2 = WS.Player.getWeapon(p, combo.weapons[1]);
      if (!w1 || !w2) continue;

      p.combosActive[id] = true;
      combo.apply(w1, w2, combo);
      const fresh = WS.Save.discoverCombo(id);
      WS.Game.toast(
        (fresh ? 'Discovery: ' : 'Synergy: ') + combo.name,
        WS.template(combo.description, combo));
      WS.Audio.play('evolve');
    }
  };

  WS.ComboSystem = ComboSystem;

})(window.WS);

/* ===== src/game/achievements.js ===== */
/* Achievement checking. Tests read persisted statistics, so an achievement can
 * complete mid-run or at the moment the run's totals are banked. */
'use strict';
(function (WS) {

  const Achievements = {};

  Achievements.check = function () {
    const db = WS.Save.db;
    let earned = null;
    for (const id of WS.AchievementOrder) {
      if (db.achievements[id]) continue;
      const a = WS.Achievements[id];
      let passed = false;
      try { passed = a.test(db); } catch (e) { passed = false; }
      if (!passed) continue;

      db.achievements[id] = true;
      earned = a;
      if (a.reward) {
        if (a.reward.type === 'gold') WS.Save.addGold(a.reward.amount);
        else if (a.reward.type === 'character') db.unlocks.characters[a.reward.id] = true;
        else if (a.reward.type === 'map') db.unlocks.maps[a.reward.id] = true;
      }
      WS.Game.toast('Achievement: ' + a.name, Achievements.rewardText(a));
      WS.Audio.play('level');
    }
    if (earned) WS.Save.save();
    return earned;
  };

  Achievements.rewardText = function (a) {
    if (!a.reward) return a.description;
    if (a.reward.type === 'gold') return `+${a.reward.amount} gold banked.`;
    if (a.reward.type === 'character') return `${WS.Characters[a.reward.id].name} is now playable.`;
    if (a.reward.type === 'map') return `${WS.Maps[a.reward.id].name} is now open.`;
    return a.description;
  };

  WS.AchievementSystem = Achievements;
  // The data table is WS.Achievements; the system hangs off it for convenience
  // so ported call sites (`WS.Achievements.check()`) still read naturally.
  WS.Achievements.check = Achievements.check;
  WS.Achievements.rewardText = Achievements.rewardText;

})(window.WS);

/* ===== src/game/waves.js ===== */
/* Drives each battlefield's data timeline: ambient spawn phases, scripted swarm
 * events, timed boss arrivals, supply caches, the egg merchant, and the three
 * one-shot story objects (coffin / runeblade / warglaives). Difficulty scaling
 * is a function of elapsed time times the map's difficulty knob. */
'use strict';
(function (WS) {

  const Wave = {};

  Wave.reset = function (map) {
    this.map = map;
    this.phaseIndex = 0;
    this.eventIndex = 0;
    this.bossIndex = 0;
    this.spawnTimer = 0.75;
    this.endlessBossTimer = 120;
    this.endlessEventTimer = 100;
    this.endlessBosses = 0;
    this.deathWarned = false;
    this.deathTimer = 0;
    this.cacheTimer = 60;
    this.merchantTimer = 150;
    this.coffinDone = false;
    this.coffinTimer = 120;
    this.runebladeDone = false;
    this.warglaiveDone = false;
  };

  /** Health/damage/xp inflation for ambient spawns. */
  Wave.enemyScale = function (time) {
    const run = WS.Game.run;
    const hyper = run.hyper ? WS.Config.hyperScale : 1;
    let s = (1 + time / WS.Config.enemyScaleTime) * this.map.difficulty * run.diffScale * hyper;
    if (run.victorious || run.mode === 'endless') {
      s *= 1 + WS.max(0, time - 1620) / WS.Config.endlessEnemyRampTime;
    }
    return s;
  };

  /** Bosses have large bases already, so their curve is gentler. */
  Wave.bossScale = function (time) {
    const run = WS.Game.run;
    const hyper = run.hyper ? WS.Config.hyperScale : 1;
    return (1 + time / WS.Config.bossScaleTime) * this.map.difficulty * run.diffScale * hyper;
  };

  /** Endless respawns draw from the tougher half of the map's roster, so a
   *  returning boss is never a step down from the last scheduled one. */
  Wave.endlessBossPool = function () {
    const bosses = this.map.bosses;
    const pool = bosses.slice(WS.floor(bosses.length / 2));
    return pool.length ? pool : [bosses[bosses.length - 1]];
  };

  Wave.spawnBoss = function (id, scale, final) {
    const player = WS.Game.player;
    const a = WS.random() * WS.TAU;
    const boss = WS.Enemy.spawn(id,
      WS.clamp(player.x + WS.cos(a) * 520, 60, WS.CONST.WORLD_WIDTH - 60),
      WS.clamp(player.y + WS.sin(a) * 520, 60, WS.CONST.WORLD_HEIGHT - 60),
      scale, true);
    if (!boss) return null;
    boss.finalBoss = !!final;
    const t = boss.template;
    WS.Game.announce(t.name, t.yell, 3.4);
    WS.Audio.play('boss');
    WS.FX.shake(6, 0.5);
    WS.FX.screen('rgba(180,40,120,.14)', 0.4);
    return boss;
  };

  Wave.update = function (dt, run) {
    const map = this.map;
    const time = run.time;
    const player = WS.Game.player;

    // Advance to the newest phase whose start time has passed.
    while (map.phases[this.phaseIndex + 1] && map.phases[this.phaseIndex + 1].at <= time) {
      this.phaseIndex++;
    }
    const phase = map.phases[this.phaseIndex];

    /* ---- ambient spawns -------------------------------------------------- */
    const curse = player.curse;
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0 && phase.count > 0) {
      this.spawnTimer = phase.interval * WS.Config.spawnIntervalMult
        * run.diffInterval * (run.hyper ? 0.75 : 1) / (1 + 0.20 * curse);
      const scale = this.enemyScale(time);
      const count = WS.max(1, WS.round(phase.count * WS.Config.spawnCountMult * (1 + 0.20 * curse)));
      for (let n = 0; n < count; n++) {
        const pick = WS.weightedPick(phase.roster);
        WS.Enemy.spawnRing(pick.id, 700 + WS.random() * 160, scale);
      }
      if (phase.elite && WS.random() < phase.eliteChance) {
        const elite = WS.Enemy.spawnRing(phase.elite, 740, scale);
        if (elite) WS.FX.notice(elite.x, elite.y, elite.template.name, '#ffb347');
      }
    }

    /* ---- scripted swarm events ------------------------------------------- */
    const ev = map.events[this.eventIndex];
    if (ev && time >= ev.at) {
      this.eventIndex++;
      WS.Game.announce(ev.text, null, 2.6);
      WS.Audio.play('warn');
      WS.Enemy.spawnCircle(ev.id, ev.count, 620, this.enemyScale(time));
    }

    /* ---- scheduled bosses ------------------------------------------------ */
    const nextBoss = map.bosses[this.bossIndex];
    if (nextBoss && time >= nextBoss.at) {
      this.bossIndex++;
      const isFinal = this.bossIndex >= map.bosses.length;
      this.spawnBoss(nextBoss.id, this.bossScale(time), false);
      if (isFinal) run.finalBossSeen = true;
    }

    /* ---- supply caches --------------------------------------------------- */
    this.cacheTimer -= dt;
    if (this.cacheTimer <= 0) {
      this.cacheTimer = 75 + WS.random() * 45;
      const a = WS.random() * WS.TAU;
      WS.Pickup.spawn('cache',
        WS.clamp(player.x + WS.cos(a) * 320, 60, WS.CONST.WORLD_WIDTH - 60),
        WS.clamp(player.y + WS.sin(a) * 320, 60, WS.CONST.WORLD_HEIGHT - 60));
    }

    /* ---- the egg merchant ------------------------------------------------ */
    this.merchantTimer -= dt;
    if (this.merchantTimer <= 0) {
      this.merchantTimer = WS.Config.eggVendorInterval;
      const a = WS.random() * WS.TAU;
      if (WS.Pickup.spawn('merchant',
        WS.clamp(player.x + WS.cos(a) * 400, 80, WS.CONST.WORLD_WIDTH - 80),
        WS.clamp(player.y + WS.sin(a) * 400, 80, WS.CONST.WORLD_HEIGHT - 80))) {
        WS.Game.toast('An egg merchant sets up shop', 'Walk to the crate to spend your coin.');
      }
    }

    /* ---- the coffin of Bartholomew the Adequate -------------------------- */
    if (!this.coffinDone && !WS.Save.db.unlocks.characters.paladin) {
      this.coffinTimer -= dt;
      if (this.coffinTimer <= 0) {
        const a = WS.random() * WS.TAU;
        const cx = WS.clamp(player.x + WS.cos(a) * 380, 90, WS.CONST.WORLD_WIDTH - 90);
        const cy = WS.clamp(player.y + WS.sin(a) * 380, 90, WS.CONST.WORLD_HEIGHT - 90);
        if (WS.Pickup.spawn('coffin', cx, cy)) {
          this.coffinDone = true;
          WS.Game.announce('A weathered coffin lies open to the sky...',
            'Reach it. Something stirs within.', 4.0);
          WS.Audio.play('boss');
          for (let i = 0; i < 6; i++) {
            const g = (i / 6) * WS.TAU;
            WS.Enemy.spawn('skeleton', cx + WS.cos(g) * 70, cy + WS.sin(g) * 70,
              this.enemyScale(time) * 1.5);
          }
        } else this.coffinTimer = 10;   // field full; try again shortly
      }
    }

    /* ---- the runeblade: answers desecration, not a timer ------------------ */
    if (!this.runebladeDone && !WS.Save.db.unlocks.characters.death_knight
      && player.desecrationDealt >= WS.Config.runebladeThreshold) {
      const a = WS.random() * WS.TAU;
      const cx = WS.clamp(player.x + WS.cos(a) * 300, 90, WS.CONST.WORLD_WIDTH - 90);
      const cy = WS.clamp(player.y + WS.sin(a) * 300, 90, WS.CONST.WORLD_HEIGHT - 90);
      if (WS.Pickup.spawn('runeblade', cx, cy)) {
        this.runebladeDone = true;
        WS.Game.announce('Enough Light has rotted.', 'A blade breaks the ground where it fell.', 4.0);
        WS.Audio.play('boss');
        for (let i = 0; i < 6; i++) {
          const g = (i / 6) * WS.TAU;
          WS.Enemy.spawn('ghoul', cx + WS.cos(g) * 74, cy + WS.sin(g) * 74, this.enemyScale(time) * 1.6);
        }
      }
    }

    /* ---- the warglaives: answer Metamorphosis ---------------------------- */
    if (!this.warglaiveDone && !WS.Save.db.unlocks.characters.demon_hunter
      && player.metamorphoses >= WS.Config.warglaiveMetas) {
      const a = WS.random() * WS.TAU;
      const cx = WS.clamp(player.x + WS.cos(a) * 300, 90, WS.CONST.WORLD_WIDTH - 90);
      const cy = WS.clamp(player.y + WS.sin(a) * 300, 90, WS.CONST.WORLD_HEIGHT - 90);
      if (WS.Pickup.spawn('warglaive', cx, cy)) {
        this.warglaiveDone = true;
        WS.Game.announce('The fel has taken enough of you.', 'Two glaives are waiting.', 4.0);
        WS.Audio.play('boss');
      }
    }

    /* ---- Death itself, and the endless escalation ------------------------ */
    const deathTime = WS.Config.deathTime;
    if (!this.deathWarned && time >= deathTime - 15) {
      this.deathWarned = true;
      WS.Game.announce('Something is coming.', 'Fifteen seconds.', 4.0);
      WS.Audio.play('warn');
    }
    if (time >= deathTime) {
      this.deathTimer -= dt;
      if (this.deathTimer <= 0) {
        this.deathTimer = WS.Config.deathInterval;
        this.spawnBoss('death_itself', 1, false);
      }
    }

    if (run.victorious || run.mode === 'endless') {
      this.endlessBossTimer -= dt;
      if (this.endlessBossTimer <= 0) {
        const cfg = WS.Config;
        this.endlessBosses++;
        // The cadence tightens toward a floor as overtime drags on.
        this.endlessBossTimer = WS.max(cfg.endlessBossMinInterval,
          cfg.endlessBossInterval - this.endlessBosses * cfg.endlessBossInterval / cfg.endlessBossAccel);
        const pool = this.endlessBossPool();
        const pick = pool[WS.randInt(0, pool.length - 1)];
        const over = WS.max(0, time - 1620);
        this.spawnBoss(pick.id,
          this.bossScale(time) * cfg.endlessBossMult * (1 + over / cfg.endlessRampTime), false);
      }
      this.endlessEventTimer -= dt;
      if (this.endlessEventTimer <= 0) {
        this.endlessEventTimer = WS.Config.endlessEventInterval;
        const phaseNow = map.phases[map.phases.length - 1];
        const pick = WS.weightedPick(phaseNow.roster);
        WS.Game.announce('The horde does not stop.', null, 2.0);
        WS.Enemy.spawnCircle(pick.id, 22, 640, this.enemyScale(time));
      }
    }
  };

  WS.WaveManager = Wave;

})(window.WS);

/* ===== src/game/levelup.js ===== */
/* Level-up boon generation and application: weapon ranks, new weapons,
 * evolutions, unions, passives, the Limit Break, and the deep-run bread
 * fallback. `type` doubles as the card's quality key in the UI. */
'use strict';
(function (WS) {

  const LevelUp = {};

  const BREADS = [
    {
      type: 'bread', id: 'crust', art: 'leaf', name: 'Crust of Bread',
      description: 'A quick bite. Restores 30 health.', heal: 30, gold: 10,
      note: 'Better than nothing',
    },
    {
      type: 'bread', id: 'loaf', art: 'leaf', name: 'Hearty Loaf',
      description: "A hero's supper. Restores 70 health and a little gold.", heal: 70, gold: 25,
      note: "The innkeeper's finest",
    },
    {
      type: 'bread', id: 'feast', art: 'heart', name: "Traveler's Feast",
      description: 'A full spread. Restores 130 health.', heal: 130, gold: 20,
      note: 'Fit for a champion',
    },
    {
      type: 'bread', id: 'bakers_dozen', art: 'coin', name: "Baker's Dozen",
      description: 'Modest food, a fat coin purse. Restores 40 health, +75 gold.', heal: 40, gold: 75,
      note: 'Mostly for the gold',
    },
  ];

  LevelUp.buildChoices = function (p) {
    const candidates = [];

    // Owned weapons: a rank-up, or the evolution once rank 8 is reached and
    // the paired passive has been learned.
    for (const w of p.weapons) {
      const d = w.data;
      if (p.banished[w.id]) continue;
      if (w.level < WS.WEAPON_MAX_LEVEL) {
        candidates.push({
          type: 'weapon_rank', id: w.id, art: d.art, school: d.school, weight: 3,
          name: d.name, description: d.description,
          note: `Rank ${w.level}  >  ${w.level + 1}`,
        });
      } else if (!w.evolved && d.evolvePairing && (p.upgradeLevels[d.evolvePairing] || 0) > 0) {
        candidates.push({
          type: 'evolve', id: w.id, art: d.art, school: d.school, weight: 6,
          name: d.evolveName, description: d.evolveDescription,
          note: 'EVOLUTION - ' + d.name + ' transformed',
        });
      }
    }

    // Unions: both sources fully evolved merge into one super-weapon, freeing
    // a slot. A forged union is recorded so it can never be offered again.
    for (const recipe of WS.Unions) {
      const [a, b] = recipe.from;
      const wa = WS.Player.getWeapon(p, a);
      const wb = WS.Player.getWeapon(p, b);
      if (!p.unionsForged[recipe.result] && !p.weaponLevels[recipe.result]
        && wa && wa.evolved && wb && wb.evolved) {
        const d = WS.Weapons[recipe.result];
        candidates.push({
          type: 'union', id: recipe.result, art: d.art, school: d.school, weight: 10,
          unionFrom: recipe.from, name: d.name, description: d.description,
          note: `UNION - merges evolved ${WS.Weapons[a].name} + ${WS.Weapons[b].name}`,
        });
      }
    }

    // New weapons, while there are free slots.
    if (p.weapons.length < WS.MAX_WEAPONS) {
      for (const id of WS.WeaponOrder) {
        if (p.weaponLevels[id] || p.banished[id]) continue;
        const d = WS.Weapons[id];
        candidates.push({
          type: 'new_weapon', id, art: d.art, school: d.school, weight: 2,
          name: d.name, description: d.description,
          note: 'New Weapon  -  pairs with ' + WS.Upgrades[d.evolvePairing].name,
        });
      }
    }

    // Passive boons.
    for (const id of WS.UpgradeOrder) {
      const up = WS.Upgrades[id];
      const rank = p.upgradeLevels[id] || 0;
      const offerable = !up.offer || up.offer(p);
      if (rank < up.max && !p.banished[id] && offerable) {
        candidates.push({
