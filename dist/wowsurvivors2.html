/* ===== src/render/sprites.js ===== */
/* Procedural art. Every creature, prop, gem and UI glyph is drawn once into an
 * offscreen canvas at boot and cached by (kind, tint, size), so the game ships
 * with no image files and still gets per-enemy silhouettes.
 *
 * House style: a three-quarter-from-above view. Bodies are built from stacked
 * ellipses lit from the upper left, outlined in a darkened shade of their own
 * tint (never black), with one hot rim highlight - the Arclight arc - on the
 * upper-left edge, and glowing eyes as the read-at-a-glance focal point. */
'use strict';
(function (WS) {

  const cache = new Map();
  const SS = 2;   // supersample factor: rasterise at 2x, draw down

  function make(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  /** Five-stop palette derived from a single tint, so every creature is lit
   *  consistently no matter what colour it was given. */
  function palette(tint) {
    return {
      hi: WS.hex(WS.mix(tint, [1, 1, 1], 0.30)),
      mid: WS.hex(WS.shade(tint, 0.82)),
      lo: WS.hex(WS.shade(tint, 0.42)),
      dark: WS.hex(WS.shade(tint, 0.22)),
      line: WS.hex(WS.shade(tint, 0.10)),
      glow: WS.hex(WS.mix(tint, [1, 1, 1], 0.7)),
    };
  }

  /* ------------------------------------------------------------- helpers - */
  function ellipse(g, x, y, rx, ry, fill, rot) {
    g.save();
    g.translate(x, y);
    if (rot) g.rotate(rot);
    g.beginPath();
    g.ellipse(0, 0, rx, ry, 0, 0, WS.TAU);
    g.fillStyle = fill;
    g.fill();
    g.restore();
  }

  function shaded(g, x, y, rx, ry, p, rot) {
    g.save();
    g.translate(x, y);
    if (rot) g.rotate(rot);
    const grd = g.createRadialGradient(-rx * 0.35, -ry * 0.45, rx * 0.1, 0, 0, rx * 1.25);
    grd.addColorStop(0, p.hi);
    grd.addColorStop(0.45, p.mid);
    grd.addColorStop(1, p.lo);
    g.beginPath();
    g.ellipse(0, 0, rx, ry, 0, 0, WS.TAU);
    g.fillStyle = grd;
    g.fill();
    g.lineWidth = WS.max(1.6, rx * 0.16);
    g.strokeStyle = p.line;
    g.stroke();
    g.restore();
  }

  function poly(g, pts, fill, stroke, lw) {
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
  }

  function eyes(g, x, y, spread, r, colour) {
    g.save();
    g.shadowColor = colour; g.shadowBlur = r * 4;
    g.fillStyle = colour;
    g.beginPath(); g.arc(x - spread, y, r, 0, WS.TAU); g.fill();
    g.beginPath(); g.arc(x + spread, y, r, 0, WS.TAU); g.fill();
    g.restore();
  }

  /** The Arclight rim: a bright crescent along the upper-left of a body mass. */
  function rimLight(g, x, y, r, colour, alpha) {
    g.save();
    g.globalAlpha = alpha === undefined ? 0.5 : alpha;
    g.strokeStyle = colour;
    g.lineWidth = WS.max(1, r * 0.13);
    g.beginPath();
    g.arc(x, y, r * 0.92, WS.PI * 0.85, WS.PI * 1.75);
    g.stroke();
    g.restore();
  }

  function blade(g, x, y, len, wide, rot, edge, spine) {
    g.save();
    g.translate(x, y); g.rotate(rot);
    poly(g, [[0, 0], [wide, -len * 0.35], [0, -len], [-wide, -len * 0.35]], edge, spine, 1);
    g.restore();
  }

  /* ------------------------------------------------------- archetypes ---- */
  // Each draws into a size x size canvas centred on (size/2, size*0.55), with
  // the creature's "footprint" about 0.7 of the canvas so glows have room.
  const CREATURES = {

    /* --- humanoid frames -------------------------------------------------- */
    kobold(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx, cy, 20 * u, 22 * u, p);                       // hunched body
      poly(g, [[cx - 4 * u, cy - 20 * u], [cx, cy - 46 * u], [cx + 4 * u, cy - 20 * u]], p.glow, p.line, u); // candle
      g.save(); g.shadowColor = '#ffcf6b'; g.shadowBlur = 10 * u;
      g.fillStyle = '#ffe6a8';
      g.beginPath(); g.ellipse(cx, cy - 48 * u, 2.4 * u, 4 * u, 0, 0, WS.TAU); g.fill();
      g.restore();
      shaded(g, cx, cy - 14 * u, 12 * u, 11 * u, p);              // head
      poly(g, [[cx - 11 * u, cy - 18 * u], [cx - 16 * u, cy - 30 * u], [cx - 6 * u, cy - 22 * u]], p.lo, p.line, u);
      poly(g, [[cx + 11 * u, cy - 18 * u], [cx + 16 * u, cy - 30 * u], [cx + 6 * u, cy - 22 * u]], p.lo, p.line, u);
      eyes(g, cx, cy - 14 * u, 4.5 * u, 1.7 * u, '#ffd36b');
      rimLight(g, cx, cy, 22 * u, p.hi);
    },

    gnoll(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 4 * u, 24 * u, 25 * u, p);
      shaded(g, cx - 22 * u, cy - 2 * u, 7 * u, 12 * u, p, -0.4); // arms
      shaded(g, cx + 22 * u, cy - 2 * u, 7 * u, 12 * u, p, 0.4);
      shaded(g, cx, cy - 20 * u, 13 * u, 12 * u, p);              // head
      poly(g, [[cx - 6 * u, cy - 22 * u], [cx - 14 * u, cy - 38 * u], [cx - 2 * u, cy - 28 * u]], p.mid, p.line, u);
      poly(g, [[cx + 6 * u, cy - 22 * u], [cx + 14 * u, cy - 38 * u], [cx + 2 * u, cy - 28 * u]], p.mid, p.line, u);
      poly(g, [[cx - 5 * u, cy - 14 * u], [cx + 5 * u, cy - 14 * u], [cx, cy - 6 * u]], p.hi); // snout
      eyes(g, cx, cy - 22 * u, 5 * u, 1.9 * u, '#ffb347');
      blade(g, cx + 26 * u, cy + 2 * u, 30 * u, 5 * u, 0.5, '#c8ccd8', '#6a7080');
      rimLight(g, cx, cy, 26 * u, p.hi);
    },

    bandit(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 4 * u, 18 * u, 24 * u, p);
      ellipse(g, cx, cy + 12 * u, 19 * u, 12 * u, p.dark);        // coat skirt
      shaded(g, cx, cy - 20 * u, 11 * u, 11 * u, { hi: '#d6c2a8', mid: '#b89b7c', lo: '#7a6350', line: '#4a3b2f', glow: '#fff' });
      g.fillStyle = p.mid;                                        // red bandana
      g.beginPath(); g.ellipse(cx, cy - 18 * u, 11.5 * u, 5 * u, 0, WS.PI, WS.TAU); g.fill();
      g.fillStyle = p.lo;
      g.fillRect(cx - 12 * u, cy - 20 * u, 24 * u, 4 * u);
      eyes(g, cx, cy - 22 * u, 4 * u, 1.5 * u, '#fff0d0');
      blade(g, cx + 20 * u, cy + 4 * u, 26 * u, 4 * u, 0.7, '#d7dbe6', '#767c8c');
      rimLight(g, cx, cy, 22 * u, p.hi);
    },

    brute(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 6 * u, 26 * u, 26 * u, p);
      shaded(g, cx - 26 * u, cy + 2 * u, 10 * u, 14 * u, p, -0.3);
      shaded(g, cx + 26 * u, cy + 2 * u, 10 * u, 14 * u, p, 0.3);
      ellipse(g, cx - 30 * u, cy + 12 * u, 8 * u, 8 * u, '#8a8f9c');  // knuckles
      ellipse(g, cx + 30 * u, cy + 12 * u, 8 * u, 8 * u, '#8a8f9c');
      shaded(g, cx, cy - 20 * u, 12 * u, 11 * u, p);
      g.fillStyle = p.lo; g.fillRect(cx - 13 * u, cy - 22 * u, 26 * u, 5 * u);
      eyes(g, cx, cy - 21 * u, 4.5 * u, 1.7 * u, '#ff8f6b');
      rimLight(g, cx, cy, 28 * u, p.hi);
    },

    murloc(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx, cy + 2 * u, 17 * u, 20 * u, p);
      poly(g, [[cx - 20 * u, cy - 12 * u], [cx - 34 * u, cy - 26 * u], [cx - 16 * u, cy + 2 * u]], p.lo, p.line, u); // fins
      poly(g, [[cx + 20 * u, cy - 12 * u], [cx + 34 * u, cy - 26 * u], [cx + 16 * u, cy + 2 * u]], p.lo, p.line, u);
      shaded(g, cx, cy - 18 * u, 15 * u, 13 * u, p);
      g.fillStyle = p.dark;                                        // wide gormless mouth
      g.beginPath(); g.ellipse(cx, cy - 12 * u, 9 * u, 4 * u, 0, 0, WS.PI); g.fill();
      eyes(g, cx, cy - 22 * u, 7 * u, 3 * u, '#e8ffd8');
      rimLight(g, cx, cy, 20 * u, p.hi);
    },

    necromancer(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      poly(g, [[cx - 22 * u, cy + 26 * u], [cx - 12 * u, cy - 22 * u], [cx + 12 * u, cy - 22 * u], [cx + 22 * u, cy + 26 * u]], p.mid, p.line, u);
      poly(g, [[cx - 12 * u, cy - 18 * u], [cx, cy - 40 * u], [cx + 12 * u, cy - 18 * u]], p.lo, p.line, u); // hood
      g.fillStyle = '#0a0a12';
      g.beginPath(); g.ellipse(cx, cy - 22 * u, 8 * u, 9 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 22 * u, 4 * u, 2 * u, '#c77dff');
      g.save(); g.shadowColor = '#a45bff'; g.shadowBlur = 14 * u;   // channelled orb
      g.fillStyle = '#c9a4ff';
      g.beginPath(); g.arc(cx + 24 * u, cy - 4 * u, 5 * u, 0, WS.TAU); g.fill();
      g.restore();
    },

    lich(g, s, p) {
      CREATURES.necromancer(g, s, p);
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      poly(g, [[cx - 14 * u, cy - 34 * u], [cx - 10 * u, cy - 50 * u], [cx - 4 * u, cy - 36 * u],
      [cx, cy - 54 * u], [cx + 4 * u, cy - 36 * u], [cx + 10 * u, cy - 50 * u],
      [cx + 14 * u, cy - 34 * u]], '#9fd8ff', '#5aa0d0', u);       // ice crown
    },

    warlock(g, s, p) { CREATURES.necromancer(g, s, p); },

    /* --- undead ----------------------------------------------------------- */
    skeleton(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.strokeStyle = p.mid; g.lineWidth = 4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx, cy - 8 * u); g.lineTo(cx, cy + 18 * u); g.stroke();
      for (let i = 0; i < 4; i++) {                                // ribs
        const ry = cy - 4 * u + i * 6 * u;
        g.beginPath(); g.ellipse(cx, ry, 12 * u - i * 1.2 * u, 3 * u, 0, WS.PI * 0.05, WS.PI * 0.95); g.stroke();
      }
      g.beginPath(); g.moveTo(cx - 14 * u, cy - 4 * u); g.lineTo(cx - 22 * u, cy + 14 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 14 * u, cy - 4 * u); g.lineTo(cx + 22 * u, cy + 14 * u); g.stroke();
      shaded(g, cx, cy - 20 * u, 11 * u, 11 * u, p);               // skull
      g.fillStyle = '#101018';
      g.beginPath(); g.ellipse(cx - 4 * u, cy - 21 * u, 3 * u, 3.6 * u, 0, 0, WS.TAU); g.fill();
      g.beginPath(); g.ellipse(cx + 4 * u, cy - 21 * u, 3 * u, 3.6 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 21 * u, 4 * u, 1.5 * u, '#8fe6ff');
      g.fillStyle = p.lo; g.fillRect(cx - 5 * u, cy - 13 * u, 10 * u, 3 * u);
      blade(g, cx + 24 * u, cy + 6 * u, 30 * u, 5 * u, 0.6, '#b9c0cc', '#5c6270');
    },

    ghoul(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 3 * u, cy + 4 * u, 21 * u, 22 * u, p, 0.18);  // lopsided
      shaded(g, cx - 24 * u, cy + 6 * u, 8 * u, 15 * u, p, -0.6);  // dragging arm
      poly(g, [[cx - 32 * u, cy + 16 * u], [cx - 26 * u, cy + 26 * u], [cx - 22 * u, cy + 14 * u]], p.hi, p.line, u);
      shaded(g, cx - 2 * u, cy - 18 * u, 12 * u, 11 * u, p, -0.25);
      g.fillStyle = '#2a1414';                                     // hanging jaw
      g.beginPath(); g.ellipse(cx - 2 * u, cy - 10 * u, 6 * u, 5 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx - 2 * u, cy - 21 * u, 4 * u, 1.8 * u, '#d9ff7a');
      rimLight(g, cx, cy, 24 * u, p.hi);
    },

    geist(g, s, p) {
      const cx = s / 2, cy = s * 0.62, u = s / 100;
      shaded(g, cx, cy, 15 * u, 14 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 3.5 * u; g.lineCap = 'round';
      for (const dir of [-1, 1]) {
        g.beginPath();
        g.moveTo(cx + dir * 10 * u, cy - 2 * u);
        g.quadraticCurveTo(cx + dir * 30 * u, cy - 16 * u, cx + dir * 24 * u, cy + 16 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 16 * u, 11 * u, 10 * u, p);
      g.fillStyle = '#141a20';                                     // stitched mask
      g.fillRect(cx - 11 * u, cy - 19 * u, 22 * u, 6 * u);
      eyes(g, cx, cy - 16 * u, 4.5 * u, 1.8 * u, '#9ff5ff');
    },

    abomination(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 6 * u, 30 * u, 28 * u, p);
      g.strokeStyle = p.dark; g.lineWidth = 2 * u;                 // stitches
      for (let i = -2; i <= 2; i++) {
        g.beginPath(); g.moveTo(cx + i * 9 * u, cy - 14 * u); g.lineTo(cx + i * 9 * u, cy + 26 * u); g.stroke();
      }
      shaded(g, cx - 30 * u, cy - 2 * u, 11 * u, 17 * u, p, -0.35);
      shaded(g, cx + 30 * u, cy - 2 * u, 11 * u, 17 * u, p, 0.35);
      blade(g, cx + 38 * u, cy + 6 * u, 34 * u, 8 * u, 0.75, '#aeb6c4', '#5a6070');
      shaded(g, cx - 4 * u, cy - 24 * u, 13 * u, 11 * u, p, -0.2); // sagging head
      eyes(g, cx - 4 * u, cy - 25 * u, 5 * u, 2 * u, '#bfff6b');
      rimLight(g, cx, cy, 32 * u, p.hi);
    },

    wraith(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.save();
      const grd = g.createLinearGradient(0, cy - 34 * u, 0, cy + 30 * u);
      grd.addColorStop(0, p.hi); grd.addColorStop(0.6, p.mid); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(cx - 20 * u, cy + 30 * u);
      g.quadraticCurveTo(cx - 24 * u, cy - 22 * u, cx, cy - 36 * u);
      g.quadraticCurveTo(cx + 24 * u, cy - 22 * u, cx + 20 * u, cy + 30 * u);
      g.quadraticCurveTo(cx, cy + 18 * u, cx - 20 * u, cy + 30 * u);
      g.fill();
      g.restore();
      g.fillStyle = 'rgba(6,8,14,.85)';
      g.beginPath(); g.ellipse(cx, cy - 20 * u, 9 * u, 11 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 21 * u, 4 * u, 2.2 * u, '#cfe6ff');
    },

    reaper(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      CREATURES.wraith(g, s, p);
      g.save();                                                    // the scythe
      g.strokeStyle = '#d8e4f2'; g.lineWidth = 3.5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 26 * u, cy + 34 * u); g.lineTo(cx + 34 * u, cy - 40 * u); g.stroke();
      g.beginPath();
      g.moveTo(cx + 34 * u, cy - 40 * u);
      g.quadraticCurveTo(cx - 4 * u, cy - 52 * u, cx - 12 * u, cy - 24 * u);
      g.lineWidth = 5 * u; g.strokeStyle = '#eef6ff'; g.stroke();
      g.restore();
      g.save(); g.globalAlpha = 0.5; g.strokeStyle = '#9fd8ff'; g.lineWidth = 2 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
    },

    sovereign(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.save();                                                    // eclipse disc
      const grd = g.createRadialGradient(cx, cy, 6 * u, cx, cy, 46 * u);
      grd.addColorStop(0, '#1a1030'); grd.addColorStop(0.7, '#2a1a4a'); grd.addColorStop(1, '#0d0820');
      g.fillStyle = grd;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.fill();
      g.shadowColor = '#ffe6ae'; g.shadowBlur = 26 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 3 * u;
      g.beginPath(); g.arc(cx, cy, 44 * u, 0, WS.TAU); g.stroke();
      g.restore();
      for (let i = 0; i < 8; i++) {                                // corona spears
        const a = (i / 8) * WS.TAU + 0.2;
        blade(g, cx + WS.cos(a) * 44 * u, cy + WS.sin(a) * 44 * u, 22 * u, 4 * u, a + WS.PI / 2, '#ffd98f', '#a97c2f');
      }
      g.fillStyle = '#0a0714';
      g.beginPath(); g.ellipse(cx, cy - 4 * u, 13 * u, 16 * u, 0, 0, WS.TAU); g.fill();
      eyes(g, cx, cy - 6 * u, 5 * u, 2.6 * u, '#fff3d0');
    },

    /* --- beasts ----------------------------------------------------------- */
    wolf(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx - 2 * u, cy + 2 * u, 26 * u, 15 * u, p);        // long body
      poly(g, [[cx + 22 * u, cy - 2 * u], [cx + 40 * u, cy - 14 * u], [cx + 26 * u, cy + 6 * u]], p.lo, p.line, u); // tail
      shaded(g, cx - 22 * u, cy - 6 * u, 13 * u, 11 * u, p);       // head
      poly(g, [[cx - 34 * u, cy - 6 * u], [cx - 44 * u, cy - 2 * u], [cx - 32 * u, cy + 2 * u]], p.hi, p.line, u);  // muzzle
      poly(g, [[cx - 28 * u, cy - 14 * u], [cx - 30 * u, cy - 26 * u], [cx - 20 * u, cy - 16 * u]], p.lo, p.line, u);
      poly(g, [[cx - 16 * u, cy - 14 * u], [cx - 14 * u, cy - 26 * u], [cx - 8 * u, cy - 15 * u]], p.lo, p.line, u);
      eyes(g, cx - 26 * u, cy - 8 * u, 4 * u, 1.6 * u, '#ffe08a');
      g.strokeStyle = p.dark; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (const dx of [-10, 4, 14]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 10 * u); g.lineTo(cx + dx * u, cy + 20 * u); g.stroke();
      }
      rimLight(g, cx - 2 * u, cy, 24 * u, p.hi, 0.35);
    },

    cat(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx - 2 * u, cy + 2 * u, 25 * u, 14 * u, p);        // low, long body
      g.strokeStyle = p.dark; g.lineWidth = 2.6 * u; g.lineCap = 'round';
      for (let i = -1; i <= 2; i++) {                              // stripes
        g.beginPath();
        g.moveTo(cx + i * 9 * u, cy - 9 * u);
        g.lineTo(cx + i * 9 * u + 4 * u, cy + 9 * u);
        g.stroke();
      }
      g.lineWidth = 4 * u;                                         // curled tail
      g.strokeStyle = p.lo;
      g.beginPath();
      g.moveTo(cx + 22 * u, cy);
      g.quadraticCurveTo(cx + 42 * u, cy - 6 * u, cx + 36 * u, cy - 24 * u);
      g.stroke();
      shaded(g, cx - 22 * u, cy - 6 * u, 12 * u, 11 * u, p);       // round head
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 31 * u, cy - 24 * u], [cx - 22 * u, cy - 15 * u]], p.lo, p.line, u);
      poly(g, [[cx - 18 * u, cy - 15 * u], [cx - 15 * u, cy - 25 * u], [cx - 10 * u, cy - 14 * u]], p.lo, p.line, u);
      eyes(g, cx - 24 * u, cy - 7 * u, 4.5 * u, 1.8 * u, '#c9f26b');
      g.strokeStyle = p.dark; g.lineWidth = 3 * u;
      for (const dx of [-14, 0, 12]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 9 * u); g.lineTo(cx + dx * u, cy + 19 * u); g.stroke();
      }
      rimLight(g, cx - 2 * u, cy, 24 * u, p.hi, 0.35);
    },

    boar(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx, cy + 2 * u, 24 * u, 18 * u, p);
      g.strokeStyle = p.dark; g.lineWidth = 2.5 * u;               // bristles
      for (let i = -3; i <= 3; i++) {
        g.beginPath(); g.moveTo(cx + i * 6 * u, cy - 14 * u); g.lineTo(cx + i * 6 * u, cy - 24 * u); g.stroke();
      }
      shaded(g, cx - 22 * u, cy + 2 * u, 12 * u, 11 * u, p);
      poly(g, [[cx - 32 * u, cy + 4 * u], [cx - 42 * u, cy + 6 * u], [cx - 32 * u, cy + 10 * u]], p.hi, p.line, u);
      g.strokeStyle = '#efe3cc'; g.lineWidth = 3 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 32 * u, cy + 6 * u); g.quadraticCurveTo(cx - 40 * u, cy - 2 * u, cx - 34 * u, cy - 8 * u); g.stroke();
      eyes(g, cx - 24 * u, cy - 2 * u, 4 * u, 1.4 * u, '#ff9d6b');
      rimLight(g, cx, cy, 24 * u, p.hi, 0.35);
    },

    quilboar(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx, cy + 4 * u, 22 * u, 24 * u, p);
      g.strokeStyle = p.hi; g.lineWidth = 3.4 * u; g.lineCap = 'round';
      for (let i = 0; i < 7; i++) {                                // quills
        const a = WS.PI * (0.15 + i * 0.1);
        g.beginPath();
        g.moveTo(cx - WS.cos(a) * 20 * u, cy - WS.sin(a) * 20 * u);
        g.lineTo(cx - WS.cos(a) * 36 * u, cy - WS.sin(a) * 36 * u);
        g.stroke();
      }
      shaded(g, cx, cy - 20 * u, 13 * u, 11 * u, p);
      poly(g, [[cx - 6 * u, cy - 14 * u], [cx + 6 * u, cy - 14 * u], [cx, cy - 6 * u]], p.hi);
      eyes(g, cx, cy - 22 * u, 5 * u, 1.8 * u, '#ffcf6b');
      blade(g, cx + 24 * u, cy + 4 * u, 28 * u, 6 * u, 0.55, '#cdd3de', '#6b7280');
    },

    raptor(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      shaded(g, cx + 2 * u, cy, 20 * u, 14 * u, p, -0.15);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx + 16 * u, cy - 2 * u); g.quadraticCurveTo(cx + 40 * u, cy - 8 * u, cx + 44 * u, cy - 24 * u); g.stroke();
      g.strokeStyle = p.dark; g.lineWidth = 4 * u;                 // raised legs
      g.beginPath(); g.moveTo(cx, cy + 8 * u); g.lineTo(cx - 6 * u, cy + 22 * u); g.lineTo(cx + 4 * u, cy + 26 * u); g.stroke();
      shaded(g, cx - 20 * u, cy - 14 * u, 12 * u, 9 * u, p, -0.3);
      poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 42 * u, cy - 10 * u], [cx - 28 * u, cy - 6 * u]], p.hi, p.line, u);
      poly(g, [[cx - 20 * u, cy - 22 * u], [cx - 12 * u, cy - 34 * u], [cx - 10 * u, cy - 20 * u]], p.lo, p.line, u); // crest
      eyes(g, cx - 23 * u, cy - 16 * u, 3.5 * u, 1.6 * u, '#ffe066');
    },

    strider(g, s, p) {
      const cx = s / 2, cy = s * 0.55, u = s / 100;
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 6 * u, cy + 10 * u); g.lineTo(cx - 10 * u, cy + 32 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 6 * u, cy + 10 * u); g.lineTo(cx + 12 * u, cy + 32 * u); g.stroke();
      shaded(g, cx, cy, 20 * u, 17 * u, p);
      g.strokeStyle = p.lo; g.lineWidth = 5 * u;                   // long neck
      g.beginPath(); g.moveTo(cx - 8 * u, cy - 10 * u); g.quadraticCurveTo(cx - 22 * u, cy - 30 * u, cx - 14 * u, cy - 40 * u); g.stroke();
      shaded(g, cx - 14 * u, cy - 42 * u, 9 * u, 8 * u, p);
      poly(g, [[cx - 22 * u, cy - 42 * u], [cx - 34 * u, cy - 40 * u], [cx - 22 * u, cy - 36 * u]], p.hi, p.line, u);
      eyes(g, cx - 14 * u, cy - 44 * u, 3.5 * u, 1.5 * u, '#ffe9a8');
    },

    vulture(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // layered wings
        poly(g, [[cx + dir * 5 * u, cy - 8 * u], [cx + dir * 46 * u, cy - 26 * u],
        [cx + dir * 40 * u, cy - 2 * u], [cx + dir * 14 * u, cy + 8 * u]], p.lo, p.line, u);
        poly(g, [[cx + dir * 8 * u, cy - 4 * u], [cx + dir * 38 * u, cy - 10 * u],
        [cx + dir * 20 * u, cy + 10 * u]], p.dark, p.line, u * 0.8);
      }
      shaded(g, cx, cy + 2 * u, 14 * u, 16 * u, p);
      shaded(g, cx, cy - 16 * u, 8 * u, 8 * u, p);
      poly(g, [[cx - 6 * u, cy - 16 * u], [cx - 20 * u, cy - 12 * u], [cx - 6 * u, cy - 10 * u]], '#e8b455', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3 * u, 1.4 * u, '#ffd166');
    },

    spider(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.strokeStyle = p.lo; g.lineWidth = 3 * u; g.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        for (const dir of [-1, 1]) {
          const a = -0.55 + i * 0.38;
          g.beginPath();
          g.moveTo(cx + dir * 6 * u, cy);
          g.quadraticCurveTo(cx + dir * (26 + i * 3) * u, cy + WS.sin(a) * 26 * u - 12 * u,
            cx + dir * (34 - i * 2) * u, cy + WS.sin(a) * 34 * u + 8 * u);
          g.stroke();
        }
      }
      shaded(g, cx + 4 * u, cy + 4 * u, 18 * u, 16 * u, p);        // abdomen
      shaded(g, cx - 14 * u, cy - 4 * u, 11 * u, 10 * u, p);       // cephalothorax
      g.save(); g.shadowColor = '#ff6b6b'; g.shadowBlur = 8 * u; g.fillStyle = '#ff8a8a';
      for (const [ox, oy] of [[-4, -3], [0, -5], [-6, 1], [1, 0]]) {
        g.beginPath(); g.arc(cx - 16 * u + ox * u, cy - 5 * u + oy * u, 1.5 * u, 0, WS.TAU); g.fill();
      }
      g.restore();
    },

    worgen(g, s, p) {
      const cx = s / 2, cy = s * 0.56, u = s / 100;
      shaded(g, cx, cy + 6 * u, 22 * u, 26 * u, p);
      shaded(g, cx - 24 * u, cy + 4 * u, 9 * u, 16 * u, p, -0.5);
      shaded(g, cx + 24 * u, cy + 4 * u, 9 * u, 16 * u, p, 0.5);
      for (const dir of [-1, 1]) {
        poly(g, [[cx + dir * 30 * u, cy + 16 * u], [cx + dir * 40 * u, cy + 24 * u], [cx + dir * 28 * u, cy + 24 * u]], '#e9edf5', '#8a90a0', u);
      }
      shaded(g, cx, cy - 22 * u, 13 * u, 12 * u, p);
      poly(g, [[cx - 8 * u, cy - 24 * u], [cx - 16 * u, cy - 42 * u], [cx - 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx + 8 * u, cy - 24 * u], [cx + 16 * u, cy - 42 * u], [cx + 2 * u, cy - 30 * u]], p.lo, p.line, u);
      poly(g, [[cx - 7 * u, cy - 16 * u], [cx + 7 * u, cy - 16 * u], [cx, cy - 6 * u]], p.hi);
      g.fillStyle = '#fff'; // bared teeth
      for (let i = -2; i <= 2; i++) poly(g, [[cx + i * 3 * u, cy - 12 * u], [cx + i * 3 * u + 1.4 * u, cy - 8 * u], [cx + i * 3 * u + 2.8 * u, cy - 12 * u]], '#fff');
      eyes(g, cx, cy - 26 * u, 5 * u, 2 * u, '#ffe14d');
      rimLight(g, cx, cy, 26 * u, p.hi);
    },

    harpy(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      for (const dir of [-1, 1]) {                                 // feathered wings
        for (let i = 0; i < 4; i++) {
          poly(g, [
            [cx + dir * 8 * u, cy - 8 * u],
            [cx + dir * (24 + i * 8) * u, cy - (26 - i * 5) * u],
            [cx + dir * (18 + i * 7) * u, cy - (10 - i * 4) * u],
          ], i % 2 ? p.mid : p.lo, p.line, u * 0.8);
        }
      }
      shaded(g, cx, cy + 4 * u, 13 * u, 18 * u, p);
      shaded(g, cx, cy - 16 * u, 10 * u, 9 * u, p);
      poly(g, [[cx - 4 * u, cy - 16 * u], [cx - 16 * u, cy - 12 * u], [cx - 4 * u, cy - 10 * u]], '#f0c469', '#8a6420', u);
      eyes(g, cx + 1 * u, cy - 18 * u, 3.5 * u, 1.5 * u, '#d9f4ff');
      g.strokeStyle = '#e8c98f'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(cx - 5 * u, cy + 20 * u); g.lineTo(cx - 9 * u, cy + 30 * u); g.stroke();
      g.beginPath(); g.moveTo(cx + 5 * u, cy + 20 * u); g.lineTo(cx + 9 * u, cy + 30 * u); g.stroke();
    },

    centaur(g, s, p) {
      const cx = s / 2, cy = s * 0.60, u = s / 100;
      shaded(g, cx + 4 * u, cy + 8 * u, 26 * u, 15 * u, p);        // horse barrel
      g.strokeStyle = p.dark; g.lineWidth = 4 * u; g.lineCap = 'round';
      for (const dx of [-14, -4, 12, 22]) {
        g.beginPath(); g.moveTo(cx + dx * u, cy + 18 * u); g.lineTo(cx + dx * u + 2 * u, cy + 32 * u); g.stroke();
      }
      poly(g, [[cx + 28 * u, cy + 4 * u], [cx + 44 * u, cy - 6 * u], [cx + 30 * u, cy + 12 * u]], p.lo, p.line, u);
      shaded(g, cx - 12 * u, cy - 14 * u, 13 * u, 16 * u, p);      // humanoid torso
      shaded(g, cx - 12 * u, cy - 32 * u, 10 * u, 9 * u, p);
      eyes(g, cx - 12 * u, cy - 33 * u, 4 * u, 1.6 * u, '#ffd98f');
      g.strokeStyle = '#cfd6e2'; g.lineWidth = 3 * u;              // spear
      g.beginPath(); g.moveTo(cx - 30 * u, cy + 20 * u); g.lineTo(cx + 6 * u, cy - 44 * u); g.stroke();
      poly(g, [[cx + 6 * u, cy - 44 * u], [cx + 12 * u, cy - 34 * u], [cx, cy - 36 * u]], '#e7ecf5', '#8a90a0', u);
    },

    golem(g, s, p) {
      const cx = s / 2, cy = s * 0.58, u = s / 100;
      g.fillStyle = p.mid; g.strokeStyle = p.line; g.lineWidth = 2 * u;
      g.fillRect(cx - 22 * u, cy - 14 * u, 44 * u, 38 * u);
      g.strokeRect(cx - 22 * u, cy - 14 * u, 44 * u, 38 * u);
      g.fillStyle = p.lo;
      g.fillRect(cx - 30 * u, cy - 8 * u, 10 * u, 26 * u);
      g.fillRect(cx + 20 * u, cy - 8 * u, 10 * u, 26 * u);
      g.fillStyle = p.hi;
      g.fillRect(cx - 14 * u, cy - 30 * u, 28 * u, 18 * u);        // head block
      g.strokeRect(cx - 14 * u, cy - 30 * u, 28 * u, 18 * u);
      g.save(); g.shadowColor = '#ff9d3c'; g.shadowBlur = 12 * u;  // furnace eye
      g.fillStyle = '#ffb45c';
      g.fillRect(cx - 8 * u, cy - 24 * u, 16 * u, 5 * u);
      g.fillRect(cx - 6 * u, cy + 2 * u, 12 * u, 12 * u);
      g.restore();
      blade(g, cx + 34 * u, cy + 6 * u, 30 * u, 9 * u, 0.9, '#b9c0cc', '#5c6270'); // scythe arm
    },
  };

  /* --------------------------------------------------------- the survivor - */
  // Player sprites share one frame and differ by robe/armour colour, silhouette
  // accessory (staff, blades, bow...) and a class glyph on the chest.
  const HEROES = {
    mage: { accessory: 'staff', cloak: true },
    priest: { accessory: 'staff', cloak: true, halo: true },
    rogue: { accessory: 'daggers', hood: true },
    hunter: { accessory: 'bow' },
    warrior: { accessory: 'axe', bulk: 1.15 },
    warlock: { accessory: 'orb', cloak: true, hood: true },
    shaman: { accessory: 'totem', cloak: true },
    paladin: { accessory: 'shield', bulk: 1.1, halo: true },
    death_knight: { accessory: 'runeblade', bulk: 1.1, cloak: true },
    demon_hunter: { accessory: 'glaives', horns: true },
  };

  function drawHero(g, s, tint, cfg, demon) {
    const cx = s / 2, cy = s * 0.56, u = s / 100;
    const p = palette(demon ? [0.45, 0.95, 0.25] : tint);
    const bulk = cfg.bulk || 1;

    if (cfg.cloak) {                                               // cloak behind
      poly(g, [[cx - 20 * u * bulk, cy + 30 * u], [cx - 13 * u, cy - 18 * u],
      [cx + 13 * u, cy - 18 * u], [cx + 20 * u * bulk, cy + 30 * u]],
        p.lo, p.line, u);
    }
    shaded(g, cx, cy + 6 * u, 15 * u * bulk, 20 * u, p);           // torso
    shaded(g, cx - 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, -0.35);
    shaded(g, cx + 17 * u * bulk, cy + 2 * u, 6 * u, 12 * u, p, 0.35);
    g.fillStyle = p.dark;                                          // legs
    g.fillRect(cx - 9 * u, cy + 20 * u, 7 * u, 14 * u);
    g.fillRect(cx + 2 * u, cy + 20 * u, 7 * u, 14 * u);

    const skin = { hi: '#f2d9bd', mid: '#d9b494', lo: '#a07f63', line: '#5d4738', glow: '#fff' };
    shaded(g, cx, cy - 16 * u, 10 * u, 10 * u, demon ? p : skin);
    if (cfg.hood) {
      poly(g, [[cx - 12 * u, cy - 12 * u], [cx, cy - 34 * u], [cx + 12 * u, cy - 12 * u]], p.mid, p.line, u);
      g.fillStyle = 'rgba(6,8,14,.8)';
      g.beginPath(); g.ellipse(cx, cy - 17 * u, 7 * u, 8 * u, 0, 0, WS.TAU); g.fill();
    }
    if (cfg.horns || demon) {
      poly(g, [[cx - 8 * u, cy - 22 * u], [cx - 18 * u, cy - 42 * u], [cx - 3 * u, cy - 26 * u]], p.hi, p.line, u);
      poly(g, [[cx + 8 * u, cy - 22 * u], [cx + 18 * u, cy - 42 * u], [cx + 3 * u, cy - 26 * u]], p.hi, p.line, u);
    }
    if (cfg.halo) {
      g.save(); g.globalAlpha = 0.85; g.shadowColor = '#ffe6ae'; g.shadowBlur = 12 * u;
      g.strokeStyle = '#ffe6ae'; g.lineWidth = 2 * u;
      g.beginPath(); g.ellipse(cx, cy - 32 * u, 12 * u, 4 * u, 0, 0, WS.TAU); g.stroke();
      g.restore();
    }
    eyes(g, cx, cy - 17 * u, 4 * u, 1.6 * u, demon ? '#d9ff6b' : '#8fd8ff');

    switch (cfg.accessory) {
      case 'staff':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3 * u; g.lineCap = 'round';
        g.beginPath(); g.moveTo(cx + 22 * u, cy + 28 * u); g.lineTo(cx + 26 * u, cy - 38 * u); g.stroke();
        g.save(); g.shadowColor = WS.hex(tint); g.shadowBlur = 16 * u;
        g.fillStyle = WS.hex(WS.mix(tint, [1, 1, 1], 0.5));
        g.beginPath(); g.arc(cx + 26 * u, cy - 42 * u, 6 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'daggers':
        blade(g, cx - 22 * u, cy + 10 * u, 20 * u, 4 * u, -0.5, '#e2e7f0', '#767c8c');
        blade(g, cx + 22 * u, cy + 10 * u, 20 * u, 4 * u, 0.5, '#e2e7f0', '#767c8c');
        break;
      case 'bow':
        g.strokeStyle = '#a97f4a'; g.lineWidth = 3 * u;
        g.beginPath(); g.arc(cx + 24 * u, cy, 22 * u, -1.1, 1.1); g.stroke();
        g.strokeStyle = '#e8edf6'; g.lineWidth = 1.2 * u;
        g.beginPath(); g.moveTo(cx + 34 * u, cy - 19 * u); g.lineTo(cx + 34 * u, cy + 19 * u); g.stroke();
        break;
      case 'axe':
        g.strokeStyle = '#8b6a44'; g.lineWidth = 3.5 * u;
        g.beginPath(); g.moveTo(cx + 20 * u, cy + 26 * u); g.lineTo(cx + 30 * u, cy - 26 * u); g.stroke();
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 46 * u, cy - 18 * u], [cx + 30 * u, cy - 6 * u]], '#d4dae6', '#767c8c', u);
        poly(g, [[cx + 30 * u, cy - 26 * u], [cx + 16 * u, cy - 16 * u], [cx + 30 * u, cy - 6 * u]], '#b9c0cc', '#767c8c', u);
        break;
      case 'orb':
        g.save(); g.shadowColor = '#9d5bff'; g.shadowBlur = 18 * u;
        g.fillStyle = '#b98cff';
        g.beginPath(); g.arc(cx + 24 * u, cy - 4 * u, 7 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'totem':
        g.fillStyle = '#8b6a44'; g.fillRect(cx + 20 * u, cy - 20 * u, 9 * u, 44 * u);
        g.save(); g.shadowColor = '#4db8ff'; g.shadowBlur = 14 * u;
        g.fillStyle = '#7fd4ff'; g.fillRect(cx + 21 * u, cy - 14 * u, 7 * u, 7 * u);
        g.restore();
        break;
      case 'shield':
        poly(g, [[cx - 30 * u, cy - 14 * u], [cx - 14 * u, cy - 18 * u], [cx - 12 * u, cy + 8 * u],
        [cx - 22 * u, cy + 20 * u], [cx - 32 * u, cy + 6 * u]], '#e0d3a8', '#8a7440', u * 1.2);
        g.save(); g.shadowColor = '#ffe6ae'; g.shadowBlur = 10 * u;
        g.fillStyle = '#fff2cc';
        g.beginPath(); g.arc(cx - 22 * u, cy - 1 * u, 4 * u, 0, WS.TAU); g.fill();
        g.restore();
        break;
      case 'runeblade':
        blade(g, cx + 24 * u, cy + 26 * u, 52 * u, 6 * u, 0.32, '#cfd8e6', '#5f6878');
        g.save(); g.globalAlpha = 0.85; g.strokeStyle = '#5be0ff'; g.lineWidth = 1.6 * u;
        g.shadowColor = '#5be0ff'; g.shadowBlur = 10 * u;
        g.beginPath(); g.moveTo(cx + 26 * u, cy + 14 * u); g.lineTo(cx + 34 * u, cy - 22 * u); g.stroke();
        g.restore();
        break;
      case 'glaives':
        for (const dir of [-1, 1]) {
          g.save();
          g.translate(cx + dir * 26 * u, cy + 4 * u); g.rotate(dir * 0.5);
          g.strokeStyle = '#7dff45'; g.lineWidth = 2.4 * u;
          g.shadowColor = '#7dff45'; g.shadowBlur = 12 * u;
          g.beginPath(); g.arc(0, 0, 14 * u, -0.9, 1.4); g.stroke();
          g.beginPath(); g.arc(0, 0, 8 * u, 1.4, -0.9, true); g.stroke();
          g.restore();
        }
        break;
    }
    rimLight(g, cx, cy + 4 * u, 22 * u, p.hi, 0.4);
  }

  /* ------------------------------------------------------------- props ---- */
  const PROPS = {
    tree(g, s) {
      const u = s / 100, cx = s / 2, cy = s * 0.7;
      g.fillStyle = '#2a1f14'; g.fillRect(cx - 5 * u, cy - 6 * u, 10 * u, 30 * u);
      for (let i = 0; i < 3; i++) {
        ellipse(g, cx, cy - 18 * u - i * 14 * u, (32 - i * 7) * u, (18 - i * 3) * u,
          i === 2 ? '#2f4a26' : i === 1 ? '#26401f' : '#1e3419');
      }
    },
    deadtree(g, s) {
      const u = s / 100, cx = s / 2, cy = s * 0.8;
      g.strokeStyle = '#2c2a33'; g.lineWidth = 6 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - 44 * u); g.stroke();
      g.lineWidth = 3.5 * u;
      for (const [ax, ay] of [[-24, -30], [22, -36], [-16, -46], [18, -52]]) {
        g.beginPath(); g.moveTo(cx, cy - 26 * u); g.lineTo(cx + ax * u, cy + ay * u); g.stroke();
      }
    },
    stump(g, s) {
      const u = s / 100;
      ellipse(g, s / 2, s * 0.62, 20 * u, 12 * u, '#3b2c1c');
      ellipse(g, s / 2, s * 0.58, 15 * u, 8 * u, '#5a452c');
    },
    rock(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 24 * u, s * 0.7], [s / 2 - 14 * u, s * 0.42], [s / 2 + 10 * u, s * 0.38],
      [s / 2 + 24 * u, s * 0.62], [s / 2 + 8 * u, s * 0.74]], '#3c4048', '#22252b', u);
    },
    flower(g, s) {
      const u = s / 100;
      g.strokeStyle = '#3f5a2c'; g.lineWidth = 2 * u;
      g.beginPath(); g.moveTo(s / 2, s * 0.72); g.lineTo(s / 2, s * 0.5); g.stroke();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * WS.TAU;
        ellipse(g, s / 2 + WS.cos(a) * 7 * u, s * 0.48 + WS.sin(a) * 7 * u, 5 * u, 5 * u, '#c98fd6');
      }
      ellipse(g, s / 2, s * 0.48, 4 * u, 4 * u, '#ffe27a');
    },
    mushroom(g, s) {
      const u = s / 100;
      g.fillStyle = '#c9c4b4'; g.fillRect(s / 2 - 4 * u, s * 0.52, 8 * u, 18 * u);
      ellipse(g, s / 2, s * 0.52, 18 * u, 11 * u, '#6b4a7a');
      ellipse(g, s / 2 - 6 * u, s * 0.5, 3 * u, 2 * u, '#d8cfe6');
    },
    grave(g, s) {
      const u = s / 100;
      g.fillStyle = '#4a4f58';
      g.beginPath();
      g.moveTo(s / 2 - 16 * u, s * 0.74); g.lineTo(s / 2 - 16 * u, s * 0.46);
      g.arc(s / 2, s * 0.46, 16 * u, WS.PI, 0);
      g.lineTo(s / 2 + 16 * u, s * 0.74); g.closePath(); g.fill();
      g.strokeStyle = '#2b2f36'; g.lineWidth = 2.5 * u;
      g.beginPath(); g.moveTo(s / 2, s * 0.44); g.lineTo(s / 2, s * 0.64); g.stroke();
      g.beginPath(); g.moveTo(s / 2 - 8 * u, s * 0.52); g.lineTo(s / 2 + 8 * u, s * 0.52); g.stroke();
    },
    bone(g, s) {
      const u = s / 100;
      g.strokeStyle = '#8f94a0'; g.lineWidth = 5 * u; g.lineCap = 'round';
      g.beginPath(); g.moveTo(s / 2 - 18 * u, s * 0.6); g.lineTo(s / 2 + 18 * u, s * 0.56); g.stroke();
      g.fillStyle = '#a3a8b4';
      for (const [x, y] of [[-20, 56], [-18, 66], [20, 52], [22, 62]]) {
        ellipse(g, s / 2 + x * u, s * (y / 100), 5 * u, 5 * u, '#a3a8b4');
      }
    },
    skull(g, s) {
      const u = s / 100;
      ellipse(g, s / 2, s * 0.56, 16 * u, 15 * u, '#9aa0ac');
      g.fillStyle = '#20242c';
      ellipse(g, s / 2 - 6 * u, s * 0.55, 4 * u, 5 * u, '#20242c');
      ellipse(g, s / 2 + 6 * u, s * 0.55, 4 * u, 5 * u, '#20242c');
      g.fillRect(s / 2 - 6 * u, s * 0.64, 12 * u, 6 * u);
    },
    wheat(g, s) {
      const u = s / 100;
      g.strokeStyle = '#8f7a3c'; g.lineWidth = 2 * u;
      for (const dx of [-10, 0, 10]) {
        g.beginPath(); g.moveTo(s / 2 + dx * u, s * 0.74); g.quadraticCurveTo(s / 2 + dx * u + 4 * u, s * 0.56, s / 2 + dx * u, s * 0.4); g.stroke();
        ellipse(g, s / 2 + dx * u, s * 0.4, 4 * u, 8 * u, '#c9a94c');
      }
    },
    fence(g, s) {
      const u = s / 100;
      g.fillStyle = '#4a3a26';
      g.fillRect(s / 2 - 22 * u, s * 0.44, 5 * u, 30 * u);
      g.fillRect(s / 2 + 17 * u, s * 0.44, 5 * u, 30 * u);
      g.fillRect(s / 2 - 24 * u, s * 0.52, 48 * u, 4 * u);
      g.fillRect(s / 2 - 24 * u, s * 0.62, 48 * u, 4 * u);
    },
    gear(g, s) {
      const u = s / 100;
      g.save(); g.translate(s / 2, s * 0.58);
      g.fillStyle = '#585d68';
      for (let i = 0; i < 8; i++) {
        g.rotate(WS.TAU / 8);
        g.fillRect(-3 * u, -20 * u, 6 * u, 8 * u);
      }
      g.beginPath(); g.arc(0, 0, 14 * u, 0, WS.TAU); g.fill();
      g.fillStyle = '#2b2f36';
      g.beginPath(); g.arc(0, 0, 5 * u, 0, WS.TAU); g.fill();
      g.restore();
    },
    cactus(g, s) {
      const u = s / 100;
      g.fillStyle = '#3d5a34';
      g.fillRect(s / 2 - 6 * u, s * 0.36, 12 * u, 38 * u);
      g.fillRect(s / 2 - 18 * u, s * 0.5, 8 * u, 16 * u);
      g.fillRect(s / 2 + 10 * u, s * 0.46, 8 * u, 20 * u);
    },
    grass(g, s) {
      const u = s / 100;
      g.strokeStyle = '#6b6a3c'; g.lineWidth = 2 * u; g.lineCap = 'round';
      for (const dx of [-12, -4, 4, 12]) {
        g.beginPath(); g.moveTo(s / 2 + dx * u, s * 0.72);
        g.quadraticCurveTo(s / 2 + dx * u + 6 * u, s * 0.58, s / 2 + dx * u + 2 * u, s * 0.44); g.stroke();
      }
    },
    spire(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 14 * u, s * 0.76], [s / 2 - 6 * u, s * 0.3], [s / 2 + 4 * u, s * 0.26],
      [s / 2 + 14 * u, s * 0.72]], '#39485c', '#22303f', u);
    },
    crystal(g, s) {
      const u = s / 100;
      g.save(); g.shadowColor = '#7fd4ff'; g.shadowBlur = 14 * u;
      poly(g, [[s / 2, s * 0.3], [s / 2 + 11 * u, s * 0.56], [s / 2, s * 0.72], [s / 2 - 11 * u, s * 0.56]],
        '#6fbfe8', '#a9e6ff', u);
      g.restore();
    },
    ice(g, s) {
      const u = s / 100;
      poly(g, [[s / 2 - 20 * u, s * 0.68], [s / 2 - 6 * u, s * 0.48], [s / 2 + 8 * u, s * 0.54],
      [s / 2 + 20 * u, s * 0.7]], 'rgba(160,210,240,.5)', 'rgba(210,240,255,.7)', u);
    },
  };

  /* -------------------------------------------------------------- API ----- */
  WS.Sprites = {
    /** Cached creature sprite. `size` is the full canvas edge in world units. */
    creature(art, tint, size) {
      size = WS.round(size);
      const key = `c:${art}:${WS.hex(tint)}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const g = c.getContext('2d');
      const draw = CREATURES[art] || CREATURES.kobold;
      draw(g, res, palette(tint));
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    hero(id, tint, size, demon) {
      size = WS.round(size);
      const key = `h:${id}:${WS.hex(tint)}:${size}:${demon ? 1 : 0}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      drawHero(c.getContext('2d'), res, tint, HEROES[id] || HEROES.mage, demon);
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    prop(kind, size) {
      size = WS.round(size);
      const key = `p:${kind}:${size}`;
      let c = cache.get(key);
      if (c) return c;
      const res = size * SS;
      c = make(res, res);
      const draw = PROPS[kind] || PROPS.rock;
      draw(c.getContext('2d'), res);
      c.displaySize = size;
      cache.set(key, c);
      return c;
    },

    has(art) { return !!CREATURES[art]; },
    clear() { cache.clear(); },
  };

})(window.WS);

/* ===== src/render/icons.js ===== */
/* Procedural ability icons, drawn to one system.
 *
 * THE SYSTEM - every glyph obeys it, which is what makes sixty of them read as
 * one set rather than sixty drawings:
 *   - a 100x100 field, with all marks inside an optical circle of radius 36
 *     centred at (50,50). Nothing touches the plate edge.
 *   - two stroke weights only: STROKE for the subject, HAIR for detail. Round
 *     caps and joins throughout.
 *   - one density target: a glyph covers roughly a third of its optical circle,
 *     so a stroked icon never looks starved beside a filled one.
 *   - one treatment per glyph. A shape is drawn OR outlined, never a hairline
 *     stapled to a heavy fill.
 *   - a distinct silhouette. Five weapons must not all be a thin vertical.
 *
 * The plate is a chamfered machined tile - an octagon, not a rounded rectangle -
 * with an outer rim, an inner bevel lit from the top, an accent hairline inlaid
 * three units in, and a pool of light behind the subject.
 */
'use strict';
(function (WS) {

  const cache = new Map();

  const R = 36;        // optical radius; no mark may exceed it
  const STROKE = 8;    // the subject
  const HAIR = 4.5;    // detail

  /* ------------------------------------------------------------ drawing -- */
  function line(g, c, w) {
    g.strokeStyle = c; g.lineWidth = w || STROKE;
    g.lineCap = 'round'; g.lineJoin = 'round';
  }
  function path(g, pts, close) {
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    if (close) g.closePath();
  }
  function shape(g, pts, fillC, strokeC) {
    path(g, pts, true);
    if (fillC) { g.fillStyle = fillC; g.fill(); }
    if (strokeC) { line(g, strokeC, HAIR); g.stroke(); }
  }
  function disc(g, x, y, r, c) {
    g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, WS.TAU); g.fill();
  }
  function circle(g, x, y, r, c, w) {
    line(g, c, w || STROKE); g.beginPath(); g.arc(x, y, r, 0, WS.TAU); g.stroke();
  }
  function arcAt(g, x, y, r, a0, a1, c, w) {
    line(g, c, w || STROKE); g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke();
  }
  /** A leaf-shaped blade: the common silhouette for anything edged. */
  function leafBlade(g, cx, cy, len, wide, rot, fillC, edgeC) {
    g.save();
    g.translate(cx, cy); g.rotate(rot);
    g.beginPath();
    g.moveTo(0, -len);
    g.quadraticCurveTo(wide, -len * 0.15, 0, len);
    g.quadraticCurveTo(-wide, -len * 0.15, 0, -len);
    g.fillStyle = fillC; g.fill();
    if (edgeC) { line(g, edgeC, 2.5); g.stroke(); }
    g.restore();
  }
  /** A tapered spike, for claws, quills and rays. */
  function spike(g, x, y, len, wide, rot, c) {
    g.save(); g.translate(x, y); g.rotate(rot);
    shape(g, [[0, -len], [wide, len * 0.4], [0, len * 0.15], [-wide, len * 0.4]], c);
    g.restore();
  }
  const dim = (c) => c + '66';     // the accent at low alpha, for detail
  const lit = '#ffffff';

  /* ------------------------------------------------------------- glyphs -- */
  const G = {

    /* ---- projectiles and spells ---------------------------------------- */
    missile(g, c) {
      // Three seeking bolts on parallel arcs, thickest in front.
      for (let i = 0; i < 3; i++) {
        const off = (i - 1) * 13;
        line(g, i === 1 ? c : dim(c), i === 1 ? STROKE : HAIR + 1);
        g.beginPath();
        g.moveTo(18, 62 + off * 0.5);
        g.quadraticCurveTo(48, 34 + off, 80, 46 + off);
        g.stroke();
      }
      disc(g, 80, 46, 6, lit);
    },
    ember(g, c) {
      shape(g, [[50, 14], [66, 40], [62, 56], [50, 86], [38, 56], [34, 40]], c);
      disc(g, 50, 62, 12, lit);
    },
    shard(g, c) {
      shape(g, [[50, 14], [74, 46], [50, 86], [26, 46]], c);
      shape(g, [[50, 14], [50, 86], [26, 46]], lit + '55');
    },
    spark(g, c) {
      line(g, c, STROKE + 1);
      path(g, [[62, 14], [36, 48], [56, 51], [34, 86]]);
      g.stroke();
    },
    ring(g, c) {
      circle(g, 50, 50, 30, c, STROKE);
      circle(g, 50, 50, 17, dim(c), HAIR);
    },
    zone(g, c) {
      // A field seen in perspective, with rot rising from it.
      line(g, c, STROKE);
      g.beginPath(); g.ellipse(50, 62, 32, 17, 0, 0, WS.TAU); g.stroke();
      g.fillStyle = c + '30';
      g.beginPath(); g.ellipse(50, 62, 32, 17, 0, 0, WS.TAU); g.fill();
      line(g, c, HAIR + 1);
      for (const [x, h] of [[32, 30], [50, 22], [68, 32]]) {
        g.beginPath(); g.moveTo(x, 56); g.lineTo(x + (x - 50) * 0.12, h); g.stroke();
      }
    },
    bolt(g, c) {
      leafBlade(g, 50, 50, 34, 22, 0.5, c);
      leafBlade(g, 50, 50, 20, 11, 0.5, lit + '77');
    },
    coil(g, c) {
      // A spiral drawn with even spacing so it reads as a coil, not a scribble.
      line(g, c, STROKE - 1);
      g.beginPath();
      for (let i = 0; i <= 46; i++) {
        const t = i / 46, a = t * WS.TAU * 1.55 - 1.2, r = 9 + t * 26;
        const x = 50 + WS.cos(a) * r, y = 50 + WS.sin(a) * r;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
      disc(g, 50 + WS.cos(-1.2) * 9, 50 + WS.sin(-1.2) * 9, 5, lit);
    },
    beam(g, c) {
      const grd = g.createLinearGradient(14, 0, 86, 0);
      grd.addColorStop(0, c + '00'); grd.addColorStop(.5, c); grd.addColorStop(1, lit);
      g.fillStyle = grd;
      shape(g, [[14, 44], [86, 36], [86, 64], [14, 56]], null);
      g.fill();
      g.fillStyle = lit;
      shape(g, [[24, 48], [86, 45], [86, 55], [24, 52]], null);
      g.fill();
    },
    chaos(g, c) {
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * WS.TAU - 1.2;
        spike(g, 50, 50, 34, 9, a, i % 2 ? c : dim(c));
      }
      disc(g, 50, 50, 11, lit);
    },
    moon(g, c) {
      g.save();
      disc(g, 50, 50, 32, c);
      g.globalCompositeOperation = 'destination-out';
      disc(g, 68, 38, 27, '#000');
      g.restore();
      disc(g, 34, 60, 4, lit);
    },

    /* ---- edged weapons: each gets its own silhouette -------------------- */
    dagger(g) {
      leafBlade(g, 50, 40, 28, 12, 0, '#dfe4ee', '#8b93a7');
      g.fillStyle = '#8a6a45';
      shape(g, [[42, 66], [58, 66], [56, 86], [44, 86]], '#8a6a45');
      shape(g, [[32, 62], [68, 62], [66, 70], [34, 70]], '#b0b7c4');
    },
    sword(g) {
      leafBlade(g, 50, 36, 34, 11, 0, '#e4e9f2', '#8b93a7');
      shape(g, [[44, 68], [56, 68], [54, 88], [46, 88]], '#8a6a45');
      shape(g, [[28, 62], [72, 62], [70, 71], [30, 71]], '#c2c9d6');
      disc(g, 50, 90, 5, '#c2c9d6');
    },
    blade(g, c) {
      // Two crossed slashes: a kill mark, not another vertical.
      for (const s2 of [-1, 1]) {
        g.save();
        g.translate(50, 50); g.rotate(s2 * 0.5);
        const grd = g.createLinearGradient(0, -34, 0, 34);
        grd.addColorStop(0, '#ffffff00');
        grd.addColorStop(.45, '#e9edf6');
        grd.addColorStop(1, '#ffffff00');
        g.fillStyle = grd;
        g.beginPath();
        g.moveTo(0, -34); g.quadraticCurveTo(9, 0, 0, 34);
        g.quadraticCurveTo(-9, 0, 0, -34);
        g.fill();
        g.restore();
      }
      disc(g, 50, 50, 6, c || '#e9edf6');
    },
    axe(g) {
      line(g, '#8a6a45', STROKE);
      g.beginPath(); g.moveTo(50, 88); g.lineTo(50, 28); g.stroke();
      g.fillStyle = '#d8dee9';
      g.beginPath();
      g.moveTo(50, 18); g.quadraticCurveTo(84, 26, 76, 54);
      g.quadraticCurveTo(62, 44, 50, 46); g.closePath(); g.fill();
      g.beginPath();
      g.moveTo(50, 18); g.quadraticCurveTo(16, 26, 24, 54);
      g.quadraticCurveTo(38, 44, 50, 46); g.closePath(); g.fill();
      line(g, '#8b93a7', 2.5); g.stroke();
    },
    spear(g) {
      line(g, '#8a6a45', STROKE - 2);
      g.beginPath(); g.moveTo(22, 86); g.lineTo(64, 36); g.stroke();
      leafBlade(g, 73, 25, 22, 11, 0.7, '#e4e9f2', '#8b93a7');
      shape(g, [[54, 44], [70, 38], [72, 46], [58, 52]], '#c2c9d6');   // collar
      // Motion trail, so it reads as a thrown weapon rather than a stick.
      line(g, '#ffffff44', 3);
      g.beginPath(); g.moveTo(16, 78); g.lineTo(34, 58); g.stroke();
      g.beginPath(); g.moveTo(24, 88); g.lineTo(42, 68); g.stroke();
    },
    arrow(g, c) {
      // Three arrows in flight - a volley, which is what the weapon is.
      for (let i = 0; i < 3; i++) {
        const off = (i - 1) * 17;
        const col = i === 1 ? '#e4e9f2' : '#aeb6c4';
        line(g, '#a97f4a', i === 1 ? HAIR + 1 : HAIR - 0.5);
        g.beginPath();
        g.moveTo(18 + off * 0.5, 74 + off * 0.55);
        g.lineTo(66 + off * 0.5, 30 + off * 0.55);
        g.stroke();
        shape(g, [[78 + off * 0.5, 20 + off * 0.55], [58 + off * 0.5, 26 + off * 0.55],
        [70 + off * 0.5, 38 + off * 0.55]], col);
      }
    },
    shield(g, c) {
      shape(g, [[50, 16], [80, 28], [78, 58], [50, 84], [22, 58], [20, 28]], c || '#e0d3a8', '#00000055');
      line(g, lit + '99', HAIR);
      g.beginPath(); g.moveTo(50, 26); g.lineTo(50, 74); g.stroke();
    },
    aegis(g, c) {
      shape(g, [[50, 16], [80, 28], [78, 58], [50, 84], [22, 58], [20, 28]], c || '#ffdf7a', '#00000055');
      line(g, '#2a2416', HAIR + 1);
      g.beginPath(); g.moveTo(50, 30); g.lineTo(50, 72); g.stroke();
      g.beginPath(); g.moveTo(34, 44); g.lineTo(66, 44); g.stroke();
    },

    /* ---- passives ------------------------------------------------------- */
    fist(g, c) {
      // A struck blow: an impact star behind a closed fist.
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * WS.TAU + 0.2;
        spike(g, 50 + WS.cos(a) * 30, 50 + WS.sin(a) * 30, 12, 5, a + WS.PI / 2, dim(c));
      }
      g.fillStyle = c;
      g.beginPath(); g.roundRect(30, 38, 40, 30, 8); g.fill();
      g.beginPath(); g.roundRect(34, 30, 32, 13, 6); g.fill();
      line(g, '#00000066', 2.5);
      for (let i = 1; i < 4; i++) {
        g.beginPath(); g.moveTo(30 + i * 10, 44); g.lineTo(30 + i * 10, 65); g.stroke();
      }
    },
    wing(g, c) {
      // Five primaries fanning from one pivot, with dark gaps between them.
      const px = 24, py = 78;
      for (let i = 0; i < 5; i++) {
        const a = -1.42 + i * 0.24;
        const len = 62 - i * 6;
        const wide = 8 - i * 0.6;
        g.save();
        g.translate(px, py);
        g.rotate(a + WS.PI / 2);
        g.fillStyle = i % 2 ? c : dim(c);
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(wide, len * 0.55, 1, len);
        g.quadraticCurveTo(-wide, len * 0.5, 0, 0);
        g.fill();
        g.restore();
      }
      line(g, c, HAIR);
      g.beginPath();
      g.moveTo(px, py);
      g.quadraticCurveTo(px + 26, py - 44, px + 62, py - 58);
      g.stroke();
      disc(g, px, py, 6, c);
    },

    boot(g, c) {
      // A boot in profile: shaft, instep, and a sole that reads as a sole.
      line(g, dim(c), HAIR);
      for (const y of [34, 48, 62]) {
        g.beginPath(); g.moveTo(10, y); g.lineTo(28, y + 2); g.stroke();
      }
      g.fillStyle = c;
      g.beginPath();
      g.moveTo(36, 18);
      g.lineTo(60, 18);
      g.quadraticCurveTo(62, 46, 66, 58);
      g.quadraticCurveTo(80, 62, 86, 70);
      g.lineTo(86, 76);
      g.lineTo(34, 76);
      g.quadraticCurveTo(32, 44, 36, 18);
      g.fill();
      g.fillStyle = '#00000055';
      g.beginPath(); g.roundRect(32, 76, 56, 8, 2); g.fill();
      g.fillStyle = dim(c);
      g.beginPath(); g.roundRect(34, 22, 28, 7, 3); g.fill();
    },
    magnet(g, c) {
      // The horseshoe with its poles clearly capped, and filings drawn in.
      arcAt(g, 50, 48, 24, WS.PI, 0, c, 16);
      g.fillStyle = c;
      g.fillRect(18, 48, 16, 14); g.fillRect(66, 48, 16, 14);
      // Bright steel poles below the arch, with a dark gap so they separate.
      g.fillStyle = '#0b0d12';
      g.fillRect(16, 61, 20, 4); g.fillRect(64, 61, 20, 4);
      g.fillStyle = '#eef2f8';
      g.beginPath(); g.roundRect(17, 64, 18, 16, 2); g.fill();
      g.beginPath(); g.roundRect(65, 64, 18, 16, 2); g.fill();
      line(g, dim(c), 3.5);
      for (const [x, y] of [[38, 30], [50, 22], [62, 30]]) {
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + (x - 50) * 0.5, y - 10); g.stroke();
      }
    },
    heart(g, c) {
      g.fillStyle = c;
      g.beginPath(); g.moveTo(50, 84);
      g.bezierCurveTo(14, 58, 22, 20, 50, 38);
      g.bezierCurveTo(78, 20, 86, 58, 50, 84);
      g.fill();
      g.fillStyle = lit + '55';
      g.beginPath(); g.ellipse(38, 42, 7, 10, -0.5, 0, WS.TAU); g.fill();
    },
    crosshair(g, c) {
      circle(g, 50, 50, 26, c, HAIR + 1.5);
      line(g, c, STROKE - 1);
      for (const [x1, y1, x2, y2] of [[50, 14, 50, 30], [50, 70, 50, 86], [14, 50, 30, 50], [70, 50, 86, 50]]) {
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      }
      disc(g, 50, 50, 7, c);
    },
    claw(g, c) {
      // Three hooked talons off a knuckle - curved, so they cannot be mistaken
      // for the straight strokes of Thorns.
      for (let i = 0; i < 3; i++) {
        const a = -1.9 + i * 0.55;
        g.save();
        g.translate(50, 82);
        g.rotate(a);
        g.fillStyle = i === 1 ? c : dim(c);
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(16, -26, 8, -60);
        g.quadraticCurveTo(2, -30, -8, -4);
        g.fill();
        g.restore();
      }
      g.fillStyle = c;
      g.beginPath(); g.ellipse(50, 82, 17, 9, 0, 0, WS.TAU); g.fill();
    },
    expand(g, c) {
      circle(g, 50, 50, 14, c, STROKE - 1);
      circle(g, 50, 50, 26, dim(c), HAIR + 1);
      circle(g, 50, 50, 36, dim(c), 2.5);
    },
    triple(g, c) {
      for (const dx of [-23, 0, 23]) leafBlade(g, 50 + dx, 50, 26, 10, 0, dx ? dim(c) : c);
      disc(g, 50, 26, 5, lit);
    },
    coin(g, c) {
      disc(g, 50, 50, 30, c || '#ffd35c');
      circle(g, 50, 50, 30, '#00000055', 3);
      circle(g, 50, 50, 22, '#00000033', 2.5);
      g.fillStyle = '#7a5a1c';
      g.font = 'bold 30px Archivo, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('G', 50, 52);
    },
    book(g, c) {
      shape(g, [[18, 26], [50, 34], [50, 80], [18, 72]], '#c8b48c');
      shape(g, [[82, 26], [50, 34], [50, 80], [82, 72]], '#b3a07c');
      line(g, c, HAIR);
      g.beginPath(); g.moveTo(50, 34); g.lineTo(50, 80); g.stroke();
      line(g, '#8a7450', 2.5);
      for (let i = 0; i < 3; i++) {
        g.beginPath(); g.moveTo(26, 44 + i * 10); g.lineTo(43, 47 + i * 10); g.stroke();
        g.beginPath(); g.moveTo(57, 47 + i * 10); g.lineTo(74, 44 + i * 10); g.stroke();
      }
    },
    leaf(g, c) {
      g.fillStyle = c || '#5fcf6a';
      g.beginPath();
      g.moveTo(22, 80); g.quadraticCurveTo(24, 24, 78, 20);
      g.quadraticCurveTo(78, 74, 22, 80); g.fill();
      line(g, '#00000055', HAIR);
      g.beginPath(); g.moveTo(22, 80); g.quadraticCurveTo(52, 56, 76, 24); g.stroke();
    },
    skull(g, c) {
      g.fillStyle = c || '#cfd5e0';
      g.beginPath(); g.arc(50, 46, 28, WS.PI, 0); g.lineTo(76, 62); g.lineTo(24, 62); g.closePath(); g.fill();
      g.beginPath(); g.roundRect(34, 62, 32, 20, 4); g.fill();
      g.fillStyle = '#12141a';
      g.beginPath(); g.ellipse(39, 46, 8, 10, 0, 0, WS.TAU); g.fill();
      g.beginPath(); g.ellipse(61, 46, 8, 10, 0, 0, WS.TAU); g.fill();
      g.fillRect(46, 64, 8, 13);
      line(g, '#12141a', 2);
      g.beginPath(); g.moveTo(40, 64); g.lineTo(40, 77); g.stroke();
      g.beginPath(); g.moveTo(60, 64); g.lineTo(60, 77); g.stroke();
    },
    frostaura(g, c) {
      const col = c || '#7fd4ff';
      for (let i = 0; i < 6; i++) {
        g.save(); g.translate(50, 50); g.rotate((i / 6) * WS.TAU);
        line(g, col, HAIR + 1.5);
        g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -34); g.stroke();
        line(g, col, HAIR - 1);
        g.beginPath(); g.moveTo(0, -20); g.lineTo(-9, -29); g.stroke();
        g.beginPath(); g.moveTo(0, -20); g.lineTo(9, -29); g.stroke();
        g.restore();
      }
      disc(g, 50, 50, 6, lit);
    },
    spiritwolf(g, c) {
      const col = c || '#7fd4ff';
      g.fillStyle = col;
      g.beginPath(); g.ellipse(56, 58, 24, 15, -0.1, 0, WS.TAU); g.fill();
      g.beginPath(); g.ellipse(28, 42, 15, 13, 0, 0, WS.TAU); g.fill();
      shape(g, [[18, 32], [16, 14], [30, 30]], col);
      shape(g, [[34, 30], [40, 13], [45, 31]], col);
      shape(g, [[76, 48], [92, 28], [80, 62]], col);
      shape(g, [[14, 44], [4, 47], [16, 52]], col);
      disc(g, 24, 40, 4, '#0b0d12');
      line(g, col, HAIR + 1);
      for (const dx of [-6, 10, 22]) {
        g.beginPath(); g.moveTo(50 + dx, 70); g.lineTo(50 + dx, 84); g.stroke();
      }
    },
    risen(g, c) {
      const col = c || '#9fd66b';
      g.fillStyle = col;
      g.beginPath(); g.ellipse(50, 34, 17, 19, 0, 0, WS.TAU); g.fill();
      g.fillStyle = '#12141a';
      disc(g, 43, 32, 4, '#12141a'); disc(g, 57, 32, 4, '#12141a');
      line(g, col, STROKE - 1);
      g.beginPath(); g.moveTo(50, 52); g.lineTo(50, 74); g.stroke();
      g.beginPath(); g.moveTo(50, 58); g.lineTo(28, 68); g.stroke();
      g.beginPath(); g.moveTo(50, 58); g.lineTo(72, 68); g.stroke();
      g.beginPath(); g.moveTo(50, 74); g.lineTo(38, 88); g.stroke();
      g.beginPath(); g.moveTo(50, 74); g.lineTo(62, 88); g.stroke();
    },
    command(g, c) {
      // A hand of command: three thralls bound to one point.
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * WS.TAU - WS.PI / 2;
        const x = 50 + WS.cos(a) * 28, y = 50 + WS.sin(a) * 28;
        line(g, dim(c), 3.5);
        g.beginPath(); g.moveTo(50, 50); g.lineTo(x, y); g.stroke();
        disc(g, x, y, 10, c);
        disc(g, x, y, 4.5, '#0b0d12');
      }
      disc(g, 50, 50, 12, c);
      disc(g, 50, 50, 6, lit);
    },
    thorn(g, c) {
      // A bramble ring: barbs facing outward, which is exactly what the passive
      // does, and a silhouette nothing else in the set shares.
      const col = c || '#6fbf5a';
      circle(g, 50, 50, 22, col, HAIR + 2);
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * WS.TAU + 0.3;
        spike(g, 50 + WS.cos(a) * 28, 50 + WS.sin(a) * 28, 14, 5.5, a + WS.PI / 2, col);
      }
      disc(g, 50, 50, 6, dim(col));
    },
    desecrate(g, c) {
      g.fillStyle = '#5a1f7a';
      g.beginPath(); g.ellipse(50, 64, 34, 18, 0, 0, WS.TAU); g.fill();
      g.fillStyle = c || '#8cf24a';
      g.beginPath(); g.ellipse(50, 64, 20, 10, 0, 0, WS.TAU); g.fill();
      line(g, '#c77dff', HAIR + 1);
      for (const [dx, h] of [[-20, 30], [0, 22], [20, 32]]) {
        g.beginPath(); g.moveTo(50 + dx, 56); g.lineTo(50 + dx * 0.75, h); g.stroke();
      }
    },
    soulrend(g, c) {
      const col = c || '#8cf24a';
      // A torn ring: two arcs pulled apart, with the tear lit between them.
      arcAt(g, 50, 50, 28, -1.05, 1.35, col, STROKE);
      arcAt(g, 50, 50, 28, 1.85, -1.55, col, STROKE);
      line(g, lit, HAIR - 1);
      g.beginPath(); g.moveTo(70, 34); g.lineTo(60, 50); g.lineTo(72, 62); g.stroke();
      disc(g, 50, 50, 6, col);
    },
    retaura(g, c) {
      const col = c || '#ffdf7a';
      circle(g, 50, 50, 24, col, HAIR + 1);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * WS.TAU;
        spike(g, 50 + WS.cos(a) * 32, 50 + WS.sin(a) * 32, 10, 4.5, a + WS.PI / 2, col);
      }
      disc(g, 50, 50, 11, col);
    },
    feint(g, c) {
      // A figure stepping clear of its own after-image: two humanoid marks,
      // one ghosted, which reads as a dodge and not as two leaves.
      const figure = (x, alpha) => {
        g.save();
        g.globalAlpha = alpha;
        g.fillStyle = c;
        disc(g, x, 28, 10, c);
        g.beginPath();

    g.lineTo(b - k, b);

    g.lineTo(a, b - k);

  // and 40 simultaneous oscillators is both inaudible mush and a CPU stall.
  const lastPlayed = Object.create(null);
  const THROTTLE = {
    hit: 0.045, crit: 0.07, gem: 0.06, cast: 0.05, enemyHit: 0.06,
    explode: 0.09, freeze: 0.2, coin: 0.08,
  };

  const KITS = {
    cast() { tone({ type: 'triangle', freq: 520, to: 780, decay: 0.10, gain: 0.10 }); },
    hit() { noise({ freq: 1500, to: 500, decay: 0.07, gain: 0.10, q: 0.8 }); },
    crit() {
      noise({ freq: 2400, to: 700, decay: 0.11, gain: 0.16, q: 0.9 });
      tone({ type: 'square', freq: 880, to: 1600, decay: 0.09, gain: 0.07 });
    },
    enemyHit() { noise({ freq: 700, to: 220, decay: 0.10, gain: 0.13, filter: 'lowpass', q: 0.6 }); },
    playerHurt() {
      tone({ type: 'sawtooth', freq: 220, to: 90, decay: 0.28, gain: 0.22, filter: 'lowpass', cutoff: 900 });
      noise({ freq: 400, to: 120, decay: 0.22, gain: 0.16, filter: 'lowpass' });
    },
    gem() { tone({ type: 'sine', freq: 1180, to: 1560, decay: 0.09, gain: 0.07 }); },
    coin() {
      tone({ type: 'square', freq: 1400, decay: 0.05, gain: 0.06 });
      tone({ type: 'square', freq: 2100, decay: 0.07, gain: 0.05, delay: 0.05 });
    },
    potion() {
      tone({ type: 'sine', freq: 400, to: 900, decay: 0.25, gain: 0.14 });
      tone({ type: 'sine', freq: 600, to: 1350, decay: 0.3, gain: 0.09, delay: 0.05 });
    },
    chest() {
      for (let i = 0; i < 5; i++) {
        tone({ type: 'square', freq: 900 + i * 240, decay: 0.10, gain: 0.05, delay: i * 0.045 });
      }
    },
    level() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => tone({ type: 'triangle', freq: f, decay: 0.45, gain: 0.13, delay: i * 0.07 }));
    },
    evolve() {
      const notes = [392, 523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach((f, i) => tone({ type: 'sawtooth', freq: f, decay: 0.5, gain: 0.09, delay: i * 0.06, filter: 'lowpass', cutoff: 2600 }));
      noise({ freq: 3000, to: 400, decay: 0.7, gain: 0.10 });
    },
    boss() {
      tone({ type: 'sawtooth', freq: 82, to: 55, decay: 1.6, gain: 0.28, filter: 'lowpass', cutoff: 500 });
      tone({ type: 'sawtooth', freq: 123, to: 82, decay: 1.4, gain: 0.18, filter: 'lowpass', cutoff: 700, delay: 0.1 });
      noise({ freq: 200, to: 70, decay: 1.2, gain: 0.12, filter: 'lowpass' });
    },
    explode() {
      noise({ freq: 900, to: 60, decay: 0.55, gain: 0.32, filter: 'lowpass', q: 0.5 });
      tone({ type: 'sine', freq: 120, to: 40, decay: 0.5, gain: 0.20 });
    },
    freeze() {
      tone({ type: 'sine', freq: 1800, to: 300, decay: 0.8, gain: 0.14 });
      noise({ freq: 4000, to: 900, decay: 0.7, gain: 0.10 });
    },
    death() {
      tone({ type: 'sawtooth', freq: 200, to: 40, decay: 1.8, gain: 0.3, filter: 'lowpass', cutoff: 600 });
      noise({ freq: 300, to: 50, decay: 1.6, gain: 0.16, filter: 'lowpass' });
    },
    victory() {
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
      notes.forEach((f, i) => tone({ type: 'triangle', freq: f, decay: 0.7, gain: 0.14, delay: i * 0.12 }));
    },
    ui() { tone({ type: 'square', freq: 660, decay: 0.05, gain: 0.05 }); },
    select() { tone({ type: 'square', freq: 880, to: 1200, decay: 0.09, gain: 0.06 }); },
    warn() {
      tone({ type: 'square', freq: 330, decay: 0.2, gain: 0.12 });
      tone({ type: 'square', freq: 330, decay: 0.2, gain: 0.12, delay: 0.24 });
    },
  };

  // How far each kit pushes the score down, and for how long.
  const DUCK = {
    boss: [0.28, 1.6], evolve: [0.4, 1.1], level: [0.4, 0.9],
    victory: [0.3, 1.8], death: [0.25, 1.8], explode: [0.55, 0.5], warn: [0.5, 0.7],
  };

  Audio.play = function (kit) {
    if (!this.ctx || !WS.Save.settings.sound) return;
    const t = this.ctx.currentTime;
    const gap = THROTTLE[kit];
    if (gap) {
      if (lastPlayed[kit] && t - lastPlayed[kit] < gap) return;
      lastPlayed[kit] = t;
    }
    const d = DUCK[kit];
    if (d && this.duck) {
      const [floor, hold] = d;
      try {
        this.duck.gain.cancelScheduledValues(t);
        this.duck.gain.setValueAtTime(this.duck.gain.value, t);
        this.duck.gain.linearRampToValueAtTime(floor, t + 0.06);
        this.duck.gain.setValueAtTime(floor, t + hold * 0.5);
        this.duck.gain.linearRampToValueAtTime(1, t + hold);
      } catch (e) { /* scheduling raced a context change */ }
    }
    const fn = KITS[kit];
    if (fn) { try { fn(); } catch (e) { /* audio graph exhausted */ } }
  };

  /* --------------------------------------------------------------- music -- */
  // Each zone gets a mode and a root. The loop schedules one bar ahead on a
  // rAF-driven pump so it never drifts and costs nothing when muted.
  const SCORES = {
    forest: { root: 146.83, scale: [0, 2, 4, 7, 9], wave: 'triangle', tempo: 1.6 },   // D major pentatonic
    plains: { root: 130.81, scale: [0, 2, 3, 7, 9], wave: 'triangle', tempo: 1.5 },   // C dorian-ish
    cursed: { root: 110.00, scale: [0, 1, 3, 7, 8], wave: 'sine', tempo: 1.9 },       // A phrygian
    savannah: { root: 123.47, scale: [0, 2, 5, 7, 10], wave: 'sawtooth', tempo: 1.4 },
    glacier: { root: 98.00, scale: [0, 3, 5, 7, 10], wave: 'sine', tempo: 2.0 },      // G minor
    eclipse: { root: 87.31, scale: [0, 1, 4, 6, 8], wave: 'sawtooth', tempo: 1.3 },   // F altered
    menu: { root: 130.81, scale: [0, 3, 5, 7, 10], wave: 'triangle', tempo: 2.2 },
  };

  function semitone(root, n) { return root * Math.pow(2, n / 12); }

  Audio.playMusic = function (key) {
    if (!this.ctx) return;
    if (this._music && this._music.key === key) return;
    this.stopMusic();
    const score = SCORES[key] || SCORES.menu;
    const ctx = this.ctx;

    const bed = ctx.createGain();
    bed.gain.value = 0.5;
    bed.connect(this.musicGain);

    // A continuous drone under everything - the "obsidian" of the score.
    const drone = ctx.createOscillator();
    const droneGain = ctx.createGain();
    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass'; droneFilter.frequency.value = 420;
    drone.type = 'sawtooth';
    drone.frequency.value = score.root / 2;
    droneGain.gain.value = 0.12;
    drone.connect(droneFilter); droneFilter.connect(droneGain); droneGain.connect(bed);
    drone.start();

    const state = { key, bed, drone, step: 0, nextTime: ctx.currentTime + 0.1, timer: null, intensity: 0 };

    state.timer = setInterval(() => {
      if (!Audio.ctx || Audio.ctx.state === 'closed') return;
      const beat = score.tempo / 2;
      while (state.nextTime < Audio.ctx.currentTime + 1.0) {
        const t0 = state.nextTime;
        const s = state.step;
        const deg = score.scale[(s * 3) % score.scale.length];
        const oct = ((s / 4) | 0) % 2 ? 12 : 0;
        // Arpeggio - denser as the run gets hairier.
        if (s % 2 === 0 || state.intensity > 0.5) {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = score.wave;
          osc.frequency.value = semitone(score.root * 2, deg + oct);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.07 + state.intensity * 0.05, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + beat * 1.6);
          osc.connect(g); g.connect(bed);
          osc.start(t0); osc.stop(t0 + beat * 1.7);
        }
        // Chord bed every four steps.
        if (s % 4 === 0) {
          for (const iv of [0, 7, state.intensity > 0.6 ? 10 : 12]) {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = semitone(score.root, deg + iv);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.3);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + beat * 4);
            osc.connect(g); g.connect(bed);
            osc.start(t0); osc.stop(t0 + beat * 4.2);
          }
        }
        state.nextTime += beat;
        state.step++;
      }
    }, 250);

    this._music = state;
  };

  /** 0..1 - drives arpeggio density and chord colour as danger climbs. */
  Audio.setIntensity = function (v) {
    if (this._music) this._music.intensity = WS.clamp(v, 0, 1);
  };

  Audio.stopMusic = function () {
    const m = this._music;
    if (!m) return;
    clearInterval(m.timer);
    try {
      m.bed.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.3);
      m.drone.stop(this.ctx.currentTime + 1.2);
    } catch (e) { /* already stopped */ }
    this._music = null;
  };

  WS.Audio = Audio;

})(window.WS);

/* ===== src/game/fx.js ===== */
/* Screen effects: floating combat text, expanding flashes, particles, shake.
 * All pooled; nothing here allocates during combat. */
'use strict';
(function (WS) {

  const FX = {
    texts: null,
    flashes: null,
    particles: null,
    corpses: null,
    shakeMag: 0,
    shakeTime: 0,
    shakeX: 0,
    shakeY: 0,
    bigHit: 0,        // rolling mean hit, the bar a number must clear when busy
    flashScreen: null,
    hitStop: 0,       // seconds of frozen simulation left, for weight
    hurtPulse: 0,     // 0..1, red rim when the survivor is struck
  };

  FX.init = function () {
    this.texts = new WS.Pool(() => ({}), null, WS.CONST.MAX_FLOATING_TEXT);
    this.flashes = new WS.Pool(() => ({}), null, 90);
    this.particles = new WS.Pool(() => ({}), null, 400);
    this.corpses = new WS.Pool(() => ({}), null, 60);
    this.hitStop = 0;
    this.hurtPulse = 0;
    this.bigHit = 0;
  };

  FX.clear = function () {
    this.texts.releaseAll();
    this.flashes.releaseAll();
    this.particles.releaseAll();
    this.corpses.releaseAll();
    this.hitStop = 0;
    this.hurtPulse = 0;
    this.shakeMag = 0; this.shakeTime = 0; this.shakeX = 0; this.shakeY = 0;
    this.flashScreen = null;
  };

  /* ---------------------------------------------------------------- text -- */
  let fanIndex = 0;
  function push(x, y, text, colour, size, life, rise, pop) {
    const t = FX.texts.acquire();
    if (!t) return null;
    t.x = x; t.y = y; t.text = text; t.colour = colour;
    t.size = size; t.life = life; t.maxLife = life;
    // Successive numbers fan out along an arc instead of stacking on one spot,
    // which is the difference between a readable hit and a smear of digits.
    const a = (fanIndex++ % 7) / 7 * WS.TAU;
    t.vx = WS.cos(a) * 34 + WS.randRange(-6, 6);
    t.vy = rise + WS.sin(a) * 12;
    t.pop = pop || 0;
    return t;
  }

  FX.damage = function (x, y, amount, crit) {
    if (!WS.Save.settings.damageNumbers) return;
    // Budget: past two-thirds full, small non-crit hits stop printing. A wall
    // of tiny digits is less information than a few readable ones.
    if (!crit && FX.texts.count > FX.texts.cap * 0.66) {
      if (amount < FX.bigHit) return;
    }
    FX.bigHit = FX.bigHit * 0.995 + amount * 0.005;
    push(x, y - 8, String(WS.floor(amount)),
      crit ? '#ffd45c' : '#f2f4f8', crit ? 21 : 14, crit ? 0.85 : 0.6, -46,
      crit ? 1 : 0.35);
  };

  FX.playerHurt = function (x, y, amount) {
    push(x, y - 20, '-' + WS.floor(amount), '#ff6b5c', 20, 0.9, -50, 1);
    this.hurtPulse = 1;
  };

  FX.heal = function (x, y, amount) {
    if (!WS.Save.settings.healNumbers) return;
    push(x, y - 26, '+' + WS.floor(amount), '#5fe08a', 16, 0.9, -40);
  };

  FX.notice = function (x, y, text, colour) {
    push(x, y - 30, text, colour || '#e8ecf6', 15, 1.1, -34);
  };

  FX.gold = function (x, y, amount) {
    push(x, y - 20, '+' + WS.floor(amount) + 'g', '#f5c56b', 15, 1.0, -38);
  };

  /** A death: the creature's silhouette squashes into the ground and fades.
   *  Far more legible than a puff of particles, and it costs one draw. */
  FX.corpse = function (enemy) {
    const c = FX.corpses.acquire();
    if (!c) return;
    c.x = enemy.x; c.y = enemy.y;
    c.art = enemy.template.art;
    c.tint = enemy.template.tint;
    c.size = enemy.spriteSize;
    c.facing = enemy.facing;
    c.life = enemy.boss ? 0.9 : 0.42;
    c.maxLife = c.life;
    c.boss = enemy.boss;
  };

  /** Freezes the simulation for a beat, so a heavy hit lands with weight. */
  FX.stop = function (seconds) {
    FX.hitStop = WS.max(FX.hitStop, seconds);
  };

  /* --------------------------------------------------------------- flash -- */
  /** An expanding ring of light: the workhorse impact effect. */
  FX.flash = function (x, y, radius, colour, life) {
    const f = FX.flashes.acquire();
    if (!f) return;
    f.x = x; f.y = y; f.radius = radius; f.colour = colour;
    f.life = life || 0.30; f.maxLife = f.life;
  };

  /** A screen-wide colour wash (metamorphosis, death, victory). */
  FX.screen = function (colour, life) {
    this.flashScreen = { colour, life, maxLife: life };
  };

  /* ----------------------------------------------------------- particles -- */
  FX.burst = function (x, y, count, colour, speed, life, size) {
    for (let i = 0; i < count; i++) {
      const p = FX.particles.acquire();
      if (!p) return;
      const a = WS.random() * WS.TAU;
      const v = speed * WS.randRange(0.35, 1);
      p.x = x; p.y = y;
      p.vx = WS.cos(a) * v; p.vy = WS.sin(a) * v;
      p.colour = colour; p.size = size || 3;
      p.life = life * WS.randRange(0.6, 1); p.maxLife = p.life;
      p.drag = 2.6;
    }
  };

  /** A directional spray, e.g. blood from a hit or sparks off a ricochet. */
  FX.spray = function (x, y, dx, dy, count, colour, speed, life) {
    for (let i = 0; i < count; i++) {
      const p = FX.particles.acquire();
      if (!p) return;
      const spread = WS.randRange(-0.6, 0.6);
      const c = WS.cos(spread), s = WS.sin(spread);
      const v = speed * WS.randRange(0.4, 1);
      p.x = x; p.y = y;
      p.vx = (dx * c - dy * s) * v; p.vy = (dx * s + dy * c) * v;
      p.colour = colour; p.size = 2.5;
      p.life = life * WS.randRange(0.6, 1); p.maxLife = p.life;
      p.drag = 3.4;
    }
  };

  /* --------------------------------------------------------------- shake -- */
  FX.shake = function (magnitude, duration) {
    if (!WS.Save.settings.screenShake) return;
    if (magnitude > this.shakeMag || this.shakeTime <= 0) {
      this.shakeMag = magnitude;
      this.shakeTime = duration;
      this.shakeMax = duration;
    }
  };

  /* -------------------------------------------------------------- update -- */
  FX.update = function (dt) {
    let i = 0;
    while (i < this.texts.count) {
      const t = this.texts.active[i];
      t.life -= dt;
      if (t.life <= 0) { this.texts.releaseAt(i); continue; }
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      t.vy += 42 * dt;                     // ease the rise into a settle
      i++;
    }

    i = 0;
    while (i < this.flashes.count) {
      const f = this.flashes.active[i];
      f.life -= dt;
      if (f.life <= 0) { this.flashes.releaseAt(i); continue; }
      i++;
    }

    i = 0;
    while (i < this.corpses.count) {
      const c = this.corpses.active[i];
      c.life -= dt;
      if (c.life <= 0) { this.corpses.releaseAt(i); continue; }
      i++;
    }

    i = 0;
    while (i < this.particles.count) {
      const p = this.particles.active[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.releaseAt(i); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const drag = 1 - WS.min(1, p.drag * dt);
      p.vx *= drag; p.vy *= drag;
      i++;
    }

    if (this.shakeTime > 0) {
      this.shakeTime -= dt;
      const k = WS.max(0, this.shakeTime / this.shakeMax);
      const m = this.shakeMag * k;
      this.shakeX = WS.randRange(-m, m);
      this.shakeY = WS.randRange(-m, m);
      if (this.shakeTime <= 0) { this.shakeX = 0; this.shakeY = 0; this.shakeMag = 0; }
    }

    if (this.flashScreen) {
      this.flashScreen.life -= dt;
      if (this.flashScreen.life <= 0) this.flashScreen = null;
    }

    if (this.hurtPulse > 0) {
      this.hurtPulse = WS.max(0, this.hurtPulse - dt * 2.4);
    }
  };

  WS.FX = FX;

})(window.WS);

    this.orbits = new WS.Pool(() => ({ hitBy: new Map() }), (o) => o.hitBy.clear(), 32);

    b.radius = spec.radius;
    b.pierce = spec.pierce;
    b.art = spec.art;
    b.colour = spec.colour;

    b.procChain = spec.procChain || 0;
